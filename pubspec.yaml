name: as_grinta
description: Application officielle ASG.
publish_to: "none"
version: 0.3.3+97

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  connectivity_plus: ^6.1.4
  flutter_riverpod: ^2.6.1
  go_router: ^14.8.1
  # Encodage JPEG des avatars recadrés : dart:ui ne sait produire que du PNG,
  # qui pesait 171 à 250 ko par avatar là où un JPEG équivalent en fait ~30.
  image: ^4.5.4
  image_picker: ^1.1.2
  audioplayers: ^6.1.0
  share_plus: ^10.1.4
  shared_preferences: ^2.5.3
  supabase_flutter: ^2.8.4
  url_launcher: ^6.3.1
  web: ^1.1.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/module_backgrounds/
    - assets/images/as_grinta_logo.webp
    - assets/images/jerseys/
    - assets/audio/

  # Deux familles pour le bilan de saison : une machine à écrire pour les
  # intitulés, une condensée de stade pour les chiffres. Licences SIL OFL
  # dans assets/fonts.
  fonts:
    - family: Courier Prime
      fonts:
        - asset: assets/fonts/CourierPrime-Regular.ttf
        - asset: assets/fonts/CourierPrime-Bold.ttf
          weight: 700
    - family: Oswald
      fonts:
        - asset: assets/fonts/Oswald-Medium.ttf
          weight: 500
        - asset: assets/fonts/Oswald-Bold.ttf
          weight: 700