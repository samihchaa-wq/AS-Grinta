name: Weather CI repair helper

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/weather_ci_repair.yml'

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - name: Repair weather schema replay and isolated test
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          workflow = Path('.github/workflows/supabase_business_tests.yml')
          text = workflow.read_text()
          weather_line = '              -f supabase/migrations/20260802050000_match_weather.sql'
          if weather_line not in text:
              needle = '''            psql "$DB_URL" -v ON_ERROR_STOP=1 \\
              -f supabase/migrations/20260802040000_timeline_uses_display_names.sql
'''
              replacement = needle + '''            psql "$DB_URL" -v ON_ERROR_STOP=1 \\
              -f supabase/migrations/20260802050000_match_weather.sql
'''
              if needle not in text:
                  raise SystemExit('Could not find migration insertion point')
              text = text.replace(needle, replacement, 1)
              workflow.write_text(text)

          test = Path('supabase/tests/database/match_weather_global_authenticated_matrix.test.sql')
          text = test.read_text()
          marker = 'begin;\n\n'
          drop = 'drop table if exists public.match_weather cascade;\n\n'
          if drop not in text:
              if marker not in text:
                  raise SystemExit('Could not find pgTAP transaction start')
              text = text.replace(marker, marker + drop, 1)
              test.write_text(text)
          PY
          rm .github/workflows/weather_ci_repair.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/workflows/supabase_business_tests.yml supabase/tests/database/match_weather_global_authenticated_matrix.test.sql .github/workflows/weather_ci_repair.yml
          git commit -m 'ci(weather): replay weather schema in business tests'
          git push origin HEAD:${{ github.head_ref }}
