name: Temporary format profile photo resilience

on:
  push:
    branches:
      - audit/546-profile-photo-network-resilience

permissions:
  contents: write

jobs:
  format:
    if: "${{ github.event.head_commit.message != 'style: format profile photo resilience' }}"
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: audit/546-profile-photo-network-resilience

      - name: Setup Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
        with:
          channel: stable
          cache: true

      - name: Install locked dependencies
        run: flutter pub get --enforce-lockfile

      - name: Format targeted files
        run: |
          dart format \
            lib/features/auth/data/auth_repository.dart \
            test/features/auth/data/profile_photo_network_resilience_test.dart

      - name: Commit formatter output
        run: |
          git add \
            lib/features/auth/data/auth_repository.dart \
            test/features/auth/data/profile_photo_network_resilience_test.dart
          if git diff --cached --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "style: format profile photo resilience"
          git push origin HEAD:audit/546-profile-photo-network-resilience
