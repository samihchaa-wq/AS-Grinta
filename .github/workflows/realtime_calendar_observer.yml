name: Realtime Calendar Observer

on:
  push:
    branches: [audit/authenticated-admin-e2e]
    paths:
      - '.github/workflows/realtime_calendar_observer.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  observe:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    env:
      APP_URL: https://samihchaa-wq.github.io/AS-Grinta/
      TEST_USERNAME: Testt
      TEST_PASSWORD: ${{ secrets.E2E_TESTT_PASSWORD }}
      AUDIT_LABEL: AUDIT_RT_MAX
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm install --no-save playwright-core@1.52.0
      - name: Observe calendar without reload
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p rt-artifacts
          node <<'NODE'
          const fs=require('fs');
          const {chromium}=require('playwright-core');
          (async()=>{
            const b=await chromium.launch({headless:true,executablePath:'/usr/bin/google-chrome',args:['--no-sandbox','--disable-dev-shm-usage']});
            const c=await b.newContext({viewport:{width:390,height:844},serviceWorkers:'block'});
            const p=await c.newPage();
            const errors=[]; p.on('pageerror',e=>errors.push(e.message)); p.on('console',m=>{if(m.type()==='error')errors.push(m.text())});
            const wait=ms=>p.waitForTimeout(ms);
            async function sem(){try{await p.evaluate(()=>document.querySelector('flt-semantics-placeholder')?.click());await wait(200)}catch(_){}}
            async function focus(label){const a=p.locator(`[aria-label="${label}"]`).first();if(await a.count())return a.click({force:true});const t=p.getByText(label,{exact:true}).first();if(await t.count())return t.click({force:true});throw new Error(`missing ${label}`)}
            await p.goto(`${process.env.APP_URL}?rt-login=${Date.now()}#/auth/sign-in`,{waitUntil:'networkidle',timeout:90000});await wait(1600);await sem();
            await focus('Identifiant');await p.keyboard.type(process.env.TEST_USERNAME);await focus('Mot de passe');await p.keyboard.type(process.env.TEST_PASSWORD);await focus('Se connecter');
            await p.waitForFunction(()=>!location.hash.includes('/auth/'),null,{timeout:45000});await wait(1800);await sem();
            await p.goto(`${process.env.APP_URL}?rt-observer=${Date.now()}#/matches`,{waitUntil:'networkidle',timeout:60000});await wait(1500);await sem();
            const samples=[]; let had=false, disappeared=false, reappeared=false, saw2349=false;
            for(let i=0;i<75;i++){
              await sem(); const text=(await p.locator('body').innerText().catch(()=>'' )).replace(/\s+/g,' ').trim(); const has=text.includes(process.env.AUDIT_LABEL);
              if(has) had=true; if(had && !has) disappeared=true; if(disappeared && has) reappeared=true; if(has && text.includes('23:49')) saw2349=true;
              samples.push({i,at:new Date().toISOString(),has,saw2349,text:text.slice(0,2400),errors:errors.length});
              await wait(1000);
            }
            const summary={initialOrEventuallySeen:had,updateTimeSeen:saw2349,disappearedAfterSeen:disappeared,reappearedAfterDisappear:reappeared,errorCount:errors.length,errors};
            fs.writeFileSync('rt-artifacts/summary.json',JSON.stringify(summary,null,2));fs.writeFileSync('rt-artifacts/samples.json',JSON.stringify(samples,null,2));fs.writeFileSync('rt-artifacts/summary.txt',JSON.stringify(summary,null,2));
            await p.screenshot({path:'rt-artifacts/final.png',fullPage:true}).catch(()=>{});await b.close();
          })().catch(e=>{console.error(e);process.exit(1)});
          NODE
      - if: always()
        run: cat rt-artifacts/summary.txt || true
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: realtime-calendar-observer
          path: rt-artifacts/
          retention-days: 7
