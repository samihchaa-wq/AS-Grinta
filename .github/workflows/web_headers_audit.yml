name: Web Headers Audit

on:
  push:
    branches: [audit/authenticated-admin-e2e]
    paths:
      - '.github/workflows/web_headers_audit.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  headers:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Inspect deployed headers
        shell: bash
        run: |
          set -euo pipefail
          curl -sSIL --max-redirs 5 https://samihchaa-wq.github.io/AS-Grinta/ | tee headers.txt
          echo '--- security headers ---'
          grep -Ei '^(content-security-policy|x-frame-options|x-content-type-options|referrer-policy|permissions-policy|strict-transport-security|cache-control):' headers.txt || true
