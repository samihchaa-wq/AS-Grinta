name: Temporary Effectif cleanup 1244

on:
  push:
    branches:
      - agent/effectif-three-column-avatars

permissions:
  contents: write

jobs:
  cleanup:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Remove obsolete Effectif renderer
        shell: python
        run: |
          from pathlib import Path
          path = Path('lib/features/sports_management/presentation/admin_squad_plan_page_widgets.dart')
          text = path.read_text()
          start_marker = 'class _EffectifColumn extends StatelessWidget {'
          end_marker = 'class _PlayerInfoRow extends StatelessWidget {'
          start = text.index(start_marker)
          end = text.index(end_marker)
          path.write_text(text[:start] + text[end:])
      - name: Remove temporary workflow
        run: rm .github/workflows/_temp_cleanup_effectif_1244.yml
      - name: Commit cleanup
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add lib/features/sports_management/presentation/admin_squad_plan_page_widgets.dart .github/workflows/_temp_cleanup_effectif_1244.yml
          git commit -m "refactor(effectif): retirer l’ancien renderer inutilisé"
          git push origin HEAD:agent/effectif-three-column-avatars
