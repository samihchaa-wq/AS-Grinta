name: Temporary Dart format probe

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.8'
          channel: stable
          cache: true
      - name: Format target files
        shell: bash
        run: |
          set -euo pipefail
          dart format \
            lib/features/matches/presentation/matches_page.dart \
            lib/features/matches/presentation/widgets/admin_match_options_button.dart \
            lib/features/predictions/presentation/merged_matches_view.dart
      - name: Export formatted files
        uses: actions/upload-artifact@v4
        with:
          name: formatted-dart-files-pr-merge
          path: |
            lib/features/matches/presentation/matches_page.dart
            lib/features/matches/presentation/widgets/admin_match_options_button.dart
            lib/features/predictions/presentation/merged_matches_view.dart
          if-no-files-found: error
          retention-days: 1
