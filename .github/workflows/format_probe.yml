name: Format probe

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  format-probe:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Format target file
        run: dart format lib/features/matches/presentation/widgets/match_info_tab.dart

      - name: Upload formatted file
        uses: actions/upload-artifact@v4
        with:
          name: formatted-match-info-tab
          path: lib/features/matches/presentation/widgets/match_info_tab.dart
