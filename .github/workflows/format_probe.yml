name: Format probe

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: read

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
        with:
          channel: stable
          cache: true
      - run: dart format lib/features/admin/presentation/admin_page.dart
      - uses: actions/upload-artifact@v4
        with:
          name: formatted-admin-page
          path: lib/features/admin/presentation/admin_page.dart
