name: Temporary Dart format probe

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Setup Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: stable
          cache: true
      - name: Install locked dependencies
        run: flutter pub get --enforce-lockfile
      - name: Show exact formatter output
        shell: bash
        run: |
          set -euo pipefail
          dart format --output=write test/match_live_state_controller_test.dart
          echo '--- FORMATTER FILE START ---'
          cat test/match_live_state_controller_test.dart
          echo '--- FORMATTER FILE END ---'
          echo '--- FORMATTER PATCH START ---'
          git diff -- test/match_live_state_controller_test.dart
          echo '--- FORMATTER PATCH END ---'
          exit 1
