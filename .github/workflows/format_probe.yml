name: Temporary Dart format probe

on:
  push:
    branches:
      - agent/match-lifecycle-cleanup

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.8'
          channel: stable
          cache: true
      - name: Format target files
        shell: bash
        run: |
          set -euo pipefail
          dart format \
            lib/features/matches/presentation/matches_page.dart \
            lib/features/matches/presentation/widgets/admin_match_options_button.dart \
            lib/features/predictions/presentation/merged_matches_view.dart
      - name: Commit formatter output
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            lib/features/matches/presentation/matches_page.dart \
            lib/features/matches/presentation/widgets/admin_match_options_button.dart \
            lib/features/predictions/presentation/merged_matches_view.dart
          git commit -m "Format match lifecycle files"
          git push origin HEAD:agent/match-lifecycle-cleanup
