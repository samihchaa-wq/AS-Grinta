name: Format Effectif once

on:
  push:
    branches:
      - agent/effectif-three-column-avatars

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: agent/effectif-three-column-avatars
          fetch-depth: 0

      - name: Setup Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
        with:
          channel: stable
          cache: true

      - name: Format target and commit if needed
        shell: bash
        run: |
          set -euo pipefail
          dart format lib/features/sports_management/presentation/admin_squad_plan_effectif_roster.dart
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add lib/features/sports_management/presentation/admin_squad_plan_effectif_roster.dart
          if git diff --cached --quiet; then
            echo 'No formatting change required.'
          else
            git commit -m 'style: format effectif avatar roster'
            git push origin HEAD:agent/effectif-three-column-avatars
          fi
