name: Temporary refresh Pub lockfile

on:
  push:
    branches:
      - agent/refresh-compatible-dependencies

permissions:
  contents: write

jobs:
  refresh:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: agent/refresh-compatible-dependencies

      - name: Setup Flutter stable
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Upgrade versions allowed by pubspec
        run: flutter pub upgrade

      - name: Show resulting dependency status
        run: flutter pub outdated || true

      - name: Commit regenerated lockfile
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- pubspec.lock; then
            echo "No lockfile changes produced."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pubspec.lock
          git commit -m "Refresh compatible Pub dependencies"
          git push origin HEAD:agent/refresh-compatible-dependencies
