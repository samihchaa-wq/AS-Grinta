name: Temporary fix composition fixture

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  fix:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Patch fixture and remove this workflow
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('supabase/tests/database/sports_management_composition_server.test.sql')
          text = path.read_text()
          old = "set availability_status = 'available',\n    availability_updated_at = now(),"
          new = "set availability_status = 'available',\n    convocation_status = 'convoked',\n    availability_updated_at = now(),"
          if old not in text:
              raise SystemExit('Composition fixture marker not found')
          path.write_text(text.replace(old, new, 1))
          PY
          git rm .github/workflows/temporary_fix_composition_fixture.yml

      - name: Commit fixture fix
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A -- \
            supabase/tests/database/sports_management_composition_server.test.sql \
            .github/workflows/temporary_fix_composition_fixture.yml
          git commit -m 'Aligner le fixture de composition sur le nouveau contrat'
          git fetch origin "${{ github.event.pull_request.head.ref }}"
          git rebase "origin/${{ github.event.pull_request.head.ref }}"
          git push origin "HEAD:${{ github.event.pull_request.head.ref }}"
