name: Temporary format finished match modules

on:
  push:
    branches: [finished-match-modules]
    paths:
      - '.github/workflows/temporary_format_finished_match_modules.yml'

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: finished-match-modules
          fetch-depth: 0
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: stable
          cache: true
      - name: Lock nullable historical effectif
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('lib/features/matches/presentation/historical_match_detail_page.dart')
          text = p.read_text()
          old = 'CompletedMatchEffectifCard(effectif: effectif),'
          new = 'CompletedMatchEffectifCard(effectif: effectif!),'
          if text.count(old) != 1:
              raise SystemExit(f'expected one historical effectif call, got {text.count(old)}')
          p.write_text(text.replace(old, new, 1))
          PY
      - name: Run canonical formatter
        run: dart format lib test
      - name: Remove temporary workflow and commit
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/temporary_format_finished_match_modules.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Format finished match modules"
          git push origin HEAD:finished-match-modules
