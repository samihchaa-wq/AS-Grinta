name: Agent fix exhaustive finalized fixture

on:
  push:
    branches:
      - agent/match-lifecycle-cleanup

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/match-lifecycle-cleanup
          fetch-depth: 0
      - name: Patch finalized archive fixture and remove workflow
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('supabase/tests/database/exhaustive_match_lifecycle_state_space.test.sql')
          text = path.read_text()
          old = """select public.update_match_with_odds(\n  current_setting('test.lifecycle_replacement_match')::uuid,\n  'e2000000-0000-0000-0000-000000000001','e3000000-0000-0000-0000-000000000002',\n  date '2000-01-02',time '21:00','exterieur','termine',null,null,null);\nselect ok(public.archive_match(current_setting('test.lifecycle_replacement_match')::uuid),'archivage initial réussi');"""
          new = """-- Seed a genuinely finished row as test setup. The generic edit RPC is\n-- intentionally no longer allowed to perform lifecycle transitions.\nreset role;\nupdate public.matches\nset status = 'termine', updated_at = now()\nwhere id = current_setting('test.lifecycle_replacement_match')::uuid;\nset local role authenticated;\nselect ok(public.archive_match(current_setting('test.lifecycle_replacement_match')::uuid),'archivage initial réussi');"""
          if old not in text:
              raise SystemExit('Expected finalized fixture snippet not found')
          path.write_text(text.replace(old, new, 1))
          PY
          rm .github/workflows/agent-fix-exhaustive-finalized-fixture.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add supabase/tests/database/exhaustive_match_lifecycle_state_space.test.sql .github/workflows/agent-fix-exhaustive-finalized-fixture.yml
          git commit -m "Update exhaustive lifecycle archive fixture"
          git push origin HEAD:agent/match-lifecycle-cleanup
