name: Phase 5 import fix

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  fix:
    if: github.head_ref == 'visual/ui-overhaul-phase-5'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: visual/ui-overhaul-phase-5
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Restore AuthRole extension import
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('lib/features/profile/presentation/profile_page.dart')
          text = path.read_text()
          anchor = "import 'package:as_grinta/features/auth/presentation/auth_state.dart';\n"
          addition = "import 'package:as_grinta/features/auth/domain/auth_profile.dart';\n"
          if addition not in text:
              text = text.replace(anchor, addition + anchor)
              path.write_text(text)
          PY
          dart format lib/features/profile/presentation/profile_page.dart
      - name: Commit fix
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add lib/features/profile/presentation/profile_page.dart
          git diff --cached --quiet || git commit -m "fix: restaurer l’extension de libellé des rôles"
          git push origin HEAD:visual/ui-overhaul-phase-5