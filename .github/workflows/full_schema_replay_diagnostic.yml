name: Supabase full schema replay diagnostic

on:
  pull_request:
    branches: [main]
    paths:
      - 'supabase/migrations/**'
      - 'supabase/replay/**'
      - '.github/workflows/full_schema_replay_diagnostic.yml'
      - '.github/workflows/migration_inventory.yml'
  workflow_dispatch:
  schedule:
    - cron: '41 4 * * 1'

permissions:
  contents: read

jobs:
  replay-diagnostic:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v2
        with:
          version: 2.111.0

      - name: Inject the recovered pre-history only for clean replay
        shell: bash
        run: |
          set -euo pipefail
          test -s supabase/replay/production_pre_history_gap.sql
          cp supabase/replay/production_pre_history_gap.sql \
            supabase/migrations/20260708150000_replay_pre_history_gap.sql

      - name: Replay the complete migration history
        id: replay
        shell: bash
        run: |
          set +e
          set -o pipefail
          supabase start 2>&1 | tee full-schema-replay.log
          code=${PIPESTATUS[0]}
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          {
            echo "## Full schema replay diagnostic"
            if [ "$code" -eq 0 ]; then
              echo "✅ Le socle historique récupéré + les 427 migrations de production se rejouent depuis une base vide."
            else
              echo "❌ La reconstruction complète depuis une base vide échoue."
            fi
            echo
            echo "Code de sortie : $code"
          } >> "$GITHUB_STEP_SUMMARY"
          exit "$code"

      - name: Upload replay log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: full-schema-replay-diagnostic
          path: full-schema-replay.log
          if-no-files-found: warn
