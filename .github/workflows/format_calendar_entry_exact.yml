name: Format calendar entry exact CI

on:
  push:
    branches:
      - fix/reorder-calendar-entry-form
    paths:
      - .github/workflows/format_calendar_entry_exact.yml

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: fix/reorder-calendar-entry-form
      - name: Setup Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
        with:
          channel: stable
          cache: true
      - name: Match CI dependency setup and format
        run: |
          set -euo pipefail
          flutter pub get --enforce-lockfile
          dart format lib/features/matches/presentation/calendar_entry_form_page.dart
          git diff --check
      - name: Commit exact formatting and remove temporary workflow
        run: |
          set -euo pipefail
          rm .github/workflows/format_calendar_entry_exact.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add lib/features/matches/presentation/calendar_entry_form_page.dart .github/workflows/format_calendar_entry_exact.yml
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m 'Format calendar entry form with CI toolchain'
          git push origin HEAD:fix/reorder-calendar-entry-form
