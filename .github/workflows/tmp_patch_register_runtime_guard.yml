name: Temporary register runtime guard patch

on:
  push:
    branches: [fix/auth-register-web-initial-route]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: fix/auth-register-web-initial-route
          fetch-depth: 0

      - name: Add cold-register browser guard
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p = Path('.github/workflows/runtime_diagnostic.yml')
          text = p.read_text()
          anchor = "      - name: Inspect rendered app on multiple viewports\n"
          block = r'''      - name: Verify cold registration deep-link
        run: |
          node <<'NODE'
          const fs = require('fs');
          const { chromium } = require('playwright-core');

          (async () => {
            const browser = await chromium.launch({
              headless: true,
              executablePath: '/usr/bin/google-chrome',
              args: ['--no-sandbox', '--disable-dev-shm-usage'],
            });
            const context = await browser.newContext({
              viewport: { width: 390, height: 844 },
              serviceWorkers: 'block',
            });
            const page = await context.newPage();
            const requested = 'http://127.0.0.1:8080/#/auth/register';
            await page.goto(requested, {
              waitUntil: 'domcontentloaded', timeout: 45000,
            });
            await page.locator('flutter-view, flt-glass-pane, canvas').first()
              .waitFor({ state: 'attached', timeout: 45000 });
            await page.waitForTimeout(1800);
            await page.evaluate(() => {
              const placeholder = document.querySelector('flt-semantics-placeholder');
              if (placeholder instanceof HTMLElement) placeholder.click();
            }).catch(() => {});
            await page.getByRole('textbox', { name: 'Prénom', exact: true })
              .waitFor({ timeout: 15000 });
            if (!page.url().includes('/auth/register')) {
              throw new Error(`Le deep-link inscription a été perdu: ${page.url()}`);
            }
            await page.screenshot({ path: 'runtime-auth-register-cold-start.png' });
            if (fs.statSync('runtime-auth-register-cold-start.png').size < 4000) {
              throw new Error('capture inscription à froid anormalement vide');
            }
            await browser.close();
          })().catch(error => {
            console.error(error);
            process.exit(1);
          });
          NODE
'''
          if 'Verify cold registration deep-link' not in text:
              if anchor not in text:
                  raise SystemExit('runtime diagnostic insertion anchor not found')
              text = text.replace(anchor, block + anchor, 1)
          p.write_text(text)
          PY
          git diff --check
          git diff -- .github/workflows/runtime_diagnostic.yml

      - name: Commit guard
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/workflows/runtime_diagnostic.yml
          git commit -m 'test(auth): verrouiller le deep-link inscription Web'
          git push origin HEAD:fix/auth-register-web-initial-route
