name: One-shot merge composition publish buttons

on:
  push:
    branches:
      - agent/fusionner-boutons-publication

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - name: Fusionner les boutons de publication
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          target = Path('lib/features/sports_management/presentation/admin_squad_plan_page.dart')
          text = target.read_text(encoding='utf-8')
          old = """        const SizedBox(height: 16),
                  FilledButton.tonalIcon(
                    onPressed:
                        _busy || _locked ? null : () => _saveComposition(publish: false),
                    icon: const Icon(Icons.save_outlined),
                    label: Text(
                      _compositionDirty
                          ? 'Enregistrer le brouillon'
                          : 'Brouillon enregistré',
                    ),
                  ),
                  const SizedBox(height: 10),
                  FilledButton.icon(
                    onPressed:
                        _busy || _locked ? null : () => _saveComposition(publish: true),
                    icon: const Icon(Icons.campaign_outlined),
                    label: Text(
                      composition.isPublished ? 'Republier' : 'Publier la composition',
                    ),
                  ),
          """
          new = """        const SizedBox(height: 16),
                  FilledButton.icon(
                    onPressed:
                        _busy || _locked ? null : () => _saveComposition(publish: true),
                    icon: const Icon(Icons.campaign_outlined),
                    label: Text(
                      composition.isPublished ? 'Mettre à jour' : 'Publier',
                    ),
                  ),
          """
          if old not in text:
              raise SystemExit('Bloc de boutons attendu introuvable')
          target.write_text(text.replace(old, new, 1), encoding='utf-8')
          Path('.github/workflows/one_shot_merge_publish_button.yml').unlink()
          PY

      - name: Commit de la modification
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/features/sports_management/presentation/admin_squad_plan_page.dart .github/workflows/one_shot_merge_publish_button.yml
          git commit -m "Fusionner le bouton de publication de la composition"
          git push origin HEAD:${{ github.ref_name }}
