name: Temporary pin GitHub actions

on:
  push:
    branches:
      - agent/pin-github-actions

permissions:
  contents: write

jobs:
  pin:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout pinning branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: agent/pin-github-actions
          fetch-depth: 0

      - name: Pin external actions and add regression guard
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          replacements = {
              'actions/checkout@v4': 'actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4',
              'subosito/flutter-action@v2': 'subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2',
              'actions/upload-artifact@v4': 'actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4',
              'actions/setup-node@v4': 'actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4',
              'actions/configure-pages@v5': 'actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5',
              'actions/upload-pages-artifact@v3': 'actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3',
              'actions/deploy-pages@v4': 'actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4',
              'supabase/setup-cli@v1': 'supabase/setup-cli@ab058987d8d6c725971f6cf9d0b5c98467e30bd1 # v1',
              'supabase/setup-cli@v2': 'supabase/setup-cli@3c2f5e2ae34c34e428e8e206e2c4d21fa2d20fbf # v2',
              'denoland/setup-deno@v2': 'denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2',
          }

          workflow_dir = Path('.github/workflows')
          changed = []
          for path in sorted([*workflow_dir.glob('*.yml'), *workflow_dir.glob('*.yaml')]):
              text = path.read_text()
              updated = text
              for old, new in replacements.items():
                  updated = updated.replace(old, new)
              if updated != text:
                  path.write_text(updated)
                  changed.append(str(path))

          guard = r'''name: GitHub action pin guard

          on:
            pull_request:
              branches: [main]
              paths:
                - '.github/workflows/**'
                - '.github/actions/**'
            push:
              branches: [main]
              paths:
                - '.github/workflows/**'
                - '.github/actions/**'
            workflow_dispatch:

          permissions:
            contents: read

          jobs:
            validate-pins:
              runs-on: ubuntu-latest
              timeout-minutes: 5
              steps:
                - name: Checkout
                  uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

                - name: Reject mutable external action refs
                  shell: bash
                  run: |
                    set -euo pipefail
                    python3 - <<'PY2'
                    import re
                    from pathlib import Path

                    candidates = []
                    for root in (Path('.github/workflows'), Path('.github/actions')):
                        if not root.exists():
                            continue
                        candidates.extend(root.rglob('*.yml'))
                        candidates.extend(root.rglob('*.yaml'))

                    uses_pattern = re.compile(r'^\s*uses:\s*([^\s#]+)')
                    sha_pattern = re.compile(r'^[0-9a-fA-F]{40}$')
                    violations = []

                    for path in sorted(set(candidates)):
                        for line_number, line in enumerate(path.read_text().splitlines(), 1):
                            match = uses_pattern.match(line)
                            if not match:
                                continue
                            target = match.group(1).strip('"\'')
                            if target.startswith('./') or target.startswith('docker://'):
                                continue
                            if '@' not in target:
                                violations.append((path, line_number, target))
                                continue
                            ref = target.rsplit('@', 1)[1]
                            if not sha_pattern.fullmatch(ref):
                                violations.append((path, line_number, target))

                    if violations:
                        for path, line_number, target in violations:
                            print(f'::error file={path},line={line_number}::Mutable GitHub Action ref: {target}')
                        raise SystemExit('External GitHub Actions must be pinned to a full 40-character commit SHA.')

                    print(f'Validated immutable action refs across {len(set(candidates))} YAML files.')
                    PY2
          '''
          guard = '\n'.join(line[10:] if line.startswith('          ') else line for line in guard.splitlines()).lstrip()
          (workflow_dir / 'github_action_pin_guard.yml').write_text(guard + ('\n' if not guard.endswith('\n') else ''))

          leftovers = []
          for path in sorted([*workflow_dir.glob('*.yml'), *workflow_dir.glob('*.yaml')]):
              text = path.read_text()
              for old in replacements:
                  if old in text:
                      leftovers.append(f'{path}: {old}')
          if leftovers:
              raise SystemExit('Unpinned refs remain:\n' + '\n'.join(leftovers))

          print('Pinned workflows:')
          for path in changed:
              print(f'- {path}')
          print('- .github/workflows/github_action_pin_guard.yml')
          PY

          rm .github/workflows/temp_pin_github_actions.yml

      - name: Commit immutable action pins
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/workflows
          git diff --cached --check
          git commit -m "Pin GitHub Actions to immutable commits"
          git push origin HEAD:agent/pin-github-actions
