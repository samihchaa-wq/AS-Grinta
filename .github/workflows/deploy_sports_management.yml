name: Deploy Supabase production

on:
  pull_request_target:
    branches: [main]
    paths:
      - '.github/workflows/deploy_sports_management.yml'
  workflow_dispatch:
    inputs:
      apply_migrations:
        description: 'Apply pending database migrations after a successful dry-run'
        required: true
        default: false
        type: boolean
      deploy_send_push:
        description: 'Deploy the send-push Edge Function'
        required: true
        default: false
        type: boolean
      deploy_calendar_feed:
        description: 'Deploy the calendar-feed Edge Function'
        required: true
        default: false
        type: boolean

# Le déploiement lui-même ne demande qu'à lire le dépôt. Les deux droits
# supplémentaires ne servent qu'à l'étape finale : pousser une branche de
# resynchronisation du verrou et ouvrir la pull request qui la porte. Rien
# n'est écrit sur main ici.
permissions:
  contents: write
  pull-requests: write

concurrency:
  group: supabase-production-deployment
  cancel-in-progress: false

env:
  SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
  SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
  SUPABASE_PROJECT_ID: ovzijmqrnsgcmryinkfa

jobs:
  deploy:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.pull_request.head.repo.full_name == github.repository &&
       startsWith(github.event.pull_request.head.ref, 'release/run-sports-deployment'))
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout authorized deployment candidate
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Check deployment secrets
        shell: bash
        run: |
          set -euo pipefail
          missing=0

          if [ -z "${SUPABASE_ACCESS_TOKEN:-}" ]; then
            echo "::error title=Missing repository secret::SUPABASE_ACCESS_TOKEN is not configured in Settings > Secrets and variables > Actions."
            missing=1
          fi

          if [ -z "${SUPABASE_DB_PASSWORD:-}" ]; then
            echo "::error title=Missing repository secret::SUPABASE_DB_PASSWORD is not configured in Settings > Secrets and variables > Actions."
            missing=1
          fi

          if [ "$missing" -ne 0 ]; then
            exit 1
          fi

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@ab058987d8d6c725971f6cf9d0b5c98467e30bd1 # v1
        with:
          version: 2.111.0

      - name: Link Production
        shell: bash
        run: |
          set -euo pipefail
          supabase link \
            --project-ref "$SUPABASE_PROJECT_ID" \
            --password "$SUPABASE_DB_PASSWORD"

      - name: Record deployment candidate
        shell: bash
        run: |
          set -euo pipefail
          git rev-parse HEAD | tee deployment-sha.txt

      - name: Record migration state before deployment
        shell: bash
        run: |
          set -euo pipefail
          supabase migration list | tee migration-before.txt

      - name: Preflight pending migrations
        shell: bash
        run: |
          set -euo pipefail
          supabase db push \
            --password "$SUPABASE_DB_PASSWORD" \
            --dry-run

      - name: Apply pending migrations
        if: github.event_name == 'workflow_dispatch' && inputs.apply_migrations
        shell: bash
        run: |
          set -euo pipefail
          supabase db push \
            --password "$SUPABASE_DB_PASSWORD" \
            --yes

      - name: Record migration state after preflight or deployment
        shell: bash
        run: |
          set -euo pipefail
          supabase migration list | tee migration-after.txt

      - name: Deploy send-push
        if: github.event_name == 'workflow_dispatch' && inputs.deploy_send_push
        shell: bash
        run: |
          set -euo pipefail
          supabase functions deploy send-push \
            --project-ref "$SUPABASE_PROJECT_ID" \
            --no-verify-jwt \
            --use-api

      # Appelée par les agendas abonnés, qui ne présentent aucun jeton de
      # session : l'autorisation repose sur le jeton d'abonnement passé en
      # paramètre, vérifié par la fonction elle-même. Ce réglage reprend celui
      # déjà déclaré dans supabase/config.toml.
      - name: Deploy calendar-feed
        if: github.event_name == 'workflow_dispatch' && inputs.deploy_calendar_feed
        shell: bash
        run: |
          set -euo pipefail
          supabase functions deploy calendar-feed \
            --project-ref "$SUPABASE_PROJECT_ID" \
            --no-verify-jwt \
            --use-api

      # Appliquer une migration décale mécaniquement le verrou de production :
      # le dépôt sait ce qu'il contient, mais plus ce que la base a réellement
      # reçu. Tant que personne ne resynchronise, compare-production-history
      # échoue sur main et bloque toute pull request ouverte contre lui. Cette
      # étape a été oubliée trois fois le 4 septembre 2026, à chaque fois au
      # prix d'un dépôt bloqué jusqu'à ce que quelqu'un fasse le lien.
      #
      # Elle est donc faite ici, dans la foulée du déploiement qui la rend
      # nécessaire, plutôt que laissée à la vigilance de l'opérateur. Le verrou
      # ne pouvant être modifié que depuis une branche
      # ci/supabase-migration-drift-guard*, la proposition passe par une pull
      # request relue comme les autres : rien n'est poussé sur main ici.
      #
      # GitHub interdit toutefois à une automatisation d'ouvrir une pull request
      # tant que le dépôt ne l'y autorise pas explicitement — la case
      # « Allow GitHub Actions to create and approve pull requests », dans
      # Settings → Actions → General. Tant qu'elle n'est pas cochée, cette étape
      # échoue après un déploiement pourtant réussi. Elle écrit alors dans le
      # résumé du run le lien, le titre et le corps prêts à coller, pour que
      # l'ouverture manuelle prenne quelques secondes au lieu d'une enquête.
      - name: Propose production migration lock sync
        if: github.event_name == 'workflow_dispatch' && inputs.apply_migrations
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail

          # Même lecture que migration_inventory.yml : une version par ligne,
          # triée et dédupliquée. Les deux doivent rester d'accord, sans quoi
          # cette étape proposerait un verrou que le garde refuserait.
          awk -F'|' '
            {
              remote=$2
              gsub(/[^0-9]/, "", remote)
              if (length(remote) == 14 && remote ~ /^[0-9]+$/) print remote
            }
          ' migration-after.txt | sort -u > /tmp/remote-versions.txt
          test -s /tmp/remote-versions.txt

          count=$(wc -l < /tmp/remote-versions.txt | tr -d ' ')
          latest=$(tail -n 1 /tmp/remote-versions.txt)
          md5=$(md5sum /tmp/remote-versions.txt | awk '{print $1}')

          source supabase/production_migrations.lock
          if [ "$count" = "$MIGRATION_COUNT" ] \
            && [ "$latest" = "$LATEST_VERSION" ] \
            && [ "$md5" = "$VERSION_MD5" ]; then
            echo "Verrou déjà à jour ($count migrations, dernière $latest)."
            exit 0
          fi

          # La copie de travail est volontairement sans identifiants
          # (persist-credentials: false) et le dépôt est privé : toute
          # opération distante doit porter le jeton explicitement.
          remote="https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"

          branch="ci/supabase-migration-drift-guard-deploy-${latest}"
          if git ls-remote --exit-code --heads "$remote" "$branch" >/dev/null 2>&1; then
            echo "::notice::La branche $branch existe déjà : une resynchronisation est en attente, rien à ajouter."
            exit 0
          fi

          printf 'MIGRATION_COUNT=%s\nLATEST_VERSION=%s\nVERSION_MD5=%s\n' \
            "$count" "$latest" "$md5" > supabase/production_migrations.lock

          git config user.name 'github-actions[bot]'
          git config user.email \
            '41898282+github-actions[bot]@users.noreply.github.com'
          git checkout -b "$branch"
          git add supabase/production_migrations.lock
          git commit -m "ci(supabase): sync production migration lock to ${latest}" \
            -m "Poussé automatiquement par le déploiement qui vient d'appliquer les migrations jusqu'à ${latest}, pour que le verrou ne reste pas en retard sur la base." \
            -m "Valeurs relevées sur l'inventaire réel renvoyé par la production juste après le déploiement, avec la même règle de lecture que migration_inventory.yml."
          git push "$remote" "HEAD:${branch}"

          pr_title="ci(supabase): resynchroniser le verrou de migrations sur ${latest}"
          pr_body="$(cat <<BODY
          Ouverte automatiquement par le déploiement Supabase de production, qui vient d'appliquer les migrations jusqu'à \`${latest}\`.

          Sans cette resynchronisation, \`compare-production-history\` échoue sur \`main\` et bloque toute pull request ouverte contre lui, quel que soit son contenu.

          Valeurs relevées sur l'inventaire réel renvoyé par la production juste après le déploiement :

          \`\`\`
          MIGRATION_COUNT=${count}
          LATEST_VERSION=${latest}
          VERSION_MD5=${md5}
          \`\`\`

          **À faire par un relecteur :** cette pull request a été ouverte par l'automatisation, avec le jeton du dépôt. GitHub ne déclenche alors aucun contrôle. Fermer puis rouvrir la pull request les lance, après quoi elle se fusionne normalement.
          BODY
          )"

          if gh pr create \
            --base main \
            --head "$branch" \
            --title "$pr_title" \
            --body "$pr_body"; then
            exit 0
          fi

          # GitHub interdit à une automatisation d'ouvrir une pull request tant
          # que le dépôt ne l'y autorise pas. Le déploiement, lui, a bien eu
          # lieu : dire seulement « échec » laisserait croire le contraire, et
          # laisserait chercher. On écrit donc ici tout ce qu'il faut pour
          # ouvrir la pull request à la main en quelques secondes, plus le
          # réglage qui rend cette étape automatique une fois pour toutes.
          compare_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/compare/main...${branch}?expand=1"
          {
            echo "## Verrou de migrations : pull request à ouvrir à la main"
            echo
            echo "La base **a bien été déployée** jusqu'à \`${latest}\`, et la branche"
            echo "\`${branch}\` est poussée. Seule l'ouverture automatique de la pull"
            echo "request a été refusée."
            echo
            echo "### 1. Ouvrir la pull request"
            echo
            echo "${compare_url}"
            echo
            echo "Titre :"
            echo '```'
            echo "${pr_title}"
            echo '```'
            echo
            echo "Corps :"
            echo '```'
            echo "${pr_body}"
            echo '```'
            echo
            echo "### 2. Pour que cette étape se fasse seule la prochaine fois"
            echo
            echo "Cocher, dans les réglages du dépôt :"
            echo "*Settings → Actions → General → Workflow permissions →*"
            echo "*Allow GitHub Actions to create and approve pull requests*."
            echo
            echo "Sans cette case, l'étape échouera à chaque déploiement de base."
          } >> "$GITHUB_STEP_SUMMARY"

          echo "::error title=Verrou de migrations non proposé::La base est déployée, mais la pull request de resynchronisation n'a pas pu être ouverte par l'automatisation. Tout ce qu'il faut pour l'ouvrir est dans le résumé du run : ${compare_url}"
          exit 1

      - name: Upload deployment diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: supabase-production-deployment
          path: |
            deployment-sha.txt
            migration-before.txt
            migration-after.txt
          if-no-files-found: warn

# Production release PRs are dry-run only. Real database or Edge Function writes
# require an explicit manual workflow_dispatch opt-in.
