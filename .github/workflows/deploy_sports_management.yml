name: Deploy Supabase production

on:
  pull_request_target:
    branches: [main]
    paths:
      - '.github/workflows/deploy_sports_management.yml'
  workflow_dispatch:
    inputs:
      apply_migrations:
        description: 'Apply pending database migrations after a successful dry-run'
        required: true
        default: false
        type: boolean
      deploy_send_push:
        description: 'Deploy the send-push Edge Function'
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: supabase-production-deployment
  cancel-in-progress: false

env:
  SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
  SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
  SUPABASE_PROJECT_ID: ovzijmqrnsgcmryinkfa

jobs:
  deploy:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.pull_request.head.repo.full_name == github.repository &&
       startsWith(github.event.pull_request.head.ref, 'release/run-sports-deployment'))
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout authorized deployment candidate
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Check deployment secrets
        shell: bash
        run: |
          set -euo pipefail
          missing=0

          if [ -z "${SUPABASE_ACCESS_TOKEN:-}" ]; then
            echo "::error title=Missing repository secret::SUPABASE_ACCESS_TOKEN is not configured in Settings > Secrets and variables > Actions."
            missing=1
          fi

          if [ -z "${SUPABASE_DB_PASSWORD:-}" ]; then
            echo "::error title=Missing repository secret::SUPABASE_DB_PASSWORD is not configured in Settings > Secrets and variables > Actions."
            missing=1
          fi

          if [ "$missing" -ne 0 ]; then
            exit 1
          fi

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@ab058987d8d6c725971f6cf9d0b5c98467e30bd1 # v1
        with:
          version: 2.111.0

      - name: Link Production
        shell: bash
        run: |
          set -euo pipefail
          supabase link \
            --project-ref "$SUPABASE_PROJECT_ID" \
            --password "$SUPABASE_DB_PASSWORD"

      - name: Record deployment candidate
        shell: bash
        run: |
          set -euo pipefail
          git rev-parse HEAD | tee deployment-sha.txt

      - name: Record migration state before deployment
        shell: bash
        run: |
          set -euo pipefail
          supabase migration list | tee migration-before.txt

      - name: Preflight pending migrations
        shell: bash
        run: |
          set -euo pipefail
          supabase db push \
            --password "$SUPABASE_DB_PASSWORD" \
            --dry-run

      - name: Apply pending migrations
        if: github.event_name == 'workflow_dispatch' && inputs.apply_migrations
        shell: bash
        run: |
          set -euo pipefail
          supabase db push \
            --password "$SUPABASE_DB_PASSWORD" \
            --yes

      - name: Record migration state after preflight or deployment
        shell: bash
        run: |
          set -euo pipefail
          supabase migration list | tee migration-after.txt

      - name: Deploy send-push
        if: github.event_name == 'workflow_dispatch' && inputs.deploy_send_push
        shell: bash
        run: |
          set -euo pipefail
          supabase functions deploy send-push \
            --project-ref "$SUPABASE_PROJECT_ID" \
            --no-verify-jwt \
            --use-api

      - name: Upload deployment diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: supabase-production-deployment
          path: |
            deployment-sha.txt
            migration-before.txt
            migration-after.txt
          if-no-files-found: warn

  deploy_testqa_20260818001000:
    if: >-
      github.event_name == 'pull_request_target' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'release/run-sports-deployment-testqa-20260818001000'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout trusted main revision only
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Require deployment secrets
        shell: bash
        run: |
          set -euo pipefail
          test -n "${SUPABASE_ACCESS_TOKEN:-}"
          test -n "${SUPABASE_DB_PASSWORD:-}"

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@ab058987d8d6c725971f6cf9d0b5c98467e30bd1 # v1
        with:
          version: 2.111.0

      - name: Link Production
        shell: bash
        run: |
          set -euo pipefail
          supabase link \
            --project-ref "$SUPABASE_PROJECT_ID" \
            --password "$SUPABASE_DB_PASSWORD"

      - name: Require exact 483 to 484 migration state
        shell: bash
        run: |
          set -euo pipefail
          supabase migration list > /tmp/migration-before.txt
          awk -F'|' '{ remote=$2; gsub(/[^0-9]/, "", remote); if (length(remote) == 14 && remote ~ /^[0-9]+$/) print remote }' /tmp/migration-before.txt | sort -u > /tmp/remote-before.txt
          find supabase/migrations -maxdepth 1 -type f -name '*.sql' -printf '%f\n' \
            | sed -nE 's/^([0-9]{14})_.+\.sql$/\1/p' \
            | sort -u > /tmp/local.txt
          test "$(wc -l < /tmp/remote-before.txt | tr -d ' ')" = '483'
          test "$(tail -n 1 /tmp/remote-before.txt)" = '20260817225600'
          comm -23 /tmp/remote-before.txt /tmp/local.txt > /tmp/remote-only.txt
          comm -13 /tmp/remote-before.txt /tmp/local.txt > /tmp/local-only.txt
          test ! -s /tmp/remote-only.txt
          test "$(wc -l < /tmp/local-only.txt | tr -d ' ')" = '1'
          test "$(cat /tmp/local-only.txt)" = '20260818001000'

      - name: Dry-run migration 20260818001000
        shell: bash
        run: |
          set -euo pipefail
          supabase db push \
            --password "$SUPABASE_DB_PASSWORD" \
            --dry-run | tee /tmp/dry-run.txt
          grep -q '20260818001000' /tmp/dry-run.txt

      - name: Apply migration 20260818001000
        shell: bash
        run: |
          set -euo pipefail
          supabase db push \
            --password "$SUPABASE_DB_PASSWORD" \
            --yes

      - name: Verify exact post-deployment state
        shell: bash
        run: |
          set -euo pipefail
          supabase migration list > /tmp/migration-after.txt
          awk -F'|' '{ remote=$2; gsub(/[^0-9]/, "", remote); if (length(remote) == 14 && remote ~ /^[0-9]+$/) print remote }' /tmp/migration-after.txt | sort -u > /tmp/remote-after.txt
          test "$(wc -l < /tmp/remote-after.txt | tr -d ' ')" = '484'
          test "$(tail -n 1 /tmp/remote-after.txt)" = '20260818001000'
          cmp -s /tmp/remote-after.txt /tmp/local.txt

# Production release PRs are dry-run only. Real database or Edge Function writes
# require an explicit manual workflow_dispatch opt-in, except the one-off guarded
# TestQA migration job above, which is restricted to one internal branch and one
# exact migration inventory and will be removed after verification.
