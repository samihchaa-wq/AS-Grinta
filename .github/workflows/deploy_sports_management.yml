name: Deploy Supabase production

on:
  pull_request_target:
    branches: [main]
    paths:
      - '.github/workflows/deploy_sports_management.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: supabase-production-deployment
  cancel-in-progress: false

env:
  SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
  SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
  SUPABASE_PROJECT_ID: ovzijmqrnsgcmryinkfa

jobs:
  deploy:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.pull_request.head.repo.full_name == github.repository &&
       startsWith(github.event.pull_request.head.ref, 'release/run-sports-deployment'))
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout authorized deployment candidate
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Check deployment secrets
        shell: bash
        run: |
          set -euo pipefail
          missing=0

          if [ -z "${SUPABASE_ACCESS_TOKEN:-}" ]; then
            echo "::error title=Missing repository secret::SUPABASE_ACCESS_TOKEN is not configured in Settings > Secrets and variables > Actions."
            missing=1
          fi

          if [ -z "${SUPABASE_DB_PASSWORD:-}" ]; then
            echo "::error title=Missing repository secret::SUPABASE_DB_PASSWORD is not configured in Settings > Secrets and variables > Actions."
            missing=1
          fi

          if [ "$missing" -ne 0 ]; then
            exit 1
          fi

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: 2.111.0

      - name: Link Production
        shell: bash
        run: |
          set -euo pipefail
          supabase link \
            --project-ref "$SUPABASE_PROJECT_ID" \
            --password "$SUPABASE_DB_PASSWORD"

      - name: Record deployment candidate
        shell: bash
        run: |
          set -euo pipefail
          git rev-parse HEAD | tee deployment-sha.txt

      - name: Record migration state before deployment
        shell: bash
        run: |
          set -euo pipefail
          supabase migration list | tee migration-before.txt

      - name: Preflight pending migrations
        shell: bash
        run: |
          set -euo pipefail
          supabase db push \
            --password "$SUPABASE_DB_PASSWORD" \
            --dry-run

      - name: Apply pending migrations
        shell: bash
        run: |
          set -euo pipefail
          supabase db push \
            --password "$SUPABASE_DB_PASSWORD" \
            --yes

      - name: Record migration state after deployment
        shell: bash
        run: |
          set -euo pipefail
          supabase migration list | tee migration-after.txt

      - name: Deploy send-push
        shell: bash
        run: |
          set -euo pipefail
          supabase functions deploy send-push \
            --project-ref "$SUPABASE_PROJECT_ID" \
            --no-verify-jwt \
            --use-api

      - name: Upload deployment diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: supabase-production-deployment
          path: |
            deployment-sha.txt
            migration-before.txt
            migration-after.txt
          if-no-files-found: warn

# Workflow de déploiement production : utiliser uniquement une release autorisée
# après validation des contrôles Flutter et Supabase correspondants.
