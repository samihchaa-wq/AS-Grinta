name: Format effectif final

on:
  push:
    branches: [agent/tap-effectif-category-final]

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: agent/tap-effectif-category-final
          fetch-depth: 0

      - name: Setup Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: stable
          cache: true

      - name: Format and clean up
        shell: bash
        run: |
          set -euo pipefail
          dart format lib/features/sports_management/presentation/admin_squad_plan_page_widgets.dart
          rm .github/workflows/format-effectif-final.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add lib/features/sports_management/presentation/admin_squad_plan_page_widgets.dart .github/workflows/format-effectif-final.yml
          git commit -m 'Finaliser le formatage Effectif'
          git push origin HEAD:agent/tap-effectif-category-final
