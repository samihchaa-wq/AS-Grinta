name: Temporary lifecycle SQL test patch

on:
  push:
    branches:
      - agent/match-lifecycle-cleanup

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Patch lifecycle SQL fixtures
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          business = Path('supabase/tests/database/business_rls.test.sql')
          text = business.read_text()
          old = """update public.matches
          set status = 'termine',
              score_as_grinta = 2,
              score_adverse = 1,
              result_validated_at = now(),
              predictions_closed_at = now(),
              updated_at = now()
          where id = '50000000-0000-0000-0000-000000000001';
          """
          new = """-- Make the fixture lifecycle-realistic: reschedule while the match is still
          -- editable, then finalize only after the planned duration + 15 minute buffer.
          update public.matches
          set match_date = ((now() - interval '2 hours') at time zone 'Europe/Paris')::date,
              match_time = ((now() - interval '2 hours') at time zone 'Europe/Paris')::time,
              updated_at = now()
          where id = '50000000-0000-0000-0000-000000000001';

          update public.matches
          set status = 'termine',
              score_as_grinta = 2,
              score_adverse = 1,
              result_validated_at = now(),
              predictions_closed_at = now(),
              updated_at = now()
          where id = '50000000-0000-0000-0000-000000000001';
          """
          if old not in text:
              raise SystemExit('business_rls finalization fixture not found')
          text = text.replace(old, new, 1)
          text = text.replace('-- Match situé dans la fenêtre H-5.', '-- Match situé dans la fenêtre T-15.')
          text = text.replace('-- Fermeture manuelle et H-5.', '-- Fermeture manuelle et T-15.')
          text = text.replace('un match situé à moins de cinq minutes est exclu de la fenêtre de pronostic', 'un match situé à moins de quinze minutes est exclu de la fenêtre de pronostic')
          business.write_text(text)

          exhaustive = Path('supabase/tests/database/exhaustive_match_lifecycle_state_space.test.sql')
          text = exhaustive.read_text()
          old_expectation = "insert into pg_temp.match_status_state_space values(v_status,v_status in ('a_venir','termine','archive'),v_ok,v_state,v_message);"
          new_expectation = "insert into pg_temp.match_status_state_space values(v_status,v_status = 'a_venir',v_ok,v_state,v_message);"
          if old_expectation not in text:
              raise SystemExit('status state-space expectation not found')
          text = text.replace(old_expectation, new_expectation, 1)

          old_final = """select public.update_match_with_odds(
            current_setting('test.lifecycle_replacement_match')::uuid,
            'e2000000-0000-0000-0000-000000000001','e3000000-0000-0000-0000-000000000002',
            date '2099-03-01',time '21:00','exterieur','termine',null,null,null);
          select ok(public.archive_match(current_setting('test.lifecycle_replacement_match')::uuid),'archivage initial réussi');
          """
          new_final = """select throws_ok(
            format('select public.archive_match(%L::uuid)',current_setting('test.lifecycle_replacement_match')),
            '22023',
            'un match à venir ne peut pas être archivé'
          );

          -- Move the still-editable fixture into the past first. The following status
          -- transition then exercises the real post-game validation window.
          select public.update_match_with_odds(
            current_setting('test.lifecycle_replacement_match')::uuid,
            'e2000000-0000-0000-0000-000000000001','e3000000-0000-0000-0000-000000000002',
            date '2000-01-02',time '21:00','exterieur','a_venir',2,3,4);
          select public.update_match_with_odds(
            current_setting('test.lifecycle_replacement_match')::uuid,
            'e2000000-0000-0000-0000-000000000001','e3000000-0000-0000-0000-000000000002',
            date '2000-01-02',time '21:00','exterieur','termine',null,null,null);
          select ok(public.archive_match(current_setting('test.lifecycle_replacement_match')::uuid),'archivage initial réussi');
          """
          if old_final not in text:
              raise SystemExit('final archive lifecycle block not found')
          text = text.replace(old_final, new_final, 1)
          exhaustive.write_text(text)
          PY
      - name: Commit lifecycle SQL test updates
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add supabase/tests/database/business_rls.test.sql supabase/tests/database/exhaustive_match_lifecycle_state_space.test.sql
          git commit -m "Align SQL lifecycle fixtures with post-game rules"
          git push origin HEAD:agent/match-lifecycle-cleanup
