name: Agent fix business RLS finalization fixture

on:
  push:
    branches:
      - agent/match-lifecycle-cleanup

permissions:
  contents: write

jobs:
  fix-fixture:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/match-lifecycle-cleanup
          fetch-depth: 0

      - name: Make finalization fixture lifecycle-realistic
        shell: python
        run: |
          from pathlib import Path

          path = Path('supabase/tests/database/business_rls.test.sql')
          text = path.read_text()
          marker = "-- Finalisation réservée au staff, rollback complet, puis succès.\n"
          if marker not in text:
              raise SystemExit('finalization marker not found')

          before, after = text.split(marker, 1)
          old_date = "date '2098-02-01'"
          new_date = "date '2000-01-03'"
          if old_date not in after:
              raise SystemExit('expected future-date references not found in finalization section')

          setup = """-- Replacer le match de finalisation dans le passé pendant qu'il est encore éditable.\nselect set_config(\n  'request.jwt.claims',\n  '{\"sub\":\"10000000-0000-0000-0000-000000000001\",\"role\":\"authenticated\",\"aud\":\"authenticated\"}',\n  true\n);\nset local role authenticated;\nselect ok(\n  public.update_match_with_odds(\n    (select id from public.matches where match_date = date '2098-02-01'),\n    '20000000-0000-0000-0000-000000000001',\n    '30000000-0000-0000-0000-000000000001',\n    date '2000-01-03', time '20:30', 'exterieur', 'a_venir', 2.20, 3.30, 4.40\n  ),\n  'la fixture de finalisation est replacée après sa fenêtre de fin planifiée'\n);\nreset role;\n\n"""

          after = after.replace(old_date, new_date)
          path.write_text(before + marker + setup + after)

      - name: Remove temporary workflow
        run: rm .github/workflows/agent-fix-business-rls-finalization.yml

      - name: Commit fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add supabase/tests/database/business_rls.test.sql .github/workflows/agent-fix-business-rls-finalization.yml
          git diff --cached --quiet && exit 0
          git commit -m "test: align postgame fixture with lifecycle timing"
          git push origin HEAD:agent/match-lifecycle-cleanup
