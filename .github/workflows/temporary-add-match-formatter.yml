name: Temporary add match formatter

on:
  push:
    branches:
      - ui/refine-add-match-form-cards

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ui/refine-add-match-form-cards

      - name: Setup Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
        with:
          channel: stable
          cache: true

      - name: Install locked dependencies
        run: flutter pub get --enforce-lockfile

      - name: Format match form
        run: dart format lib/features/matches/presentation/calendar_entry_form_page.dart

      - name: Commit formatting if needed
        run: |
          if git diff --quiet; then
            echo "Nothing to format."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/features/matches/presentation/calendar_entry_form_page.dart
          git commit -m "Format add match form"
          git push origin HEAD:ui/refine-add-match-form-cards
