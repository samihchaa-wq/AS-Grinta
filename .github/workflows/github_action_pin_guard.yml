name: GitHub action pin guard

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/**'
      - '.github/actions/**'
      - 'lib/**/*.dart'
      - 'test/**/*.dart'
  push:
    branches: [main]
    paths:
      - '.github/workflows/**'
      - '.github/actions/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-pins:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: stable
          cache: true

      - name: Show exact Dart formatter diff
        shell: bash
        run: |
          set -euo pipefail
          dart format \
            lib/features/matches/presentation/calendar_entry_form_page.dart \
            lib/features/matches/presentation/match_form_page.dart \
            lib/features/matches/presentation/widgets/convocation_launch_picker.dart \
            lib/features/matches/presentation/widgets/match_meeting_time_picker.dart \
            lib/features/matches/presentation/widgets/match_option_button.dart \
            lib/features/matches/presentation/widgets/match_wheel_picker.dart \
            test/match_meeting_test.dart
          echo '--- FORMATTER DIFF START ---'
          git diff -- \
            lib/features/matches/presentation/calendar_entry_form_page.dart \
            lib/features/matches/presentation/match_form_page.dart \
            lib/features/matches/presentation/widgets/convocation_launch_picker.dart \
            lib/features/matches/presentation/widgets/match_meeting_time_picker.dart \
            lib/features/matches/presentation/widgets/match_option_button.dart \
            lib/features/matches/presentation/widgets/match_wheel_picker.dart \
            test/match_meeting_test.dart
          echo '--- FORMATTER DIFF END ---'
