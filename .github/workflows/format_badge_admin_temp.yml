name: Format badge admin temporary

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Format badge admin page
        run: dart format lib/features/badges/presentation/badge_admin_page.dart

      - name: Upload formatted file
        uses: actions/upload-artifact@v4
        with:
          name: formatted-badge-admin
          path: lib/features/badges/presentation/badge_admin_page.dart
