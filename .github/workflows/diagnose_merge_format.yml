name: Diagnose merge formatting

on:
  push:
    branches: [feat/grinta-loading-system]

permissions:
  contents: write
  actions: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/grinta-loading-system
          fetch-depth: 0

      - name: Capture failed Flutter CI log
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh run view 30199419570 \
            --repo samihchaa-wq/AS-Grinta \
            --log-failed > .ci-format-log.txt
          git add .ci-format-log.txt

      - name: Commit diagnostic
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: capture failed formatter log"
          git push
