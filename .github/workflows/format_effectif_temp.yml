name: Format Effectif temp

on:
  push:
    branches: [ui/hide-internal-squad-limit]

permissions:
  contents: write

jobs:
  format-effectif:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Setup Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: stable
          cache: true
      - name: Resolve package language version and format
        shell: bash
        run: |
          set -euo pipefail
          flutter pub get --enforce-lockfile
          git checkout -- analysis_options.yaml
          target='lib/features/sports_management/presentation/admin_squad_plan_page_effectif.dart'
          dart format "$target"
          if git diff --quiet -- "$target"; then
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "$target"
          git commit -m 'Aligner le formatage Effectif sur la CI'
          git push origin HEAD:ui/hide-internal-squad-limit
