name: Deploy combined Pages with staging

on:
  push:
    branches: [staging]
  repository_dispatch:
    types: [staging-pages-deploy]
  workflow_run:
    workflows: [Deploy Flutter Web to GitHub Pages]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

env:
  STAGING_REF: ${{ github.event_name == 'repository_dispatch' && github.event.client_payload.staging_sha || 'staging' }}

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  dispatch-staging:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Request a main-context staging deployment
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          payload=$(jq -cn --arg sha "$GITHUB_SHA" '{event_type:"staging-pages-deploy",client_payload:{staging_sha:$sha}}')
          curl -LfsS \
            -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/dispatches" \
            -d "$payload"

  build:
    if: github.event_name != 'push' && (github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success')
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout production
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: main
          path: production
          fetch-depth: 0

      - name: Checkout staging
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ env.STAGING_REF }}
          path: staging-app
          fetch-depth: 0

      - name: Setup Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: stable
          cache: true

      - name: Configure Pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5

      - name: Build validated production root
        shell: bash
        run: |
          set -euo pipefail
          cd production
          flutter pub get
          app_version=$(awk '/^version:/{print $2}' pubspec.yaml)
          prod_sha=$(git rev-parse HEAD)
          web_version="${app_version}-${prod_sha:0:12}"
          cat > web/build_version.js <<EOF
          (function (globalScope) {
            globalScope.AS_GRINTA_WEB_VERSION = '${web_version}';
          })(typeof self !== 'undefined' ? self : window);
          EOF
          flutter build web \
            --release \
            --base-href "/AS-Grinta/" \
            --pwa-strategy=none \
            --no-web-resources-cdn \
            --dart-define-from-file=config/production.json \
            --dart-define=APP_VERSION="$app_version"
          WEB_VERSION="$web_version" python3 tool/stamp_web_release.py
          MAX_MAIN_DART_JS_BYTES=6000000 \
          MAX_MAIN_DART_JS_GZIP_BYTES=1700000 \
            python3 tool/check_web_performance_budget.py
          cp build/web/index.html build/web/404.html
          grep -q '/AS-Grinta/' build/web/index.html
          grep -q 'Content-Security-Policy' build/web/index.html

      - name: Build isolated staging application
        shell: bash
        run: |
          set -euo pipefail
          cd staging-app
          test -f config/staging.json
          test "$(jq -r '.SUPABASE_URL' config/staging.json)" = "https://dhwrtdnjwdkvdyvojvjl.supabase.co"
          if grep -Fq 'ovzijmqrnsgcmryinkfa' config/staging.json; then
            echo '::error::Staging config points to production Supabase.'
            exit 1
          fi
          flutter pub get
          app_version=$(awk '/^version:/{print $2}' pubspec.yaml)
          staging_sha=$(git rev-parse HEAD)
          web_version="${app_version}-staging-${staging_sha:0:12}"
          cat > web/build_version.js <<EOF
          (function (globalScope) {
            globalScope.AS_GRINTA_WEB_VERSION = '${web_version}';
          })(typeof self !== 'undefined' ? self : window);
          EOF
          flutter build web \
            --release \
            --base-href "/AS-Grinta/staging/" \
            --pwa-strategy=none \
            --no-web-resources-cdn \
            --dart-define-from-file=config/staging.json \
            --dart-define=APP_VERSION="$app_version"
          WEB_VERSION="$web_version" python3 tool/stamp_web_release.py

          prod_supabase_url="$(jq -r '.SUPABASE_URL' config/production.json)"
          staging_supabase_url="$(jq -r '.SUPABASE_URL' config/staging.json)"
          prod_supabase_host="${prod_supabase_url#https://}"
          staging_supabase_host="${staging_supabase_url#https://}"
          test -n "$prod_supabase_host"
          test -n "$staging_supabase_host"
          test "$prod_supabase_host" != "$staging_supabase_host"
          PROD_SUPABASE_HOST="$prod_supabase_host" \
          STAGING_SUPABASE_HOST="$staging_supabase_host" \
            python3 - <<'PY'
          import os
          from pathlib import Path

          index_path = Path('build/web/index.html')
          html = index_path.read_text()
          production_host = os.environ['PROD_SUPABASE_HOST']
          staging_host = os.environ['STAGING_SUPABASE_HOST']

          if production_host not in html:
              raise SystemExit('Production Supabase host is absent from the staging CSP template.')

          html = html.replace(production_host, staging_host)

          if production_host in html:
              raise SystemExit('Production Supabase host remains in the staging HTML after CSP retargeting.')
          if staging_host not in html:
              raise SystemExit('Staging Supabase host is absent from the staging HTML after CSP retargeting.')

          index_path.write_text(html)
          PY

          cp build/web/index.html build/web/404.html
          grep -q '/AS-Grinta/staging/' build/web/index.html
          grep -q 'Content-Security-Policy' build/web/index.html
          grep -Fq "$staging_supabase_host" build/web/index.html
          if grep -Fq "$prod_supabase_host" build/web/index.html; then
            echo '::error::Production Supabase remains allowed by the staging HTML CSP.'
            exit 1
          fi

      - name: Combine production and staging without replacing production root
        shell: bash
        run: |
          set -euo pipefail
          rm -rf production/build/web/staging
          mkdir -p production/build/web/staging
          cp -a staging-app/build/web/. production/build/web/staging/
          test -s production/build/web/index.html
          test -s production/build/web/main.dart.js
          test -s production/build/web/staging/index.html
          test -s production/build/web/staging/main.dart.js

      - name: Upload combined GitHub Pages artifact
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: production/build/web

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      pages: write
      id-token: write
    steps:
      - name: Deploy production plus staging
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4

  smoke-test:
    needs: deploy
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Verify production and staging URLs
        shell: bash
        run: |
          set -euo pipefail
          token="$(date +%s)"
          prod='https://samihchaa-wq.github.io/AS-Grinta/'
          staging='https://samihchaa-wq.github.io/AS-Grinta/staging/'
          prod_supabase_host='ovzijmqrnsgcmryinkfa.supabase.co'
          staging_supabase_host='dhwrtdnjwdkvdyvojvjl.supabase.co'

          fetch_after_pages_propagation() {
            local url="$1"
            local destination="$2"
            local label="$3"
            local status=''

            for attempt in $(seq 1 18); do
              status="$(curl -L -sS -o "$destination" -w '%{http_code}' "${url}?smoke=${token}" || true)"
              if [ "$status" = '200' ] && [ -s "$destination" ]; then
                echo "${label} available after attempt ${attempt}."
                return 0
              fi
              echo "Waiting for GitHub Pages propagation: ${label} returned HTTP ${status:-transport-error} (attempt ${attempt}/18)."
              sleep 5
            done

            echo "::error::${label} did not become available after the Pages propagation window (last HTTP ${status:-transport-error})."
            return 1
          }

          fetch_after_pages_propagation "$prod" /tmp/prod.html production
          fetch_after_pages_propagation "$staging" /tmp/staging.html staging
          curl --retry 5 --retry-delay 3 -LfsS \
            'https://dhwrtdnjwdkvdyvojvjl.supabase.co/auth/v1/health' \
            -H 'apikey: sb_publishable_jTOp1ah4CLw8OIKloeHUiQ_PvYS2J5q' \
            -o /tmp/staging-auth-health.json
          test -s /tmp/prod.html
          test -s /tmp/staging.html
          test -s /tmp/staging-auth-health.json
          grep -q '/AS-Grinta/' /tmp/prod.html
          grep -q '/AS-Grinta/staging/' /tmp/staging.html
          grep -Fq "$prod_supabase_host" /tmp/prod.html
          grep -Fq "$staging_supabase_host" /tmp/staging.html
          if grep -Fq "$staging_supabase_host" /tmp/prod.html; then
            echo '::error::Production HTML unexpectedly allows the staging Supabase host.'
            exit 1
          fi
          if grep -Fq "$prod_supabase_host" /tmp/staging.html; then
            echo '::error::Staging HTML unexpectedly allows the production Supabase host.'
            exit 1
          fi
