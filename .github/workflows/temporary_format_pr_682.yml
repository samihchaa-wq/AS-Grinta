name: Temporary format PR 682

on:
  push:
    branches:
      - agent/match-temporality-notifications

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: agent/match-temporality-notifications
          fetch-depth: 0

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Format exact PR files
        shell: bash
        run: |
          set -euo pipefail
          dart format \
            lib/features/notifications/presentation/notifications_page.dart \
            lib/features/predictions/data/predictions_repository.dart \
            lib/features/predictions/presentation/merged_matches_view.dart \
            lib/features/sports_management/presentation/admin_squad_plan_page_state.dart \
            lib/features/sports_management/presentation/match_lineup_page.dart \
            test/exhaustive_prediction_state_space_test.dart \
            test/match_weather_card_test.dart

      - name: Commit formatter output
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet --exit-code; then
            echo 'Already formatted.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            lib/features/notifications/presentation/notifications_page.dart \
            lib/features/predictions/data/predictions_repository.dart \
            lib/features/predictions/presentation/merged_matches_view.dart \
            lib/features/sports_management/presentation/admin_squad_plan_page_state.dart \
            lib/features/sports_management/presentation/match_lineup_page.dart \
            test/exhaustive_prediction_state_space_test.dart \
            test/match_weather_card_test.dart
          git commit -m 'Apply Dart formatter'
          git push origin HEAD:agent/match-temporality-notifications
