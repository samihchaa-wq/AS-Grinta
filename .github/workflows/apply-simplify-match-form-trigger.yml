name: Apply simplified match form

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  apply:
    if: github.event.pull_request.head.ref == 'agent/simplify-match-form'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/simplify-match-form
          fetch-depth: 0
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Apply implementation
        run: python .github/agent/apply_simplify_match_form.py
      - name: Validate
        run: |
          dart format lib/features/matches/presentation/match_form_page.dart
          flutter pub get
          flutter analyze --fatal-infos
          flutter test
          flutter build web --release
          git diff --check
      - name: Commit implementation
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "Simplifier le formulaire de match [match-form-applied]"
          git push origin HEAD:agent/simplify-match-form
