name: Temporary patch guest publication once

on:
  push:
    branches:
      - agent/clarify-effectif-publication

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: agent/clarify-effectif-publication
          fetch-depth: 0

      - name: Apply unique guest scenario patch
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path('supabase/tests/database/sports_management_guests.test.sql')
          text = path.read_text()
          marker = """update public.match_sport_participants
set availability_status = 'available',
    availability_updated_at = now(),
    availability_updated_by = 'a1000000-0000-0000-0000-000000000001',
    convocation_status = 'convoked',
    updated_at = now()
where match_id = current_setting('test.guest_match')::uuid
  and season_player_id is not null;

select set_config(
  'request.jwt.claims',
  '{\"sub\":\"a1000000-0000-0000-0000-000000000001\",\"role\":\"authenticated\",\"aud\":\"authenticated\"}',
  true
);
set local role authenticated;

select is(
  public.admin_save_match_composition(
"""
          replacement = """update public.match_sport_participants
set availability_status = 'available',
    availability_updated_at = now(),
    availability_updated_by = 'a1000000-0000-0000-0000-000000000001',
    convocation_status = 'convoked',
    updated_at = now()
where match_id = current_setting('test.guest_match')::uuid
  and season_player_id is not null;

select set_config(
  'request.jwt.claims',
  '{\"sub\":\"a1000000-0000-0000-0000-000000000001\",\"role\":\"authenticated\",\"aud\":\"authenticated\"}',
  true
);
set local role authenticated;

select is(
  public.admin_publish_match_effectif(
    current_setting('test.guest_match')::uuid,
    14,
    (
      select jsonb_agg(
        jsonb_build_object(
          'season_player_id', participant.season_player_id,
          'status', 'convoked'
        ) order by participant.season_player_id
      )
      from public.match_sport_participants participant
      where participant.match_id = current_setting('test.guest_match')::uuid
        and participant.season_player_id is not null
        and participant.availability_status = 'available'
    ),
    'Publication préalable des convocations avec invité'
  ) #>> '{convocation_version}',
  '1',
  'les convocations sont publiées explicitement avant la composition invitée'
);

select is(
  public.admin_save_match_composition(
"""
          if replacement in text:
              print('Le scénario invité est déjà corrigé.')
          elif text.count(marker) == 1:
              path.write_text(text.replace(marker, replacement, 1))
          else:
              raise SystemExit(f'Point insertion unique introuvable: {text.count(marker)} occurrence(s)')
          PY
          git rm .github/workflows/temporary_patch_guest_publication_once.yml

      - name: Commit patch and self-removal
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add supabase/tests/database/sports_management_guests.test.sql
          git commit -m 'Publier les convocations dans le scénario invité'
          git push origin HEAD:agent/clarify-effectif-publication
