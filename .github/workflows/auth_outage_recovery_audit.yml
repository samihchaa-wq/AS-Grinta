name: Auth Outage Recovery Audit

on:
  push:
    branches: [audit/authenticated-admin-e2e]
    paths:
      - '.github/workflows/auth_outage_recovery_audit.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  recovery:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    env:
      APP_URL: https://samihchaa-wq.github.io/AS-Grinta/
      TEST_USERNAME: Testt
      TEST_PASSWORD: ${{ secrets.E2E_TESTT_PASSWORD }}
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm install --no-save playwright-core@1.52.0
      - name: Simulate profile API outage then recovery
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p auth-outage
          node <<'NODE'
          const fs=require('fs');const{chromium}=require('playwright-core');
          (async()=>{const b=await chromium.launch({headless:true,executablePath:'/usr/bin/google-chrome',args:['--no-sandbox','--disable-dev-shm-usage']});const c=await b.newContext({viewport:{width:390,height:844},serviceWorkers:'block'});const p=await c.newPage();const wait=ms=>p.waitForTimeout(ms);async function sem(){try{await p.evaluate(()=>document.querySelector('flt-semantics-placeholder')?.click());await wait(150)}catch(_){}}async function focus(l){const a=p.locator(`[aria-label="${l}"]`).first();if(await a.count())return a.click({force:true});const t=p.getByText(l,{exact:true}).first();if(await t.count())return t.click({force:true});throw new Error(`missing ${l}`)}
          await p.goto(`${process.env.APP_URL}?auth-recovery-login=${Date.now()}#/auth/sign-in`,{waitUntil:'networkidle',timeout:90000});await wait(1200);await sem();await focus('Identifiant');await p.keyboard.type(process.env.TEST_USERNAME);await focus('Mot de passe');await p.keyboard.type(process.env.TEST_PASSWORD);await focus('Se connecter');await p.waitForFunction(()=>!location.hash.includes('/auth/'),null,{timeout:45000});await wait(1500);
          const before=p.url();let intercepted=0;await p.route('**/rest/v1/rpc/get_my_profile',async route=>{intercepted++;await route.fulfill({status:503,contentType:'application/json',body:'{"message":"audit simulated outage"}'})});
          await p.reload({waitUntil:'domcontentloaded',timeout:60000});await wait(9000);await sem();const during=p.url();const duringText=(await p.locator('body').innerText().catch(()=>'' )).replace(/\s+/g,' ').trim().slice(0,1200);await p.screenshot({path:'auth-outage/during.png',fullPage:true}).catch(()=>{});
          await p.unroute('**/rest/v1/rpc/get_my_profile');await p.reload({waitUntil:'networkidle',timeout:60000});await wait(3500);await sem();const after=p.url();const afterText=(await p.locator('body').innerText().catch(()=>'' )).replace(/\s+/g,' ').trim().slice(0,1200);await p.screenshot({path:'auth-outage/after.png',fullPage:true}).catch(()=>{});
          const result={before,during,after,intercepted,duringLooksSignedOut:during.includes('/auth/sign-in'),recoveredWithoutCredentials:!after.includes('/auth/'),duringText,afterText};fs.writeFileSync('auth-outage/result.json',JSON.stringify(result,null,2));fs.writeFileSync('auth-outage/result.txt',JSON.stringify(result,null,2));await b.close()})().catch(e=>{console.error(e);process.exit(1)});
          NODE
      - if: always()
        run: cat auth-outage/result.txt || true
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: auth-outage-recovery
          path: auth-outage/
          retention-days: 7
