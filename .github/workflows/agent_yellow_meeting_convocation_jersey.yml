name: Agent yellow meeting convocation jersey

on:
  push:
    branches:
      - agent/yellow-meeting-convocation-jersey

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: agent/yellow-meeting-convocation-jersey
          fetch-depth: 0
      - name: Apply patch
        run: bash .github/scripts/patch_selected_yellow.sh
