name: Refresh lock diagnostic

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  generate-lock:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Regenerate lockfile with CI Flutter
        run: flutter pub get
      - name: Upload generated lockfile
        uses: actions/upload-artifact@v4
        with:
          name: generated-pubspec-lock
          path: pubspec.lock
          if-no-files-found: error
