name: Temporary compact match repair

on:
  push:
    branches: [feat/compact-match-form-wheel-pickers]

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: feat/compact-match-form-wheel-pickers
          fetch-depth: 0

      - name: Setup Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: stable
          cache: true

      - name: Resolve dependencies
        run: flutter pub get

      - name: Repair compile error
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('lib/features/matches/presentation/match_form_page.dart')
          text = path.read_text()
          old = "appBar: const GrintaAppBar(\n        title: Text('Modifier'),"
          new = "appBar: GrintaAppBar(\n        title: const Text('Modifier'),"
          if old in text:
              text = text.replace(old, new, 1)
              path.write_text(text)
          elif new not in text:
              raise SystemExit('Expected GrintaAppBar snippet not found')
          PY

      - name: Format compact match refactor
        run: |
          dart format \
            lib/features/matches/domain/match_meeting.dart \
            lib/features/matches/presentation/calendar_entry_form_page.dart \
            lib/features/matches/presentation/match_form_page.dart \
            lib/features/matches/presentation/widgets/convocation_launch_picker.dart \
            lib/features/matches/presentation/widgets/match_meeting_time_picker.dart \
            lib/features/matches/presentation/widgets/match_wheel_picker.dart \
            test/match_meeting_test.dart \
            test/match_meeting_time_picker_test.dart

      - name: Commit repair output
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet; then
            echo "Already repaired and formatted."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            lib/features/matches/domain/match_meeting.dart \
            lib/features/matches/presentation/calendar_entry_form_page.dart \
            lib/features/matches/presentation/match_form_page.dart \
            lib/features/matches/presentation/widgets/convocation_launch_picker.dart \
            lib/features/matches/presentation/widgets/match_meeting_time_picker.dart \
            lib/features/matches/presentation/widgets/match_wheel_picker.dart \
            test/match_meeting_test.dart \
            test/match_meeting_time_picker_test.dart
          git commit -m "Repair and format compact match form"
          git push origin HEAD:feat/compact-match-form-wheel-pickers
