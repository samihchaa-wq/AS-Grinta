name: Temporary compact match repair

on:
  push:
    branches: [feat/compact-match-form-wheel-pickers]

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: feat/compact-match-form-wheel-pickers
          fetch-depth: 0

      - name: Setup Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: stable
          cache: true

      - name: Resolve dependencies
        run: flutter pub get

      - name: Repair analyzer findings
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('lib/features/matches/presentation/match_form_page.dart')
          text = path.read_text()
          text = text.replace(
              "import 'package:as_grinta/features/matches/presentation/widgets/convocation_launch_picker.dart';\n",
              "",
              1,
          )
          old = "  ConvocationLaunchMode _launchMode = ConvocationLaunchMode.automatic;"
          new = "  final ConvocationLaunchMode _launchMode = ConvocationLaunchMode.automatic;"
          if old in text:
              text = text.replace(old, new, 1)
          elif new not in text:
              raise SystemExit('Expected _launchMode declaration not found')
          path.write_text(text)
          PY

      - name: Format repaired file
        run: dart format lib/features/matches/presentation/match_form_page.dart

      - name: Commit repair output
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- lib/features/matches/presentation/match_form_page.dart; then
            echo "Already repaired."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/features/matches/presentation/match_form_page.dart
          git commit -m "Fix compact match form analyzer findings"
          git push origin HEAD:feat/compact-match-form-wheel-pickers
