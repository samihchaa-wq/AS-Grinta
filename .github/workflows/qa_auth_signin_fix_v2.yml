name: QA auth sign-in fix v2

on:
  push:
    branches: [fix/auth-signin-offline-feedback]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: qa-auth-signin-fix-v2
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: stable
          cache: true

      - name: Install and test
        run: |
          flutter pub get --enforce-lockfile
          flutter test test/auth_controller_test.dart test/auth_signin_error_message_test.dart

      - name: Build staging-configured web
        run: |
          flutter build web \
            --release \
            --base-href "/" \
            --pwa-strategy=none \
            --no-web-resources-cdn \
            --dart-define-from-file=config/staging.json

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'

      - name: Browser proof
        run: |
          npm install --no-save playwright-core@1.52.0
          mkdir -p qa-auth-fix-v2
          python3 -m http.server 8092 --directory build/web > qa-auth-fix-v2/server.log 2>&1 &
          echo $! > qa-auth-fix-v2/server.pid
          trap 'kill $(cat qa-auth-fix-v2/server.pid) 2>/dev/null || true' EXIT
          for attempt in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8092/ >/dev/null; then break; fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:8092/ >/dev/null

          node <<'NODE'
          const fs = require('fs');
          const { chromium } = require('playwright-core');
          const root = 'http://127.0.0.1:8092';
          const authToken = /\/auth\/v1\/token/;
          const credentialMessage = 'Connexion impossible. Vérifie ton identifiant et ton mot de passe.';
          const networkMessage = 'Connexion temporairement indisponible. Vérifie ta connexion et réessaie.';

          async function activate(page) {
            await page.locator('flutter-view, flt-glass-pane, canvas').first()
              .waitFor({ state: 'attached', timeout: 45000 });
            await page.waitForTimeout(1500);
            await page.evaluate(() => {
              const placeholder = document.querySelector('flt-semantics-placeholder');
              if (placeholder instanceof HTMLElement) placeholder.click();
            }).catch(() => {});
            await page.waitForTimeout(400);
          }

          async function names(page) {
            const cdp = await page.context().newCDPSession(page);
            await cdp.send('Accessibility.enable');
            const tree = await cdp.send('Accessibility.getFullAXTree');
            return tree.nodes.map(n => String(n.name?.value ?? '').trim()).filter(Boolean);
          }

          async function waitFor(page, expected, timeout) {
            const deadline = Date.now() + timeout;
            while (Date.now() < deadline) {
              const current = await names(page);
              if (current.some(name => name.includes(expected))) return;
              await page.waitForTimeout(200);
            }
            throw new Error(`Message absent: ${expected}\n${(await names(page)).join('\n')}`);
          }

          async function open(browser) {
            const context = await browser.newContext({
              viewport: { width: 390, height: 844 },
              serviceWorkers: 'block',
            });
            const page = await context.newPage();
            const requests = [];
            page.on('request', req => {
              if (req.url().includes('/auth/v1/')) requests.push(`${req.method()} ${req.url()}`);
            });
            await page.goto(`${root}/#/auth/sign-in`, { waitUntil: 'networkidle', timeout: 90000 });
            await activate(page);
            return { context, page, requests };
          }

          async function save(state, stem, extra = '') {
            await state.page.screenshot({ path: `qa-auth-fix-v2/${stem}.png`, fullPage: true });
            fs.writeFileSync(
              `qa-auth-fix-v2/${stem}.txt`,
              `requests=${state.requests.join('\n')}\n\nax=${(await names(state.page)).join('\n')}\n\n${extra}`,
            );
          }

          (async () => {
            const browser = await chromium.launch({
              headless: true,
              executablePath: '/usr/bin/google-chrome',
              args: ['--no-sandbox', '--disable-dev-shm-usage'],
            });

            // 1. Réponse d'identifiants invalides : immédiate et spécifique.
            {
              const state = await open(browser);
              await state.page.route(authToken, route => route.fulfill({
                status: 400,
                contentType: 'application/json',
                body: JSON.stringify({
                  code: 'invalid_credentials',
                  message: 'Invalid login credentials',
                }),
              }));
              await state.page.getByRole('textbox', { name: 'Identifiant', exact: true }).fill('qa-invalid');
              await state.page.getByRole('textbox', { name: 'Mot de passe', exact: true }).fill('MauvaisMotDePasse123');
              await state.page.getByRole('button', { name: 'Se connecter', exact: true }).click();
              await waitFor(state.page, credentialMessage, 10000);
              await save(state, 'bad-credentials-ok');
              if (!state.requests.some(url => url.includes('/auth/v1/token'))) {
                throw new Error(`Requête auth non observée: ${state.requests.join(' | ')}`);
              }
              await state.context.close();
            }

            // 2. Requête suspendue : retour autour de 12 s avec message réseau.
            {
              const state = await open(browser);
              await state.page.route(authToken, async route => {
                await new Promise(resolve => setTimeout(resolve, 30000));
                await route.abort('timedout').catch(() => {});
              });
              await state.page.getByRole('textbox', { name: 'Identifiant', exact: true }).fill('qa-stalled');
              await state.page.getByRole('textbox', { name: 'Mot de passe', exact: true }).fill('MotDePasseReseau123');
              const started = Date.now();
              await state.page.getByRole('button', { name: 'Se connecter', exact: true }).click();
              await waitFor(state.page, networkMessage, 18000);
              const elapsed = Date.now() - started;
              await save(state, 'stalled-network-ok', `elapsedMs=${elapsed}\n`);
              if (elapsed < 10000 || elapsed > 16000) {
                throw new Error(`Timeout hors plage: ${elapsed}ms`);
              }
              await state.context.close();
            }

            await browser.close();
          })().catch(error => {
            fs.writeFileSync('qa-auth-fix-v2/failure.txt', String(error.stack || error));
            console.error(error);
            process.exit(1);
          });
          NODE

      - name: Upload proof
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: qa-auth-signin-fix-v2
          path: qa-auth-fix-v2/
          if-no-files-found: error
