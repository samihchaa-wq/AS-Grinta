name: Temporary format tap-position branch

on:
  push:
    branches:
      - feat/tap-position-lineup-placement

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: feat/tap-position-lineup-placement

      - name: Setup Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
        with:
          channel: stable
          cache: true

      - name: Install locked dependencies
        run: flutter pub get --enforce-lockfile

      - name: Format tap-position files
        run: |
          dart format \
            lib/features/sports_management/presentation/widgets/formation_pitch_editor.dart \
            test/features/sports_management/presentation/formation_pitch_tap_selection_test.dart

      - name: Commit formatting if needed
        run: |
          if git diff --quiet; then
            echo "Nothing to format."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            lib/features/sports_management/presentation/widgets/formation_pitch_editor.dart \
            test/features/sports_management/presentation/formation_pitch_tap_selection_test.dart
          git commit -m "Format tap-to-place lineup changes"
          git push origin HEAD:feat/tap-position-lineup-placement
