name: Apply Live score controls

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  patch-live:
    if: github.head_ref == 'live-score-controls-compact'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout PR head
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get --enforce-lockfile

      - name: Apply Live UI adjustments
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('lib/features/match_live/presentation/match_live_running_page.dart')
          source = path.read_text()

          source = source.replace(
              '        _ScoreCard(bundle: bundle),',
              '        _ScoreCard(bundle: bundle, canEdit: canEdit),',
              1,
          )

          action_start = source.find(
              '        if (canEdit) ...[\n'
              '          const SizedBox(height: 12),\n'
              '          _LiveActionBar('
          )
          action_end = source.find(
              '        const SizedBox(height: 12),\n'
              '        _LiveJournal(',
              action_start,
          )
          if action_start == -1 or action_end == -1:
              raise SystemExit('Live action bar usage not found')
          source = source[:action_start] + source[action_end:]

          picker_start = source.find('  Future<void> _openReplacementPicker({')
          validate_start = source.find('  Future<void> _validatePending(', picker_start)
          if picker_start == -1 or validate_start == -1:
              raise SystemExit('Obsolete quick-action methods not found')
          source = source[:picker_start] + source[validate_start:]

          top_start = source.index('class _LiveTopBar extends StatelessWidget {')
          top_end = source.index('class _LiveMatchControls extends StatelessWidget {', top_start)
          top = source[top_start:top_end]
          top = top.replace(
              'padding: const EdgeInsets.all(12),',
              'padding: const EdgeInsets.symmetric(horizontal: 10, vertical: 12),',
              1,
          )
          top = top.replace('              width: 104,', '              width: 90,', 1)
          top = top.replace('            const SizedBox(width: 10),', '            const SizedBox(width: 6),', 1)
          source = source[:top_start] + top + source[top_end:]

          controls_start = source.index('class _LiveMatchControls extends StatelessWidget {')
          controls_end = source.index('class _ScoreCard extends ConsumerWidget {', controls_start)
          controls = source[controls_start:controls_end]
          controls = controls.replace(
              '        final width = (constraints.maxWidth - 8) / 2;',
              '        final width = (constraints.maxWidth - 6) / 2;',
              1,
          )
          controls = controls.replace('horizontal: 8,\n                    vertical: 10,', 'horizontal: 5,\n                    vertical: 9,')
          controls = controls.replace('horizontal: 8,\n                        vertical: 10,', 'horizontal: 5,\n                        vertical: 9,')
          controls = controls.replace('              Icon(icon, size: 17),', '              Icon(icon, size: 16),', 1)
          controls = controls.replace('              const SizedBox(width: 5),', '              const SizedBox(width: 4),', 1)
          controls = controls.replace('                  style: const TextStyle(fontSize: 12),', '                  style: const TextStyle(fontSize: 11.5),', 1)
          controls = controls.replace('          spacing: 8,\n          runSpacing: 8,', '          spacing: 6,\n          runSpacing: 6,', 1)
          source = source[:controls_start] + controls + source[controls_end:]

          score_start = source.index('class _ScoreCard extends ConsumerWidget {')
          score_end = source.index('const double _benchGap = 10;', score_start)
          new_score = '''class _ScoreCard extends ConsumerWidget {
            const _ScoreCard({required this.bundle, required this.canEdit});

            final MatchLiveStateBundle bundle;
            final bool canEdit;

            @override
            Widget build(BuildContext context, WidgetRef ref) {
              final matchId = bundle.session.matchId;
              final controller = ref.read(matchLiveStateProvider(matchId).notifier);
              final fixture = ref
                  .watch(upcomingMatchFixtureProvider(matchId))
                  .valueOrNull;
              final opponentName = fixture?.opponentName ?? 'Adversaire';
              final grintaIsHome = fixture?.grintaIsHome ?? true;

              final home = _ScoreTeamControl(
                label: grintaIsHome ? 'AS Grinta' : opponentName,
                score: grintaIsHome
                    ? bundle.session.scoreAsGrinta
                    : bundle.session.scoreAdverse,
                canEdit: canEdit,
                onIncrement: () => controller.adjustScore(
                  team: grintaIsHome ? 'us' : 'them',
                  delta: 1,
                ),
                onDecrement: () => controller.adjustScore(
                  team: grintaIsHome ? 'us' : 'them',
                  delta: -1,
                ),
              );
              final away = _ScoreTeamControl(
                label: grintaIsHome ? opponentName : 'AS Grinta',
                score: grintaIsHome
                    ? bundle.session.scoreAdverse
                    : bundle.session.scoreAsGrinta,
                canEdit: canEdit,
                onIncrement: () => controller.adjustScore(
                  team: grintaIsHome ? 'them' : 'us',
                  delta: 1,
                ),
                onDecrement: () => controller.adjustScore(
                  team: grintaIsHome ? 'them' : 'us',
                  delta: -1,
                ),
              );

              return Card(
                margin: EdgeInsets.zero,
                child: Padding(
                  padding: const EdgeInsets.symmetric(horizontal: 10, vertical: 9),
                  child: Row(
                    children: [
                      Expanded(child: home),
                      Padding(
                        padding: const EdgeInsets.symmetric(horizontal: 4),
                        child: Text(
                          '–',
                          style: Theme.of(context).textTheme.headlineSmall?.copyWith(
                            fontWeight: FontWeight.w700,
                          ),
                        ),
                      ),
                      Expanded(child: away),
                    ],
                  ),
                ),
              );
            }
          }

          class _ScoreTeamControl extends StatelessWidget {
            const _ScoreTeamControl({
              required this.label,
              required this.score,
              required this.canEdit,
              required this.onIncrement,
              required this.onDecrement,
            });

            final String label;
            final int score;
            final bool canEdit;
            final VoidCallback onIncrement;
            final VoidCallback onDecrement;

            @override
            Widget build(BuildContext context) {
              final theme = Theme.of(context);
              return Column(
                mainAxisSize: MainAxisSize.min,
                children: [
                  Text(
                    label,
                    maxLines: 2,
                    overflow: TextOverflow.ellipsis,
                    textAlign: TextAlign.center,
                    style: theme.textTheme.titleSmall?.copyWith(
                      fontWeight: FontWeight.w800,
                    ),
                  ),
                  const SizedBox(height: 3),
                  Row(
                    mainAxisAlignment: MainAxisAlignment.center,
                    children: [
                      if (canEdit)
                        IconButton(
                          tooltip: 'Retirer un but',
                          onPressed: score > 0 ? onDecrement : null,
                          padding: EdgeInsets.zero,
                          visualDensity: VisualDensity.compact,
                          constraints: const BoxConstraints(
                            minWidth: 34,
                            minHeight: 34,
                          ),
                          icon: const Icon(Icons.remove_circle_outline_rounded),
                        ),
                      ConstrainedBox(
                        constraints: const BoxConstraints(minWidth: 34),
                        child: Text(
                          '$score',
                          textAlign: TextAlign.center,
                          style: theme.textTheme.headlineMedium?.copyWith(
                            fontWeight: FontWeight.w900,
                            fontFeatures: const [FontFeature.tabularFigures()],
                          ),
                        ),
                      ),
                      if (canEdit)
                        IconButton(
                          tooltip: 'Ajouter un but',
                          onPressed: onIncrement,
                          padding: EdgeInsets.zero,
                          visualDensity: VisualDensity.compact,
                          constraints: const BoxConstraints(
                            minWidth: 34,
                            minHeight: 34,
                          ),
                          icon: const Icon(Icons.add_circle_outline_rounded),
                        ),
                    ],
                  ),
                ],
              );
            }
          }

          '''
          source = source[:score_start] + new_score + source[score_end:]

          bar_start = source.find('class _LiveActionBar extends StatelessWidget {')
          bar_end = source.find('enum _JournalAction { scorer, delete }', bar_start)
          if bar_start == -1 or bar_end == -1:
              raise SystemExit('LiveActionBar class not found')
          source = source[:bar_start] + source[bar_end:]

          path.write_text(source)
          PY

          dart format lib/features/match_live/presentation/match_live_running_page.dart

      - name: Commit Live UI adjustments
        shell: bash
        env:
          HEAD_BRANCH: ${{ github.head_ref }}
        run: |
          set -euo pipefail
          git add lib/features/match_live/presentation/match_live_running_page.dart
          if git diff --cached --quiet; then
            echo 'Aucun changement à enregistrer.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Ajuste les commandes et le score du Live'
          git push origin "HEAD:${HEAD_BRANCH}"
