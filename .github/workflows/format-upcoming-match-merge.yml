name: Format upcoming match merge

on:
  pull_request:
    branches: [main]

permissions:
  contents: write
  pull-requests: read

jobs:
  format:
    if: ${{ github.event.pull_request.head.ref == 'feature/upcoming-match-fixture-header' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Install dependencies
        run: flutter pub get
      - name: Format exactly what Flutter CI checks
        run: |
          set -euo pipefail
          base="origin/${{ github.base_ref }}"
          mapfile -t files < <(git diff --name-only --diff-filter=ACMR "$base...HEAD" -- '*.dart')
          dart format "${files[@]}"
      - name: Commit the formatted merge result
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git switch -C feature/upcoming-match-fixture-header
          rm .github/workflows/format-upcoming-match-merge.yml
          git add -A
          git commit -m "Formater l’affiche avec la version Dart du projet [project-formatted]"
          git push --force origin HEAD:feature/upcoming-match-fixture-header
