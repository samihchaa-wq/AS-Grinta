name: Temporary calendar diff repair

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/tmp_repair_calendar_diff.yml'

permissions:
  contents: write

jobs:
  repair:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
        with:
          channel: stable
          cache: true
      - name: Restore main and apply minimal availability change
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git show origin/main:lib/features/predictions/presentation/merged_matches_view.dart > lib/features/predictions/presentation/merged_matches_view.dart
          python3 - <<'PY'
          from pathlib import Path
          path = Path('lib/features/predictions/presentation/merged_matches_view.dart')
          text = path.read_text()
          old_import = "import 'package:as_grinta/features/predictions/presentation/widgets/match_history_card.dart';\nimport 'package:as_grinta/features/sports_management/presentation/widgets/match_availability_selector.dart';"
          new_import = "import 'package:as_grinta/features/predictions/presentation/widgets/match_history_card.dart';\nimport 'package:as_grinta/features/sports_management/presentation/match_availability_provider.dart';\nimport 'package:as_grinta/features/sports_management/presentation/widgets/match_availability_selector.dart';"
          if old_import not in text:
              raise SystemExit('availability import anchor missing')
          text = text.replace(old_import, new_import, 1)
          text = text.replace('class _UpcomingMatchCard extends StatelessWidget {', 'class _UpcomingMatchCard extends ConsumerWidget {', 1)
          text = text.replace('  Widget build(BuildContext context) {\n    final opponent = match.opponentName', '  Widget build(BuildContext context, WidgetRef ref) {\n    final opponent = match.opponentName', 1)
          old = """    final availabilityOpensAt = matchFeaturesOpenAt(match.kickoffAt);
    final availabilityIsOpen = !match.isCancelled &&
        !now.isBefore(availabilityOpensAt) &&
        now.isBefore(match.kickoffAt);"""
          new = """    final availability = ref.watch(myMatchAvailabilityProvider(match.id));
    final availabilityIsOpen = !match.isCancelled &&
        now.isBefore(match.kickoffAt) &&
        availability.valueOrNull?.canRespond == true;"""
          if old not in text:
              raise SystemExit('availability window anchor missing')
          text = text.replace(old, new, 1)
          path.write_text(text)
          PY
          dart format lib/features/predictions/presentation/merged_matches_view.dart
      - name: Commit minimal repair
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/features/predictions/presentation/merged_matches_view.dart
          git commit -m "Keep calendar availability diff minimal"
          git push origin HEAD:${{ github.head_ref }}
