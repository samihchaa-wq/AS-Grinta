name: Temporary Dart format diff

on:
  pull_request:
    branches: [main]
    paths:
      - 'lib/core/sync/shared_data_sync.dart'
      - '.github/workflows/format_preview.yml'

permissions:
  contents: read

jobs:
  format-diff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Print formatter diff
        shell: bash
        run: |
          set -euo pipefail
          dart format lib/core/sync/shared_data_sync.dart
          git diff -- lib/core/sync/shared_data_sync.dart
