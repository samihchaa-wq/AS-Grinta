name: Temporary fix tap-position interaction

on:
  push:
    branches:
      - feat/tap-position-lineup-placement
    paths:
      - .github/workflows/temp_fix_tap_position.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: feat/tap-position-lineup-placement

      - name: Remove delayed double-tap handler
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('lib/features/sports_management/presentation/widgets/formation_pitch_editor.dart')
          text = path.read_text()
          old = """              onDoubleTap: widget.editable
                  ? () {
                      _clearSelection();
                      widget.onRemoveFromField(entry);
                    }
                  : null,
"""
          if old not in text:
              raise SystemExit('Expected onDoubleTap block not found')
          path.write_text(text.replace(old, '', 1))
          PY

      - name: Commit interaction fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/features/sports_management/presentation/widgets/formation_pitch_editor.dart
          git commit -m "Make occupied position taps immediate"
          git push origin HEAD:feat/tap-position-lineup-placement
