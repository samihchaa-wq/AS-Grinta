name: Temporary format availability resilience

on:
  push:
    branches:
      - audit/546-availability-network-resilience

permissions:
  contents: write

jobs:
  format:
    if: github.event.head_commit.message != 'style: format availability resilience'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: audit/546-availability-network-resilience

      - name: Setup Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
        with:
          channel: stable
          cache: true

      - name: Format targeted files
        run: |
          dart format \
            lib/features/sports_management/data/match_availability_repository.dart \
            lib/features/sports_management/presentation/widgets/match_availability_selector.dart \
            test/features/sports_management/data/match_availability_network_resilience_test.dart

      - name: Commit formatter output
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            lib/features/sports_management/data/match_availability_repository.dart \
            lib/features/sports_management/presentation/widgets/match_availability_selector.dart \
            test/features/sports_management/data/match_availability_network_resilience_test.dart
          git commit -m "style: format availability resilience"
          git push origin HEAD:audit/546-availability-network-resilience
