name: Temporary remove completed effectif

on:
  push:
    branches: [cleanup-no-effectif-temp]
    paths:
      - '.github/workflows/temporary_remove_completed_effectif.yml'

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: cleanup-no-effectif-temp
          fetch-depth: 0
      - name: Remove finished-match Effectif module and unrelated changes
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git checkout origin/main -- analysis_options.yaml lib/features/matches/data/historical_match_detail_repository.dart
          git rm -f \
            lib/features/matches/data/completed_match_effectif_repository.dart \
            lib/features/matches/presentation/widgets/completed_match_effectif_card.dart \
            supabase/migrations/20260826007000_finished_match_modules.sql \
            test/features/matches/data/completed_match_effectif_test.dart \
            test/features/matches/data/historical_absent_names_test.dart
          python3 - <<'PY'
          from pathlib import Path
          import re

          p = Path('lib/features/matches/presentation/match_details_page.dart')
          s = p.read_text()
          s = s.replace("import 'package:as_grinta/features/matches/data/completed_match_effectif_repository.dart';\n", '')
          s = s.replace("import 'package:as_grinta/features/matches/presentation/widgets/completed_match_effectif_card.dart';\n", '')
          s = s.replace("            ..invalidate(completedMatchEffectifProvider(matchId))\n", '')
          s = re.sub(
              r"\n\s*_CompletedEffectifSection\(\n\s*matchId: matchId,\n\s*sportsEnabled: sportsEnabled,\n\s*\),",
              '',
              s,
              count=1,
          )
          s, n = re.subn(
              r"\nclass _CompletedEffectifSection extends ConsumerWidget \{.*?\n\}\n\n(?=class _CompletedFactsSection)",
              '\n',
              s,
              count=1,
              flags=re.S,
          )
          assert n == 1, 'completed Effectif section not found exactly once'
          p.write_text(s)

          p = Path('lib/features/matches/presentation/historical_match_detail_page.dart')
          s = p.read_text()
          s = s.replace("import 'package:as_grinta/features/matches/data/completed_match_effectif_repository.dart';\n", '')
          s = s.replace("import 'package:as_grinta/features/matches/presentation/widgets/completed_match_effectif_card.dart';\n", '')
          old = """    final absentNames = detail.absentNames;\n    final effectif = absentNames == null\n        ? null\n        : CompletedMatchEffectif.fromNames(\n            presentNames: detail.presentNames,\n            absentNames: absentNames,\n          );\n    final showEffectif = effectif != null && !effectif.isEmpty;\n    final showComposition = detail.hasComposition;\n    if (!showEffectif && !showComposition) return const SizedBox.shrink();\n\n    final composition =\n        showComposition ? _compositionFromHistorical(matchId, detail) : null;\n"""
          new = """    final showComposition = detail.hasComposition;\n    if (!showComposition) return const SizedBox.shrink();\n\n    final composition = _compositionFromHistorical(matchId, detail);\n"""
          assert old in s, 'historical Effectif setup block not found'
          s = s.replace(old, new, 1)
          old_children = """        if (showEffectif) ...[\n          const SizedBox(height: 16),\n          CompletedMatchEffectifCard(effectif: effectif!),\n        ],\n        if (composition != null) ...[\n"""
          new_children = """        if (composition != null) ...[\n"""
          assert old_children in s, 'historical Effectif UI block not found'
          s = s.replace(old_children, new_children, 1)
          p.write_text(s)
          PY
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: stable
          cache: true
      - name: Format only feature files in project environment
        shell: bash
        run: |
          set -euo pipefail
          flutter pub get --enforce-lockfile
          dart format \
            lib/core/widgets/match_detail_header_card.dart \
            lib/features/matches/presentation/match_details_page.dart \
            lib/features/matches/presentation/historical_match_detail_page.dart
          git diff --check
      - name: Commit cleanup and remove temporary workflow
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/temporary_remove_completed_effectif.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Remove Effectif from completed match details"
          git push origin HEAD:cleanup-no-effectif-temp
