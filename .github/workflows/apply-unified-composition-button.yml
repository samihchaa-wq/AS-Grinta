name: Apply unified composition publish button

on:
  push:
    branches:
      - feature/unified-composition-publish-button
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  apply-change:
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref || github.ref_name }}

      - name: Merge the draft and publication buttons
        shell: python
        run: |
          from pathlib import Path

          path = Path("lib/features/sports_management/presentation/admin_squad_plan_page.dart")
          text = path.read_text(encoding="utf-8")

          old = """        const SizedBox(height: 16),
                  FilledButton.tonalIcon(
                    onPressed:
                        _busy || _locked ? null : () => _saveComposition(publish: false),
                    icon: const Icon(Icons.save_outlined),
                    label: Text(
                      _compositionDirty
                          ? 'Enregistrer le brouillon'
                          : 'Brouillon enregistré',
                    ),
                  ),
                  const SizedBox(height: 10),
                  FilledButton.icon(
                    onPressed:
                        _busy || _locked ? null : () => _saveComposition(publish: true),
                    icon: const Icon(Icons.campaign_outlined),
                    label: Text(
                      composition.isPublished ? 'Republier' : 'Publier la composition',
                    ),
                  ),
"""

          new = """        const SizedBox(height: 16),
                  FilledButton.icon(
                    onPressed:
                        _busy || _locked ? null : () => _saveComposition(publish: true),
                    icon: const Icon(Icons.campaign_outlined),
                    label: Text(
                      composition.isPublished ? 'Mettre à jour' : 'Publier',
                    ),
                  ),
"""

          occurrences = text.count(old)
          if occurrences != 1:
              raise SystemExit(
                  f"Expected exactly one button block, found {occurrences}."
              )

          path.write_text(text.replace(old, new), encoding="utf-8")

      - name: Commit the application change
        run: |
          rm .github/workflows/apply-unified-composition-button.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/features/sports_management/presentation/admin_squad_plan_page.dart .github/workflows/apply-unified-composition-button.yml
          git commit -m "Unify composition publication button"
          git push origin HEAD:${{ github.event.pull_request.head.ref || github.ref_name }}
