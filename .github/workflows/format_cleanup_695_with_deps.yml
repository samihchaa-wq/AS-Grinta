name: Format cleanup 695 with dependencies

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/format_cleanup_695_with_deps.yml'

permissions:
  contents: write

concurrency:
  group: format-cleanup-695-with-deps
  cancel-in-progress: true

jobs:
  format:
    if: github.head_ref == 'cleanup/remove-home-dashboard-compat'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: cleanup/remove-home-dashboard-compat
          fetch-depth: 0
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get --enforce-lockfile
      - name: Format exactly as Flutter CI
        run: |
          dart format \
            lib/features/match_live/presentation/match_live_recap_page.dart \
            lib/features/matches/presentation/widgets/admin_match_options_button.dart
      - name: Remove temporary formatter
        run: rm .github/workflows/format_cleanup_695_with_deps.yml
      - name: Commit formatting
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git diff --cached --check
          git commit -m "Format cleanup with resolved dependencies"
          git push origin HEAD:cleanup/remove-home-dashboard-compat
