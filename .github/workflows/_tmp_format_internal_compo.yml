name: Temporary internal composition formatter

on:
  push:
    branches:
      - codex/internal-match-compo-ux

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: codex/internal-match-compo-ux
          fetch-depth: 0

      - name: Setup Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
        with:
          channel: stable
          cache: true

      - name: Format changed Dart files
        shell: bash
        run: |
          set -euo pipefail
          dart format \
            lib/features/sports_management/data/internal_match_composition_repository.dart \
            lib/features/sports_management/domain/internal_match_composition.dart \
            lib/features/sports_management/presentation/widgets/internal_team_composition_view.dart

      - name: Commit formatting
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet; then
            echo "Already formatted."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            lib/features/sports_management/data/internal_match_composition_repository.dart \
            lib/features/sports_management/domain/internal_match_composition.dart \
            lib/features/sports_management/presentation/widgets/internal_team_composition_view.dart
          git commit -m "style: format internal composition changes"
          git push origin HEAD:codex/internal-match-compo-ux
