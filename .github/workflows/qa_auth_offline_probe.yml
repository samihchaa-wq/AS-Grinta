name: QA auth offline probe

on:
  push:
    branches: [qa/auth-prelogin-audit]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'

      - name: Install Playwright Core
        run: npm install --no-save playwright-core@1.52.0

      - name: Capture final offline sign-in state
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('fs');
          const { chromium } = require('playwright-core');
          (async () => {
            const browser = await chromium.launch({
              headless: true,
              executablePath: '/usr/bin/google-chrome',
              args: ['--no-sandbox', '--disable-dev-shm-usage'],
            });
            const context = await browser.newContext({
              viewport: { width: 390, height: 844 },
              serviceWorkers: 'block',
            });
            const page = await context.newPage();
            const consoleErrors = [];
            page.on('console', msg => {
              if (msg.type() === 'error') consoleErrors.push(msg.text());
            });
            await page.goto(`https://samihchaa-wq.github.io/AS-Grinta/staging/#/auth/sign-in?offlineprobe=${Date.now()}`, {
              waitUntil: 'domcontentloaded',
              timeout: 45000,
            });
            await page.locator('flutter-view, flt-glass-pane, canvas').first()
              .waitFor({ state: 'attached', timeout: 45000 });
            await page.waitForTimeout(1800);
            await page.evaluate(() => {
              const p = document.querySelector('flt-semantics-placeholder');
              if (p instanceof HTMLElement) p.click();
            }).catch(() => {});
            await page.waitForTimeout(800);

            await context.setOffline(true);
            await page.getByRole('textbox', { name: 'Identifiant', exact: true }).fill(`qa-offline-${Date.now()}`);
            await page.getByRole('textbox', { name: 'Mot de passe', exact: true }).fill('MotDePasseOffline123');
            await page.getByRole('button', { name: 'Se connecter', exact: true }).click();
            await page.waitForTimeout(15000);

            const cdp = await context.newCDPSession(page);
            await cdp.send('Accessibility.enable');
            const ax = await cdp.send('Accessibility.getFullAXTree');
            const names = ax.nodes
              .map(node => String(node.name?.value ?? ''))
              .filter(Boolean);
            const expected = 'Connexion temporairement indisponible. Vérifie ta connexion et réessaie.';
            const snapshot = {
              url: page.url(),
              expectedVisibleInAccessibility: names.some(name => name.includes(expected)),
              accessibilityNames: names,
              consoleErrors,
            };
            fs.writeFileSync('offline-probe.json', JSON.stringify(snapshot, null, 2));
            await page.screenshot({ path: 'offline-probe.png' });
            console.log(JSON.stringify(snapshot, null, 2));
            await browser.close();
          })().catch(error => {
            console.error(error);
            process.exit(1);
          });
          NODE

      - name: Upload offline evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: qa-auth-offline-probe
          path: |
            offline-probe.json
            offline-probe.png
          if-no-files-found: warn
