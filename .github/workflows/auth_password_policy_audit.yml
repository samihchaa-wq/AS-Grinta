name: Auth password policy audit

on:
  push:
    branches: [audit/auth-password-policy]
    paths:
      - '.github/workflows/auth_password_policy_audit.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_REF: ovzijmqrnsgcmryinkfa
    steps:
      - name: Read sanitized Auth password policy
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${SUPABASE_ACCESS_TOKEN:-}" ]; then
            echo "::error::SUPABASE_ACCESS_TOKEN is missing."
            exit 1
          fi

          curl -LfsS \
            "https://api.supabase.com/v1/projects/${SUPABASE_PROJECT_REF}/config/auth" \
            -H "Authorization: Bearer ${SUPABASE_ACCESS_TOKEN}" \
            -H "Accept: application/json" \
            -o /tmp/auth-config.json

          jq '{
            password_hibp_enabled,
            password_min_length,
            password_required_characters,
            security_update_password_require_reauthentication
          }' /tmp/auth-config.json > /tmp/auth-password-policy.json

          cat /tmp/auth-password-policy.json
          {
            echo '## Supabase Auth password policy'
            echo
            echo '```json'
            cat /tmp/auth-password-policy.json
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
