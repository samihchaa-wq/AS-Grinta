name: Realtime Network Audit

on:
  push:
    branches: [audit/authenticated-admin-e2e]
    paths:
      - '.github/workflows/realtime_network_audit.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  observe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      APP_URL: https://samihchaa-wq.github.io/AS-Grinta/
      TEST_USERNAME: Testt
      TEST_PASSWORD: ${{ secrets.E2E_TESTT_PASSWORD }}
      MATCH_ID: b246374b-1913-4338-903a-d49498cc0b60
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm install --no-save playwright-core@1.52.0
      - name: Observe match REST refreshes without reload
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p rt-network
          node <<'NODE'
          const fs=require('fs');const{chromium}=require('playwright-core');
          (async()=>{const b=await chromium.launch({headless:true,executablePath:'/usr/bin/google-chrome',args:['--no-sandbox','--disable-dev-shm-usage']});const c=await b.newContext({viewport:{width:390,height:844},serviceWorkers:'block'});const p=await c.newPage();const responses=[];const errors=[];let initial=false,updated=false,deleted=false;
          p.on('pageerror',e=>errors.push(`pageerror ${e.message}`));
          p.on('response',async r=>{try{const u=r.url();if(!u.includes('/rest/v1/matches?')||r.status()!==200)return;const txt=await r.text();let rows;try{rows=JSON.parse(txt)}catch{return}if(!Array.isArray(rows))return;const row=rows.find(x=>x.id===process.env.MATCH_ID);const at=new Date().toISOString();responses.push({at,url:u,row:row?{id:row.id,match_date:row.match_date,match_time:row.match_time,kickoff_at:row.kickoff_at,status:row.status}:null,count:rows.length});if(row){initial=true;if(String(row.match_time||'').startsWith('23:49')||String(row.kickoff_at||'').includes('21:49'))updated=true}else if(initial){deleted=true}}catch(e){errors.push(`response-listener ${e.message}`)}});
          const wait=ms=>p.waitForTimeout(ms);async function sem(){try{await p.evaluate(()=>document.querySelector('flt-semantics-placeholder')?.click());await wait(150)}catch(_){}}async function focus(l){const a=p.locator(`[aria-label="${l}"]`).first();if(await a.count())return a.click({force:true});const t=p.getByText(l,{exact:true}).first();if(await t.count())return t.click({force:true});throw new Error(`missing ${l}`)}
          await p.goto(`${process.env.APP_URL}?rt-net-login=${Date.now()}#/auth/sign-in`,{waitUntil:'networkidle',timeout:90000});await wait(1200);await sem();await focus('Identifiant');await p.keyboard.type(process.env.TEST_USERNAME);await focus('Mot de passe');await p.keyboard.type(process.env.TEST_PASSWORD);await focus('Se connecter');await p.waitForFunction(()=>!location.hash.includes('/auth/'),null,{timeout:45000});await wait(1200);await p.goto(`${process.env.APP_URL}?rt-net=${Date.now()}#/matches`,{waitUntil:'networkidle',timeout:60000});await wait(1500);await sem();
          for(let i=0;i<100;i++){await wait(1000)}
          const summary={initialResponseContainedMatch:initial,updatedResponseSeenWithoutReload:updated,deletedResponseSeenWithoutReload:deleted,matchResponses:responses.length,responses,errors};fs.writeFileSync('rt-network/result.json',JSON.stringify(summary,null,2));fs.writeFileSync('rt-network/result.txt',JSON.stringify(summary,null,2));await b.close()})().catch(e=>{console.error(e);process.exit(1)});
          NODE
      - if: always()
        run: cat rt-network/result.txt || true
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: realtime-network-audit
          path: rt-network/
          retention-days: 7
