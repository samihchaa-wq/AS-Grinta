name: Diagnose Dart format

on:
  pull_request:
    branches: [main]

permissions:
  contents: read
  pull-requests: write

jobs:
  diagnose:
    if: github.head_ref == 'agent/sticky-match-section-headers-final'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout merge commit
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Diagnose formatter
        id: diagnose
        shell: bash
        run: |
          set -u
          base="origin/${{ github.base_ref }}"
          range="$base...HEAD"
          mapfile -t files < <(git diff --name-only --diff-filter=ACMR "$range" -- '*.dart')
          printf '%s\n' "${files[@]}" > /tmp/files.txt
          set +e
          dart format --output=none --set-exit-if-changed "${files[@]}" > /tmp/check.txt 2>&1
          status=$?
          set -e
          dart format "${files[@]}" > /tmp/write.txt 2>&1
          git diff -- "${files[@]}" > /tmp/format.diff
          {
            echo '## Diagnostic du formatage Dart'
            echo
            echo "Statut de la commande CI : $status"
            echo
            echo 'Fichiers détectés :'
            echo '```'
            cat /tmp/files.txt
            echo '```'
            echo
            echo 'Sortie du contrôle :'
            echo '```'
            cat /tmp/check.txt
            echo '```'
            echo
            echo 'Sortie du formatage :'
            echo '```'
            cat /tmp/write.txt
            echo '```'
            echo
            echo 'Diff après formatage :'
            echo '```diff'
            cat /tmp/format.diff
            echo '```'
          } > /tmp/comment.md

      - name: Comment PR
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh pr comment "${{ github.event.pull_request.number }}" --body-file /tmp/comment.md
