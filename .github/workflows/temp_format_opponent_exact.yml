name: Temporary exact opponent formatter

on:
  push:
    branches:
      - feature/opponent-stadium-library
  workflow_dispatch:

permissions:
  contents: read

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: feature/opponent-stadium-library
          fetch-depth: 0

      - name: Setup Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
        with:
          channel: stable
          cache: true

      - name: Install locked dependencies
        run: flutter pub get --enforce-lockfile

      - name: Format target file
        run: dart format lib/features/admin/presentation/opponent_stadium_library_page.dart

      - name: Upload exact formatter output
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: exact-opponent-formatter-output
          path: lib/features/admin/presentation/opponent_stadium_library_page.dart
          if-no-files-found: error
