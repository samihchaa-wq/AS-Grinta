name: Temporary sync production migration 06000

on:
  push:
    branches:
      - release/sync-production-06000

permissions:
  contents: read

concurrency:
  group: supabase-production-deployment
  cancel-in-progress: false

env:
  SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
  SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
  SUPABASE_PROJECT_ID: ovzijmqrnsgcmryinkfa

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Guard exact release branch
        shell: bash
        run: |
          set -euo pipefail
          test "${GITHUB_REF_NAME}" = "release/sync-production-06000"
          test "${SUPABASE_PROJECT_ID}" = "ovzijmqrnsgcmryinkfa"

      - name: Checkout exact candidate
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false

      - name: Require deployment secrets
        shell: bash
        run: |
          set -euo pipefail
          test -n "${SUPABASE_ACCESS_TOKEN:-}"
          test -n "${SUPABASE_DB_PASSWORD:-}"

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@3c2f5e2ae34c34e428e8e206e2c4d21fa2d20fbf
        with:
          version: 2.111.0

      - name: Link production
        shell: bash
        run: |
          set -euo pipefail
          supabase link --project-ref "$SUPABASE_PROJECT_ID" --password "$SUPABASE_DB_PASSWORD"

      - name: Verify exact candidate migration
        shell: bash
        run: |
          set -euo pipefail
          test -f supabase/migrations/20260826005000_allow_explicit_duplicate_opponents.sql
          test -f supabase/migrations/20260826006000_calendar_history_metadata_and_rounds.sql
          test ! -f supabase/migrations/20260826003000_calendar_history_metadata_and_rounds.sql
          supabase migration list | tee migration-before.txt

      - name: Dry-run production migration
        shell: bash
        run: |
          set -euo pipefail
          supabase db push --password "$SUPABASE_DB_PASSWORD" --dry-run 2>&1 | tee dry-run.txt
          grep -Fq '20260826006000_calendar_history_metadata_and_rounds.sql' dry-run.txt

      - name: Apply production migration
        shell: bash
        run: |
          set -euo pipefail
          supabase db push --password "$SUPABASE_DB_PASSWORD" --yes
