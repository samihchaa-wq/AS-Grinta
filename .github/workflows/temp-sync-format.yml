name: Temporary sync and format

on:
  push:
    branches:
      - design/visual-system-polish

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: design/visual-system-polish
          fetch-depth: 0
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Sync main and format
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          git merge --no-edit origin/main
          dart format $(git ls-files '*.dart')
          git rm .github/workflows/temp-sync-format.yml
          git add -A
          git commit -m "Sync main and apply Dart formatting"
          git push origin HEAD:design/visual-system-polish
