name: Format match edit lock with CI dependencies

on:
  push:
    branches:
      - fix/match-edit-optimistic-lock

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: fix/match-edit-optimistic-lock
          fetch-depth: 0
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
        with:
          flutter-version: '3.47.0'
          channel: stable
      - run: flutter pub get
      - run: dart format lib/features/matches/data/matches_repository.dart lib/features/matches/presentation/matches_controller.dart lib/features/matches/presentation/match_form_page.dart test/match_edit_optimistic_lock_contract_test.dart
      - run: rm .github/workflows/format_match_edit_lock.yml
      - name: Commit formatter output
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "style: format match edit optimistic lock"
          git push origin HEAD:fix/match-edit-optimistic-lock
