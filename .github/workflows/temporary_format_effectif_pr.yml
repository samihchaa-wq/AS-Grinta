name: Temporary format effectif PR

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  format:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Format changed Dart files
        run: |
          dart format \
            lib/features/sports_management/presentation/admin_squad_plan_page_composition.dart \
            lib/features/sports_management/presentation/admin_squad_plan_page_effectif.dart \
            test/effectif_publication_contract_test.dart

      - name: Commit formatted files when needed
        shell: bash
        run: |
          set -euo pipefail
          files=(
            lib/features/sports_management/presentation/admin_squad_plan_page_composition.dart
            lib/features/sports_management/presentation/admin_squad_plan_page_effectif.dart
            test/effectif_publication_contract_test.dart
          )
          if git diff --quiet -- "${files[@]}"; then
            echo 'Les fichiers sont déjà formatés.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- "${files[@]}"
          git commit -m 'Formater le parcours effectif composition'
          git push origin "HEAD:${{ github.event.pull_request.head.ref }}"
