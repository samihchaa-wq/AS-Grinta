name: Temporary format effectif PR

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  format:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install locked dependencies
        run: flutter pub get --enforce-lockfile

      - name: Reproduce the global CI formatter command
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t files < <(git ls-files '*.dart')
          dart format "${files[@]}"
          dart format --output=none --set-exit-if-changed "${files[@]}"

      - name: Commit only expected formatted files
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t changed < <(git diff --name-only -- '*.dart')
          if [ "${#changed[@]}" -eq 0 ]; then
            echo 'Tous les fichiers sont déjà conformes à la commande globale.'
            exit 0
          fi
          allowed='^(lib/features/sports_management/presentation/admin_squad_plan_page_(composition|effectif)\.dart|test/effectif_publication_contract_test\.dart)$'
          for path in "${changed[@]}"; do
            if [[ ! "$path" =~ $allowed ]]; then
              echo "Fichier inattendu modifié par le formateur : $path" >&2
              exit 1
            fi
          done
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- "${changed[@]}"
          git commit -m 'Aligner le formatage sur la commande globale de la CI'
          git push origin "HEAD:${{ github.event.pull_request.head.ref }}"
