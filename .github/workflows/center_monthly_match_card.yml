name: Temporary center monthly match card

on:
  push:
    branches: [agent/center-monthly-match-card]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/center-monthly-match-card
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Center monthly card content
        shell: python
        run: |
          from pathlib import Path
          path = Path('lib/features/matches/presentation/calendar_matches_view.dart')
          text = path.read_text()
          class_pos = text.index('class _MonthlyMatchCard')
          start_marker = "            child: Column(\n              crossAxisAlignment: CrossAxisAlignment.stretch,\n              children: [\n                MatchFixture("
          end_marker = "                  ],\n                ),\n              ],\n            ),"
          start = text.index(start_marker, class_pos)
          end = text.index(end_marker, start) + len(end_marker)
          new = "\n".join([
              "            child: Row(",
              "              crossAxisAlignment: CrossAxisAlignment.center,",
              "              children: [",
              "                if (adminActions != null) const SizedBox(width: 42),",
              "                Expanded(",
              "                  child: Column(",
              "                    mainAxisSize: MainAxisSize.min,",
              "                    mainAxisAlignment: MainAxisAlignment.center,",
              "                    crossAxisAlignment: CrossAxisAlignment.stretch,",
              "                    children: [",
              "                      MatchFixture(",
              "                        homeName: homeName,",
              "                        awayName: awayName,",
              "                        grintaIsHome: match.isHome,",
              "                        finished: false,",
              "                        nameStyle: Theme.of(context)",
              "                            .textTheme",
              "                            .titleMedium",
              "                            ?.copyWith(fontSize: 17, height: 1.1),",
              "                        textAlign: TextAlign.center,",
              "                      ),",
              "                      const SizedBox(height: 8),",
              "                      Text(",
              "                        match.statusLabel,",
              "                        textAlign: TextAlign.center,",
              "                        style: Theme.of(context).textTheme.labelMedium?.copyWith(",
              "                              color: statusColor,",
              "                              fontWeight: FontWeight.w900,",
              "                            ),",
              "                      ),",
              "                    ],",
              "                  ),",
              "                ),",
              "                if (adminActions != null) ...[",
              "                  const SizedBox(width: 4),",
              "                  SizedBox(width: 38, child: adminActions),",
              "                ],",
              "              ],",
              "            ),",
          ])
          path.write_text(text[:start] + new + text[end:])
      - name: Format and commit
        shell: bash
        run: |
          set -euo pipefail
          flutter pub get --enforce-lockfile
          dart format lib/features/matches/presentation/calendar_matches_view.dart
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/features/matches/presentation/calendar_matches_view.dart
          if git diff --cached --quiet; then
            echo "No source change needed."
            exit 0
          fi
          git commit -m "Recentre les statuts du calendrier mensuel"
          git push origin HEAD:agent/center-monthly-match-card
