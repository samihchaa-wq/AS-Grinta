name: Temporary internal composition formatter

on:
  push:
    branches:
      - agent/internal-match-composition-ux
    paths:
      - .github/workflows/tmp_internal_composition_format.yml
      - lib/features/sports_management/data/internal_match_composition_repository.dart
      - lib/features/sports_management/domain/internal_match_composition.dart
      - lib/features/sports_management/domain/player_position_affinity.dart
      - lib/features/sports_management/presentation/widgets/internal_team_composition_view.dart

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: agent/internal-match-composition-ux
      - name: Setup Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
        with:
          channel: stable
          cache: true
      - name: Resolve dependencies
        run: flutter pub get
      - name: Format changed Dart files
        run: |
          dart format \
            lib/features/sports_management/data/internal_match_composition_repository.dart \
            lib/features/sports_management/domain/internal_match_composition.dart \
            lib/features/sports_management/domain/player_position_affinity.dart \
            lib/features/sports_management/presentation/widgets/internal_team_composition_view.dart
      - name: Commit formatting
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            lib/features/sports_management/data/internal_match_composition_repository.dart \
            lib/features/sports_management/domain/internal_match_composition.dart \
            lib/features/sports_management/domain/player_position_affinity.dart \
            lib/features/sports_management/presentation/widgets/internal_team_composition_view.dart
          git commit -m 'Format internal composition changes'
          git push origin HEAD:agent/internal-match-composition-ux
