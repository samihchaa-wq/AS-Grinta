name: Temporary business fixture date fix

on:
  push:
    branches:
      - agent/match-lifecycle-cleanup

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Use an isolated fixed past date in the lifecycle fixture
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('supabase/tests/database/business_rls.test.sql')
          text = path.read_text()
          old = """set match_date = ((now() - interval '2 hours') at time zone 'Europe/Paris')::date,
              match_time = ((now() - interval '2 hours') at time zone 'Europe/Paris')::time,
"""
          new = """set match_date = date '2000-01-02',
              match_time = time '20:00',
"""
          if old not in text:
              raise SystemExit('dynamic past-date fixture block not found')
          text = text.replace(old, new, 1)
          text = text.replace(
              '-- Make the fixture lifecycle-realistic: reschedule while the match is still\n-- editable, then finalize only after the planned duration + 15 minute buffer.',
              '-- Make the fixture lifecycle-realistic on an isolated fixed past date:\n-- reschedule while editable, then finalize after the planned end window.',
              1,
          )
          path.write_text(text)
          PY
      - name: Commit fixture correction
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add supabase/tests/database/business_rls.test.sql
          git commit -m "Avoid lifecycle fixture date collision"
          git push origin HEAD:agent/match-lifecycle-cleanup
