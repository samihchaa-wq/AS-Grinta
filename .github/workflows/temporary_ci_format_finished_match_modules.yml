name: Temporary CI-format finished match modules

on:
  push:
    branches: [finished-match-modules]
    paths:
      - '.github/workflows/temporary_ci_format_finished_match_modules.yml'

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: finished-match-modules
          fetch-depth: 0
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: stable
          cache: true
      - name: Install locked dependencies exactly like CI
        run: flutter pub get --enforce-lockfile
      - name: Format intended files with project language config
        run: dart format lib/core/widgets/match_detail_header_card.dart lib/features/matches/data/completed_match_effectif_repository.dart lib/features/matches/data/historical_match_detail_repository.dart lib/features/matches/presentation/historical_match_detail_page.dart lib/features/matches/presentation/match_details_page.dart lib/features/matches/presentation/widgets/completed_match_effectif_card.dart test/features/matches/data/completed_match_effectif_test.dart test/features/matches/data/historical_absent_names_test.dart
      - name: Remove temporary workflow and commit
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/temporary_ci_format_finished_match_modules.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          if git diff --cached --quiet; then
            echo "Nothing to format."
            exit 0
          fi
          git commit -m "Align finished match modules with CI formatter"
          git push origin HEAD:finished-match-modules
