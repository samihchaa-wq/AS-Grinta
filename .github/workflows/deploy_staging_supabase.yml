name: Deploy Supabase staging

on:
  push:
    branches: [staging]
    paths:
      - 'supabase/migrations/**'
      - 'supabase/seed.sql'
      - 'supabase/seeds/**'
      - 'supabase/config.toml'
      - 'supabase/functions/**'
      - '.github/workflows/deploy_staging_supabase.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: supabase-staging
  cancel-in-progress: false

env:
  SUPABASE_STAGING_PROJECT_ID: dhwrtdnjwdkvdyvojvjl
  SUPABASE_PRODUCTION_PROJECT_ID: ovzijmqrnsgcmryinkfa

jobs:
  database:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Guard staging target
        shell: bash
        run: |
          set -euo pipefail
          test "${GITHUB_REF_NAME}" = "staging"
          test -n "${SUPABASE_STAGING_PROJECT_ID}"
          if [ "${SUPABASE_STAGING_PROJECT_ID}" = "${SUPABASE_PRODUCTION_PROJECT_ID}" ]; then
            echo "::error::Refusing to target the production Supabase project."
            exit 1
          fi

      - name: Require Supabase access token
        shell: bash
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          set -euo pipefail
          test -n "${SUPABASE_ACCESS_TOKEN:-}" || {
            echo "::error::SUPABASE_ACCESS_TOKEN is required."
            exit 1
          }

      - uses: supabase/setup-cli@3c2f5e2ae34c34e428e8e206e2c4d21fa2d20fbf # v2
        with:
          version: 2.111.0

      - name: Link staging project without production DB password
        shell: bash
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          set -euo pipefail
          unset SUPABASE_DB_PASSWORD || true
          supabase link --project-ref "${SUPABASE_STAGING_PROJECT_ID}"

      - name: Preview database deployment
        shell: bash
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          set -euo pipefail
          unset SUPABASE_DB_PASSWORD || true
          supabase db push --linked --include-all --include-seed --dry-run

      - name: Apply migrations and safe staging seeds
        shell: bash
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          set -euo pipefail
          unset SUPABASE_DB_PASSWORD || true
          supabase db push --linked --include-all --include-seed --yes

  functions:
    needs: database
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Guard staging target
        shell: bash
        run: |
          set -euo pipefail
          test "${GITHUB_REF_NAME}" = "staging"
          if [ "${SUPABASE_STAGING_PROJECT_ID}" = "${SUPABASE_PRODUCTION_PROJECT_ID}" ]; then
            echo "::error::Refusing to target the production Supabase project."
            exit 1
          fi

      - uses: supabase/setup-cli@3c2f5e2ae34c34e428e8e206e2c4d21fa2d20fbf # v2
        with:
          version: 2.111.0

      - name: Deploy Edge Functions to staging
        shell: bash
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          set -euo pipefail
          for dir in supabase/functions/*; do
            [ -d "$dir" ] || continue
            name=$(basename "$dir")
            [ "$name" = "_shared" ] && continue
            echo "Deploying $name to staging"
            supabase functions deploy "$name" --project-ref "${SUPABASE_STAGING_PROJECT_ID}"
          done
