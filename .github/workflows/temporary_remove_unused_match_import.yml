name: Temporary remove unused finished-match import

on:
  push:
    branches: [finished-match-modules]
    paths:
      - '.github/workflows/temporary_remove_unused_match_import.yml'

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: finished-match-modules
          fetch-depth: 0
      - name: Remove unused import
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p = Path('lib/features/matches/presentation/match_details_page.dart')
          s = p.read_text()
          target = "import 'package:as_grinta/features/sports_management/domain/match_composition.dart';\n"
          assert s.count(target) == 1
          p.write_text(s.replace(target, '', 1))
          PY
          git diff --check
      - name: Remove temporary workflow and commit
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/temporary_remove_unused_match_import.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Remove unused finished-match import"
          git push origin HEAD:finished-match-modules
