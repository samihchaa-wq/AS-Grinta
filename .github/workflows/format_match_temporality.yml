name: Capture formatted match temporality file

on:
  push:
    branches:
      - agent/match-temporality-notifications
    paths:
      - '.github/workflows/format_match_temporality.yml'
      - 'lib/features/predictions/presentation/merged_matches_view.dart'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  format:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Format target
        run: dart format lib/features/predictions/presentation/merged_matches_view.dart
      - name: Upload formatted source
        uses: actions/upload-artifact@v4
        with:
          name: formatted-merged-matches-view
          path: lib/features/predictions/presentation/merged_matches_view.dart
