name: Temp remove duplicate add match

on:
  push:
    branches:
      - agent/club-events-ui

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Remove legacy add-match buttons
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          path = Path('lib/features/predictions/presentation/merged_matches_view.dart')
          text = path.read_text()
          original = text
          text = text.replace("import 'package:as_grinta/features/matches/presentation/match_form_page.dart';\n", '')
          text, method_count = re.subn(
              r"\n  Future<void> _openMatchForm\(BuildContext context\) async \{.*?\n  \}\n",
              "\n",
              text,
              count=1,
              flags=re.S,
          )

          lines = text.splitlines(keepends=True)
          output = []
          i = 0
          removed_buttons = 0
          while i < len(lines):
              line = lines[i]
              stripped = line.strip()
              indent = len(line) - len(line.lstrip(' '))
              window = ''.join(lines[i:i + 45])
              has_add_match = "label: const Text('Ajouter un match')" in window
              if has_add_match and stripped == 'if (isAdmin) ...[':
                  i += 1
                  while i < len(lines):
                      current = lines[i]
                      if (len(current) - len(current.lstrip(' ')) == indent and current.strip() == '],'):
                          i += 1
                          break
                      i += 1
                  removed_buttons += 1
                  continue
              if has_add_match and stripped == 'if (isAdmin)':
                  i += 1
                  while i < len(lines):
                      current = lines[i]
                      if (len(current) - len(current.lstrip(' ')) == indent and current.strip() == '),'):
                          i += 1
                          break
                      i += 1
                  removed_buttons += 1
                  continue
              output.append(line)
              i += 1

          text = ''.join(output)
          if method_count != 1:
              raise SystemExit(f'expected 1 legacy method, removed {method_count}')
          if removed_buttons != 2:
              raise SystemExit(f'expected 2 legacy buttons, removed {removed_buttons}')
          if text == original:
              raise SystemExit('no source change produced')
          path.write_text(text)
          PY
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get --enforce-lockfile
      - run: dart format lib/features/predictions/presentation/merged_matches_view.dart
      - name: Commit patch
        run: |
          if git diff --quiet; then
            echo "Aucun changement."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/features/predictions/presentation/merged_matches_view.dart
          git commit -m "Déplace définitivement le bouton Ajouter un match"
          git push origin HEAD:agent/club-events-ui
