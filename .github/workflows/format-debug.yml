name: Format debug

on:
  push:
    branches:
      - agent/fix-audit-core-issues

permissions:
  contents: write

jobs:
  format-debug:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Format target file
        run: |
          dart format lib/features/predictions/presentation/widgets/inline_match_prediction_card.dart
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/features/predictions/presentation/widgets/inline_match_prediction_card.dart
          git commit -m "Format prediction card with Dart"
          git push
