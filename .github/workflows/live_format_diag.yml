name: Live format diagnostic

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  format-diff:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get --enforce-lockfile

      - name: Print formatter diff
        shell: bash
        run: |
          set -euo pipefail
          dart format lib/features/match_live/presentation/match_live_running_page.dart
          echo '--- FORMAT DIFF START ---'
          git diff --no-ext-diff -- lib/features/match_live/presentation/match_live_running_page.dart
          echo '--- FORMAT DIFF END ---'
