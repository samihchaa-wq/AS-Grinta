name: TEMP format Live score

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR head
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
      - name: Setup Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: stable
          cache: true
      - name: Install locked dependencies
        run: flutter pub get --enforce-lockfile
      - name: Format changed Dart files
        run: dart format lib/features/match_live/presentation/match_live_providers.dart test/match_live_state_controller_test.dart
      - name: Commit formatter output
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet; then
            echo 'No formatting changes.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add lib/features/match_live/presentation/match_live_providers.dart test/match_live_state_controller_test.dart
          git commit -m 'style: apply CI Dart formatter'
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
