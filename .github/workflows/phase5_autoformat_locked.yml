name: Phase 5 locked autoformat

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  format:
    if: github.head_ref == 'visual/ui-overhaul-phase-5'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: visual/ui-overhaul-phase-5
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Install locked dependencies
        run: flutter pub get --enforce-lockfile
      - name: Format phase 5 files
        run: dart format lib/features/profile/presentation/profile_page.dart lib/features/badges/presentation/badge_trophy_button.dart
      - name: Commit formatted files
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add lib/features/profile/presentation/profile_page.dart lib/features/badges/presentation/badge_trophy_button.dart
          git diff --cached --quiet || git commit -m "style: formater la phase 5 avec les dépendances verrouillées"
          git push origin HEAD:visual/ui-overhaul-phase-5
