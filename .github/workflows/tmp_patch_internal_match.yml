name: Temporary internal match patch

on:
  push:
    branches: ['db/internal-match-atomic-update']

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: db/internal-match-atomic-update
          fetch-depth: 0

      - name: Setup Flutter formatter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: stable
          cache: true

      - name: Apply minimal client patch
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re

          repo = Path('lib/features/matches/data/matches_repository.dart')
          text = repo.read_text()
          start = text.index('  Future<void> updateInternalMatch({')
          end = text.index('  /// Cotes suggérées', start)
          block = text[start:end]
          block, count = re.subn(
              r'(required DateTime kickoffAt,\n)(\s*\}\) async \{)',
              r'\1    String? address,\n\2',
              block,
              count=1,
          )
          if count != 1:
              raise SystemExit('repository signature target not found')
          block, count = re.subn(
              r"('p_match_time': _formatTime\(kickoffAt\),\n)",
              r"\1        'p_address': address,\n",
              block,
              count=1,
          )
          if count != 1:
              raise SystemExit('repository params target not found')
          repo.write_text(text[:start] + block + text[end:])

          controller = Path('lib/features/matches/presentation/matches_controller.dart')
          text = controller.read_text()
          start = text.index('  Future<void> updateInternalMatch({')
          end = text.index('  bool _validOdds', start)
          block = text[start:end]
          block, count = re.subn(
              r'(kickoffAt: kickoffAt,\n\s*\);)',
              'kickoffAt: kickoffAt,\n        address: address,\n      );',
              block,
              count=1,
          )
          if count != 1:
              raise SystemExit('controller update call target not found')
          block, count = re.subn(
              r'\n\s*await _repository\.setMatchAddress\(\n\s*matchId: id,\n\s*address: address,\n\s*rememberAsDefault: rememberAddressAsDefault,\n\s*\);',
              '',
              block,
              count=1,
          )
          if count != 1:
              raise SystemExit('controller second RPC target not found')
          controller.write_text(text[:start] + block + text[end:])
          PY

          dart format lib/features/matches/data/matches_repository.dart \
            lib/features/matches/presentation/matches_controller.dart

          rm .github/workflows/tmp_patch_internal_match.yml
          git diff --check

      - name: Commit patch and remove temporary workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add lib/features/matches/data/matches_repository.dart \
            lib/features/matches/presentation/matches_controller.dart \
            .github/workflows/tmp_patch_internal_match.yml
          git commit -m 'fix(matches): make internal match update a single RPC'
          git push origin HEAD:db/internal-match-atomic-update
