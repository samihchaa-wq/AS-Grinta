name: Temporary internal match patch

on:
  push:
    branches: ['db/internal-match-atomic-update']

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: db/internal-match-atomic-update
          fetch-depth: 0

      - name: Apply minimal client patch
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          repo = Path('lib/features/matches/data/matches_repository.dart')
          text = repo.read_text()
          old = """  Future<void> updateInternalMatch({
            required String id,
            required String seasonId,
            required DateTime kickoffAt,
          }) async {
            final result = await _client.rpc(
              'update_internal_match',
              params: {
                'p_match_id': id,
                'p_season_id': seasonId,
                'p_match_date': kickoffAt.toIso8601String().split('T').first,
                'p_match_time': _formatTime(kickoffAt),
              },
            );
          """
          new = """  Future<void> updateInternalMatch({
            required String id,
            required String seasonId,
            required DateTime kickoffAt,
            String? address,
          }) async {
            final result = await _client.rpc(
              'update_internal_match',
              params: {
                'p_match_id': id,
                'p_season_id': seasonId,
                'p_match_date': kickoffAt.toIso8601String().split('T').first,
                'p_match_time': _formatTime(kickoffAt),
                'p_address': address,
              },
            );
          """
          if old not in text:
              raise SystemExit('repository target block not found')
          repo.write_text(text.replace(old, new, 1))

          controller = Path('lib/features/matches/presentation/matches_controller.dart')
          text = controller.read_text()
          old = """      await _repository.updateInternalMatch(
                id: id,
                seasonId: seasonId,
                kickoffAt: kickoffAt,
              );
              await _repository.setMatchAddress(
                matchId: id,
                address: address,
                rememberAsDefault: rememberAddressAsDefault,
              );
          """
          new = """      await _repository.updateInternalMatch(
                id: id,
                seasonId: seasonId,
                kickoffAt: kickoffAt,
                address: address,
              );
          """
          if old not in text:
              raise SystemExit('controller target block not found')
          controller.write_text(text.replace(old, new, 1))
          PY

          dart format lib/features/matches/data/matches_repository.dart \
            lib/features/matches/presentation/matches_controller.dart || true

          rm .github/workflows/tmp_patch_internal_match.yml
          git diff --check
          git diff --exit-code -- .github/workflows/flutter_ci.yml

      - name: Commit patch and remove temporary workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add lib/features/matches/data/matches_repository.dart \
            lib/features/matches/presentation/matches_controller.dart \
            .github/workflows/tmp_patch_internal_match.yml
          git commit -m 'fix(matches): make internal match update a single RPC'
          git push origin HEAD:db/internal-match-atomic-update
