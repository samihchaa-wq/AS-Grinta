name: Apply opponent default addresses trigger

on:
  push:
    branches:
      - agent/opponent-default-addresses

permissions:
  contents: write

jobs:
  apply:
    if: ${{ !contains(github.event.head_commit.message, '[addresses-applied]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/opponent-default-addresses
          fetch-depth: 0
      - name: Apply implementation
        run: python .github/agent/apply_opponent_default_addresses.py
      - name: Commit implementation
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add \
            lib/features/matches/data/matches_repository.dart \
            lib/features/matches/presentation/matches_controller.dart \
            lib/features/matches/presentation/match_form_page.dart \
            supabase/migrations/20260726200000_opponent_default_addresses.sql \
            supabase/tests/database/opponent_default_addresses.test.sql
          git commit -m "Préremplir les adresses des adversaires [addresses-applied]"
          git push origin HEAD:agent/opponent-default-addresses
