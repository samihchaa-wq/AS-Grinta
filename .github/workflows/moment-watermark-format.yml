name: Moment watermark formatter

on:
  push:
    branches:
      - agent/moment-card-watermarks

permissions:
  contents: read

jobs:
  format:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
        with:
          channel: stable
          cache: true
      - name: Format changed Dart files
        run: |
          dart format \
            lib/core/widgets/moment_card_watermark.dart \
            lib/features/matches/presentation/widgets/calendar_feed_event_card.dart \
            lib/features/matches/presentation/widgets/historical_match_card.dart
      - name: Pack formatted files
        run: |
          mkdir -p formatted/lib/core/widgets
          mkdir -p formatted/lib/features/matches/presentation/widgets
          cp lib/core/widgets/moment_card_watermark.dart formatted/lib/core/widgets/
          cp lib/features/matches/presentation/widgets/calendar_feed_event_card.dart formatted/lib/features/matches/presentation/widgets/
          cp lib/features/matches/presentation/widgets/historical_match_card.dart formatted/lib/features/matches/presentation/widgets/
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: formatted-moment-watermarks
          path: formatted
