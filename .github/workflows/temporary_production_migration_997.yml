name: Temporary production migrations 482-483

on:
  push:
    branches:
      - ci/supabase-migration-drift-guard-997-season-prediction
    paths:
      - 'supabase/migrations/20260817225500_freeze_season_prediction_roster.sql'
      - 'supabase/migrations/20260817225600_fix_season_prediction_snapshot_rls.sql'
      - '.github/workflows/temporary_production_migration_997.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: temporary-production-migrations-482-483
  cancel-in-progress: false

env:
  SUPABASE_PRODUCTION_PROJECT_ID: ovzijmqrnsgcmryinkfa
  SUPABASE_STAGING_PROJECT_ID: dhwrtdnjwdkvdyvojvjl
  SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
  SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}

jobs:
  migrate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Guard production target and credentials
        shell: bash
        run: |
          set -euo pipefail
          test "${GITHUB_REF_NAME}" = "ci/supabase-migration-drift-guard-997-season-prediction"
          test -n "${SUPABASE_ACCESS_TOKEN:-}"
          test -n "${SUPABASE_DB_PASSWORD:-}"
          test -n "${SUPABASE_PRODUCTION_PROJECT_ID}"
          test "${SUPABASE_PRODUCTION_PROJECT_ID}" != "${SUPABASE_STAGING_PROJECT_ID}"
          test -f supabase/migrations/20260817225500_freeze_season_prediction_roster.sql
          test -f supabase/migrations/20260817225600_fix_season_prediction_snapshot_rls.sql

      - uses: supabase/setup-cli@3c2f5e2ae34c34e428e8e206e2c4d21fa2d20fbf # v2
        with:
          version: 2.111.0

      - name: Link production project
        shell: bash
        run: |
          set -euo pipefail
          supabase link --project-ref "${SUPABASE_PRODUCTION_PROJECT_ID}"

      - name: Verify production registry before deployment
        shell: bash
        run: |
          set -euo pipefail
          supabase migration list 2>&1 | tee /tmp/prod-migration-before.log
          remote_count=$(awk -F'|' '{ remote=$2; gsub(/[^0-9]/, "", remote); if (length(remote) == 14) count++ } END { print count+0 }' /tmp/prod-migration-before.log)
          latest_remote=$(awk -F'|' '{ remote=$2; gsub(/[^0-9]/, "", remote); if (length(remote) == 14) latest=remote } END { print latest }' /tmp/prod-migration-before.log)
          test "${remote_count}" = "481"
          test "${latest_remote}" = "20260817214500"

      - name: Preview migrations 482 and 483 only
        shell: bash
        run: |
          set -euo pipefail
          supabase db push --linked --include-all --dry-run 2>&1 | tee /tmp/prod-migration-dry-run.log
          grep -q '20260817225500' /tmp/prod-migration-dry-run.log
          grep -q '20260817225600' /tmp/prod-migration-dry-run.log

      - name: Apply migrations 482 and 483
        shell: bash
        run: |
          set -euo pipefail
          supabase db push --linked --include-all --yes

      - name: Verify production migration registry
        shell: bash
        run: |
          set -euo pipefail
          supabase migration list 2>&1 | tee /tmp/prod-migration-after.log
          remote_count=$(awk -F'|' '{ remote=$2; gsub(/[^0-9]/, "", remote); if (length(remote) == 14) count++ } END { print count+0 }' /tmp/prod-migration-after.log)
          latest_remote=$(awk -F'|' '{ remote=$2; gsub(/[^0-9]/, "", remote); if (length(remote) == 14) latest=remote } END { print latest }' /tmp/prod-migration-after.log)
          grep -q '20260817225500' /tmp/prod-migration-after.log
          grep -q '20260817225600' /tmp/prod-migration-after.log
          test "${remote_count}" = "483"
          test "${latest_remote}" = "20260817225600"
