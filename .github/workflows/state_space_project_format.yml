name: State-space project format

on:
  pull_request:
    branches: [main]
    paths:
      - 'test/exhaustive_*_state_space_test.dart'
      - '.github/workflows/state_space_project_format.yml'

permissions:
  contents: read

concurrency:
  group: state-space-project-format-${{ github.ref }}
  cancel-in-progress: true

jobs:
  format:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Install locked dependencies
        run: flutter pub get --enforce-lockfile
      - name: Format with project language version
        run: dart format test/exhaustive_auth_router_state_space_test.dart test/exhaustive_prediction_state_space_test.dart
      - name: Upload exact formatted sources
        uses: actions/upload-artifact@v4
        with:
          name: state-space-project-formatted-sources
          path: |
            test/exhaustive_auth_router_state_space_test.dart
            test/exhaustive_prediction_state_space_test.dart
          if-no-files-found: error
