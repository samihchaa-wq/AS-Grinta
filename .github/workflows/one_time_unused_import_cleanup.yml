name: One-time unused import cleanup

on:
  push:
    branches: [hardening/audit-stabilization-batch-1]
    paths:
      - '.github/workflows/one_time_unused_import_cleanup.yml'

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: hardening/audit-stabilization-batch-1
          fetch-depth: 0
      - name: Remove analyzer-confirmed unused imports
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path

          removals = {
              'lib/features/badges/presentation/armoire_page.dart': [
                  "import 'package:as_grinta/features/auth/domain/auth_profile.dart';\n",
              ],
              'lib/features/home/presentation/accueil_page.dart': [
                  "import 'package:as_grinta/features/auth/domain/auth_profile.dart';\n",
              ],
              'lib/features/matches/presentation/match_details_page.dart': [
                  "import 'package:as_grinta/features/auth/domain/auth_profile.dart';\n",
              ],
              'lib/features/matches/presentation/matches_page.dart': [
                  "import 'package:as_grinta/features/auth/domain/auth_profile.dart';\n",
              ],
              'lib/features/more/presentation/more_page.dart': [
                  "import 'package:as_grinta/features/auth/domain/auth_profile.dart';\n",
              ],
              'lib/features/notifications/presentation/notifications_page.dart': [
                  "import 'package:as_grinta/features/auth/domain/auth_profile.dart';\n",
              ],
              'lib/features/predictions/presentation/pronos_hub_page.dart': [
                  "import 'package:as_grinta/core/utils/app_formats.dart';\n",
                  "import 'package:as_grinta/features/auth/domain/auth_profile.dart';\n",
              ],
              'lib/features/sports_management/presentation/match_lineup_page.dart': [
                  "import 'package:as_grinta/features/auth/domain/auth_profile.dart';\n",
              ],
          }
          for filename, imports in removals.items():
              path = Path(filename)
              content = path.read_text()
              for import_line in imports:
                  if import_line not in content:
                      raise SystemExit(f'Import attendu absent: {filename}: {import_line.strip()}')
                  content = content.replace(import_line, '', 1)
              path.write_text(content)
          Path('.github/workflows/one_time_unused_import_cleanup.yml').unlink()
          PY
      - name: Commit cleanup
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'quality: supprimer les imports inutilisés existants'
          git push origin HEAD:hardening/audit-stabilization-batch-1
