name: QA auth password probe

on:
  push:
    branches: [qa/auth-prelogin-audit]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'

      - name: Install Playwright Core
        run: npm install --no-save playwright-core@1.52.0

      - name: Verify short password feedback in isolation
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const { chromium } = require('playwright-core');
          (async () => {
            const browser = await chromium.launch({
              headless: true,
              executablePath: '/usr/bin/google-chrome',
              args: ['--no-sandbox', '--disable-dev-shm-usage'],
            });
            const context = await browser.newContext({
              viewport: { width: 390, height: 844 },
              serviceWorkers: 'block',
            });
            const page = await context.newPage();
            await page.goto(`https://samihchaa-wq.github.io/AS-Grinta/staging/#/auth/sign-in?pwd=${Date.now()}`, {
              waitUntil: 'domcontentloaded',
              timeout: 45000,
            });
            await page.locator('flutter-view, flt-glass-pane, canvas').first()
              .waitFor({ state: 'attached', timeout: 45000 });
            await page.waitForTimeout(1800);
            await page.evaluate(() => {
              const p = document.querySelector('flt-semantics-placeholder');
              if (p instanceof HTMLElement) p.click();
            }).catch(() => {});
            await page.waitForTimeout(500);

            await page.getByRole('button', { name: 'Créer mon compte', exact: true }).click();
            await page.getByRole('textbox', { name: 'Prénom', exact: true }).waitFor({ timeout: 15000 });
            await page.getByRole('textbox', { name: 'Prénom', exact: true }).fill('Recette');
            await page.getByRole('textbox', { name: 'Nom', exact: true }).fill('Grinta');
            await page.getByRole('textbox', { name: 'Mot de passe', exact: true }).fill('abc');
            await page.getByRole('textbox', { name: 'Confirme ton mot de passe', exact: true }).fill('abc');
            await page.getByRole('button', { name: 'Créer mon compte', exact: true }).click();

            const expected = 'Le mot de passe doit contenir entre 12 et 72 caractères.';
            const deadline = Date.now() + 10000;
            let found = false;
            while (Date.now() < deadline && !found) {
              const cdp = await context.newCDPSession(page);
              await cdp.send('Accessibility.enable');
              const tree = await cdp.send('Accessibility.getFullAXTree');
              found = tree.nodes.some(node => String(node.name?.value ?? '').includes(expected));
              if (!found) await page.waitForTimeout(200);
            }
            await page.screenshot({ path: 'short-password-feedback.png' });
            if (!found) {
              throw new Error(`Short-password feedback not exposed: ${expected}`);
            }
            console.log('SHORT_PASSWORD_FEEDBACK=OK');
            await browser.close();
          })().catch(error => {
            console.error(error);
            process.exit(1);
          });
          NODE

      - name: Upload screenshot
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: qa-short-password-feedback
          path: short-password-feedback.png
          if-no-files-found: warn
