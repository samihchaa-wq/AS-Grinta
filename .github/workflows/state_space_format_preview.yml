name: State-space format preview

on:
  pull_request:
    branches: [main]
    paths:
      - 'test/exhaustive_*_state_space_test.dart'
      - '.github/workflows/state_space_format_preview.yml'

permissions:
  contents: read

concurrency:
  group: state-space-format-preview-${{ github.ref }}
  cancel-in-progress: true

jobs:
  format:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Format exhaustive tests
        run: dart format test/exhaustive_auth_router_state_space_test.dart test/exhaustive_prediction_state_space_test.dart
      - name: Upload formatted sources
        uses: actions/upload-artifact@v4
        with:
          name: state-space-formatted-sources
          path: |
            test/exhaustive_auth_router_state_space_test.dart
            test/exhaustive_prediction_state_space_test.dart
          if-no-files-found: error
