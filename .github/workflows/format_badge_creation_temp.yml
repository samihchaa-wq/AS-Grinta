name: Temporary badge creation formatter

on:
  push:
    branches:
      - feature/badge-creation-image-first

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/badge-creation-image-first
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Format badge creation page
        run: dart format lib/features/badges/presentation/badge_admin_page.dart
      - name: Commit formatter output
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- lib/features/badges/presentation/badge_admin_page.dart; then
            echo "Already formatted."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/features/badges/presentation/badge_admin_page.dart
          git commit -m "Format badge creation page"
          git push origin HEAD:feature/badge-creation-image-first
