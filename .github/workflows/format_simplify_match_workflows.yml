name: Format simplified match workflows

on:
  push:
    branches: [agent/simplify-match-workflows]

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/simplify-match-workflows
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Resolve project language version
        run: flutter pub get --enforce-lockfile
      - name: Format changed Dart files
        run: |
          dart format \
            lib/features/auth/presentation/auth_loading_page.dart \
            lib/features/sports_management/presentation/admin_squad_plan_page_composition.dart \
            lib/features/sports_management/presentation/admin_squad_plan_page_effectif.dart
      - name: Remove one-shot formatter and commit
        run: |
          rm .github/workflows/format_simplify_match_workflows.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Format workflow files with project language version"
          git push origin HEAD:agent/simplify-match-workflows
