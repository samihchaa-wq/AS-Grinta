name: Temporary format admin split

on:
  push:
    branches:
      - agent/split-admin-profile-presentation

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/split-admin-profile-presentation
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Format moved Dart files
        run: dart format lib/features/admin/presentation/admin_profile_dialogs.dart lib/features/admin/presentation/admin_profile_actions.dart lib/features/admin/presentation/admin_profiles_section_v2.dart lib/features/admin/presentation/admin_page.dart
      - name: Commit formatter output
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/features/admin/presentation/
          git commit -m "Format admin profile split"
          git push origin HEAD:agent/split-admin-profile-presentation
