name: Visual evidence guard

on:
  pull_request:
    branches: [main]
    types: [opened, edited, synchronize, reopened, ready_for_review]

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: visual-evidence-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  require-before-after:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout visual evidence checker
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Require before/after evidence for visual changes
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        shell: bash
        run: bash tool/check_visual_evidence.sh
