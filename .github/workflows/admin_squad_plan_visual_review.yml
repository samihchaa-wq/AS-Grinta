name: Admin squad plan visual review

on:
  pull_request:
    branches: [main]
    paths:
      - 'lib/features/sports_management/presentation/admin_squad_plan_page*.dart'
      - 'lib/features/sports_management/domain/sport_waitlist_models.dart'
      - 'lib/features/sports_management/domain/match_composition.dart'
      - 'test/admin_squad_plan_visual_review_test.dart'
      - '.github/workflows/admin_squad_plan_visual_review.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: admin-squad-plan-visual-review-${{ github.ref }}
  cancel-in-progress: true

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref }}

      - name: Align composition server test once
        if: github.event_name == 'pull_request' && github.head_ref == 'agent/simplify-match-workflows'
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path('supabase/tests/database/sports_management_composition_server.test.sql')
          text = path.read_text()

          start = text.index("select throws_ok(\n  $$select public.admin_save_match_composition(\n    current_setting('test.composition_match')::uuid,\n    '4-3-3',\n    pg_temp.composition_payload('twelve_field')")
          end = text.index("\n\nselect is(\n  (\n    select composition_state::text", start)
          text = text[:start] + '''select is(
  public.admin_publish_match_effectif(
    current_setting('test.composition_match')::uuid,
    14,
    pg_temp.effectif_payload(),
    'Effectif immédiat avant composition'
  ) #>> '{convocation_version}',
  '1',
  'l’effectif est enregistré et publié immédiatement avant la composition'
);

select throws_ok(
  $$select public.admin_save_match_composition(
    current_setting('test.composition_match')::uuid,
    '4-3-3',
    pg_temp.composition_payload('twelve_field'),
    false,
    'Trop de titulaires'
  )$$,
  '22023',
  'A composition cannot contain more than 11 starters',
  'le serveur refuse douze titulaires'
);

select is(
  public.admin_save_match_composition(
    current_setting('test.composition_match')::uuid,
    '4-3-3',
    pg_temp.composition_payload('valid'),
    false,
    'Première composition immédiate'
  ) #>> '{version}',
  '1',
  'la première composition valide est publiée immédiatement en version 1'
);

select is(
  public.admin_publish_match_composition(
    current_setting('test.composition_match')::uuid,
    false,
    'Compatibilité ancienne publication'
  ) #>> '{version}',
  '1',
  'un ancien appel de publication après save reste un no-op compatible'
);''' + text[end:]

          start = text.index("select is(\n  public.admin_save_match_composition(\n    current_setting('test.composition_match')::uuid,\n    '4-4-2',")
          end = text.index("\n\nselect is(\n  public.admin_get_match_composition(", start)
          text = text[:start] + '''select is(
  public.admin_save_match_composition(
    current_setting('test.composition_match')::uuid,
    '4-4-2',
    pg_temp.composition_payload('goalkeeper_bench'),
    false,
    'Gardien sur le banc'
  ) #>> '{version}',
  '2',
  'une modification valide est publiée immédiatement en version 2'
);

select is(
  (
    select count(*)
    from public.match_composition_publications
    where match_id = current_setting('test.composition_match')::uuid
  ),
  2::bigint,
  'chaque modification immédiate conserve un snapshot immuable'
);

select is(
  public.admin_publish_match_composition(
    current_setting('test.composition_match')::uuid,
    false,
    'Compatibilité republication'
  ) #>> '{version}',
  '2',
  'un ancien appel de republication après save reste un no-op compatible'
);''' + text[end:]

          start = text.index("select public.admin_save_match_composition(\n  current_setting('test.composition_match')::uuid,\n  '4-3-3',\n  pg_temp.composition_payload('unresolved')")
          end = text.index("\n\nreset role;\nupdate private.app_feature_flags", start)
          text = text[:start] + '''select throws_ok(
  $$select public.admin_save_match_composition(
    current_setting('test.composition_match')::uuid,
    '4-3-3',
    pg_temp.composition_payload('unresolved'),
    false,
    'Composition volontairement incomplète'
  )$$,
  '22023',
  'Every selected player must be placed on the field or bench before publication',
  'un joueur convoqué non placé bloque l’enregistrement immédiat'
);''' + text[end:]

          path.write_text(text)
          PY

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          git checkout origin/main -- .github/workflows/admin_squad_plan_visual_review.yml
          git add -A
          git commit -m "Align composition server test with immediate persistence"
          git push origin HEAD:agent/simplify-match-workflows

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install locked dependencies
        run: flutter pub get --enforce-lockfile

      - name: Check visual test formatting
        run: dart format --output=none --set-exit-if-changed test/admin_squad_plan_visual_review_test.dart

      - name: Render admin squad plan states
        shell: bash
        run: |
          set -o pipefail
          mkdir -p build/visual-review
          timeout --signal=TERM 180s flutter test \
            --reporter expanded \
            --timeout 30s \
            test/admin_squad_plan_visual_review_test.dart \
            2>&1 | tee build/visual-review/visual-test.log

      - name: Upload visual review
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: admin-squad-plan-visual-review
          path: |
            build/visual-review/*.png
            build/visual-review/visual-test.log
          if-no-files-found: error
