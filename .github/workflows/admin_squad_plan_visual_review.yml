name: Admin squad plan visual review

on:
  pull_request:
    branches: [main]
    paths:
      - 'lib/features/sports_management/presentation/admin_squad_plan_page*.dart'
      - 'lib/features/sports_management/domain/sport_waitlist_models.dart'
      - 'lib/features/sports_management/domain/match_composition.dart'
      - 'test/admin_squad_plan_visual_review_test.dart'
      - '.github/workflows/admin_squad_plan_visual_review.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: admin-squad-plan-visual-review-${{ github.ref }}
  cancel-in-progress: true

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref }}

      - name: Harden legacy prediction compatibility shim once
        if: github.event_name == 'pull_request' && github.head_ref == 'agent/simplify-match-workflows'
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path('supabase/migrations/20260803010000_remove_x2_and_private_profile_photos.sql')
          text = path.read_text()
          old = '''create or replace function public.save_match_prediction(
            p_match_id uuid,
            p_score_as_grinta integer,
            p_score_adverse integer,
            p_use_x2 boolean
          )
          returns boolean
          language sql
          security definer
          set search_path to ''
          as $$
            select public.save_match_prediction(
              p_match_id,
              p_score_as_grinta,
              p_score_adverse
            );
          $$;'''
          new = '''create or replace function public.save_match_prediction(
            p_match_id uuid,
            p_score_as_grinta integer,
            p_score_adverse integer,
            p_use_x2 boolean
          )
          returns boolean
          language sql
          set search_path to ''
          as $$
            select public.save_match_prediction(
              p_match_id,
              p_score_as_grinta,
              p_score_adverse
            );
          $$;'''
          if old not in text:
              raise SystemExit('Legacy prediction shim block not found')
          path.write_text(text.replace(old, new))
          PY

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          git checkout origin/main -- .github/workflows/admin_squad_plan_visual_review.yml
          git add -A
          git commit -m "Harden legacy prediction compatibility shim"
          git push origin HEAD:agent/simplify-match-workflows

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install locked dependencies
        run: flutter pub get --enforce-lockfile

      - name: Check visual test formatting
        run: dart format --output=none --set-exit-if-changed test/admin_squad_plan_visual_review_test.dart

      - name: Render admin squad plan states
        shell: bash
        run: |
          set -o pipefail
          mkdir -p build/visual-review
          timeout --signal=TERM 180s flutter test \
            --reporter expanded \
            --timeout 30s \
            test/admin_squad_plan_visual_review_test.dart \
            2>&1 | tee build/visual-review/visual-test.log

      - name: Upload visual review
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: admin-squad-plan-visual-review
          path: |
            build/visual-review/*.png
            build/visual-review/visual-test.log
          if-no-files-found: error
