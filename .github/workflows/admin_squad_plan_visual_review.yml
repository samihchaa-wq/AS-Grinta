name: Admin squad plan visual review

on:
  pull_request:
    branches: [main]
    paths:
      - 'lib/features/sports_management/presentation/admin_squad_plan_page*.dart'
      - 'lib/features/sports_management/domain/sport_waitlist_models.dart'
      - 'lib/features/sports_management/domain/match_composition.dart'
      - 'test/admin_squad_plan_visual_review_test.dart'
      - '.github/workflows/admin_squad_plan_visual_review.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: admin-squad-plan-visual-review-${{ github.ref }}
  cancel-in-progress: true

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install locked dependencies
        run: flutter pub get --enforce-lockfile

      - name: Prepare visual test in CI environment
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path('test/admin_squad_plan_visual_review_test.dart')
          text = path.read_text()
          before = """  final image = await boundary.toImage(pixelRatio: 1.5);
            final bytes = await image.toByteData(format: ui.ImageByteFormat.png);
            if (bytes == null) throw StateError('Capture PNG impossible.');
            final directory = Directory('build/visual-review');
            await directory.create(recursive: true);
            await File('${directory.path}/$fileName').writeAsBytes(
              bytes.buffer.asUint8List(bytes.offsetInBytes, bytes.lengthInBytes),
            );
          """
          after = """  await tester.runAsync(() async {
            final image = await boundary.toImage(pixelRatio: 1.5);
            final bytes = await image.toByteData(format: ui.ImageByteFormat.png);
            if (bytes == null) throw StateError('Capture PNG impossible.');
            final directory = Directory('build/visual-review');
            await directory.create(recursive: true);
            await File('${directory.path}/$fileName').writeAsBytes(
              bytes.buffer.asUint8List(bytes.offsetInBytes, bytes.lengthInBytes),
            );
          });
          """
          if text.count(before) != 1:
              raise SystemExit('Bloc de capture introuvable ou ambigu')
          path.write_text(text.replace(before, after, 1))
          PY
          dart format test/admin_squad_plan_visual_review_test.dart
          mkdir -p build/visual-review
          cp test/admin_squad_plan_visual_review_test.dart \
            build/visual-review/admin_squad_plan_visual_review_test.formatted.dart

      - name: Render admin squad plan states
        shell: bash
        run: |
          set -o pipefail
          timeout --signal=TERM 180s flutter test \
            --reporter expanded \
            --timeout 30s \
            test/admin_squad_plan_visual_review_test.dart \
            2>&1 | tee build/visual-review/visual-test.log

      - name: Upload visual review
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: admin-squad-plan-visual-review
          path: build/visual-review/*
          if-no-files-found: error
