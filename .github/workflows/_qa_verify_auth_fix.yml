name: QA verify auth fix

on:
  push:
    branches: [fix/auth-signin-offline-feedback]

permissions:
  contents: read

jobs:
  auth-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Setup Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: stable
          cache: true
      - name: Install locked dependencies
        run: flutter pub get --enforce-lockfile
      - name: Run auth tests
        run: flutter test test/auth_controller_test.dart test/auth_signin_error_message_test.dart
