name: Apply PR 493 simplified match form

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  apply:
    if: ${{ !contains(github.event.head_commit.message, '[match-form-applied]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Apply implementation
        shell: bash
        run: |
          python <<'PY'
          from pathlib import Path

          path = Path('lib/features/matches/presentation/match_form_page.dart')
          text = path.read_text()

          def replace_once(old: str, new: str, label: str) -> None:
              global text
              if old not in text:
                  raise SystemExit(f'Marker missing: {label}')
              text = text.replace(old, new, 1)

          replace_once(
              """            DropdownButtonFormField<String>(
                initialValue: _seasonId.isEmpty ? null : _seasonId,
                decoration: const InputDecoration(labelText: 'Saison'),
                items: seasons
                    .map(
                      (season) => DropdownMenuItem<String>(
                        value: season['id'].toString(),
                        child: Text(season['name'].toString()),
                      ),
                    )
                    .toList(),
                onChanged: (value) => setState(() => _seasonId = value ?? ''),
                validator: (value) => value == null || value.isEmpty
                    ? 'Sélectionnez une saison'
                    : null,
              ),
              const SizedBox(height: 12),
""",
              """            if (widget.match != null) ...[
              DropdownButtonFormField<String>(
                initialValue: _seasonId.isEmpty ? null : _seasonId,
                decoration: const InputDecoration(labelText: 'Saison'),
                items: seasons
                    .map(
                      (season) => DropdownMenuItem<String>(
                        value: season['id'].toString(),
                        child: Text(season['name'].toString()),
                      ),
                    )
                    .toList(),
                onChanged: (value) => setState(() => _seasonId = value ?? ''),
                validator: (value) => value == null || value.isEmpty
                    ? 'Sélectionnez une saison'
                    : null,
              ),
              const SizedBox(height: 12),
            ],
""",
              'season selector',
          )
          replace_once(
              """                helperText:
                    'Préremplie depuis l’équipe qui reçoit. La modification '
                    'reste propre à ce match sauf option ci-dessous.',
""",
              '',
              'address helper',
          )
          replace_once(
              """                  helperText:
                      '14 est proposé habituellement, mais la limite est libre pour ce match.',
""",
              '',
              'squad helper',
          )
          replace_once(
              """                const SizedBox(width: 8),
                Expanded(
                  child: Text(
                    'd’après les précédentes rencontres',
                    style: Theme.of(context).textTheme.bodySmall,
                  ),
                ),
                if (_suggestingOdds)
                  const SizedBox(
""",
              """                if (_suggestingOdds) ...[
                  const Spacer(),
                  const SizedBox(
""",
              'odds subtitle',
          )
          replace_once(
              """                    child: CircularProgressIndicator(strokeWidth: 2),
                  ),
              ],
            ),
""",
              """                    child: CircularProgressIndicator(strokeWidth: 2),
                  ),
                ],
              ],
            ),
""",
              'odds row closure',
          )
          replace_once("_OddsDisplay(label: 'Victoire (1)', value: _oddsWin)", "_OddsDisplay(label: 'Victoire', value: _oddsWin)", 'win label')
          replace_once("_OddsDisplay(label: 'Nul (N)', value: _oddsDraw)", "_OddsDisplay(label: 'Nul', value: _oddsDraw)", 'draw label')
          replace_once("_OddsDisplay(label: 'Défaite (2)', value: _oddsLoss)", "_OddsDisplay(label: 'Défaite', value: _oddsLoss)", 'loss label')
          replace_once(
              """  Future<void> _submit() async {
    if (!_formKey.currentState!.validate()) return;
""",
              """  Future<void> _submit() async {
    if (_seasonId.isEmpty) {
      ScaffoldMessenger.of(context).showSnackBar(
        const SnackBar(content: Text('Aucune saison ouverte disponible.')),
      );
      return;
    }
    if (!_formKey.currentState!.validate()) return;
""",
              'missing season feedback',
          )

          forbidden = [
              'Préremplie depuis l’équipe qui reçoit.',
              '14 est proposé habituellement',
              'd’après les précédentes rencontres',
              'Victoire (1)',
              'Nul (N)',
              'Défaite (2)',
          ]
          for value in forbidden:
              if value in text:
                  raise SystemExit(f'Unexpected remaining text: {value}')

          path.write_text(text)
          for extra in (
              Path('.github/workflows/apply-pr493-simplified-match-form.yml'),
              Path('.github/agent/apply-pr493-simplified-match-form.trigger'),
          ):
              if extra.exists():
                  extra.unlink()
          PY
      - name: Validate
        shell: bash
        run: |
          dart format lib/features/matches/presentation/match_form_page.dart
          flutter pub get
          flutter analyze --fatal-infos
          flutter test
          flutter build web --release
          git diff --check
      - name: Commit implementation
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "Simplifier le formulaire de match [match-form-applied]"
          git push origin HEAD:main
