name: Format opponent default addresses

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  format:
    if: ${{ github.head_ref == 'agent/opponent-default-addresses' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/opponent-default-addresses
          fetch-depth: 0
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: |
          dart format \
            lib/features/matches/data/matches_repository.dart \
            lib/features/matches/presentation/matches_controller.dart \
            lib/features/matches/presentation/match_form_page.dart
      - run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add \
            lib/features/matches/data/matches_repository.dart \
            lib/features/matches/presentation/matches_controller.dart \
            lib/features/matches/presentation/match_form_page.dart
          git diff --cached --quiet || git commit -m "Formater le préremplissage des adresses"
          git push origin HEAD:agent/opponent-default-addresses
