name: Format opponent default addresses

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  format:
    if: ${{ github.head_ref == 'agent/opponent-default-addresses' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/opponent-default-addresses
          fetch-depth: 0
      - name: Restore repository formatting baseline
        shell: python
        run: |
          from pathlib import Path

          replacements = {
            'lib/features/matches/data/matches_repository.dart': [
              ("""    final response = await _client
        .from('seasons')
        .select('id, name, status')
        .order('name');
""", """    final response =
        await _client.from('seasons').select('id, name, status').order('name');
"""),
            ],
            'lib/features/matches/presentation/match_form_page.dart': [
              ("""    _kickoffAt =
        match?.kickoffAt ??
        DateTime(tomorrow.year, tomorrow.month, tomorrow.day, 21);
""", """    _kickoffAt = match?.kickoffAt ??
        DateTime(tomorrow.year, tomorrow.month, tomorrow.day, 21);
"""),
              ("""      final home = await ref
          .read(matchesRepositoryProvider)
          .fetchClubHomeAddress();
""", """      final home =
          await ref.read(matchesRepositoryProvider).fetchClubHomeAddress();
"""),
              ("""      final opponent = ref
          .read(matchesControllerProvider)
          .opponents
          .firstWhere(
""", """      final opponent = ref.read(matchesControllerProvider).opponents.firstWhere(
"""),
              ("""    final feature = ref
        .watch(featureFlagsControllerProvider)
        .valueOrNull
        ?.sportsManagement;
""", """    final feature =
        ref.watch(featureFlagsControllerProvider).valueOrNull?.sportsManagement;
"""),
              ("""        ? state.seasons
              .where((season) => season['status']?.toString() == 'open')
              .toList()
""", """        ? state.seasons
            .where((season) => season['status']?.toString() == 'open')
            .toList()
"""),
              ("""    final confirmed =
        await showDialog<bool>(
""", """    final confirmed = await showDialog<bool>(
"""),
              ("""    final squadSizeLimit = sportsEnabled
        ? int.parse(_squadSizeController.text.trim())
        : null;
""", """    final squadSizeLimit =
        sportsEnabled ? int.parse(_squadSizeController.text.trim()) : null;
"""),
            ],
            'lib/features/matches/presentation/matches_controller.dart': [
              ("""      final resolvedSeasonId =
          seasonId ??
""", """      final resolvedSeasonId = seasonId ??
"""),
              ("""final matchesControllerProvider =
    StateNotifierProvider<MatchesController, MatchesState>((ref) {
      return MatchesController(ref.watch(matchesRepositoryProvider), ref);
    });
""", """final matchesControllerProvider =
    StateNotifierProvider<MatchesController, MatchesState>((ref) {
  return MatchesController(ref.watch(matchesRepositoryProvider), ref);
});
"""),
            ],
          }

          for path, pairs in replacements.items():
            file = Path(path)
            text = file.read_text()
            for old, new in pairs:
              if old not in text:
                raise SystemExit(f'Marker missing in {path}: {old[:50]!r}')
              text = text.replace(old, new, 1)
            file.write_text(text)
      - name: Commit formatting alignment
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add \
            lib/features/matches/data/matches_repository.dart \
            lib/features/matches/presentation/matches_controller.dart \
            lib/features/matches/presentation/match_form_page.dart
          git diff --cached --quiet || git commit -m "Aligner le formatage des adresses sur la CI"
          git push origin HEAD:agent/opponent-default-addresses
