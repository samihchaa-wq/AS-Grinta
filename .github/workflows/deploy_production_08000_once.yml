name: Deploy production migration 08000 once

on:
  push:
    branches:
      - release/deploy-production-08000
    paths:
      - .github/workflows/deploy_production_08000_once.yml

permissions:
  contents: read

concurrency:
  group: supabase-production-deployment
  cancel-in-progress: false

env:
  SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
  SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
  SUPABASE_PROJECT_ID: ovzijmqrnsgcmryinkfa

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout merged production candidate
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Check deployment secrets
        shell: bash
        run: |
          set -euo pipefail
          test -n "${SUPABASE_ACCESS_TOKEN:-}"
          test -n "${SUPABASE_DB_PASSWORD:-}"

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@ab058987d8d6c725971f6cf9d0b5c98467e30bd1
        with:
          version: 2.111.0

      - name: Link production
        shell: bash
        run: |
          set -euo pipefail
          supabase link --project-ref "$SUPABASE_PROJECT_ID" --password "$SUPABASE_DB_PASSWORD"

      - name: Verify release candidate
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "8d5918296790f5977ae883de4b214e163c79baa6"
          test "$(find supabase/migrations -maxdepth 1 -type f -name '*.sql' -printf '%f\n' | sort | tail -n 1)" = "20260826008000_edit_convocation_launch.sql"
          supabase migration list | tee migration-before.txt
          supabase db push --password "$SUPABASE_DB_PASSWORD" --dry-run 2>&1 | tee dry-run.txt
          grep -q '20260826008000' dry-run.txt

      - name: Apply migration 08000
        shell: bash
        run: |
          set -euo pipefail
          supabase db push --password "$SUPABASE_DB_PASSWORD" --yes

      - name: Verify migration history
        shell: bash
        run: |
          set -euo pipefail
          supabase migration list | tee migration-after.txt
          grep -Eq '20260826008000[[:space:]]*\|[[:space:]]*20260826008000' migration-after.txt
