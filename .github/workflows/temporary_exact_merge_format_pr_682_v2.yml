name: Temporary exact merge formatter PR 682 v2

on:
  push:
    branches:
      - agent/match-temporality-notifications

permissions:
  contents: write

jobs:
  exact-merge-format:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: agent/match-temporality-notifications
          fetch-depth: 0

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Wait for matching PR merge ref and apply formatter output
        shell: bash
        run: |
          set -euo pipefail
          branch_sha="$(git rev-parse HEAD)"
          merge_sha=''

          for attempt in $(seq 1 30); do
            git fetch --force origin refs/pull/682/merge:refs/remotes/origin/pr-682-merge
            merge_sha="$(git rev-parse refs/remotes/origin/pr-682-merge)"
            merge_head="$(git rev-parse refs/remotes/origin/pr-682-merge^2)"
            echo "Attempt ${attempt}: merge=${merge_sha} head=${merge_head} branch=${branch_sha}"
            if [ "$merge_head" = "$branch_sha" ]; then
              break
            fi
            if [ "$attempt" -eq 30 ]; then
              echo 'PR merge ref did not catch up to branch head.' >&2
              exit 1
            fi
            sleep 2
          done

          files=(
            lib/features/notifications/presentation/notifications_page.dart
            lib/features/predictions/data/predictions_repository.dart
            lib/features/predictions/presentation/merged_matches_view.dart
            lib/features/sports_management/presentation/admin_squad_plan_page_state.dart
            lib/features/sports_management/presentation/match_lineup_page.dart
            test/exhaustive_prediction_state_space_test.dart
            test/match_weather_card_test.dart
          )

          git checkout --detach "$merge_sha"
          dart format "${files[@]}"
          tar -cf /tmp/formatted-pr-682.tar "${files[@]}"

          git checkout -B agent/match-temporality-notifications "$branch_sha"
          tar -xf /tmp/formatted-pr-682.tar
          git rm .github/workflows/temporary_exact_merge_format_pr_682_v2.yml

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "${files[@]}"
          git commit -m 'Apply exact formatter from current PR merge'
          git push origin HEAD:agent/match-temporality-notifications
