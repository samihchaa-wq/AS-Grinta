name: Temporary split calendar presentation

on:
  push:
    branches:
      - agent/split-calendar-presentation

permissions:
  contents: write

jobs:
  split:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/split-calendar-presentation
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Resolve locked dependencies
        run: flutter pub get --enforce-lockfile
      - name: Split calendar presentation
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('lib/features/matches/presentation/calendar_matches_view.dart')
          text = path.read_text()
          marker = '\nclass _CalendarToolbar extends StatelessWidget {'
          if text.count(marker) != 1:
              raise SystemExit(f'Expected one calendar toolbar marker, found {text.count(marker)}')

          prefix, tail = text.split(marker, 1)
          part = "part 'calendar_matches_widgets.dart';"
          if part not in prefix:
              enum_marker = '\nenum _CalendarDisplayMode'
              if prefix.count(enum_marker) != 1:
                  raise SystemExit('Calendar display mode marker is not unique')
              prefix = prefix.replace(enum_marker, f'\n{part}\n\nenum _CalendarDisplayMode', 1)

          path.write_text(prefix.rstrip() + '\n')
          widgets = Path('lib/features/matches/presentation/calendar_matches_widgets.dart')
          widgets.write_text(
              "part of 'calendar_matches_view.dart';\n\n"
              "class _CalendarToolbar extends StatelessWidget {" + tail
          )
          PY
          dart format \
            lib/features/matches/presentation/calendar_matches_view.dart \
            lib/features/matches/presentation/calendar_matches_widgets.dart
      - name: Commit split
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            lib/features/matches/presentation/calendar_matches_view.dart \
            lib/features/matches/presentation/calendar_matches_widgets.dart
          git commit -m "Split calendar presentation widgets"
          git push origin HEAD:agent/split-calendar-presentation
