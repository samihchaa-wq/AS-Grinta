name: Temporary fix effectif analysis

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  fix:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Apply focused analysis fixes
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          main_path = Path('lib/features/sports_management/presentation/admin_squad_plan_page.dart')
          main = main_path.read_text()
          main = main.replace(
              "part 'admin_squad_plan_page_composition_widgets.dart';\n",
              '',
          )
          main_path.write_text(main)

          state_path = Path('lib/features/sports_management/presentation/admin_squad_plan_page_state.dart')
          state = state_path.read_text()
          marker = 'class _AdminSquadPlanPageState extends ConsumerState<AdminSquadPlanPage> {\n'
          helper = (
              marker
              + '  void _updateState(VoidCallback callback) {\n'
              + '    setState(callback);\n'
              + '  }\n\n'
          )
          if 'void _updateState(VoidCallback callback)' not in state:
              if marker not in state:
                  raise SystemExit('State class marker not found')
              state = state.replace(marker, helper, 1)
          state_path.write_text(state)

          for relative in (
              'lib/features/sports_management/presentation/admin_squad_plan_page_composition.dart',
              'lib/features/sports_management/presentation/admin_squad_plan_page_effectif.dart',
          ):
              path = Path(relative)
              text = path.read_text().replace('setState(', '_updateState(')
              path.write_text(text)
          PY

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install locked dependencies
        run: flutter pub get --enforce-lockfile

      - name: Format all Dart files
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t files < <(git ls-files '*.dart')
          dart format "${files[@]}"
          dart format --output=none --set-exit-if-changed "${files[@]}"

      - name: Analyze with CI rules
        run: flutter analyze --fatal-warnings --fatal-infos

      - name: Commit verified fixes
        shell: bash
        run: |
          set -euo pipefail
          paths=(
            lib/features/sports_management/presentation/admin_squad_plan_page.dart
            lib/features/sports_management/presentation/admin_squad_plan_page_state.dart
            lib/features/sports_management/presentation/admin_squad_plan_page_composition.dart
            lib/features/sports_management/presentation/admin_squad_plan_page_effectif.dart
          )
          if git diff --quiet -- "${paths[@]}"; then
            echo 'Aucune correction restante.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- "${paths[@]}"
          git commit -m 'Corriger l’analyse du parcours effectif composition'
          git push origin "HEAD:${{ github.event.pull_request.head.ref }}"
