name: Temporary format match form

on:
  push:
    branches:
      - fix/align-match-edit-layout

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: fix/align-match-edit-layout
      - name: Setup Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
        with:
          channel: stable
          cache: true
      - name: Format and clean up helper workflow
        shell: bash
        run: |
          set -euo pipefail
          dart format lib/features/matches/presentation/match_form_page.dart
          rm .github/workflows/temporary-format-match-form.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/features/matches/presentation/match_form_page.dart .github/workflows/temporary-format-match-form.yml
          git commit -m "style(matches): format match form"
          git push origin HEAD:fix/align-match-edit-layout
