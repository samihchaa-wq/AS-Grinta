name: Temporary format probe

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  format-probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: Show exact formatter diff
        shell: bash
        run: |
          dart format \
            lib/features/matches/data/calendar_history_repository.dart \
            lib/features/matches/data/calendar_matches_local_cache.dart \
            lib/features/matches/presentation/matches_controller.dart \
            test/calendar_loading_dedup_contract_test.dart
          git diff -- \
            lib/features/matches/data/calendar_history_repository.dart \
            lib/features/matches/data/calendar_matches_local_cache.dart \
            lib/features/matches/presentation/matches_controller.dart \
            test/calendar_loading_dedup_contract_test.dart
