name: Temporary Dart format

on:
  push:
    branches:
      - feature/highlight-current-user-rows

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: feature/highlight-current-user-rows
          fetch-depth: 0

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Format changed files
        run: |
          dart format \
            lib/features/matches/presentation/match_details_page.dart \
            lib/features/predictions/presentation/pronos_hub_components.dart \
            lib/features/statistics/presentation/stats_hub_page.dart

      - name: Commit formatting
        run: |
          if git diff --quiet; then
            echo "Files already formatted."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            lib/features/matches/presentation/match_details_page.dart \
            lib/features/predictions/presentation/pronos_hub_components.dart \
            lib/features/statistics/presentation/stats_hub_page.dart
          git commit -m "Format current user row highlighting"
          git push origin HEAD:feature/highlight-current-user-rows
