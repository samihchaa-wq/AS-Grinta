name: Generate canonical schema baseline

on:
  push:
    branches: [rebuild/full-migration-history]
    paths: [.github/workflows/generate_schema_baseline.yml]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_PROJECT_ID: ovzijmqrnsgcmryinkfa
      PRISTINE_HISTORY_COMMIT: 7d3700cff30be4bac3a64e80c2b2b5ba0c92b691
    steps:
      - name: Checkout reconstruction branch
        uses: actions/checkout@v4
        with:
          ref: rebuild/full-migration-history
          fetch-depth: 0

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v2
        with:
          version: 2.111.0

      - name: Verify secrets
        shell: bash
        run: |
          set -euo pipefail
          test -n "${SUPABASE_ACCESS_TOKEN:-}"
          test -n "${SUPABASE_DB_PASSWORD:-}"

      - name: Restore pristine history and dump current app schema
        shell: bash
        run: |
          set -euo pipefail
          source supabase/production_migrations.lock

          # This immutable commit was produced by a successful linked fetch of
          # production's real migration history earlier in this reconstruction.
          # Reusing it removes a flaky network fetch without changing provenance.
          rm -rf /tmp/pristine-history
          mkdir -p /tmp/pristine-history
          git cat-file -e "${PRISTINE_HISTORY_COMMIT}^{commit}"
          git archive "$PRISTINE_HISTORY_COMMIT" supabase/migrations \
            | tar -x -C /tmp/pristine-history
          test -d /tmp/pristine-history/supabase/migrations

          rm -rf supabase/migrations_legacy_production
          mkdir -p supabase/migrations_legacy_production
          cp -a /tmp/pristine-history/supabase/migrations/. supabase/migrations_legacy_production/

          find supabase/migrations_legacy_production -maxdepth 1 -type f -name '*.sql' -printf '%f\n' \
            | sed -nE 's/^([0-9]{14})_.+\.sql$/\1/p' \
            | sort -u > /tmp/pristine-versions.txt
          count=$(wc -l < /tmp/pristine-versions.txt | tr -d ' ')
          latest=$(tail -n 1 /tmp/pristine-versions.txt)
          checksum=$(md5sum /tmp/pristine-versions.txt | awk '{print $1}')
          printf 'Pristine history: count=%s latest=%s md5=%s\n' "$count" "$latest" "$checksum"
          test "$count" = "$MIGRATION_COUNT"
          test "$latest" = "$LATEST_VERSION"
          test "$checksum" = "$VERSION_MD5"

          # Read only the current application-owned structure from production.
          # No DDL or data writes are sent to production by db dump.
          supabase link --project-ref "$SUPABASE_PROJECT_ID" --password "$SUPABASE_DB_PASSWORD"
          supabase db dump --linked --schema public,private --file /tmp/current_app_schema.sql
          test -s /tmp/current_app_schema.sql

          latest_file=$(find supabase/migrations_legacy_production -maxdepth 1 -type f -name "${LATEST_VERSION}_*.sql" | sort | head -n 1)
          test -n "$latest_file"
          latest_base=$(basename "$latest_file")

          rm -rf supabase/migrations
          mkdir -p supabase/migrations

          while IFS= read -r source_file; do
            base=$(basename "$source_file")
            version=${base%%_*}
            cat > "supabase/migrations/$base" <<EOF
          -- Historical production migration $version.
          -- Its pristine SQL is archived in supabase/migrations_legacy_production/$base.
          -- Fresh installations are built by the canonical baseline at $LATEST_VERSION.
          EOF
          done < <(find supabase/migrations_legacy_production -maxdepth 1 -type f -name '*.sql' | sort)

          cp /tmp/current_app_schema.sql "supabase/migrations/$latest_base"
          cat >> "supabase/migrations/$latest_base" <<'SQL'

          -- App-owned Storage configuration. The storage schema itself is managed
          -- by Supabase and already exists before application migrations run.
          insert into storage.buckets (id, name, public, file_size_limit, allowed_mime_types, type)
          values
            ('app-assets', 'app-assets', true, 10485760, array['image/png','image/jpeg','image/webp'], 'STANDARD'),
            ('badge-images', 'badge-images', true, 5242880, array['image/jpeg','image/png','image/webp'], 'STANDARD'),
            ('profile-photos', 'profile-photos', false, 5242880, array['image/jpeg','image/png','image/webp'], 'STANDARD')
          on conflict (id) do update set
            name = excluded.name,
            public = excluded.public,
            file_size_limit = excluded.file_size_limit,
            allowed_mime_types = excluded.allowed_mime_types,
            type = excluded.type;

          drop policy if exists "badge_images_admin_delete" on storage.objects;
          create policy "badge_images_admin_delete" on storage.objects for delete to authenticated
          using ((bucket_id = 'badge-images') and (select private.is_match_staff()));

          drop policy if exists "badge_images_admin_insert" on storage.objects;
          create policy "badge_images_admin_insert" on storage.objects for insert to authenticated
          with check ((bucket_id = 'badge-images') and (select private.is_match_staff()));

          drop policy if exists "badge_images_admin_update" on storage.objects;
          create policy "badge_images_admin_update" on storage.objects for update to authenticated
          using ((bucket_id = 'badge-images') and (select private.is_match_staff()))
          with check ((bucket_id = 'badge-images') and (select private.is_match_staff()));

          drop policy if exists "profile_photos_active_read" on storage.objects;
          create policy "profile_photos_active_read" on storage.objects for select to authenticated
          using ((bucket_id = 'profile-photos') and private.is_active_profile());

          drop policy if exists "profile_photos_admin_write" on storage.objects;
          create policy "profile_photos_admin_write" on storage.objects for all to authenticated
          using ((bucket_id = 'profile-photos') and (select private.is_admin()))
          with check ((bucket_id = 'profile-photos') and (select private.is_admin()));

          drop policy if exists "profile_photos_owner_delete" on storage.objects;
          create policy "profile_photos_owner_delete" on storage.objects for delete to authenticated
          using ((bucket_id = 'profile-photos') and (select private.is_active_profile()) and owner_id = (select auth.uid())::text);

          drop policy if exists "profile_photos_owner_insert" on storage.objects;
          create policy "profile_photos_owner_insert" on storage.objects for insert to authenticated
          with check ((bucket_id = 'profile-photos') and (select private.is_active_profile()) and owner_id = (select auth.uid())::text and (storage.foldername(name))[1] = (select auth.uid())::text);

          drop policy if exists "profile_photos_owner_update" on storage.objects;
          create policy "profile_photos_owner_update" on storage.objects for update to authenticated
          using ((bucket_id = 'profile-photos') and (select private.is_active_profile()) and owner_id = (select auth.uid())::text)
          with check ((bucket_id = 'profile-photos') and (select private.is_active_profile()) and owner_id = (select auth.uid())::text and (storage.foldername(name))[1] = (select auth.uid())::text);
          SQL

          # Never copy club/user/player/match/history rows to a new installation.
          # Only create the neutral singleton needed by club settings.
          cat >> "supabase/migrations/$latest_base" <<'SQL'

          insert into public.club_settings (id, home_address)
          values (true, null)
          on conflict (id) do nothing;
          SQL

          # The active migration inventory remains byte-for-byte identical at the
          # version level to production: 427 historical version numbers, same last.
          find supabase/migrations -maxdepth 1 -type f -name '*.sql' -printf '%f\n' \
            | sed -nE 's/^([0-9]{14})_.+\.sql$/\1/p' \
            | sort -u > /tmp/baseline-versions.txt
          test "$(wc -l < /tmp/baseline-versions.txt | tr -d ' ')" = "$MIGRATION_COUNT"
          test "$(tail -n 1 /tmp/baseline-versions.txt)" = "$LATEST_VERSION"
          test "$(md5sum /tmp/baseline-versions.txt | awk '{print $1}')" = "$VERSION_MD5"

      - name: Commit generated baseline
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add supabase/migrations supabase/migrations_legacy_production
          git diff --cached --quiet && exit 0
          git commit -m 'Replace broken replay chain with canonical production baseline'
          git push origin HEAD:rebuild/full-migration-history
