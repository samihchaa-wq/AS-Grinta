name: Temporary lockfile generator

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  generate-lockfile:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Flutter 3.47.0
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.0'
          channel: stable
          cache: true
      - name: Generate lockfile
        run: flutter pub get
      - name: Verify generated lockfile is enforceable
        run: flutter pub get --enforce-lockfile
      - name: Upload lockfile
        uses: actions/upload-artifact@v4
        with:
          name: generated-pubspec-lock
          path: pubspec.lock
          if-no-files-found: error
