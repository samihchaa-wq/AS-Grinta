name: Temporary realign internal composition reset

on:
  push:
    branches:
      - feat/internal-composition-reset
    paths:
      - .github/workflows/tmp_realign_internal_composition_reset.yml

permissions:
  contents: write

jobs:
  realign:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: feat/internal-composition-reset
          fetch-depth: 0
      - name: Merge current main and remove temporary workflow
        run: |
          set -euo pipefail
          git config user.name "samihchaa-wq"
          git config user.email "samihchaa@hotmail.com"
          git fetch origin main
          git merge --no-commit --no-ff origin/main
          rm .github/workflows/tmp_realign_internal_composition_reset.yml
          git add -A
          git commit -m "Merge current main into internal composition reset"
          git push origin HEAD:feat/internal-composition-reset
