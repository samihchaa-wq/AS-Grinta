name: Phase 4 autoformat

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  format-and-push:
    if: github.head_ref == 'visual/ui-overhaul-phase-4'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          token: ${{ github.token }}
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Resolve package language version
        run: flutter pub get --enforce-lockfile
      - name: Format and remove helper
        run: |
          dart format lib/features/predictions/presentation/merged_matches_view.dart
          rm .github/workflows/phase4_autofmt.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add lib/features/predictions/presentation/merged_matches_view.dart .github/workflows/phase4_autofmt.yml
          git commit -m "style: appliquer le formatage Dart du projet"
          git push origin HEAD:${{ github.head_ref }}
