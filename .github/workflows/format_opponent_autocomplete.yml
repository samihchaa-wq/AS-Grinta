name: Format opponent autocomplete

on:
  push:
    branches: [codex/opponent-autocomplete]

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: codex/opponent-autocomplete
          fetch-depth: 0

      - name: Setup Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
        with:
          channel: stable
          cache: true

      - name: Format target file
        run: dart format lib/features/matches/presentation/calendar_entry_form_page.dart

      - name: Commit formatter output
        shell: bash
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/features/matches/presentation/calendar_entry_form_page.dart
          git commit -m "Apply Dart formatter"
          git push origin HEAD:codex/opponent-autocomplete
