name: Temporary format PR 918

on:
  push:
    branches: [fix/live-action-confirmation]
    paths:
      - '.github/workflows/format_pr918_temp.yml'

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: fix/live-action-confirmation

      - name: Setup Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: stable
          cache: true

      - name: Format test with CI Dart SDK and remove this workflow
        shell: bash
        run: |
          set -euo pipefail
          dart format test/match_live_state_controller_test.dart
          rm .github/workflows/format_pr918_temp.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add test/match_live_state_controller_test.dart .github/workflows/format_pr918_temp.yml
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Format Live action confirmation test"
          git push origin HEAD:fix/live-action-confirmation
