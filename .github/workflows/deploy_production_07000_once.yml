name: Deploy production migration 07000 once

on:
  push:
    branches:
      - release/deploy-production-07000
    paths:
      - .github/workflows/deploy_production_07000_once.yml

permissions:
  contents: read

concurrency:
  group: supabase-production-deployment
  cancel-in-progress: false

env:
  SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
  SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
  SUPABASE_PROJECT_ID: ovzijmqrnsgcmryinkfa

jobs:
  deploy:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Check deployment secrets
        shell: bash
        run: |
          set -euo pipefail
          test -n "${SUPABASE_ACCESS_TOKEN:-}"
          test -n "${SUPABASE_DB_PASSWORD:-}"
      - uses: supabase/setup-cli@ab058987d8d6c725971f6cf9d0b5c98467e30bd1
        with:
          version: 2.111.0
      - name: Link production
        shell: bash
        run: |
          set -euo pipefail
          supabase link --project-ref "$SUPABASE_PROJECT_ID" --password "$SUPABASE_DB_PASSWORD"
      - name: Verify exactly one pending migration
        shell: bash
        run: |
          set -euo pipefail
          supabase migration list | tee migration-before.txt
          supabase db push --password "$SUPABASE_DB_PASSWORD" --dry-run | tee dry-run.txt
          grep -q '20260826007000' dry-run.txt
          if grep -q '20260826008000' dry-run.txt; then
            echo 'Unexpected 08000 migration in this release candidate.' >&2
            exit 1
          fi
      - name: Apply migration 07000
        shell: bash
        run: |
          set -euo pipefail
          supabase db push --password "$SUPABASE_DB_PASSWORD" --yes
      - name: Verify migration history
        shell: bash
        run: |
          set -euo pipefail
          supabase migration list | tee migration-after.txt
          grep -q '20260826007000' migration-after.txt
