name: Temporary fix guest contract

on:
  push:
    branches:
      - agent/clarify-effectif-publication

permissions:
  contents: write

concurrency:
  group: temporary-fix-guest-contract
  cancel-in-progress: true

jobs:
  fix:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: agent/clarify-effectif-publication
          fetch-depth: 0

      - name: Adapt guest test and remove workflow
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path('supabase/tests/database/sports_management_guests.test.sql')
          text = path.read_text()
          marker = """select is(
            public.admin_publish_match_composition(
              current_setting('test.guest_match')::uuid,
              false,
              'Publication avec invité'
            ) #>> '{version}',
          """
          insertion = """select is(
            public.admin_publish_match_effectif(
              current_setting('test.guest_match')::uuid,
              14,
              (
                select jsonb_agg(
                  jsonb_build_object(
                    'season_player_id', participant.season_player_id,
                    'status', 'convoked'
                  ) order by participant.season_player_id
                )
                from public.match_sport_participants participant
                where participant.match_id = current_setting('test.guest_match')::uuid
                  and participant.season_player_id is not null
                  and participant.availability_status = 'available'
              ),
              'Publication des convocations avec invité'
            ) #>> '{convocation_version}',
            '1',
            'les convocations sont publiées avant la composition avec invité'
          );

          select is(
            public.admin_publish_match_composition(
              current_setting('test.guest_match')::uuid,
              false,
              'Publication avec invité'
            ) #>> '{version}',
          """
          if insertion not in text:
              if text.count(marker) != 1:
                  raise SystemExit('Guest publication marker missing or ambiguous')
              text = text.replace(marker, insertion, 1)
              path.write_text(text)
          PY
          git rm -- .github/workflows/temporary_fix_guest_contract.yml

      - name: Commit correction
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A -- \
            supabase/tests/database/sports_management_guests.test.sql \
            .github/workflows/temporary_fix_guest_contract.yml
          git commit -m 'Adapter le test invité à la publication explicite'
          git push origin HEAD:agent/clarify-effectif-publication
