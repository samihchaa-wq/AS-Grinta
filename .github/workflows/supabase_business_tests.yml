name: Supabase business and RLS tests

on:
  pull_request:
    branches: [main]
    paths:
      - 'supabase/**'
      - '.github/workflows/supabase_business_tests.yml'
  push:
    branches: [main]
    paths:
      - 'supabase/**'
      - '.github/workflows/supabase_business_tests.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: supabase-business-tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  database-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Verify local database tools
        shell: bash
        run: |
          set -euo pipefail
          supabase --version
          supabase start --help > /dev/null
          supabase test db --help > /dev/null
          supabase db lint --help > /dev/null
          psql --version
          python3 --version

      - name: Verify Edge Function security contract
        shell: bash
        run: python3 supabase/tests/edge/verify_edge_security_contract.py

      - name: Setup Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Test push delivery resilience
        shell: bash
        run: deno test supabase/functions/send-push/delivery_policy_test.ts

      - name: Start isolated Supabase database
        shell: bash
        run: |
          set -o pipefail
          mv supabase/migrations supabase/migrations.full
          mkdir supabase/migrations
          restore_migrations() {
            rm -rf supabase/migrations
            mv supabase/migrations.full supabase/migrations
          }
          trap restore_migrations EXIT
          supabase start 2>&1 | tee supabase-start.log

      - name: Install current business schema
        shell: bash
        run: |
          set -o pipefail
          DB_URL='postgresql://postgres:postgres@127.0.0.1:54322/postgres'
          {
            psql "$DB_URL" -v ON_ERROR_STOP=1 \
              -f supabase/tests/bootstrap/current_business_schema.sql
            psql "$DB_URL" -v ON_ERROR_STOP=1 \
              -f supabase/tests/bootstrap/pgtap_like_compat.sql
            psql "$DB_URL" -v ON_ERROR_STOP=1 \
              -f supabase/tests/bootstrap/sports_notifications_push_schema.sql
            psql "$DB_URL" -v ON_ERROR_STOP=1 \
              -f supabase/migrations/20260711101000_register_push_subscription_rpc.sql
            psql "$DB_URL" -v ON_ERROR_STOP=1 \
              -f supabase/migrations/20260713222000_harden_personal_rpcs.sql
            psql "$DB_URL" -v ON_ERROR_STOP=1 \
              -f supabase/migrations/20260713225500_harden_staff_season_rpcs.sql
            psql "$DB_URL" -v ON_ERROR_STOP=1 \
              -f supabase/migrations/20260720030747_kickoff_prediction_and_match_atomicity.sql
            psql "$DB_URL" -v ON_ERROR_STOP=1 \
              -f supabase/migrations/20260720033749_integrity_backfill_and_staff_audit.sql
            psql "$DB_URL" -v ON_ERROR_STOP=1 \
              -f supabase/tests/bootstrap/security_hardening_pass_2_schema.sql
            psql "$DB_URL" -v ON_ERROR_STOP=1 \
              -f supabase/migrations/20260720110119_security_hardening_pass_2.sql
            psql "$DB_URL" -v ON_ERROR_STOP=1 \
              -f supabase/migrations/20260720123000_sports_management_feature_flag.sql
            psql "$DB_URL" -v ON_ERROR_STOP=1 \
              -f supabase/migrations/20260720131500_sports_management_availability_workflow.sql
            psql "$DB_URL" -v ON_ERROR_STOP=1 \
              -f supabase/migrations/20260720150000_sports_management_waitlist_rotation.sql
            psql "$DB_URL" -v ON_ERROR_STOP=1 \
              -f supabase/migrations/20260720151000_sports_management_waitlist_rotation_fixes.sql
            psql "$DB_URL" -v ON_ERROR_STOP=1 \
              -f supabase/migrations/20260720162500_sports_management_notification_scheduler_extensions.sql
            psql "$DB_URL" -v ON_ERROR_STOP=1 \
              -f supabase/migrations/20260720163000_sports_management_availability_notifications.sql
            psql "$DB_URL" -v ON_ERROR_STOP=1 \
              -f supabase/migrations/20260720163500_sports_management_availability_notification_rpc_grants.sql
            psql "$DB_URL" -v ON_ERROR_STOP=1 \
              -f supabase/migrations/20260720170000_sports_management_composition_server.sql
            psql "$DB_URL" -v ON_ERROR_STOP=1 \
              -f supabase/migrations/20260720174500_sports_management_guests.sql
            psql "$DB_URL" -v ON_ERROR_STOP=1 \
              -f supabase/migrations/20260720180000_sports_management_final_attendance_statistics.sql
            psql "$DB_URL" -v ON_ERROR_STOP=1 \
              -f supabase/migrations/20260720190000_sports_management_motm_vote.sql
            psql "$DB_URL" -v ON_ERROR_STOP=1 \
              -f supabase/migrations/20260720190500_sports_management_motm_vote_finalization_response.sql
            psql "$DB_URL" -v ON_ERROR_STOP=1 \
              -f supabase/migrations/20260720191000_sports_management_motm_vote_rpc_grants.sql
            psql "$DB_URL" -v ON_ERROR_STOP=1 \
              -f supabase/migrations/20260720213000_sports_management_motm_notifications.sql
            psql "$DB_URL" -v ON_ERROR_STOP=1 \
              -f supabase/migrations/20260720220000_sports_management_release_readiness.sql
            psql "$DB_URL" -v ON_ERROR_STOP=1 \
              -f supabase/migrations/20260721170424_unified_match_squad_plan.sql
            psql "$DB_URL" -v ON_ERROR_STOP=1 \
              -f supabase/migrations/20260723120000_motm_open_from_kickoff_and_ballot_detail.sql
            psql "$DB_URL" -v ON_ERROR_STOP=1 \
              -f supabase/migrations/20260723130000_fix_motm_enum_cast_and_match_delete.sql
            psql "$DB_URL" -v ON_ERROR_STOP=1 \
              -f supabase/migrations/20260724000000_admin_send_test_push.sql
            psql "$DB_URL" -v ON_ERROR_STOP=1 \
              -f supabase/migrations/20260724120000_match_address_and_opponent_memory.sql
            psql "$DB_URL" -v ON_ERROR_STOP=1 \
              -f supabase/migrations/20260724130000_match_address_home_team_memory.sql
            psql "$DB_URL" -v ON_ERROR_STOP=1 \
              -f supabase/tests/bootstrap/player_photo_cleanup_schema.sql
            psql "$DB_URL" -v ON_ERROR_STOP=1 \
              -f supabase/migrations/20260724060000_cleanup_replaced_photos_trigger.sql
            psql "$DB_URL" -v ON_ERROR_STOP=1 \
              -f supabase/migrations/20260725220000_complete_postmatch_composition_once.sql
            psql "$DB_URL" -v ON_ERROR_STOP=1 \
              -f supabase/migrations/20260725221500_grant_postmatch_composition_private_rpc.sql
            psql "$DB_URL" -v ON_ERROR_STOP=1 \
              -f supabase/migrations/20260725222000_allow_postmatch_publication_kind.sql
            psql "$DB_URL" -v ON_ERROR_STOP=1 \
              -f supabase/tests/bootstrap/statistics_rollover_schema.sql
            psql "$DB_URL" -v ON_ERROR_STOP=1 \
              -f supabase/migrations/20260726214500_fix_previous_season_rollover.sql
            # Cette migration durcit encore la signature historique à deux
            # paramètres. Elle doit donc être appliquée avant son remplacement.
            psql "$DB_URL" -v ON_ERROR_STOP=1 \
              -f supabase/migrations/20260727000100_restrict_public_definer_execution.sql
            psql "$DB_URL" -v ON_ERROR_STOP=1 \
              -f supabase/migrations/20260726200000_opponent_default_addresses.sql
            psql "$DB_URL" -v ON_ERROR_STOP=1 \
              -f supabase/tests/bootstrap/historical_match_scores_schema.sql
            psql "$DB_URL" -v ON_ERROR_STOP=1 \
              -f supabase/migrations/20260727002000_explicit_deny_rls_policies.sql
            psql "$DB_URL" -v ON_ERROR_STOP=1 \
              -f supabase/migrations/20260727024000_ensure_opponent_default_address_rpc.sql
            psql "$DB_URL" -v ON_ERROR_STOP=1 \
              -f supabase/tests/bootstrap/profile_badge_metrics_security_contract.sql
            psql "$DB_URL" -v ON_ERROR_STOP=1 \
              -f supabase/migrations/20260727024500_revoke_anon_public_definer_execution.sql
            psql "$DB_URL" -v ON_ERROR_STOP=1 \
              -f supabase/migrations/20260727030000_export_personal_data.sql
            psql "$DB_URL" -v ON_ERROR_STOP=1 \
              -f supabase/tests/bootstrap/enable_prediction_guard.sql
            psql "$DB_URL" -v ON_ERROR_STOP=1 \
              -f supabase/tests/bootstrap/live_effectif_security_contract.sql
            # Le verrou global couvre tout l'historique et sécurise les privilèges
            # par défaut. Les migrations suivantes doivent rester explicites.
            psql "$DB_URL" -v ON_ERROR_STOP=1 \
              -f supabase/migrations/20260727040000_lock_down_business_security_surface.sql
            psql "$DB_URL" -v ON_ERROR_STOP=1 \
              -f supabase/migrations/20260727040500_lock_down_future_object_defaults.sql
            psql "$DB_URL" -v ON_ERROR_STOP=1 \
              -f supabase/migrations/20260727050000_live_feature_flag_session_refresh.sql
            psql "$DB_URL" -v ON_ERROR_STOP=1 \
              -f supabase/migrations/20260727060000_push_delivery_resilience.sql
            psql "$DB_URL" -v ON_ERROR_STOP=1 \
              -f supabase/migrations/20260727070000_harden_admin_send_test_push_search_path.sql
            psql "$DB_URL" -v ON_ERROR_STOP=1 \
              -f supabase/migrations/20260728090000_effectif_draft_publication_contract.sql
            psql "$DB_URL" -v ON_ERROR_STOP=1 \
              -f supabase/migrations/20260728091000_unified_squad_plan_draft_contract.sql
            psql "$DB_URL" -v ON_ERROR_STOP=1 \
              -f supabase/migrations/20260728095000_sync_motm_workflow_after_finalization.sql
            psql "$DB_URL" -v ON_ERROR_STOP=1 \
              -f supabase/migrations/20260729123000_waitlist_history_counts.sql
            psql "$DB_URL" -v ON_ERROR_STOP=1 \
              -f supabase/migrations/20260729123500_grant_waitlist_history_enrich_execute.sql
            psql "$DB_URL" -v ON_ERROR_STOP=1 \
              -f supabase/migrations/20260729161500_manual_waitlist_count.sql
            psql "$DB_URL" -v ON_ERROR_STOP=1 \
              -f supabase/migrations/20260730044106_fix_prepare_deletion_effectif_draft_updated_by.sql
            psql "$DB_URL" -v ON_ERROR_STOP=1 \
              -f supabase/migrations/20260730044911_notifications_admin_kill_switch.sql
            psql "$DB_URL" -v ON_ERROR_STOP=1 \
              -f supabase/migrations/20260730044927_notify_admin_pending_signup.sql
            psql "$DB_URL" -v ON_ERROR_STOP=1 \
              -f supabase/migrations/20260730050000_open_test_push_to_all_players.sql
            psql "$DB_URL" -v ON_ERROR_STOP=1 \
              -f supabase/migrations/20260730060000_remove_personal_data_export.sql
            psql "$DB_URL" -v ON_ERROR_STOP=1 \
              -f supabase/migrations/20260730070000_atomic_match_create_update.sql
            psql "$DB_URL" -v ON_ERROR_STOP=1 \
              -f supabase/migrations/20260730080000_player_readable_sport_waitlist.sql
            psql "$DB_URL" -v ON_ERROR_STOP=1 \
              -f supabase/migrations/20260730153000_playful_manual_availability_reminder_copy.sql
            psql "$DB_URL" -v ON_ERROR_STOP=1 \
              -f supabase/migrations/20260730180000_venue_aware_odds_v6.sql
            psql "$DB_URL" -v ON_ERROR_STOP=1 \
              -f supabase/migrations/20260730190000_clamp_venue_aware_odds_v6.sql
            psql "$DB_URL" -v ON_ERROR_STOP=1 \
              -f supabase/tests/bootstrap/season_lifecycle_acl.sql
            psql "$DB_URL" -v ON_ERROR_STOP=1 \
              -f supabase/tests/bootstrap/match_delete_rpc_grants.sql
            psql "$DB_URL" -v ON_ERROR_STOP=1 \
              -f supabase/tests/bootstrap/grant_pgtap_test_helpers.sql
          } 2>&1 | tee supabase-schema.log

      - name: Run every pgTAP business and RLS test
        shell: bash
        run: |
          set -euo pipefail
          : > supabase-tests.log
          test_count=0
          while IFS= read -r test_file; do
            echo "::group::$test_file"
            supabase test db "$test_file" 2>&1 | tee -a supabase-tests.log
            echo "::endgroup::"
            test_count=$((test_count + 1))
          done < <(find supabase/tests/database -maxdepth 1 -type f -name '*.test.sql' -print | sort)
          if [ "$test_count" -eq 0 ]; then
            echo 'Aucun test Supabase trouvé.' >&2
            exit 1
          fi
          echo "Tests Supabase exécutés : $test_count"

      - name: Lint database functions
        shell: bash
        run: |
          set -o pipefail
          supabase db lint --level error 2>&1 | tee supabase-lint.log

      - name: Upload database diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: supabase-business-test-logs
          path: |
            supabase-start.log
            supabase-schema.log
            supabase-tests.log
            supabase-lint.log
          if-no-files-found: warn

      - name: Stop isolated Supabase stack
        if: always()
        shell: bash
        run: supabase stop || true