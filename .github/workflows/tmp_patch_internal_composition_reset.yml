name: Temporary patch internal composition reset

on:
  push:
    branches:
      - feat/internal-composition-reset
    paths:
      - .github/workflows/tmp_patch_internal_composition_reset.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: feat/internal-composition-reset
      - name: Apply targeted reset-button patch
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('lib/features/sports_management/presentation/widgets/internal_team_composition_view.dart')
          text = path.read_text()

          old = "  Future<void> _save() async {\n"
          new = "  Future<void> _save({\n    String successMessage = 'Composition enregistrée.',\n  }) async {\n"
          if old not in text:
              raise SystemExit('save signature marker not found')
          text = text.replace(old, new, 1)

          old = """      ScaffoldMessenger.of(\n        context,\n      ).showSnackBar(const SnackBar(content: Text('Composition enregistrée.')));\n"""
          new = """      ScaffoldMessenger.of(\n        context,\n      ).showSnackBar(SnackBar(content: Text(successMessage)));\n"""
          if old not in text:
              raise SystemExit('success snackbar marker not found')
          text = text.replace(old, new, 1)

          marker = "  @override\n  Widget build(BuildContext context) {\n"
          method = """  Future<void> _resetComposition() async {\n    final entries = _entries;\n    if (entries == null ||\n        _saving ||\n        !entries.any((entry) => entry.teamNo != null)) {\n      return;\n    }\n\n    final confirmed = await showDialog<bool>(\n      context: context,\n      builder: (context) => AlertDialog(\n        title: const Text('Réinitialiser les compositions ?'),\n        content: const Text(\n          'Tous les joueurs des deux équipes seront remis dans '\n          '« Non affectés ». Les noms d’équipe et les maillots seront conservés.',\n        ),\n        actions: [\n          TextButton(\n            onPressed: () => Navigator.of(context).pop(false),\n            child: const Text('Annuler'),\n          ),\n          FilledButton(\n            onPressed: () => Navigator.of(context).pop(true),\n            child: const Text('Réinitialiser'),\n          ),\n        ],\n      ),\n    );\n    if (confirmed != true || !mounted) return;\n\n    setState(() {\n      for (var index = 0; index < entries.length; index += 1) {\n        entries[index] = entries[index].copyWith(clearTeam: true);\n      }\n      _selectedParticipantId = null;\n      _dirty = true;\n    });\n\n    await _save(successMessage: 'Compositions remises à zéro.');\n  }\n\n"""
          if marker not in text:
              raise SystemExit('build marker not found')
          text = text.replace(marker, method + marker, 1)

          old = """        final team2 = entries.where((e) => e.teamNo == 2).toList();\n        final profiles = profilesAsync.valueOrNull;\n"""
          new = """        final team2 = entries.where((e) => e.teamNo == 2).toList();\n        final hasAssignedPlayers = team1.isNotEmpty || team2.isNotEmpty;\n        final profiles = profilesAsync.valueOrNull;\n"""
          if old not in text:
              raise SystemExit('team list marker not found')
          text = text.replace(old, new, 1)

          old = """            if (widget.editable) ...[\n              const SizedBox(height: 16),\n              FilledButton.icon(\n                onPressed: _saving ? null : _save,\n"""
          new = """            if (widget.editable) ...[\n              const SizedBox(height: 16),\n              OutlinedButton.icon(\n                onPressed: _saving || !hasAssignedPlayers\n                    ? null\n                    : _resetComposition,\n                icon: const Icon(Icons.restart_alt_rounded),\n                label: const Text('Réinitialiser'),\n              ),\n              const SizedBox(height: 8),\n              FilledButton.icon(\n                onPressed: _saving ? null : () => _save(),\n"""
          if old not in text:
              raise SystemExit('save button marker not found')
          text = text.replace(old, new, 1)

          path.write_text(text)
          PY
          rm .github/workflows/tmp_patch_internal_composition_reset.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add lib/features/sports_management/presentation/widgets/internal_team_composition_view.dart .github/workflows/tmp_patch_internal_composition_reset.yml
          git commit -m "Add reset action to internal compositions"
          git push origin HEAD:feat/internal-composition-reset
