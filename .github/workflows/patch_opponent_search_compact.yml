name: Patch opponent search compact left

on:
  push:
    branches: [fix/opponent-search-compact-left]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: fix/opponent-search-compact-left
          fetch-depth: 0

      - name: Remove search icon and tighten left padding
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('lib/features/matches/presentation/calendar_entry_form_page.dart')
          text = path.read_text()
          old = """                        decoration: const InputDecoration(\n                          hintText: 'Rechercher un adversaire',\n                          prefixIcon: Icon(Icons.search_rounded),\n                        ),\n"""
          new = """                        decoration: const InputDecoration(\n                          hintText: 'Rechercher...',\n                          contentPadding: EdgeInsets.symmetric(\n                            horizontal: 12,\n                            vertical: 16,\n                          ),\n                        ),\n"""
          if old not in text:
              raise SystemExit('Expected opponent search decoration not found')
          path.write_text(text.replace(old, new, 1))
          PY

      - name: Remove temporary workflow
        run: rm .github/workflows/patch_opponent_search_compact.yml

      - name: Commit patch
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/features/matches/presentation/calendar_entry_form_page.dart .github/workflows/patch_opponent_search_compact.yml
          git commit -m "Remove opponent search icon and align left"
          git push origin HEAD:fix/opponent-search-compact-left