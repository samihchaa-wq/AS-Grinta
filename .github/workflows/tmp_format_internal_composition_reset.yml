name: Temporary targeted Dart formatter

on:
  push:
    branches:
      - feat/internal-composition-reset
    paths:
      - .github/workflows/tmp_format_internal_composition_reset.yml

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: feat/internal-composition-reset
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
        with:
          channel: stable
          cache: true
      - name: Format only reset feature files
        run: |
          set -euo pipefail
          flutter pub get --enforce-lockfile
          dart format \
            lib/features/sports_management/presentation/widgets/internal_team_composition_view.dart \
            test/internal_team_composition_reset_test.dart
          rm .github/workflows/tmp_format_internal_composition_reset.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add \
            lib/features/sports_management/presentation/widgets/internal_team_composition_view.dart \
            test/internal_team_composition_reset_test.dart \
            .github/workflows/tmp_format_internal_composition_reset.yml
          git commit -m "Format internal composition reset changes"
          git push origin HEAD:feat/internal-composition-reset
