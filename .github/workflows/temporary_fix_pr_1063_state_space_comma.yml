name: Temporary PR 1063 state-space syntax fix

on:
  push:
    branches:
      - fix/canonical-server-match-odds

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: fix/canonical-server-match-odds

      - name: Fix state-space assertion syntax
        shell: bash
        run: |
          python3 -c "from pathlib import Path; p=Path('supabase/tests/database/exhaustive_match_lifecycle_state_space.test.sql'); t=p.read_text(); old=\"              and v_date between date '2000-01-01' and date '2100-12-31'\\n            v_ok,v_state,v_message);\"; new=\"              and v_date between date '2000-01-01' and date '2100-12-31',\\n            v_ok,v_state,v_message);\"; assert t.count(old)==1; p.write_text(t.replace(old,new))"
          git add supabase/tests/database/exhaustive_match_lifecycle_state_space.test.sql
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Fix canonical odds state-space syntax'
          git push origin HEAD:fix/canonical-server-match-odds
