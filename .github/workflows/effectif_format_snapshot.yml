name: Effectif format snapshot

on:
  push:
    branches:
      - agent/clarify-effectif-publication

permissions:
  contents: read

concurrency:
  group: effectif-format-snapshot
  cancel-in-progress: true

jobs:
  format-snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: agent/clarify-effectif-publication

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install locked dependencies
        run: flutter pub get --enforce-lockfile

      - name: Reproduce global formatter
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t files < <(git ls-files '*.dart')
          dart format "${files[@]}"

      - name: Collect target files
        run: |
          mkdir -p snapshot/lib/features/sports_management/presentation snapshot/test
          cp lib/features/sports_management/presentation/admin_squad_plan_page_composition.dart \
            snapshot/lib/features/sports_management/presentation/
          cp lib/features/sports_management/presentation/admin_squad_plan_page_effectif.dart \
            snapshot/lib/features/sports_management/presentation/
          cp test/effectif_publication_contract_test.dart snapshot/test/

      - name: Upload snapshot
        uses: actions/upload-artifact@v4
        with:
          name: effectif-format-snapshot
          path: snapshot
          if-no-files-found: error
