name: Dispatch calendar-fix CI

on:
  push:
    branches: [agent/trigger-calendar-fix-ci]

permissions:
  actions: write
  contents: read

jobs:
  dispatch-required-checks:
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch official validation workflows on clean fix branch
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_REF: agent/fix-calendar-back-position-clean
        run: |
          set -euo pipefail
          for workflow in flutter_ci.yml runtime_diagnostic.yml; do
            curl -LfsS \
              -X POST \
              -H "Accept: application/vnd.github+json" \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/workflows/${workflow}/dispatches" \
              -d "{\"ref\":\"${TARGET_REF}\"}"
          done
