name: Format audit branch

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  format:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Format changed Dart files
        run: |
          dart format \
            lib/features/auth/presentation/auth_loading_page.dart \
            lib/features/predictions/data/season_predictions_repository.dart \
            lib/features/predictions/presentation/season_prediction_entry_page.dart \
            test/auth_redirect_test.dart \
            test/full_schema_replay_diagnostic_contract_test.dart
      - name: Package formatted files
        run: |
          tar -czf formatted-audit-files.tar.gz \
            lib/features/auth/presentation/auth_loading_page.dart \
            lib/features/predictions/data/season_predictions_repository.dart \
            lib/features/predictions/presentation/season_prediction_entry_page.dart \
            test/auth_redirect_test.dart \
            test/full_schema_replay_diagnostic_contract_test.dart
      - uses: actions/upload-artifact@v4
        with:
          name: formatted-audit-files
          path: formatted-audit-files.tar.gz
