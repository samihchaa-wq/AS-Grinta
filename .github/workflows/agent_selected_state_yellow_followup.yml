name: Agent selected state patch

'on':
  push:
    branches:
      - agent/selected-state-yellow-followup

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/selected-state-yellow-followup
          fetch-depth: 0

      - name: Patch selected colors
        run: |
          sed -i 's/? Colors.white/? AppTheme.accent/' lib/core/widgets/grinta_secondary_tabs.dart
          python3 -c "from pathlib import Path; p=Path('lib/features/matches/presentation/calendar_entry_form_page.dart'); s=p.read_text(); old='    if (selected) {\n      return FilledButton(\n        style: style,\n'; new='    if (selected) {\n      return FilledButton(\n        style: style.copyWith(\n          foregroundColor: WidgetStatePropertyAll(\n            Theme.of(context).colorScheme.secondary,\n          ),\n        ),\n'; assert old in s; p.write_text(s.replace(old,new,1))"

      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm .github/workflows/agent_selected_state_yellow_followup.yml
          git add -A
          git commit -m "Extend club yellow to secondary selections"
          git push origin HEAD:agent/selected-state-yellow-followup
