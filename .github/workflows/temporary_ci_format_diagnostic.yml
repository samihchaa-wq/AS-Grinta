name: Temporary CI format diagnostic

on:
  push:
    branches:
      - feature/highlight-current-user-rows

permissions:
  contents: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: feature/highlight-current-user-rows
          fetch-depth: 0

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Reproduce PR formatting check
        shell: bash
        run: |
          set +e
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main refs/pull/482/merge:refs/remotes/origin/pr-482-merge
          git checkout --detach refs/remotes/origin/pr-482-merge
          range="origin/main...HEAD"
          mapfile -t files < <(git diff --name-only --diff-filter=ACMR "$range" -- '*.dart')
          status_file=/tmp/ci-format-status.txt
          patch_file=/tmp/ci-format.patch
          {
            echo "head=$(git rev-parse HEAD)"
            echo "main=$(git rev-parse origin/main)"
            echo "range=$range"
            printf 'file=%s\n' "${files[@]}"
          } > "$status_file"
          dart format --output=none --set-exit-if-changed "${files[@]}" >> "$status_file" 2>&1
          check_status=$?
          echo "check_status=$check_status" >> "$status_file"
          dart format "${files[@]}" >> "$status_file" 2>&1
          echo "format_status=$?" >> "$status_file"
          git diff -- "${files[@]}" > "$patch_file"
          git checkout feature/highlight-current-user-rows
          cp "$status_file" .github/tmp_ci_format_status.txt
          cp "$patch_file" .github/tmp_ci_format.patch
          git add .github/tmp_ci_format_status.txt .github/tmp_ci_format.patch
          git commit -m "Record CI format diagnostic"
          git push origin HEAD:feature/highlight-current-user-rows
