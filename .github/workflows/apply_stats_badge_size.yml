name: Apply larger Statistics badges

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  resize-badges:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR head
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Apply Statistics badge sizing
        shell: python
        run: |
          from pathlib import Path

          def replace_once(path_str, old, new):
              path = Path(path_str)
              text = path.read_text()
              if old not in text:
                  raise SystemExit(f'Expected block not found in {path_str}:\n{old}')
              path.write_text(text.replace(old, new, 1))

          replace_once(
              'lib/features/statistics/presentation/stats_hub_page.dart',
              'badgeSize: 22,',
              'badgeSize: 28,',
          )
          replace_once(
              'lib/features/predictions/presentation/pronos_hub_page.dart',
              'badgeSize: 22,',
              'badgeSize: 28,',
          )
          replace_once(
              'lib/features/predictions/presentation/season_prediction_entry_page.dart',
              'badgeSize: widget.embedded ? 22 : null,',
              'badgeSize: widget.embedded ? 28 : null,',
          )
          replace_once(
              'lib/features/predictions/presentation/scorer_dashboard_page.dart',
              'badgeSize: embedded ? 22 : null,',
              'badgeSize: embedded ? 28 : null,',
          )

          path = Path('lib/features/predictions/presentation/scorer_dashboard_page.dart')
          text = path.read_text()
          old = '''                _GaugeSection(\n                  title: 'Buteurs',\n                  icon: Icons.sports_soccer,\n                  gauges: scorers,\n                  scaleMax: _scale(scorers, 20),\n                  currentUserId: currentUserId,'''
          new = '''                _GaugeSection(\n                  title: 'Buteurs',\n                  icon: Icons.sports_soccer,\n                  gauges: scorers,\n                  scaleMax: _scale(scorers, 20),\n                  currentUserId: currentUserId,\n                  badgeSize: embedded ? 112 : 88,'''
          if old not in text:
              raise SystemExit('Buteurs GaugeSection block not found')
          text = text.replace(old, new, 1)
          old = '''                _GaugeSection(\n                  title: 'Clean sheets',\n                  icon: Icons.sports_handball_outlined,\n                  gauges: keepers,\n                  scaleMax: _scale(keepers, 15),\n                  currentUserId: currentUserId,'''
          new = '''                _GaugeSection(\n                  title: 'Clean sheets',\n                  icon: Icons.sports_handball_outlined,\n                  gauges: keepers,\n                  scaleMax: _scale(keepers, 15),\n                  currentUserId: currentUserId,\n                  badgeSize: embedded ? 112 : 88,'''
          if old not in text:
              raise SystemExit('Clean sheets GaugeSection block not found')
          text = text.replace(old, new, 1)
          old = '''    required this.scaleMax,\n    required this.currentUserId,\n    required this.onOpen,'''
          new = '''    required this.scaleMax,\n    required this.currentUserId,\n    required this.badgeSize,\n    required this.onOpen,'''
          if old not in text:
              raise SystemExit('GaugeSection constructor block not found')
          text = text.replace(old, new, 1)
          old = '''  final int scaleMax;\n  final String? currentUserId;\n  final ValueChanged<PlayerGauge> onOpen;'''
          new = '''  final int scaleMax;\n  final String? currentUserId;\n  final double badgeSize;\n  final ValueChanged<PlayerGauge> onOpen;'''
          if old not in text:
              raise SystemExit('GaugeSection fields block not found')
          text = text.replace(old, new, 1)
          old = '''              personalPrediction: gauge.predictionFor(currentUserId)?.value,\n              onTap: () => onOpen(gauge),'''
          new = '''              personalPrediction: gauge.predictionFor(currentUserId)?.value,\n              badgeSize: badgeSize,\n              onTap: () => onOpen(gauge),'''
          if old not in text:
              raise SystemExit('ReferencePlayerGaugeCard call block not found')
          text = text.replace(old, new, 1)
          path.write_text(text)

          path = Path('lib/features/predictions/presentation/widgets/reference_player_gauge_card.dart')
          text = path.read_text()
          replacements = [
              (
                  '''    required this.personalPrediction,\n    required this.onTap,\n  });''',
                  '''    required this.personalPrediction,\n    this.badgeSize = 88,\n    required this.onTap,\n  });''',
              ),
              (
                  '''  final int? personalPrediction;\n  final VoidCallback onTap;''',
                  '''  final int? personalPrediction;\n  final double badgeSize;\n  final VoidCallback onTap;''',
              ),
              (
                  '''                  personalPrediction: personalPrediction,\n                ),''',
                  '''                  personalPrediction: personalPrediction,\n                  badgeSize: badgeSize,\n                ),''',
              ),
              (
                  '''    required this.personalPrediction,\n  });\n\n  final PlayerGauge gauge;\n  final int scaleMax;\n  final int? personalPrediction;''',
                  '''    required this.personalPrediction,\n    required this.badgeSize,\n  });\n\n  final PlayerGauge gauge;\n  final int scaleMax;\n  final int? personalPrediction;\n  final double badgeSize;''',
              ),
              (
                  '''              profileId: gauge.profileId,\n              isGoalkeeper: gauge.isGoalkeeper,\n            ),''',
                  '''              profileId: gauge.profileId,\n              isGoalkeeper: gauge.isGoalkeeper,\n              badgeSize: badgeSize,\n            ),''',
              ),
              (
                  '''    required this.profileId,\n    required this.isGoalkeeper,\n  });''',
                  '''    required this.profileId,\n    required this.isGoalkeeper,\n    required this.badgeSize,\n  });''',
              ),
              (
                  '''  final String? profileId;\n  final bool isGoalkeeper;''',
                  '''  final String? profileId;\n  final bool isGoalkeeper;\n  final double badgeSize;''',
              ),
              (
                  '''          _GaugeBadgeChip(badge: badge, size: 88),''',
                  '''          _GaugeBadgeChip(badge: badge, size: badgeSize),''',
              ),
          ]
          for old, new in replacements:
              if old not in text:
                  raise SystemExit(f'Reference gauge block not found:\n{old}')
              text = text.replace(old, new, 1)
          path.write_text(text)

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get --enforce-lockfile

      - name: Format changed Dart files
        run: dart format lib/features/statistics/presentation/stats_hub_page.dart lib/features/predictions/presentation/pronos_hub_page.dart lib/features/predictions/presentation/season_prediction_entry_page.dart lib/features/predictions/presentation/scorer_dashboard_page.dart lib/features/predictions/presentation/widgets/reference_player_gauge_card.dart

      - name: Commit badge resizing
        shell: bash
        env:
          HEAD_BRANCH: ${{ github.head_ref }}
        run: |
          set -euo pipefail
          git add lib/features/statistics/presentation/stats_hub_page.dart \
            lib/features/predictions/presentation/pronos_hub_page.dart \
            lib/features/predictions/presentation/season_prediction_entry_page.dart \
            lib/features/predictions/presentation/scorer_dashboard_page.dart \
            lib/features/predictions/presentation/widgets/reference_player_gauge_card.dart
          if git diff --cached --quiet; then
            echo "Aucune modification à committer."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Agrandit tous les badges du module Statistiques"
          git push origin "HEAD:${HEAD_BRANCH}"
