name: Restore production migration history

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/restore_production_migration_history.yml'
      - '.github/workflows/migration_inventory.yml'

permissions:
  contents: write

jobs:
  restore:
    if: startsWith(github.head_ref, 'rebuild/full-migration-history')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_PROJECT_ID: ovzijmqrnsgcmryinkfa
    steps:
      - name: Checkout reconstruction branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Stop when production history is already restored
        id: marker
        shell: bash
        run: |
          if [ -f supabase/migrations_legacy_synthetic/.production_history_fetched ]; then
            echo 'done=true' >> "$GITHUB_OUTPUT"
          else
            echo 'done=false' >> "$GITHUB_OUTPUT"
          fi

      - name: Setup Supabase CLI
        if: steps.marker.outputs.done != 'true'
        uses: supabase/setup-cli@v2
        with:
          version: 2.111.0

      - name: Verify secrets
        if: steps.marker.outputs.done != 'true'
        shell: bash
        run: |
          set -euo pipefail
          test -n "${SUPABASE_ACCESS_TOKEN:-}"
          test -n "${SUPABASE_DB_PASSWORD:-}"

      - name: Archive synthetic history and fetch the applied production history
        if: steps.marker.outputs.done != 'true'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p supabase/migrations_legacy_synthetic
          find supabase/migrations -maxdepth 1 -type f -name '*.sql' -exec mv -t supabase/migrations_legacy_synthetic {} +
          supabase link --project-ref "$SUPABASE_PROJECT_ID" --password "$SUPABASE_DB_PASSWORD"
          supabase migration fetch --linked
          touch supabase/migrations_legacy_synthetic/.production_history_fetched

      - name: Verify fetched inventory against production lock
        if: steps.marker.outputs.done != 'true'
        shell: bash
        run: |
          set -euo pipefail
          source supabase/production_migrations.lock
          find supabase/migrations -maxdepth 1 -type f -name '*.sql' -printf '%f\n' \
            | sed -nE 's/^([0-9]{14})_.+\.sql$/\1/p' \
            | sort -u > /tmp/fetched-versions.txt
          count=$(wc -l < /tmp/fetched-versions.txt | tr -d ' ')
          latest=$(tail -n 1 /tmp/fetched-versions.txt)
          checksum=$(md5sum /tmp/fetched-versions.txt | awk '{print $1}')
          printf 'Fetched count=%s latest=%s md5=%s\n' "$count" "$latest" "$checksum"
          test "$count" = "$MIGRATION_COUNT"
          test "$latest" = "$LATEST_VERSION"
          test "$checksum" = "$VERSION_MD5"

      - name: Commit the real production history
        if: steps.marker.outputs.done != 'true'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add supabase/migrations supabase/migrations_legacy_synthetic
          if git diff --cached --quiet; then
            echo 'No migration history change to commit.'
            exit 0
          fi
          git commit -m 'Restaurer l’historique Supabase réellement appliqué'
          git push origin "HEAD:${GITHUB_HEAD_REF}"
