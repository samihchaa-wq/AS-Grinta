name: Temporary match meeting patch

on:
  push:
    branches: [feat/match-meeting-time]
    paths:
      - '.github/workflows/tmp_match_meeting_patch.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: feat/match-meeting-time
          fetch-depth: 0
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: stable
          cache: true
      - name: Patch application wiring
        shell: bash
        run: |
          cat > /tmp/patch_meeting.py <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              file = Path(path)
              text = file.read_text()
              count = text.count(old)
              if count != 1:
                  raise RuntimeError(f'{path}: expected one occurrence, found {count}: {old[:100]!r}')
              file.write_text(text.replace(old, new, 1))

          # Match model.
          p = 'lib/features/matches/domain/match_model.dart'
          replace_once(p,
              "import 'package:as_grinta/core/utils/match_window.dart';\n",
              "import 'package:as_grinta/core/utils/match_window.dart';\nimport 'package:as_grinta/features/matches/domain/match_meeting.dart';\n")
          replace_once(p,
              "    this.address,\n    this.matchType = 'championnat',",
              "    this.address,\n    this.meetingAt,\n    this.matchType = 'championnat',")
          replace_once(p,
              "  /// Adresse du lieu de la rencontre (facultative).\n  final String? address;\n\n  /// « amical »",
              "  /// Adresse du lieu de la rencontre (facultative).\n  final String? address;\n\n  /// Heure de rendez-vous explicite. NULL = 30 min avant le coup d’envoi.\n  final DateTime? meetingAt;\n\n  DateTime get effectiveMeetingAt => resolvedMatchMeetingAt(\n        kickoffAt: kickoffAt,\n        customMeetingAt: meetingAt,\n      );\n\n  /// « amical »")
          replace_once(p,
              "      address: (json['address']?.toString().trim().isNotEmpty ?? false)\n          ? json['address'].toString()\n          : null,\n      matchType:",
              "      address: (json['address']?.toString().trim().isNotEmpty ?? false)\n          ? json['address'].toString()\n          : null,\n      meetingAt: DateTime.tryParse(\n        '${json['meeting_at'] ?? ''}',\n      )?.toLocal(),\n      matchType:")

          # Local calendar cache.
          p = 'lib/features/matches/data/calendar_matches_local_cache.dart'
          replace_once(p,
              "      'kickoff_at': match.kickoffAt.toUtc().toIso8601String(),\n      'location':",
              "      'kickoff_at': match.kickoffAt.toUtc().toIso8601String(),\n      'meeting_at': match.meetingAt?.toUtc().toIso8601String(),\n      'location':")

          # Scheduled creation repository.
          p = 'lib/features/matches/data/scheduled_match_creation_repository.dart'
          replace_once(p,
              "    DateTime? customLaunchAt,\n    int? squadSizeLimit,",
              "    DateTime? customLaunchAt,\n    DateTime? meetingAt,\n    int? squadSizeLimit,")
          replace_once(p,
              "      'admin_create_match_complete_v2',",
              "      'admin_create_match_complete_v3',")
          replace_once(p,
              "        'p_availability_opens_at': launchMode == ConvocationLaunchMode.custom\n            ? customLaunchAt?.toUtc().toIso8601String()\n            : null,\n      },",
              "        'p_availability_opens_at': launchMode == ConvocationLaunchMode.custom\n            ? customLaunchAt?.toUtc().toIso8601String()\n            : null,\n        'p_meeting_at': meetingAt?.toUtc().toIso8601String(),\n      },")
          replace_once(p,
              "    DateTime? customLaunchAt,\n    String? address,\n  }) async {\n    final result = await _client.rpc(\n      'create_internal_match_v2',",
              "    DateTime? customLaunchAt,\n    DateTime? meetingAt,\n    String? address,\n  }) async {\n    final result = await _client.rpc(\n      'create_internal_match_v3',")
          # Second availability block belongs to internal creation.
          old = "        'p_availability_opens_at': launchMode == ConvocationLaunchMode.custom\n            ? customLaunchAt?.toUtc().toIso8601String()\n            : null,\n      },"
          new = "        'p_availability_opens_at': launchMode == ConvocationLaunchMode.custom\n            ? customLaunchAt?.toUtc().toIso8601String()\n            : null,\n        'p_meeting_at': meetingAt?.toUtc().toIso8601String(),\n      },"
          replace_once(p, old, new)

          # Main repository and all legacy controller paths.
          p = 'lib/features/matches/data/matches_repository.dart'
          replace_once(p,
              "      kickoff_at,\n      location,",
              "      kickoff_at,\n      meeting_at,\n      location,")
          replace_once(p,
              "    int? squadSizeLimit,\n    String? address,\n    bool rememberAddressAsDefault = false,\n    String matchType = 'championnat',\n    String? jerseyNote,\n  }) async {\n    final result = await _client.rpc(\n      'admin_create_match_complete',",
              "    int? squadSizeLimit,\n    String? address,\n    bool rememberAddressAsDefault = false,\n    String matchType = 'championnat',\n    String? jerseyNote,\n    DateTime? meetingAt,\n  }) async {\n    final result = await _client.rpc(\n      'admin_create_match_complete_v3',")
          replace_once(p,
              "        'p_match_type': matchType,\n        'p_jersey_note': jerseyNote,\n      },\n    );\n    if (result == null",
              "        'p_match_type': matchType,\n        'p_jersey_note': jerseyNote,\n        'p_availability_schedule_mode': 'automatic',\n        'p_availability_opens_at': null,\n        'p_meeting_at': meetingAt?.toUtc().toIso8601String(),\n      },\n    );\n    if (result == null")
          replace_once(p,
              "  Future<String> createInternalMatch({\n    required String seasonId,\n    required DateTime kickoffAt,\n    String? address,\n  }) async {\n    final result = await _client.rpc(\n      'create_internal_match',",
              "  Future<String> createInternalMatch({\n    required String seasonId,\n    required DateTime kickoffAt,\n    String? address,\n    DateTime? meetingAt,\n  }) async {\n    final result = await _client.rpc(\n      'create_internal_match_v3',")
          replace_once(p,
              "        'p_match_time': _formatTime(kickoffAt),\n        'p_address': address,\n      },\n    );\n    if (result == null",
              "        'p_match_time': _formatTime(kickoffAt),\n        'p_address': address,\n        'p_availability_schedule_mode': 'automatic',\n        'p_availability_opens_at': null,\n        'p_meeting_at': meetingAt?.toUtc().toIso8601String(),\n      },\n    );\n    if (result == null")
          replace_once(p,
              "    required DateTime expectedUpdatedAt,\n    String? address,\n  }) async {\n    final result = await _client.rpc(\n      'update_internal_match',",
              "    required DateTime expectedUpdatedAt,\n    String? address,\n    DateTime? meetingAt,\n  }) async {\n    final result = await _client.rpc(\n      'update_internal_match_v2',")
          replace_once(p,
              "        'p_address': address,\n        'p_expected_updated_at': expectedUpdatedAt.toUtc().toIso8601String(),\n      },\n    );\n    if (result != true)",
              "        'p_address': address,\n        'p_expected_updated_at': expectedUpdatedAt.toUtc().toIso8601String(),\n        'p_meeting_at': meetingAt?.toUtc().toIso8601String(),\n      },\n    );\n    if (result != true)")
          replace_once(p,
              "    String matchType = 'championnat',\n    String? jerseyNote,\n  }) async {\n    final result = await _client.rpc(\n      'admin_update_match_complete',",
              "    String matchType = 'championnat',\n    String? jerseyNote,\n    DateTime? meetingAt,\n  }) async {\n    final result = await _client.rpc(\n      'admin_update_match_complete_v2',")
          # This is now the update block (create block has already been changed and no longer matches this exact tail).
          replace_once(p,
              "        'p_match_type': matchType,\n        'p_jersey_note': jerseyNote,\n      },\n    );\n    if (result != true)",
              "        'p_match_type': matchType,\n        'p_jersey_note': jerseyNote,\n        'p_meeting_at': meetingAt?.toUtc().toIso8601String(),\n      },\n    );\n    if (result != true)")

          # Controller plumbing.
          p = 'lib/features/matches/presentation/matches_controller.dart'
          # createMatch signature/forward
          replace_once(p,
              "    String matchType = 'championnat',\n    String? jerseyNote,\n  }) async {\n    if (!_canManageMatches)",
              "    String matchType = 'championnat',\n    String? jerseyNote,\n    DateTime? meetingAt,\n  }) async {\n    if (!_canManageMatches)")
          replace_once(p,
              "        matchType: matchType,\n        jerseyNote: jerseyNote,\n      );\n      await load(",
              "        matchType: matchType,\n        jerseyNote: jerseyNote,\n        meetingAt: meetingAt,\n      );\n      await load(")
          # updateMatch signature/forward
          replace_once(p,
              "    String matchType = 'championnat',\n    String? jerseyNote,\n  }) async {\n    if (!_canManageMatches) {\n      state = state.copyWith(isLoading: false, error: 'Droits insuffisants.');\n      return;\n    }\n    if (id.isEmpty",
              "    String matchType = 'championnat',\n    String? jerseyNote,\n    DateTime? meetingAt,\n  }) async {\n    if (!_canManageMatches) {\n      state = state.copyWith(isLoading: false, error: 'Droits insuffisants.');\n      return;\n    }\n    if (id.isEmpty")
          replace_once(p,
              "        matchType: matchType,\n        jerseyNote: jerseyNote,\n      );\n      await load(\n        seasonId: state.selectedSeasonId,\n        allSeasons: state.includesAllSeasons,\n        forceRefresh: true,\n      );\n      _ref.invalidate(matchInfoProvider(id));",
              "        matchType: matchType,\n        jerseyNote: jerseyNote,\n        meetingAt: meetingAt,\n      );\n      await load(\n        seasonId: state.selectedSeasonId,\n        allSeasons: state.includesAllSeasons,\n        forceRefresh: true,\n      );\n      _ref.invalidate(matchInfoProvider(id));")
          # createInternalMatch
          replace_once(p,
              "  Future<void> createInternalMatch({\n    required String seasonId,\n    required DateTime kickoffAt,\n    String? address,\n  }) async {",
              "  Future<void> createInternalMatch({\n    required String seasonId,\n    required DateTime kickoffAt,\n    String? address,\n    DateTime? meetingAt,\n  }) async {")
          replace_once(p,
              "        kickoffAt: kickoffAt,\n        address: address,\n      );\n      await load(\n        seasonId: state.selectedSeasonId,",
              "        kickoffAt: kickoffAt,\n        address: address,\n        meetingAt: meetingAt,\n      );\n      await load(\n        seasonId: state.selectedSeasonId,")
          # updateInternalMatch
          replace_once(p,
              "    DateTime? expectedUpdatedAt,\n    String? address,\n    bool rememberAddressAsDefault = false,\n  }) async {",
              "    DateTime? expectedUpdatedAt,\n    String? address,\n    bool rememberAddressAsDefault = false,\n    DateTime? meetingAt,\n  }) async {")
          replace_once(p,
              "        expectedUpdatedAt: expectedUpdatedAt,\n        address: address,\n      );\n      if (rememberAddressAsDefault)",
              "        expectedUpdatedAt: expectedUpdatedAt,\n        address: address,\n        meetingAt: meetingAt,\n      );\n      if (rememberAddressAsDefault)")

          # Info repository.
          p = 'lib/features/matches/data/match_info_repository.dart'
          replace_once(p,
              "import 'package:as_grinta/core/providers/supabase_provider.dart';\n",
              "import 'package:as_grinta/core/providers/supabase_provider.dart';\nimport 'package:as_grinta/features/matches/domain/match_meeting.dart';\n")
          replace_once(p,
              "    required this.address,\n    required this.opponentId,",
              "    required this.address,\n    this.meetingAt,\n    required this.opponentId,")
          replace_once(p,
              "  final DateTime? kickoffAt;\n  final String? address;\n  final String? opponentId;",
              "  final DateTime? kickoffAt;\n  final String? address;\n  final DateTime? meetingAt;\n  final String? opponentId;")
          replace_once(p,
              "    required this.address,\n    required this.lastEncounters,",
              "    required this.address,\n    this.meetingAt,\n    required this.lastEncounters,")
          replace_once(p,
              "  final DateTime? kickoffAt;\n  final String? address;\n  final List<MatchEncounter> lastEncounters;",
              "  final DateTime? kickoffAt;\n  final String? address;\n  final DateTime? meetingAt;\n  final List<MatchEncounter> lastEncounters;")
          replace_once(p,
              "  bool get isFriendly => matchType == 'amical';",
              "  DateTime? get effectiveMeetingAt => kickoffAt == null\n      ? null\n      : resolvedMatchMeetingAt(\n          kickoffAt: kickoffAt!,\n          customMeetingAt: meetingAt,\n        );\n\n  bool get isFriendly => matchType == 'amical';")
          replace_once(p,
              "    kickoffAt: core.kickoffAt,\n    address: core.address,\n    lastEncounters:",
              "    kickoffAt: core.kickoffAt,\n    address: core.address,\n    meetingAt: core.meetingAt,\n    lastEncounters:")
          replace_once(p,
              "        'kickoff_at, match_date, match_time, status, location, address, '\n        'opponent_id, match_type, jersey_note, opponents(name, address)',",
              "        'kickoff_at, match_date, match_time, meeting_at, status, location, address, '\n        'opponent_id, match_type, jersey_note, opponents(name, address)',")
          replace_once(p,
              "    kickoffAt: kickoffAt,\n    address: address,\n    opponentId:",
              "    kickoffAt: kickoffAt,\n    address: address,\n    meetingAt: DateTime.tryParse('${match['meeting_at'] ?? ''}')?.toLocal(),\n    opponentId:")
          replace_once(p,
              "    kickoffAt: baseInfo.kickoffAt,\n    address: baseInfo.address,\n    lastEncounters:",
              "    kickoffAt: baseInfo.kickoffAt,\n    address: baseInfo.address,\n    meetingAt: baseInfo.meetingAt,\n    lastEncounters:")

          # Info UI: replace the previously hard-coded H-30 value.
          p = 'lib/features/matches/presentation/widgets/match_info_tab.dart'
          replace_once(p,
              "                            text: AppFormats.time(\n                              info.kickoffAt!.subtract(\n                                const Duration(minutes: 30),\n                              ),\n                            ),",
              "                            text: AppFormats.time(\n                              info.effectiveMeetingAt!,\n                            ),")

          # Calendar entry form (the screen shown by the user). Events remain unchanged.
          p = 'lib/features/matches/presentation/calendar_entry_form_page.dart'
          replace_once(p,
              "import 'package:as_grinta/features/matches/domain/jersey_option.dart';\n",
              "import 'package:as_grinta/features/matches/domain/jersey_option.dart';\nimport 'package:as_grinta/features/matches/domain/match_meeting.dart';\n")
          replace_once(p,
              "import 'package:as_grinta/features/matches/presentation/widgets/convocation_launch_picker.dart';\n",
              "import 'package:as_grinta/features/matches/presentation/widgets/convocation_launch_picker.dart';\nimport 'package:as_grinta/features/matches/presentation/widgets/match_meeting_time_picker.dart';\n")
          replace_once(p,
              "  DateTime? _customLaunchAt;\n\n  bool get _isEvent",
              "  DateTime? _customLaunchAt;\n  DateTime? _meetingAt;\n\n  bool get _isEvent")
          replace_once(p,
              "      _dateTile(),\n      _timeTile(),\n      if (widget.event == null) ...[",
              "      _dateTile(),\n      _timeTile(),\n      MatchMeetingTimePicker(\n        kickoffAt: _startsAt,\n        customMeetingAt: _meetingAt,\n        enabled: !busy,\n        onChanged: (value) => setState(() => _meetingAt = value),\n      ),\n      if (widget.event == null) ...[")
          replace_once(p,
              "      if (_isEvent) {\n        _addressController.clear();\n      } else {",
              "      if (_isEvent) {\n        _addressController.clear();\n        _meetingAt = null;\n      } else {")
          replace_once(p,
              "      _repairCustomLaunchIfNeeded();\n    });\n    if (_isNormalMatch",
              "      _repairCustomLaunchIfNeeded();\n      _repairMeetingAt();\n    });\n    if (_isNormalMatch")
          replace_once(p,
              "      _repairCustomLaunchIfNeeded();\n    });\n  }\n\n  void _repairCustomLaunchIfNeeded()",
              "      _repairCustomLaunchIfNeeded();\n      _repairMeetingAt();\n    });\n  }\n\n  void _repairMeetingAt() {\n    _meetingAt = preserveCustomMeetingTime(\n      kickoffAt: _startsAt,\n      customMeetingAt: _meetingAt,\n    );\n  }\n\n  void _repairCustomLaunchIfNeeded()")
          replace_once(p,
              "              customLaunchAt: _customLaunchAt,\n              address:",
              "              customLaunchAt: _customLaunchAt,\n              meetingAt: _meetingAt,\n              address:")
          replace_once(p,
              "              customLaunchAt: _customLaunchAt,\n              squadSizeLimit:",
              "              customLaunchAt: _customLaunchAt,\n              meetingAt: _meetingAt,\n              squadSizeLimit:")

          # Match form (secondary add/edit route).
          p = 'lib/features/matches/presentation/match_form_page.dart'
          replace_once(p,
              "import 'package:as_grinta/features/matches/domain/match_model.dart';\n",
              "import 'package:as_grinta/features/matches/domain/match_model.dart';\nimport 'package:as_grinta/features/matches/domain/match_meeting.dart';\n")
          replace_once(p,
              "import 'package:as_grinta/features/matches/presentation/widgets/convocation_launch_picker.dart';\n",
              "import 'package:as_grinta/features/matches/presentation/widgets/convocation_launch_picker.dart';\nimport 'package:as_grinta/features/matches/presentation/widgets/match_meeting_time_picker.dart';\n")
          replace_once(p,
              "  DateTime? _customLaunchAt;\n\n  int _oddsRequestToken",
              "  DateTime? _customLaunchAt;\n  DateTime? _meetingAt;\n\n  int _oddsRequestToken")
          replace_once(p,
              "    _addressController.text = match?.address ?? '';\n    _selectedJersey",
              "    _addressController.text = match?.address ?? '';\n    _meetingAt = match?.meetingAt;\n    _selectedJersey")
          replace_once(p,
              "              ListTile(\n                contentPadding: EdgeInsets.zero,\n                title: const Text('Heure'),\n                subtitle: Text(_formatTime(_kickoffAt)),\n                trailing: const Icon(Icons.schedule),\n                onTap: busy ? null : _pickTime,\n              ),\n              if (widget.match == null) ...[",
              "              ListTile(\n                contentPadding: EdgeInsets.zero,\n                title: const Text('Heure'),\n                subtitle: Text(_formatTime(_kickoffAt)),\n                trailing: const Icon(Icons.schedule),\n                onTap: busy ? null : _pickTime,\n              ),\n              MatchMeetingTimePicker(\n                kickoffAt: _kickoffAt,\n                customMeetingAt: _meetingAt,\n                enabled: !busy,\n                onChanged: (value) => setState(() => _meetingAt = value),\n              ),\n              if (widget.match == null) ...[")
          replace_once(p,
              "      _repairCustomLaunchIfNeeded();\n    });\n    if (!_isInternal",
              "      _repairCustomLaunchIfNeeded();\n      _repairMeetingAt();\n    });\n    if (!_isInternal")
          replace_once(p,
              "      _repairCustomLaunchIfNeeded();\n    });\n  }\n\n  void _repairCustomLaunchIfNeeded()",
              "      _repairCustomLaunchIfNeeded();\n      _repairMeetingAt();\n    });\n  }\n\n  void _repairMeetingAt() {\n    _meetingAt = preserveCustomMeetingTime(\n      kickoffAt: _kickoffAt,\n      customMeetingAt: _meetingAt,\n    );\n  }\n\n  void _repairCustomLaunchIfNeeded()")
          replace_once(p,
              "        address: address.isEmpty ? null : address,\n        rememberAddressAsDefault:",
              "        address: address.isEmpty ? null : address,\n        meetingAt: _meetingAt,\n        rememberAddressAsDefault:")
          replace_once(p,
              "      jerseyNote: _selectedJersey?.id,\n    );\n    if (!mounted)",
              "      jerseyNote: _selectedJersey?.id,\n      meetingAt: _meetingAt,\n    );\n    if (!mounted)")
          replace_once(p,
              "          customLaunchAt: _customLaunchAt,\n          address: address.isEmpty ? null : address,",
              "          customLaunchAt: _customLaunchAt,\n          meetingAt: _meetingAt,\n          address: address.isEmpty ? null : address,")
          replace_once(p,
              "          customLaunchAt: _customLaunchAt,\n          squadSizeLimit:",
              "          customLaunchAt: _customLaunchAt,\n          meetingAt: _meetingAt,\n          squadSizeLimit:")

          PY
          python3 /tmp/patch_meeting.py

          dart format \
            lib/features/matches/domain/match_meeting.dart \
            lib/features/matches/domain/match_model.dart \
            lib/features/matches/data/calendar_matches_local_cache.dart \
            lib/features/matches/data/scheduled_match_creation_repository.dart \
            lib/features/matches/data/matches_repository.dart \
            lib/features/matches/data/match_info_repository.dart \
            lib/features/matches/presentation/matches_controller.dart \
            lib/features/matches/presentation/calendar_entry_form_page.dart \
            lib/features/matches/presentation/match_form_page.dart \
            lib/features/matches/presentation/widgets/match_info_tab.dart \
            lib/features/matches/presentation/widgets/match_meeting_time_picker.dart \
            test/match_meeting_test.dart \
            test/match_meeting_time_picker_test.dart

          rm .github/workflows/tmp_match_meeting_patch.yml

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'Wire configurable match meeting time through app'
          git push origin HEAD:feat/match-meeting-time
