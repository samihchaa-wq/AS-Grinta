name: Apply match edit optimistic lock patch

on:
  push:
    branches:
      - fix/match-edit-optimistic-lock

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: fix/match-edit-optimistic-lock
          fetch-depth: 0
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
        with:
          flutter-version: '3.47.0'
          channel: stable
      - name: Patch client
        run: |
          python3 <<'PY'
          from pathlib import Path

          repo = Path('lib/features/matches/data/matches_repository.dart')
          text = repo.read_text()
          start = text.index('  Future<void> updateInternalMatch({')
          end = text.index('  /// Cotes suggérées', start)
          method = text[start:end]
          method = method.replace(
              "    required DateTime kickoffAt,\n    String? address,",
              "    required DateTime kickoffAt,\n    required DateTime expectedUpdatedAt,\n    String? address,",
              1,
          )
          method = method.replace(
              "        'p_match_time': _formatTime(kickoffAt),\n        'p_address': address,",
              "        'p_match_time': _formatTime(kickoffAt),\n        'p_address': address,\n        'p_expected_updated_at': expectedUpdatedAt.toUtc().toIso8601String(),",
              1,
          )
          text = text[:start] + method + text[end:]
          start = text.index('  Future<void> updateMatch({')
          tail = text[start:]
          tail = tail.replace(
              "    required double oddsLoss,\n    int? squadSizeLimit,",
              "    required double oddsLoss,\n    required DateTime expectedUpdatedAt,\n    int? squadSizeLimit,",
              1,
          )
          tail = tail.replace(
              "        'p_loss': oddsLoss,\n        'p_squad_size_limit': squadSizeLimit,",
              "        'p_loss': oddsLoss,\n        'p_expected_updated_at': expectedUpdatedAt.toUtc().toIso8601String(),\n        'p_squad_size_limit': squadSizeLimit,",
              1,
          )
          repo.write_text(text[:start] + tail)

          controller = Path('lib/features/matches/presentation/matches_controller.dart')
          text = controller.read_text()
          start = text.index('  Future<void> updateMatch({')
          end = text.index('  /// Crée un « match entre nous »', start)
          method = text[start:end]
          method = method.replace(
              "    required double oddsLoss,\n    int? squadSizeLimit,",
              "    required double oddsLoss,\n    required DateTime? expectedUpdatedAt,\n    int? squadSizeLimit,",
              1,
          )
          marker = "    state = state.copyWith(isLoading: true, clearError: true);"
          method = method.replace(
              marker,
              "    if (expectedUpdatedAt == null) {\n      state = state.copyWith(\n        isLoading: false,\n        error: 'Le match a changé. Recharge l’écran avant d’enregistrer.',\n      );\n      return;\n    }\n" + marker,
              1,
          )
          method = method.replace(
              "        oddsLoss: oddsLoss,\n        squadSizeLimit: squadSizeLimit,",
              "        oddsLoss: oddsLoss,\n        expectedUpdatedAt: expectedUpdatedAt,\n        squadSizeLimit: squadSizeLimit,",
              1,
          )
          text = text[:start] + method + text[end:]
          start = text.index('  Future<void> updateInternalMatch({')
          end = text.index('  bool _validOdds', start)
          method = text[start:end]
          method = method.replace(
              "    required DateTime kickoffAt,\n    String? address,",
              "    required DateTime kickoffAt,\n    required DateTime? expectedUpdatedAt,\n    String? address,",
              1,
          )
          method = method.replace(
              marker,
              "    if (expectedUpdatedAt == null) {\n      state = state.copyWith(\n        isLoading: false,\n        error: 'Le match a changé. Recharge l’écran avant d’enregistrer.',\n      );\n      return;\n    }\n" + marker,
              1,
          )
          method = method.replace(
              "        kickoffAt: kickoffAt,\n        address: address,",
              "        kickoffAt: kickoffAt,\n        expectedUpdatedAt: expectedUpdatedAt,\n        address: address,",
              1,
          )
          controller.write_text(text[:start] + method + text[end:])

          form = Path('lib/features/matches/presentation/match_form_page.dart')
          text = form.read_text()
          text = text.replace(
              "          kickoffAt: _kickoffAt,\n          address: address.isEmpty ? null : address,\n          rememberAddressAsDefault: _rememberAddressAsDefault,",
              "          kickoffAt: _kickoffAt,\n          expectedUpdatedAt: widget.match!.updatedAt,\n          address: address.isEmpty ? null : address,\n          rememberAddressAsDefault: _rememberAddressAsDefault,",
              1,
          )
          update_start = text.index('      await notifier.updateMatch(')
          update_tail = text[update_start:]
          update_tail = update_tail.replace(
              "        oddsLoss: oddsLoss,\n        squadSizeLimit: squadSizeLimit,",
              "        oddsLoss: oddsLoss,\n        expectedUpdatedAt: widget.match!.updatedAt,\n        squadSizeLimit: squadSizeLimit,",
              1,
          )
          form.write_text(text[:update_start] + update_tail)

          test_content = (
              "import 'dart:io';\n\n"
              "import 'package:flutter_test/flutter_test.dart';\n\n"
              "void main() {\n"
              "  test('les éditions de match transmettent la version chargée', () {\n"
              "    final repository = File(\n"
              "      'lib/features/matches/data/matches_repository.dart',\n"
              "    ).readAsStringSync();\n"
              "    final controller = File(\n"
              "      'lib/features/matches/presentation/matches_controller.dart',\n"
              "    ).readAsStringSync();\n"
              "    final form = File(\n"
              "      'lib/features/matches/presentation/match_form_page.dart',\n"
              "    ).readAsStringSync();\n\n"
              "    expect(repository, contains(\"'p_expected_updated_at'\"));\n"
              "    expect(repository, contains('expectedUpdatedAt.toUtc().toIso8601String()'));\n"
              "    expect(controller, contains('required DateTime? expectedUpdatedAt'));\n"
              "    expect(controller, contains('expectedUpdatedAt: expectedUpdatedAt'));\n"
              "    expect(form, contains('expectedUpdatedAt: widget.match!.updatedAt'));\n"
              "  });\n"
              "}\n"
          )
          Path('test/match_edit_optimistic_lock_contract_test.dart').write_text(test_content)
          PY
      - name: Format changed Dart files
        run: dart format lib/features/matches/data/matches_repository.dart lib/features/matches/presentation/matches_controller.dart lib/features/matches/presentation/match_form_page.dart test/match_edit_optimistic_lock_contract_test.dart
      - name: Remove temporary workflow
        run: rm .github/workflows/apply_match_edit_optimistic_lock.yml
      - name: Commit patch
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "fix(matches): reject stale concurrent edits"
          git push origin HEAD:fix/match-edit-optimistic-lock
