name: Temporary production migration 985

on:
  push:
    branches:
      - ci/supabase-migration-drift-guard-985-pending-profile
    paths:
      - 'supabase/migrations/20260817175500_allow_self_profile_non_active_status.sql'
      - '.github/workflows/temporary_production_migration_985.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: temporary-production-migration-985
  cancel-in-progress: false

env:
  SUPABASE_PRODUCTION_PROJECT_ID: ovzijmqrnsgcmryinkfa
  SUPABASE_STAGING_PROJECT_ID: dhwrtdnjwdkvdyvojvjl
  SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
  SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}

jobs:
  migrate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Guard production target and credentials
        shell: bash
        run: |
          set -euo pipefail
          test "${GITHUB_REF_NAME}" = "ci/supabase-migration-drift-guard-985-pending-profile"
          test -n "${SUPABASE_ACCESS_TOKEN:-}"
          test -n "${SUPABASE_DB_PASSWORD:-}"
          test -n "${SUPABASE_PRODUCTION_PROJECT_ID}"
          test "${SUPABASE_PRODUCTION_PROJECT_ID}" != "${SUPABASE_STAGING_PROJECT_ID}"
          test -f supabase/migrations/20260817175500_allow_self_profile_non_active_status.sql

      - uses: supabase/setup-cli@3c2f5e2ae34c34e428e8e206e2c4d21fa2d20fbf # v2
        with:
          version: 2.111.0

      - name: Link production project
        shell: bash
        run: |
          set -euo pipefail
          supabase link --project-ref "${SUPABASE_PRODUCTION_PROJECT_ID}"

      - name: Preview migration 480 only
        shell: bash
        run: |
          set -euo pipefail
          supabase db push --linked --include-all --dry-run | tee /tmp/prod-migration-dry-run.log
          grep -q '20260817175500' /tmp/prod-migration-dry-run.log

      - name: Apply migration 480
        shell: bash
        run: |
          set -euo pipefail
          supabase db push --linked --include-all --yes

      - name: Verify production migration registry
        shell: bash
        run: |
          set -euo pipefail
          supabase migration list | tee /tmp/prod-migration-list.log
          awk -F'|' '{ remote=$2; gsub(/[^0-9]/, "", remote); if (remote == "20260817175500") found=1 } END { exit !found }' /tmp/prod-migration-list.log
