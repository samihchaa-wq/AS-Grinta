name: Patch opponent field left alignment

on:
  push:
    branches: [fix/opponent-field-left-align]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: fix/opponent-field-left-align
          fetch-depth: 0

      - name: Align opponent autocomplete text left
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('lib/features/matches/presentation/calendar_entry_form_page.dart')
          text = path.read_text()
          old = """                        enabled: !busy,\n                        textCapitalization: TextCapitalization.words,\n                        textInputAction: TextInputAction.done,\n"""
          new = """                        enabled: !busy,\n                        textAlign: TextAlign.start,\n                        textAlignVertical: TextAlignVertical.center,\n                        textCapitalization: TextCapitalization.words,\n                        textInputAction: TextInputAction.done,\n"""
          if old not in text:
              raise SystemExit('Target TextFormField block not found')
          if text.count(old) != 1:
              raise SystemExit(f'Expected one target block, found {text.count(old)}')
          path.write_text(text.replace(old, new, 1))
          PY

      - name: Remove temporary workflow
        run: rm .github/workflows/patch_opponent_left_align.yml

      - name: Commit patch
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/features/matches/presentation/calendar_entry_form_page.dart .github/workflows/patch_opponent_left_align.yml
          git commit -m "Align opponent autocomplete text left"
          git push origin HEAD:fix/opponent-field-left-align
