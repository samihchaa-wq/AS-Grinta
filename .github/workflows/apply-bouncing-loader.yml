name: Apply bouncing ball loader

on:
  push:
    branches:
      - agent/bouncing-ball-loader

permissions:
  contents: write

jobs:
  codemod:
    if: github.actor != 'github-actions[bot]' && github.event.head_commit.message == 'chore: appliquer le loader rebondissant'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/bouncing-ball-loader
          fetch-depth: 0

      - name: Replace every circular loader
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          loader_path = Path('lib/core/widgets/grinta_loader.dart')
          loader_path.write_text(r'''import 'dart:math' as math;

import 'package:as_grinta/core/theme/app_theme.dart';
import 'package:flutter/material.dart';

/// Loader animé et unifié pour toute l'application.
///
/// Le ballon illustré rebondit naturellement, tourne pendant sa phase aérienne
/// et produit une onde bleue et rose à chaque impact. Les trois formats gardent
/// le même mouvement afin que tous les chargements partagent la même identité.
class GrintaLoader extends StatelessWidget {
  const GrintaLoader.page({
    super.key,
    this.message,
    this.semanticLabel = 'Chargement de la page',
  }) : size = 92;

  const GrintaLoader.inline({
    super.key,
    this.message,
    this.semanticLabel = 'Chargement en cours',
  }) : size = 58;

  const GrintaLoader.button({
    super.key,
    this.semanticLabel = 'Action en cours',
  })  : size = 32,
        message = null;

  final double size;

  /// Conservé pour ne pas casser les appels existants. Le loader reste
  /// volontairement sans texte, quelle que soit sa taille.
  final String? message;
  final String semanticLabel;

  @override
  Widget build(BuildContext context) {
    return Semantics(
      label: semanticLabel,
      liveRegion: true,
      child: ExcludeSemantics(
        child: _BouncingBallMark(size: size),
      ),
    );
  }
}

/// Remplacement compact des anciens [CircularProgressIndicator].
///
/// Il accepte leur API courante pour permettre une migration mécanique sans
/// modifier les contraintes déjà posées par les pages et les boutons.
class GrintaProgressIndicator extends StatelessWidget {
  const GrintaProgressIndicator({
    super.key,
    this.value,
    this.backgroundColor,
    this.color,
    this.valueColor,
    this.strokeWidth = 4,
    this.strokeAlign = 0,
    this.semanticsLabel,
    this.semanticsValue,
    this.strokeCap,
    this.constraints,
    this.padding,
    this.year2023,
  });

  final double? value;
  final Color? backgroundColor;
  final Color? color;
  final Animation<Color?>? valueColor;
  final double strokeWidth;
  final double strokeAlign;
  final String? semanticsLabel;
  final String? semanticsValue;
  final StrokeCap? strokeCap;
  final BoxConstraints? constraints;
  final EdgeInsetsGeometry? padding;
  final bool? year2023;

  @override
  Widget build(BuildContext context) {
    final effectiveConstraints = constraints ?? const BoxConstraints();
    return Semantics(
      label: semanticsLabel ?? 'Chargement en cours',
      value: semanticsValue,
      liveRegion: value == null,
      child: ExcludeSemantics(
        child: Padding(
          padding: padding ?? EdgeInsets.zero,
          child: ConstrainedBox(
            constraints: effectiveConstraints,
            child: LayoutBuilder(
              builder: (context, box) {
                final candidates = <double>[
                  if (box.hasBoundedWidth) box.maxWidth,
                  if (box.hasBoundedHeight) box.maxHeight,
                ];
                final available = candidates.isEmpty
                    ? 32.0
                    : candidates.reduce(math.min);
                final size = available.clamp(16.0, 32.0).toDouble();
                return Center(child: _BouncingBallMark(size: size));
              },
            ),
          ),
        ),
      ),
    );
  }
}

class _BouncingBallMark extends StatefulWidget {
  const _BouncingBallMark({required this.size});

  final double size;

  @override
  State<_BouncingBallMark> createState() => _BouncingBallMarkState();
}

class _BouncingBallMarkState extends State<_BouncingBallMark>
    with SingleTickerProviderStateMixin {
  late final AnimationController _controller = AnimationController(
    vsync: this,
    duration: const Duration(milliseconds: 1200),
  )..repeat();

  @override
  void dispose() {
    _controller.dispose();
    super.dispose();
  }

  @override
  Widget build(BuildContext context) {
    final reduceMotion =
        MediaQuery.maybeOf(context)?.disableAnimations ?? false;

    return RepaintBoundary(
      child: SizedBox.square(
        dimension: widget.size,
        child: AnimatedBuilder(
          animation: _controller,
          builder: (context, _) => CustomPaint(
            painter: _BouncingBallPainter(
              progress: reduceMotion ? 0 : _controller.value,
            ),
          ),
        ),
      ),
    );
  }
}

class _BouncingBallPainter extends CustomPainter {
  const _BouncingBallPainter({required this.progress});

  final double progress;

  @override
  void paint(Canvas canvas, Size size) {
    final shortestSide = math.min(size.width, size.height);
    final radius = shortestSide * 0.205;
    final groundY = size.height * 0.78;
    final bounce = 4 * progress * (1 - progress);
    final bounceHeight = size.height * 0.42;
    final center = Offset(
      size.width / 2,
      groundY - radius - bounceHeight * bounce,
    );

    _drawImpactRipple(canvas, size, groundY, radius);
    _drawShadow(canvas, size, groundY, radius, bounce);
    _drawBall(canvas, center, radius, progress);
  }

  void _drawImpactRipple(
    Canvas canvas,
    Size size,
    double groundY,
    double radius,
  ) {
    const rippleDuration = 0.2;
    if (progress > rippleDuration) return;

    final phase = Curves.easeOut.transform(progress / rippleDuration);
    final opacity = (1 - phase) * 0.72;
    final center = Offset(size.width / 2, groundY + radius * 0.08);
    final width = radius * (2.05 + phase * 2.35);
    final height = radius * (0.38 + phase * 0.42);
    final rect = Rect.fromCenter(
      center: center,
      width: width,
      height: height,
    );

    canvas.drawOval(
      rect,
      Paint()
        ..color = AppTheme.primaryBright.withValues(alpha: opacity)
        ..style = PaintingStyle.stroke
        ..strokeWidth = math.max(1, size.width * 0.018),
    );

    canvas.drawArc(
      rect,
      math.pi * 0.96,
      math.pi * 0.7,
      false,
      Paint()
        ..color = AppTheme.accent.withValues(alpha: opacity * 0.92)
        ..style = PaintingStyle.stroke
        ..strokeWidth = math.max(1, size.width * 0.022)
        ..strokeCap = StrokeCap.round,
    );
  }

  void _drawShadow(
    Canvas canvas,
    Size size,
    double groundY,
    double radius,
    double bounce,
  ) {
    final width = radius * (2.25 - bounce * 0.72);
    final height = radius * (0.38 - bounce * 0.1);
    final shadowRect = Rect.fromCenter(
      center: Offset(size.width / 2, groundY + radius * 0.08),
      width: width,
      height: height,
    );

    canvas.drawOval(
      shadowRect,
      Paint()
        ..color = Colors.black.withValues(alpha: 0.34 - bounce * 0.17)
        ..maskFilter = MaskFilter.blur(
          BlurStyle.normal,
          math.max(1, size.width * 0.035),
        ),
    );
  }

  void _drawBall(
    Canvas canvas,
    Offset center,
    double radius,
    double progress,
  ) {
    final distanceFromImpact = math.min(progress, 1 - progress);
    final impact = (1 - (distanceFromImpact / 0.13)).clamp(0.0, 1.0);
    final easedImpact = Curves.easeOut.transform(impact);
    final scaleX = 1 + easedImpact * 0.14;
    final scaleY = 1 - easedImpact * 0.18;
    final rotation = progress * math.pi * 2;

    canvas.save();
    canvas.translate(center.dx, center.dy);
    canvas.scale(scaleX, scaleY);
    canvas.rotate(rotation);

    canvas.drawCircle(
      Offset.zero,
      radius * 1.12,
      Paint()
        ..color = AppTheme.primaryBright.withValues(alpha: 0.13)
        ..maskFilter = MaskFilter.blur(
          BlurStyle.normal,
          radius * 0.26,
        ),
    );

    final ballRect = Rect.fromCircle(center: Offset.zero, radius: radius);
    canvas.drawCircle(
      Offset.zero,
      radius,
      Paint()
        ..shader = const RadialGradient(
          center: Alignment(-0.38, -0.44),
          radius: 1.05,
          colors: [
            Colors.white,
            Color(0xFFF3F6FC),
            AppTheme.primaryBright,
          ],
          stops: [0, 0.68, 1],
        ).createShader(ballRect),
    );

    final darkPaint = Paint()..color = AppTheme.background;
    final seamPaint = Paint()
      ..color = AppTheme.background.withValues(alpha: 0.58)
      ..style = PaintingStyle.stroke
      ..strokeWidth = math.max(0.8, radius * 0.075)
      ..strokeCap = StrokeCap.round;

    final pentagon = Path();
    for (var i = 0; i < 5; i++) {
      final angle = -math.pi / 2 + i * math.pi * 2 / 5;
      final point = Offset(
        math.cos(angle) * radius * 0.31,
        math.sin(angle) * radius * 0.31,
      );
      if (i == 0) {
        pentagon.moveTo(point.dx, point.dy);
      } else {
        pentagon.lineTo(point.dx, point.dy);
      }
    }
    pentagon.close();
    canvas.drawPath(pentagon, darkPaint);

    for (var i = 0; i < 5; i++) {
      final angle = -math.pi / 2 + i * math.pi * 2 / 5;
      final inner = Offset(
        math.cos(angle) * radius * 0.31,
        math.sin(angle) * radius * 0.31,
      );
      final outer = Offset(
        math.cos(angle) * radius * 0.78,
        math.sin(angle) * radius * 0.78,
      );
      canvas.drawLine(inner, outer, seamPaint);
      canvas.drawCircle(outer, radius * 0.125, darkPaint);
    }

    canvas.drawArc(
      Rect.fromCircle(center: Offset.zero, radius: radius * 0.82),
      -2.45,
      0.92,
      false,
      Paint()
        ..color = Colors.white.withValues(alpha: 0.58)
        ..style = PaintingStyle.stroke
        ..strokeWidth = math.max(1, radius * 0.1)
        ..strokeCap = StrokeCap.round,
    );

    canvas.restore();
  }

  @override
  bool shouldRepaint(covariant _BouncingBallPainter oldDelegate) {
    return oldDelegate.progress != progress;
  }
}
''', encoding='utf-8')

          loader_import = "import 'package:as_grinta/core/widgets/grinta_loader.dart';"
          indicator_pattern = re.compile(r'(?<![.\w])CircularProgressIndicator\b')

          changed = []
          for path in Path('lib').rglob('*.dart'):
              if path == loader_path:
                  continue
              text = path.read_text(encoding='utf-8')
              if not indicator_pattern.search(text):
                  continue

              updated = indicator_pattern.sub('GrintaProgressIndicator', text)
              if loader_import not in updated:
                  lines = updated.splitlines(keepends=True)
                  import_indexes = [
                      i for i, line in enumerate(lines)
                      if line.startswith('import ')
                  ]
                  if not import_indexes:
                      raise RuntimeError(f'Aucun import trouvé dans {path}')
                  insert_at = import_indexes[-1] + 1
                  lines.insert(insert_at, loader_import + '\n')
                  updated = ''.join(lines)

              path.write_text(updated, encoding='utf-8')
              changed.append(str(path))

          workflow = Path('.github/workflows/apply-bouncing-loader.yml')
          workflow.unlink()

          print(f'{len(changed)} fichiers migrés vers GrintaProgressIndicator')
          for item in changed:
              print(f' - {item}')
          PY

      - name: Commit generated application changes
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib .github/workflows/apply-bouncing-loader.yml
          git commit -m "feat: généraliser le ballon rebondissant aux chargements"
          git push origin HEAD:agent/bouncing-ball-loader
