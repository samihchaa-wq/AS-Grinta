name: Temporary sync and format

on:
  push:
    branches:
      - feature/highlight-current-user-rows

permissions:
  contents: write

jobs:
  sync-format:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: feature/highlight-current-user-rows
          fetch-depth: 0

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Merge main and format changed files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          git merge --no-edit origin/main
          dart format \
            lib/features/matches/presentation/match_details_page.dart \
            lib/features/predictions/presentation/pronos_hub_components.dart \
            lib/features/statistics/presentation/stats_hub_page.dart
          if ! git diff --quiet; then
            git add \
              lib/features/matches/presentation/match_details_page.dart \
              lib/features/predictions/presentation/pronos_hub_components.dart \
              lib/features/statistics/presentation/stats_hub_page.dart
            git commit -m "Format current user row highlighting after main sync"
          fi
          git push origin HEAD:feature/highlight-current-user-rows
