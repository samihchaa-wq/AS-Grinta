name: Temporary patch guest final

on:
  push:
    branches:
      - agent/clarify-effectif-publication

permissions:
  contents: write

concurrency:
  group: temporary-patch-guest-final
  cancel-in-progress: true

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: agent/clarify-effectif-publication
          fetch-depth: 0

      - name: Patch guest test and remove workflow
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path('supabase/tests/database/sports_management_guests.test.sql')
          text = path.read_text()
          marker = """select is(
  public.admin_publish_match_composition(
    current_setting('test.guest_match')::uuid,
    false,
    'Publication avec invité'
  ) #>> '{version}',
"""
          insertion = """select is(
  public.admin_publish_match_effectif(
    current_setting('test.guest_match')::uuid,
    14,
    (
      select jsonb_agg(
        jsonb_build_object(
          'season_player_id', participant.season_player_id,
          'status', 'convoked'
        ) order by participant.season_player_id
      )
      from public.match_sport_participants participant
      where participant.match_id = current_setting('test.guest_match')::uuid
        and participant.season_player_id is not null
        and participant.availability_status = 'available'
        and participant.is_eligible
    ),
    'Publication préalable des convocations avec invité'
  ) #>> '{convocation_version}',
  '1',
  'les convocations sont publiées explicitement avant la composition invitée'
);

""" + marker
          if 'les convocations sont publiées explicitement avant la composition invitée' not in text:
              if text.count(marker) != 1:
                  raise SystemExit('Point d’insertion introuvable ou ambigu')
              path.write_text(text.replace(marker, insertion, 1))
          PY
          git rm .github/workflows/temporary_patch_guest_final.yml

      - name: Commit and push safely
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            echo 'Aucune correction à enregistrer.'
            exit 0
          fi
          git commit -m 'Finaliser le test invité du parcours explicite'
          git fetch origin agent/clarify-effectif-publication
          git rebase origin/agent/clarify-effectif-publication
          git push origin HEAD:agent/clarify-effectif-publication
