name: Temporary format and compile fix

on:
  push:
    branches:
      - design/visual-system-polish

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: design/visual-system-polish
          fetch-depth: 0
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Fix role label and format Dart
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('lib/features/profile/presentation/profile_page.dart')
          text = path.read_text()
          old = "label: profile?.role.label ?? 'Rôle inconnu',"
          new = "label: profile == null ? 'Rôle inconnu' : switch (profile.role) { AuthRole.admin => 'Admin', AuthRole.pronostiqueur => 'Joueur' },"
          if old not in text:
              raise SystemExit('Expected role label expression not found')
          path.write_text(text.replace(old, new))
          PY
          dart format lib/core/theme/app_theme.dart \
            lib/features/badges/presentation/armoire_page.dart \
            lib/features/badges/presentation/badge_detail_sheet.dart \
            lib/features/home/presentation/home_next_match_card.dart \
            lib/features/matches/presentation/matches_page.dart \
            lib/features/profile/presentation/profile_page.dart
      - name: Remove temporary workflow and commit
        run: |
          git rm .github/workflows/temp-format-fix.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/core/theme/app_theme.dart \
            lib/features/badges/presentation/armoire_page.dart \
            lib/features/badges/presentation/badge_detail_sheet.dart \
            lib/features/home/presentation/home_next_match_card.dart \
            lib/features/matches/presentation/matches_page.dart \
            lib/features/profile/presentation/profile_page.dart
          git commit -m "Fix formatting and profile role label"
          git push origin HEAD:design/visual-system-polish
