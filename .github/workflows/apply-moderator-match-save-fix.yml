# Trigger the one-shot match-save fix from this clean branch.
name: Apply moderator match save fix

on:
  push:
    branches:
      - agent/fix-moderator-match-save
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  apply-fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/fix-moderator-match-save
          fetch-depth: 0

      - name: Apply targeted fix and release bump
        shell: python
        run: |
          from pathlib import Path

          replacements = {
              Path('lib/features/matches/presentation/match_form_page.dart'): [
                  ('final canManage = role == AuthRole.admin;',
                   'final canManage = role?.isAdmin ?? false;'),
              ],
              Path('lib/features/matches/presentation/matches_controller.dart'): [
                  ('bool get _isAdmin => _role == AuthRole.admin;',
                   'bool get _isAdmin => _role?.isAdmin ?? false;'),
              ],
              Path('pubspec.yaml'): [
                  ('version: 0.3.2+93', 'version: 0.3.2+94'),
              ],
              Path('web/build_version.js'): [
                  ("AS_GRINTA_WEB_VERSION = '0.3.2+93';",
                   "AS_GRINTA_WEB_VERSION = '0.3.2+94';"),
              ],
              Path('web/sw.js'): [
                  ('Révision de déploiement 0.3.2+93',
                   'Révision de déploiement 0.3.2+94'),
              ],
          }

          for path, pairs in replacements.items():
              text = path.read_text()
              for old, new in pairs:
                  if text.count(old) != 1:
                      raise SystemExit(f'{path}: expected exactly one occurrence of {old!r}')
                  text = text.replace(old, new)
              path.write_text(text)

          test = Path('test/match_staff_permissions_contract_test.dart')
          test.write_text("""import 'dart:io';

import 'package:flutter_test/flutter_test.dart';

void main() {
  test('match management honors moderator admin rights', () async {
    final form = await File(
      'lib/features/matches/presentation/match_form_page.dart',
    ).readAsString();
    final controller = await File(
      'lib/features/matches/presentation/matches_controller.dart',
    ).readAsString();

    expect(form, contains('final canManage = role?.isAdmin ?? false;'));
    expect(
      controller,
      contains('bool get _isAdmin => _role?.isAdmin ?? false;'),
    );
    expect(
      form,
      isNot(contains('final canManage = role == AuthRole.admin;')),
    );
    expect(
      controller,
      isNot(contains('bool get _isAdmin => _role == AuthRole.admin;')),
    );
  });
}
""")

          workflow = Path('.github/workflows/apply-moderator-match-save-fix.yml')
          workflow.unlink()

      - name: Commit targeted fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/features/matches/presentation/match_form_page.dart \
                  lib/features/matches/presentation/matches_controller.dart \
                  pubspec.yaml web/build_version.js web/sw.js \
                  test/match_staff_permissions_contract_test.dart \
                  .github/workflows/apply-moderator-match-save-fix.yml
          git commit -m "Corrige l’enregistrement des matchs pour les modérateurs"
          git push origin HEAD:agent/fix-moderator-match-save
