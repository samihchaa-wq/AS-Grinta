name: Apply upcoming match fixture

on:
  pull_request:
    branches: [main]

permissions:
  contents: write
  pull-requests: read

jobs:
  apply:
    if: ${{ github.event.pull_request.head.ref == 'feature/upcoming-match-fixture-header' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/upcoming-match-fixture-header
          fetch-depth: 0
      - name: Merge the latest main branch
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git fetch origin main
          git merge --no-edit origin/main
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Apply the interface changes
        run: |
          python - <<'PY'
          from pathlib import Path

          def insert_after(lines: list[str], anchor: str, value: str, label: str) -> None:
              if value in lines:
                  return
              try:
                  index = lines.index(anchor)
              except ValueError as exc:
                  raise SystemExit(f'Missing anchor for {label}: {anchor!r}') from exc
              lines.insert(index + 1, value)

          def insert_before_first(lines: list[str], anchor: str, values: list[str], label: str) -> None:
              if any(value in lines for value in values):
                  return
              try:
                  index = lines.index(anchor)
              except ValueError as exc:
                  raise SystemExit(f'Missing anchor for {label}: {anchor!r}') from exc
              lines[index:index] = values

          admin_path = Path('lib/features/sports_management/presentation/admin_squad_plan_page.dart')
          admin = admin_path.read_text().splitlines()
          insert_after(
              admin,
              "import 'package:as_grinta/features/matches/presentation/widgets/match_info_tab.dart';",
              "import 'package:as_grinta/features/matches/presentation/widgets/upcoming_match_fixture_header.dart';",
              'admin import',
          )
          refresh_line = '      if (selected != null) await _loadWorkspace(selected);'
          if '        ref.invalidate(upcomingMatchFixtureProvider(selected));' not in admin:
              try:
                  refresh_index = admin.index(refresh_line)
              except ValueError as exc:
                  raise SystemExit('Missing admin refresh anchor') from exc
              admin[refresh_index:refresh_index + 1] = [
                  '      if (selected != null) {',
                  '        ref.invalidate(upcomingMatchFixtureProvider(selected));',
                  '        await _loadWorkspace(selected);',
                  '      }',
              ]
          insert_before_first(
              admin,
              '          SegmentedButton<_AdminStep>(',
              [
                  '          if (_selectedMatchId != null)',
                  '            UpcomingMatchFixtureHeader(matchId: _selectedMatchId!),',
              ],
              'admin fixture placement',
          )
          admin_path.write_text('\n'.join(admin) + '\n')

          player_path = Path('lib/features/sports_management/presentation/match_lineup_page.dart')
          player = player_path.read_text().splitlines()
          insert_after(
              player,
              "import 'package:as_grinta/features/matches/presentation/widgets/match_info_tab.dart';",
              "import 'package:as_grinta/features/matches/presentation/widgets/upcoming_match_fixture_header.dart';",
              'player import',
          )
          invalidation = '            ..invalidate(upcomingMatchFixtureProvider(matchId))'
          insert_before_first(
              player,
              '            ..invalidate(publishedMatchCompositionProvider(matchId))',
              [invalidation],
              'player refresh invalidation',
          )
          provider_read = '            ref.read(upcomingMatchFixtureProvider(matchId).future),'
          if provider_read not in player:
              try:
                  wait_index = player.index('          await Future.wait([')
              except ValueError as exc:
                  raise SystemExit('Missing player refresh wait anchor') from exc
              player.insert(wait_index + 1, provider_read)
          insert_before_first(
              player,
              '            SegmentedButton<String>(',
              ['            UpcomingMatchFixtureHeader(matchId: matchId),'],
              'player fixture placement',
          )
          player_path.write_text('\n'.join(player) + '\n')
          PY
      - name: Format the changed Dart files
        run: |
          dart format \
            lib/features/matches/presentation/widgets/upcoming_match_fixture_header.dart \
            lib/features/sports_management/presentation/admin_squad_plan_page.dart \
            lib/features/sports_management/presentation/match_lineup_page.dart
      - name: Commit the implementation and remove this temporary workflow
        run: |
          rm .github/workflows/apply-upcoming-match-fixture.yml
          git add -A
          git commit -m "Afficher l’affiche domicile extérieur [fixture-applied]"
          git push origin HEAD:feature/upcoming-match-fixture-header
