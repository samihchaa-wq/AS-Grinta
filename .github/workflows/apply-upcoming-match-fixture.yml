name: Apply upcoming match fixture

on:
  pull_request:
    branches: [main]

permissions:
  contents: write
  pull-requests: read

jobs:
  apply:
    if: ${{ github.event.pull_request.head.ref == 'feature/upcoming-match-fixture-header' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/upcoming-match-fixture-header
          fetch-depth: 0
      - name: Merge the latest main branch
        run: |
          git fetch origin main
          git merge --no-edit origin/main
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Apply the interface changes
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(text: str, old: str, new: str, label: str) -> str:
              if text.count(old) != 1:
                  raise SystemExit(f"Expected one occurrence for {label}, found {text.count(old)}")
              return text.replace(old, new, 1)

          admin_path = Path('lib/features/sports_management/presentation/admin_squad_plan_page.dart')
          admin = admin_path.read_text()
          admin = replace_once(
              admin,
              "import 'package:as_grinta/features/matches/presentation/widgets/match_info_tab.dart';\n",
              "import 'package:as_grinta/features/matches/presentation/widgets/match_info_tab.dart';\n"
              "import 'package:as_grinta/features/matches/presentation/widgets/upcoming_match_fixture_header.dart';\n",
              'admin import',
          )
          admin = replace_once(
              admin,
              "      if (selected != null) await _loadWorkspace(selected);\n",
              "      if (selected != null) {\n"
              "        ref.invalidate(upcomingMatchFixtureProvider(selected));\n"
              "        await _loadWorkspace(selected);\n"
              "      }\n",
              'admin refresh',
          )
          admin = replace_once(
              admin,
              "        children: [\n          SegmentedButton<_AdminStep>(\n",
              "        children: [\n"
              "          if (_selectedMatchId != null)\n"
              "            UpcomingMatchFixtureHeader(matchId: _selectedMatchId!),\n"
              "          SegmentedButton<_AdminStep>(\n",
              'admin fixture placement',
          )
          admin_path.write_text(admin)

          player_path = Path('lib/features/sports_management/presentation/match_lineup_page.dart')
          player = player_path.read_text()
          player = replace_once(
              player,
              "import 'package:as_grinta/features/matches/presentation/widgets/match_info_tab.dart';\n",
              "import 'package:as_grinta/features/matches/presentation/widgets/match_info_tab.dart';\n"
              "import 'package:as_grinta/features/matches/presentation/widgets/upcoming_match_fixture_header.dart';\n",
              'player import',
          )
          player = replace_once(
              player,
              "          ref\n            ..invalidate(publishedMatchCompositionProvider(matchId))\n",
              "          ref\n"
              "            ..invalidate(upcomingMatchFixtureProvider(matchId))\n"
              "            ..invalidate(publishedMatchCompositionProvider(matchId))\n",
              'player refresh invalidation',
          )
          player = replace_once(
              player,
              "          await Future.wait([\n            if (showComposition)\n",
              "          await Future.wait([\n"
              "            ref.read(upcomingMatchFixtureProvider(matchId).future),\n"
              "            if (showComposition)\n",
              'player refresh wait',
          )
          player = replace_once(
              player,
              "          children: [\n            SegmentedButton<String>(\n",
              "          children: [\n"
              "            UpcomingMatchFixtureHeader(matchId: matchId),\n"
              "            SegmentedButton<String>(\n",
              'player fixture placement',
          )
          player_path.write_text(player)
          PY
      - name: Format the changed Dart files
        run: |
          dart format \
            lib/features/matches/presentation/widgets/upcoming_match_fixture_header.dart \
            lib/features/sports_management/presentation/admin_squad_plan_page.dart \
            lib/features/sports_management/presentation/match_lineup_page.dart
      - name: Commit the implementation and remove this temporary workflow
        run: |
          rm .github/workflows/apply-upcoming-match-fixture.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "Afficher l’affiche domicile extérieur [fixture-applied]"
          git push origin HEAD:feature/upcoming-match-fixture-header
