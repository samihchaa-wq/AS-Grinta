name: Restore guest test rollback

on:
  push:
    branches:
      - agent/clarify-effectif-publication

permissions:
  contents: write

jobs:
  restore:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/clarify-effectif-publication
          fetch-depth: 0

      - name: Restore rollback and remove workflow
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          path = Path('supabase/tests/database/sports_management_guests.test.sql')
          text = path.read_text().rstrip()
          if not text.endswith('rollback;'):
              path.write_text(text + '\nrollback;\n')
          PY
          git rm .github/workflows/z_restore_guest_rollback.yml

      - name: Commit
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Restaurer le rollback du test invité'
          git fetch origin agent/clarify-effectif-publication
          git rebase origin/agent/clarify-effectif-publication
          git push origin HEAD:agent/clarify-effectif-publication
