name: Apply compact match form labels

on:
  push:
    branches:
      - fix/compact-match-form-labels

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/compact-match-form-labels
          fetch-depth: 0
      - name: Apply requested UI changes
        run: python .github/scripts/apply_compact_match_form_labels.py
      - name: Commit changes
        run: |
          git rm .github/workflows/apply_compact_match_form_labels.yml
          git rm .github/scripts/apply_compact_match_form_labels.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/features/matches/presentation/calendar_entry_form_page.dart lib/features/matches/presentation/widgets/championship_round_tile.dart
          git commit -m "Compact match form labels"
          git push origin HEAD:fix/compact-match-form-labels
