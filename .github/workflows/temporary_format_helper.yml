name: Temporary Dart format helper

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  format:
    if: github.head_ref == 'agent/simplify-match-workflows'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Install locked dependencies
        run: flutter pub get --enforce-lockfile
      - name: Format changed Dart files
        run: |
          dart format \
            lib/features/auth/presentation/auth_loading_page.dart \
            lib/features/sports_management/presentation/admin_squad_plan_page_composition.dart \
            lib/features/sports_management/presentation/admin_squad_plan_page_effectif.dart
      - name: Upload formatted files
        uses: actions/upload-artifact@v4
        with:
          name: formatted-dart-files-v2
          path: |
            lib/features/auth/presentation/auth_loading_page.dart
            lib/features/sports_management/presentation/admin_squad_plan_page_composition.dart
            lib/features/sports_management/presentation/admin_squad_plan_page_effectif.dart
