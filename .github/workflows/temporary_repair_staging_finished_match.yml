name: Temporary repair staging finished match migration

on:
  push:
    branches: [cleanup-no-effectif-temp]
    paths:
      - '.github/workflows/temporary_repair_staging_finished_match.yml'

permissions:
  contents: write

env:
  SUPABASE_STAGING_PROJECT_ID: dhwrtdnjwdkvdyvojvjl
  SUPABASE_PRODUCTION_PROJECT_ID: ovzijmqrnsgcmryinkfa

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: cleanup-no-effectif-temp
          fetch-depth: 0
      - name: Guard staging target
        shell: bash
        run: |
          set -euo pipefail
          test "$SUPABASE_STAGING_PROJECT_ID" != "$SUPABASE_PRODUCTION_PROJECT_ID"
          test "$SUPABASE_STAGING_PROJECT_ID" = "dhwrtdnjwdkvdyvojvjl"
      - uses: supabase/setup-cli@3c2f5e2ae34c34e428e8e206e2c4d21fa2d20fbf # v2
        with:
          version: 2.111.0
      - name: Link staging
        shell: bash
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          set -euo pipefail
          test -n "${SUPABASE_ACCESS_TOKEN:-}"
          unset SUPABASE_DB_PASSWORD || true
          supabase link --project-ref "$SUPABASE_STAGING_PROJECT_ID"
      - name: Discover repair command and mark discarded migration reverted
        shell: bash
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          set -euo pipefail
          unset SUPABASE_DB_PASSWORD || true
          supabase migration repair --help
          supabase migration repair 20260826020719 --status reverted --linked
          supabase migration list --linked
      - name: Remove temporary workflow
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/temporary_repair_staging_finished_match.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Repair discarded staging migration history"
          git push origin HEAD:cleanup-no-effectif-temp
