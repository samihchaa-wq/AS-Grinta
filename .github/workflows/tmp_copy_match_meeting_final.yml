name: Temporary copy meeting-time implementation

on:
  push:
    branches: [feat/match-meeting-time-final]
    paths:
      - '.github/workflows/tmp_copy_match_meeting_final.yml'

permissions:
  contents: write

jobs:
  copy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: feat/match-meeting-time-final
          fetch-depth: 0
      - name: Copy reviewed feature files
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin feat/match-meeting-time
          git checkout origin/feat/match-meeting-time -- \
            lib/features/matches/data/calendar_matches_local_cache.dart \
            lib/features/matches/data/match_info_repository.dart \
            lib/features/matches/data/matches_repository.dart \
            lib/features/matches/data/scheduled_match_creation_repository.dart \
            lib/features/matches/domain/match_meeting.dart \
            lib/features/matches/domain/match_model.dart \
            lib/features/matches/presentation/calendar_entry_form_page.dart \
            lib/features/matches/presentation/match_form_page.dart \
            lib/features/matches/presentation/matches_controller.dart \
            lib/features/matches/presentation/widgets/match_info_tab.dart \
            lib/features/matches/presentation/widgets/match_meeting_time_picker.dart \
            supabase/migrations/20260825212000_match_meeting_time.sql \
            supabase/tests/database/match_meeting_time.test.sql \
            test/match_meeting_test.dart \
            test/match_meeting_time_picker_test.dart
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add lib supabase/migrations/20260825212000_match_meeting_time.sql supabase/tests/database/match_meeting_time.test.sql test
          git commit -m 'Add configurable match meeting time'
          git push origin HEAD:feat/match-meeting-time-final
