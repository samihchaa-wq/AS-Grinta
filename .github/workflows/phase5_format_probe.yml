name: Phase 5 format probe

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  format:
    if: github.head_ref == 'visual/ui-overhaul-phase-5'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Format profile
        run: dart format lib/features/profile/presentation/profile_page.dart
      - name: Upload formatted profile
        uses: actions/upload-artifact@v4
        with:
          name: phase5-formatted-profile
          path: lib/features/profile/presentation/profile_page.dart
