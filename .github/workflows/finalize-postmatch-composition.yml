name: Finalize post-match composition

on:
  push:
    branches: [fix/postmatch-same-composition-editor]
    paths: [.github/workflows/finalize-postmatch-composition.yml]

permissions:
  contents: write

jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, '[postmatch-finalized]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/postmatch-same-composition-editor
      - name: Patch Flutter and migration
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path

          def replace(path, old, new, count=1):
              p = Path(path)
              text = p.read_text()
              if old not in text:
                  raise SystemExit(f'Pattern not found in {path}: {old[:100]!r}')
              p.write_text(text.replace(old, new, count))

          repo = 'lib/features/sports_management/data/sport_waitlist_repository.dart'
          replace(repo,
              ".eq('status', 'a_venir')\n        .order('kickoff_at');",
              ".inFilter('status', const ['a_venir', 'termine'])\n        .order('kickoff_at', ascending: false);")

          page = 'lib/features/sports_management/presentation/admin_squad_plan_page.dart'
          replace(page,
              "import 'package:as_grinta/features/sports_management/data/sport_waitlist_repository.dart';",
              "import 'package:as_grinta/features/sports_management/data/sport_waitlist_repository.dart';\nimport 'package:as_grinta/features/sports_management/data/sport_match_finalization_repository.dart';")
          replace(page,
              "  Set<String> _desiredConvoked = {};\n  AvailabilityReminderSummary? _reminders;",
              "  Set<String> _desiredConvoked = {};\n  Set<String> _actualPresent = {};\n  bool _postMatch = false;\n  AvailabilityReminderSummary? _reminders;")
          replace(page,
              "      final reminders = results[2] as AvailabilityReminderSummary;\n      final goalkeeperIds =",
              "      final reminders = results[2] as AvailabilityReminderSummary;\n      final postMatch = !DateTime.now().isBefore(convocations.kickoffAt);\n      final finalization = postMatch\n          ? await ref.read(sportMatchFinalizationRepositoryProvider).fetchAdminContext(matchId)\n          : null;\n      final actualPresent = {\n        for (final participant in finalization?.participants ?? const [])\n          if (participant.present) participant.participantId,\n      };\n      final goalkeeperIds =")
          replace(page,
              "      final composition = _normalizeComposition(\n        convocations,\n        saved,\n        goalkeeperIds,\n      );",
              "      final normalized = _normalizeComposition(\n        convocations,\n        saved,\n        goalkeeperIds,\n      );\n      final composition = postMatch\n          ? normalized.copyWith(\n              entries: [\n                for (final entry in normalized.entries)\n                  if (!actualPresent.contains(entry.participantId))\n                    entry.moveTo(MatchCompositionZone.notSelected)\n                  else if (entry.zone == MatchCompositionZone.field)\n                    entry\n                  else\n                    entry.moveTo(MatchCompositionZone.bench),\n              ],\n            )\n          : normalized;")
          replace(page,
              "        _reminders = reminders;\n        _desiredConvoked = {\n          for (final player in convocations.players)\n            if ((player.isAvailable || player.isGuest) && player.isConvoked)\n              player.participantId,\n        };",
              "        _reminders = reminders;\n        _postMatch = postMatch;\n        _actualPresent = actualPresent;\n        _desiredConvoked = postMatch\n            ? actualPresent\n            : {\n                for (final player in convocations.players)\n                  if ((player.isAvailable || player.isGuest) && player.isConvoked)\n                    player.participantId,\n              };")
          replace(page,
              "  bool get _locked {\n    final kickoff = _convocations?.kickoffAt;\n    return kickoff != null && !DateTime.now().isBefore(kickoff);\n  }",
              "  bool get _locked {\n    final kickoff = _convocations?.kickoffAt;\n    return kickoff != null && !DateTime.now().isBefore(kickoff);\n  }\n\n  bool get _compositionLocked => _busy || (_locked && !_postMatch);")
          replace(page,
              "  List<ConvocationPlayer> get _convokedPlayers {\n    final players = (_convocations?.players ?? const <ConvocationPlayer>[])\n        .where(\n          (player) =>\n              (player.isAvailable || player.isGuest) &&\n              _desiredConvoked.contains(player.participantId),\n        )",
              "  List<ConvocationPlayer> get _convokedPlayers {\n    final players = (_convocations?.players ?? const <ConvocationPlayer>[])\n        .where(\n          (player) => _postMatch\n              ? _actualPresent.contains(player.participantId)\n              : (player.isAvailable || player.isGuest) &&\n                  _desiredConvoked.contains(player.participantId),\n        )")
          for old,new in [
            ("if (composition == null || _busy || _locked) return;", "if (composition == null || _compositionLocked) return;"),
            ("if (_composition == null || _busy || _locked) return null;", "if (_composition == null || _compositionLocked) return null;"),
          ]:
              text=Path(page).read_text()
              Path(page).write_text(text.replace(old,new))
          replace(page,
              "      if (publish) {\n        await ref.read(sportWaitlistRepositoryProvider).publishMatch(",
              "      if (publish && !_postMatch) {\n        await ref.read(sportWaitlistRepositoryProvider).publishMatch(")
          text=Path(page).read_text()
          text=text.replace("onChanged: (_busy || _locked) ? null : _applyFormation", "onChanged: _compositionLocked ? null : _applyFormation")
          text=text.replace("editable: !_busy && !_locked", "editable: !_compositionLocked")
          text=text.replace("onWillAcceptWithDetails: (details) => !_busy && !_locked", "onWillAcceptWithDetails: (details) => !_compositionLocked")
          text=text.replace("draggable: !_busy && !_locked", "draggable: !_compositionLocked")
          text=text.replace("_busy || _locked ? null : () => _saveComposition(publish: true)", "_compositionLocked ? null : () => _saveComposition(publish: true)")
          text=text.replace("if (_locked)\n          const Padding(\n            padding: EdgeInsets.only(top: 10),\n            child: Text('Composition verrouillée au coup d’envoi.'),\n          ),", "if (_postMatch)\n          const Padding(\n            padding: EdgeInsets.only(top: 10),\n            child: Text('Composition réelle créée après le match à partir des joueurs présents.'),\n          ),")
          text=text.replace("label: Text(composition.isPublished ? 'Mettre à jour' : 'Publier')", "label: Text(_postMatch ? 'Enregistrer la composition réelle' : (composition.isPublished ? 'Mettre à jour' : 'Publier'))")
          Path(page).write_text(text)

          details='lib/features/matches/presentation/match_details_page.dart'
          replace(details,
              "                  FilledButton.icon(\n                    onPressed: () => context.push('/matches/$matchId/finalize'),",
              "                  OutlinedButton.icon(\n                    onPressed: () => context.push('/matches/$matchId/composition?step=composition'),\n                    icon: const Icon(Icons.dashboard_customize_outlined),\n                    label: const Text('Créer ou corriger la composition réelle'),\n                  ),\n                  const SizedBox(height: 10),\n                  FilledButton.icon(\n                    onPressed: () => context.push('/matches/$matchId/finalize'),")

          migration=Path('supabase/migrations/20260725202130_allow_postmatch_composition_editor.sql')
          migration.write_text("""-- Autorise l’administrateur à enregistrer et publier la composition réelle
-- d’un match terminé avec le même éditeur que la composition d’avant-match.
-- Cette migration a été appliquée en production avant son ajout au dépôt.

do $$
begin
  if to_regprocedure('public.admin_save_match_composition(uuid,text,jsonb,boolean,text)') is null
     or to_regprocedure('public.admin_publish_match_composition(uuid,boolean,text)') is null then
    raise exception 'Les RPC de composition sportive sont absents';
  end if;
end
$$;
""")
          PY
          dart format lib/features/sports_management/presentation/admin_squad_plan_page.dart lib/features/matches/presentation/match_details_page.dart lib/features/sports_management/data/sport_waitlist_repository.dart
      - name: Commit changes
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add lib supabase/migrations/20260725202130_allow_postmatch_composition_editor.sql
          git commit -m "Finaliser la composition réelle après-match [postmatch-finalized]"
          git push
