name: Authenticated Admin Audit

on:
  push:
    branches: [audit/authenticated-admin-e2e]
    paths:
      - '.github/workflows/authenticated_admin_audit.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      APP_URL: https://samihchaa-wq.github.io/AS-Grinta/
      TEST_USERNAME: Testt
      TEST_PASSWORD: ${{ secrets.E2E_TESTT_PASSWORD }}
    steps:
      - name: Check secret
        shell: bash
        run: |
          set -euo pipefail
          test -n "$TEST_PASSWORD"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install Playwright Core
        run: npm install --no-save playwright-core@1.52.0

      - name: Run safe authenticated admin click journey
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p audit-artifacts/screenshots
          node <<'NODE'
          const fs = require('fs');
          const { chromium } = require('playwright-core');

          const APP_URL = process.env.APP_URL;
          const USERNAME = process.env.TEST_USERNAME;
          const PASSWORD = process.env.TEST_PASSWORD;
          if (!APP_URL || !USERNAME || !PASSWORD) throw new Error('Configuration E2E manquante');

          const browser = await chromium.launch({
            headless: true,
            executablePath: '/usr/bin/google-chrome',
            args: ['--no-sandbox', '--disable-dev-shm-usage'],
          });
          const context = await browser.newContext({
            viewport: { width: 390, height: 844 },
            deviceScaleFactor: 1,
            serviceWorkers: 'block',
          });
          const page = await context.newPage();
          const errors = [];
          const steps = [];
          let currentStep = 'boot';

          function record(kind, text) {
            errors.push({ step: currentStep, kind, text });
          }
          page.on('pageerror', e => record('pageerror', e.stack || e.message));
          page.on('console', m => {
            if (m.type() === 'error') record('console.error', m.text());
          });
          page.on('requestfailed', r => record('requestfailed', `${r.url()} ${r.failure()?.errorText ?? ''}`));
          page.on('response', r => {
            if (r.status() >= 400) record(`http ${r.status()}`, r.url());
          });

          function routeUrl(route) {
            return `${APP_URL}#${route}`;
          }
          async function pause(ms = 1500) {
            await page.waitForTimeout(ms);
          }
          async function enableSemantics() {
            try {
              await page.evaluate(() => {
                const p = document.querySelector('flt-semantics-placeholder');
                if (p) p.click();
              });
              await pause(350);
            } catch (_) {}
          }
          async function visit(route) {
            await page.goto(routeUrl(route), { waitUntil: 'networkidle', timeout: 60000 });
            await pause(1200);
            await enableSemantics();
          }
          async function clickLabel(label) {
            const aria = page.locator(`[aria-label="${label}"]`).first();
            if (await aria.count()) {
              await aria.click({ force: true });
              return;
            }
            const text = page.getByText(label, { exact: true }).first();
            if (await text.count()) {
              await text.click({ force: true });
              return;
            }
            throw new Error(`Action introuvable: ${label}`);
          }
          async function typeInto(label, value) {
            const aria = page.locator(`[aria-label="${label}"]`).first();
            if (await aria.count()) {
              await aria.click({ force: true });
            } else {
              const text = page.getByText(label, { exact: true }).first();
              await text.click({ force: true });
            }
            await page.keyboard.type(value);
          }
          async function snap(index, name) {
            await page.screenshot({
              path: `audit-artifacts/screenshots/${String(index).padStart(2, '0')}-${name}.png`,
              fullPage: true,
            });
          }
          async function runStep(index, name, fn) {
            currentStep = name;
            const before = errors.length;
            const start = Date.now();
            let status = 'ok';
            let detail = '';
            try {
              await fn();
            } catch (e) {
              status = 'failed';
              detail = String(e.stack || e);
              record('journey', detail);
            }
            steps.push({
              name,
              status,
              durationMs: Date.now() - start,
              url: page.url(),
              detail,
              errors: errors.slice(before),
            });
          }

          try {
            currentStep = 'login';
            await page.goto(`${APP_URL}?admin-click-audit=${Date.now()}`, { waitUntil: 'networkidle', timeout: 90000 });
            await page.waitForFunction(() => document.querySelector('flutter-view, flt-glass-pane, canvas') !== null, null, { timeout: 45000 });
            await pause(1800);
            await enableSemantics();
            await visit('/auth/sign-in');
            await typeInto('Identifiant', USERNAME);
            await typeInto('Mot de passe', PASSWORD);
            await clickLabel('Se connecter');
            await page.waitForFunction(() => !location.hash.includes('/auth/'), null, { timeout: 45000 });
            await pause(2200);
            await enableSemantics();
            await snap(1, 'authenticated');

            await runStep(2, 'admin-menu-comptes', async () => {
              await visit('/admin');
              await clickLabel('Comptes et saison');
              await pause(1600);
              await enableSemantics();
              await snap(2, 'admin-comptes-click');
            });

            await runStep(3, 'admin-menu-effectif', async () => {
              await visit('/admin');
              await clickLabel('Effectif');
              await pause(1600);
              await enableSemantics();
              await snap(3, 'admin-effectif-click');
            });

            await runStep(4, 'create-match-open-cancel', async () => {
              await visit('/admin/matches');
              await clickLabel('Créer un match');
              await pause(1200);
              await enableSemantics();
              await snap(4, 'create-match-form');
              await page.goBack({ waitUntil: 'networkidle', timeout: 30000 }).catch(() => null);
              await pause(900);
            });

            await runStep(5, 'create-guest-open-cancel', async () => {
              await visit('/admin/guests');
              await clickLabel('Créer un invité');
              await pause(1200);
              await enableSemantics();
              await snap(5, 'create-guest-form');
              await page.keyboard.press('Escape').catch(() => null);
              await pause(500);
            });

            await runStep(6, 'stats-tabs', async () => {
              await visit('/stats?section=players');
              await clickLabel('Équipe');
              await pause(1100);
              await snap(6, 'stats-team-click');
              await clickLabel('Prono');
              await pause(1100);
              await snap(7, 'stats-prono-click');
              await clickLabel('Joueurs');
              await pause(1100);
              await snap(8, 'stats-players-return');
            });

            await runStep(9, 'composition-tabs', async () => {
              await visit('/matches/7ad3c789-b308-4d3a-ada3-a592c5509b09/composition');
              await clickLabel('Compo');
              await pause(1300);
              await snap(9, 'composition-compo-click');
              await clickLabel('Effectif');
              await pause(700);
              await clickLabel("Voir la liste d’attente");
              await pause(1200);
              await enableSemantics();
              await snap(10, 'composition-waitlist-click');
            });

            await runStep(11, 'composition-refresh', async () => {
              await visit('/admin/composition');
              await clickLabel('Actualiser');
              await pause(1800);
              await snap(11, 'composition-refresh');
            });

            const summary = {
              timestamp: new Date().toISOString(),
              username: USERNAME,
              finalUrl: page.url(),
              steps,
              errors,
            };
            fs.writeFileSync('audit-artifacts/admin-click-audit.json', JSON.stringify(summary, null, 2));
            fs.writeFileSync('audit-artifacts/admin-click-audit.txt', [
              `Authenticated as: ${USERNAME}`,
              ...steps.map(s => `${s.status.padEnd(8)} ${String(s.durationMs).padStart(6)}ms ${s.name} -> ${s.url}`),
              '',
              `Errors observed: ${errors.length}`,
              ...errors.map(e => `[${e.step}] ${e.kind}: ${e.text}`),
            ].join('\n'));
          } catch (e) {
            fs.writeFileSync('audit-artifacts/fatal-error.txt', String(e.stack || e));
            try { await snap(99, 'fatal'); } catch (_) {}
            await browser.close();
            process.exit(1);
          }

          await browser.close();
          NODE

      - name: Print click audit summary
        if: always()
        run: |
          if [ -f audit-artifacts/admin-click-audit.txt ]; then
            cat audit-artifacts/admin-click-audit.txt
          elif [ -f audit-artifacts/fatal-error.txt ]; then
            cat audit-artifacts/fatal-error.txt
          fi

      - name: Upload audit artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: authenticated-admin-click-audit
          path: audit-artifacts/
          if-no-files-found: error
          retention-days: 7
