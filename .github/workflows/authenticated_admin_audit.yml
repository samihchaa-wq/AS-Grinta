name: Authenticated Admin Audit

on:
  push:
    branches: [audit/authenticated-admin-e2e]
    paths:
      - '.github/workflows/authenticated_admin_audit.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      APP_URL: https://samihchaa-wq.github.io/AS-Grinta/
      TEST_USERNAME: Testt
      TEST_PASSWORD: ${{ secrets.E2E_TESTT_PASSWORD }}
      AUDIT_MATCH_ID: 2b0aedfc-13c1-4ff7-9f56-152d1a23963f
    steps:
      - name: Check secret
        run: test -n "$TEST_PASSWORD"
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install Playwright Core
        run: npm install --no-save playwright-core@1.52.0
      - name: Sweep authenticated routes
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p audit-artifacts/screenshots
          node <<'NODE'
          const fs = require('fs');
          const { chromium } = require('playwright-core');
          (async () => {
            const APP_URL = process.env.APP_URL;
            const matchId = process.env.AUDIT_MATCH_ID;
            const browser = await chromium.launch({headless:true, executablePath:'/usr/bin/google-chrome', args:['--no-sandbox','--disable-dev-shm-usage']});
            const context = await browser.newContext({viewport:{width:390,height:844},serviceWorkers:'block'});
            const page = await context.newPage();
            const errors=[]; const routes=[]; let current='login'; let shot=0;
            const record=(kind,text)=>errors.push({step:current,kind,text});
            page.on('pageerror',e=>record('pageerror',e.stack||e.message));
            page.on('console',m=>{if(m.type()==='error')record('console.error',m.text())});
            page.on('requestfailed',r=>record('requestfailed',`${r.url()} ${r.failure()?.errorText||''}`));
            page.on('response',r=>{if(r.status()>=400)record(`http ${r.status()}`,r.url())});
            const pause=ms=>page.waitForTimeout(ms);
            async function semantics(){try{await page.evaluate(()=>document.querySelector('flt-semantics-placeholder')?.click());await pause(300)}catch(_){}}
            async function snap(name){shot++;await page.screenshot({path:`audit-artifacts/screenshots/${String(shot).padStart(3,'0')}-${name.replace(/[^a-zA-Z0-9_-]+/g,'-').slice(0,70)}.png`,fullPage:true})}
            async function focus(label){const a=page.locator(`[aria-label="${label}"]`).first();if(await a.count())return a.click({force:true});const t=page.getByText(label,{exact:true}).first();if(await t.count())return t.click({force:true});throw new Error(`missing ${label}`)}
            async function click(label){return focus(label)}
            await page.goto(`${APP_URL}?audit-login=${Date.now()}`,{waitUntil:'networkidle',timeout:90000});
            await page.waitForFunction(()=>document.querySelector('flutter-view,flt-glass-pane,canvas')!==null,null,{timeout:45000});
            await pause(2200); await semantics();
            await page.goto(`${APP_URL}?audit-signin=${Date.now()}#/auth/sign-in`,{waitUntil:'networkidle',timeout:60000});
            await pause(1200); await semantics();
            await focus('Identifiant'); await page.keyboard.type(process.env.TEST_USERNAME);
            await focus('Mot de passe'); await page.keyboard.type(process.env.TEST_PASSWORD);
            await click('Se connecter');
            await page.waitForFunction(()=>!location.hash.includes('/auth/'),null,{timeout:45000});
            await pause(2500); await semantics(); await snap('authenticated');
            const list=[
              `/matches/${matchId}/lineup?section=effectif`,
              `/matches/${matchId}/lineup?section=composition`,
              `/matches/${matchId}/lineup?section=prediction`,
              `/matches/${matchId}`,
              `/matches/${matchId}/composition`,
              `/matches/${matchId}/guests`,
              `/matches/${matchId}/vote`,
              `/matches/${matchId}/finalize`,
              '/matches','/admin','/admin/administration','/admin/matches','/admin/composition','/admin/guests','/admin/waitlist','/waitlist','/admin/badges','/admin/notification','/players','/profile','/privacy','/armoire','/notifications','/stats?section=players','/stats?section=team','/stats?section=rankings&view=matches','/stats?section=rankings&view=scorers','/more'
            ];
            for(const route of list){
              current=`route:${route}`; const before=errors.length; const start=Date.now();
              try{
                await page.goto(`${APP_URL}?route-audit=${Date.now()}#${route}`,{waitUntil:'networkidle',timeout:60000});
                await pause(900); await semantics();
                const text=(await page.locator('body').innerText().catch(()=>'' )).replace(/\s+/g,' ').trim();
                routes.push({route,status:'ok',finalUrl:page.url(),durationMs:Date.now()-start,newErrors:errors.length-before,text:text.slice(0,1800)});
                await snap(`route-${route}`);
              }catch(e){routes.push({route,status:'failed',durationMs:Date.now()-start,detail:String(e.stack||e)});try{await snap(`failed-${route}`)}catch(_){}}
            }
            fs.writeFileSync('audit-artifacts/route-sweep.json',JSON.stringify({matchId,routes,errors},null,2));
            fs.writeFileSync('audit-artifacts/route-sweep.txt',[
              ...routes.map(r=>`${r.status.padEnd(6)} ${r.route} -> ${r.finalUrl||''} errors=${r.newErrors??''}\nTEXT ${r.text||''}`),
              '',`ERRORS ${errors.length}`,...errors.map(e=>`[${e.step}] ${e.kind}: ${e.text}`)
            ].join('\n'));
            await browser.close();
          })().catch(e=>{console.error(e);process.exit(1)});
          NODE
      - name: Print summary
        if: always()
        run: test ! -f audit-artifacts/route-sweep.txt || cat audit-artifacts/route-sweep.txt
      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: prepared-match-route-sweep
          path: audit-artifacts/
          if-no-files-found: error
          retention-days: 7
