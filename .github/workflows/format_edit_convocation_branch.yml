name: Format convocation edit branch

on:
  push:
    branches:
      - fix/edit-convocation-launch
    paths:
      - lib/features/matches/data/match_edit_schedule_repository.dart
      - lib/features/matches/presentation/match_form_page.dart
      - .github/workflows/format_edit_convocation_branch.yml

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: fix/edit-convocation-launch
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
        with:
          channel: stable
          cache: true
      - name: Format changed Dart files
        run: |
          dart format \
            lib/features/matches/data/match_edit_schedule_repository.dart \
            lib/features/matches/presentation/match_form_page.dart
          if git diff --quiet --exit-code; then
            echo "Already formatted."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            lib/features/matches/data/match_edit_schedule_repository.dart \
            lib/features/matches/presentation/match_form_page.dart
          git commit -m "Format convocation edit Dart files"
          git push origin HEAD:fix/edit-convocation-launch
