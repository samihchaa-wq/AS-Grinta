name: Temporary compact match form patch

on:
  push:
    branches: [feat/compact-match-form-controls]

permissions:
  contents: write

jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, '[compact-form-patch]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Patch form pages
        shell: python
        run: |
          from pathlib import Path

          def replace_once(text, old, new, label):
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected exactly one occurrence, found {count}')
              return text.replace(old, new, 1)

          calendar_path = Path('lib/features/matches/presentation/calendar_entry_form_page.dart')
          calendar = calendar_path.read_text()
          calendar = replace_once(
              calendar,
              "import 'package:as_grinta/features/matches/presentation/widgets/match_meeting_time_picker.dart';\nimport 'package:flutter/material.dart';",
              "import 'package:as_grinta/features/matches/presentation/widgets/match_meeting_time_picker.dart';\nimport 'package:as_grinta/features/matches/presentation/widgets/match_option_button.dart';\nimport 'package:as_grinta/features/matches/presentation/widgets/match_wheel_picker.dart';\nimport 'package:flutter/material.dart';",
              'calendar imports',
          )
          calendar = calendar.replace(
              'bool _rememberAddressAsDefault = false;',
              'bool _rememberAddressAsDefault = true;',
          )
          calendar = replace_once(
              calendar,
              """                DropdownButtonFormField<_CalendarEntryKind>(
                  initialValue: _kind,
                  decoration: const InputDecoration(
                    labelText: 'Type',
                    prefixIcon: Icon(Icons.category_outlined),
                  ),
                  items: const [
                    DropdownMenuItem(
                      value: _CalendarEntryKind.championnat,
                      child: Text('Championnat'),
                    ),
                    DropdownMenuItem(
                      value: _CalendarEntryKind.amical,
                      child: Text('Amical'),
                    ),
                    DropdownMenuItem(
                      value: _CalendarEntryKind.internal,
                      child: Text('Match entre nous'),
                    ),
                    DropdownMenuItem(
                      value: _CalendarEntryKind.event,
                      child: Text('Événement'),
                    ),
                  ],
                  onChanged: busy ? null : _changeKind,
                ),
                const SizedBox(height: 18),""",
              """                _typeSelector(busy: busy),
                const SizedBox(height: 14),""",
              'calendar type selector',
          )
          calendar = replace_once(
              calendar,
              """      const SizedBox(height: 8),
      _dateTile(),
      _timeTile(),
      const SizedBox(height: 12),""",
              """      const SizedBox(height: 8),
      _dateTimeFields(),
      const SizedBox(height: 12),""",
              'calendar event date time',
          )
          calendar = replace_once(
              calendar,
              """        DropdownButtonFormField<bool>(
          initialValue: _isHome,
          decoration: const InputDecoration(labelText: 'Lieu'),
          items: const [
            DropdownMenuItem(value: true, child: Text('Domicile')),
            DropdownMenuItem(value: false, child: Text('Extérieur')),
          ],
          onChanged: busy
              ? null
              : (value) {
                  setState(() {
                    _isHome = value ?? true;
                    _refreshAddressForSelection();
                  });
                  _suggestOdds();
                },
        ),""",
              """        _locationSelector(busy: busy),""",
              'calendar location selector',
          )
          calendar = replace_once(
              calendar,
              """      const SizedBox(height: 12),
      _dateTile(),
      _timeTile(),
      MatchMeetingTimePicker(""",
              """      const SizedBox(height: 12),
      _dateTimeFields(enabled: !busy),
      const SizedBox(height: 12),
      MatchMeetingTimePicker(""",
              'calendar match date time',
          )
          calendar = calendar.replace(
              """        textCapitalization: TextCapitalization.words,
        maxLength: 300,""",
              """        textCapitalization: TextCapitalization.words,
        keyboardType: TextInputType.streetAddress,
        minLines: 2,
        maxLines: null,
        maxLength: 300,""",
          )
          calendar = replace_once(
              calendar,
              """          title: const Text(
            'Utiliser cette adresse par défaut pour les prochains matchs',
          ),
          subtitle: Text(
            _isHome
                ? 'Met à jour le terrain par défaut d’AS Grinta.'
                : 'Met à jour le terrain par défaut de l’adversaire.',
          ),""",
              """          title: const Text('Garder cette adresse pour cette équipe'),""",
              'calendar address checkbox',
          )
          calendar = replace_once(
              calendar,
              """          TextFormField(
            controller: _squadSizeController,
            keyboardType: TextInputType.number,
            decoration: const InputDecoration(
              labelText: 'Nombre de joueurs convoqués',
            ),
            validator: (raw) {
              final value = int.tryParse(raw?.trim() ?? '');
              if (value == null || value < 1 || value > 30) {
                return 'Choisissez un nombre entre 1 et 30';
              }
              return null;
            },
          ),""",
              """          MatchValueButton(
            label: 'Nombre de joueurs convoqués',
            value: _squadSizeController.text,
            icon: Icons.groups_outlined,
            onPressed: busy ? null : _pickSquadSize,
          ),""",
              'calendar squad picker',
          )
          calendar = replace_once(
              calendar,
              """  Widget _dateTile() => ListTile(
        contentPadding: EdgeInsets.zero,
        title: const Text('Date'),
        subtitle: Text(_formatDate(_startsAt)),
        trailing: const Icon(Icons.calendar_today),
        onTap: _pickDate,
      );

  Widget _timeTile() => ListTile(
        contentPadding: EdgeInsets.zero,
        title: const Text('Heure'),
        subtitle: Text(_formatTime(_startsAt)),
        trailing: const Icon(Icons.schedule),
        onTap: _pickTime,
      );""",
              """  Widget _typeSelector({required bool busy}) {
    return Column(
      crossAxisAlignment: CrossAxisAlignment.stretch,
      children: [
        Text(
          'Type',
          style: Theme.of(context)
              .textTheme
              .titleSmall
              ?.copyWith(fontWeight: FontWeight.w800),
        ),
        const SizedBox(height: 8),
        Row(
          children: [
            Expanded(
              child: MatchOptionButton(
                label: 'Championnat',
                selected: _kind == _CalendarEntryKind.championnat,
                onPressed: busy
                    ? null
                    : () => _changeKind(_CalendarEntryKind.championnat),
                height: 50,
              ),
            ),
            const SizedBox(width: 8),
            Expanded(
              child: MatchOptionButton(
                label: 'Amical',
                selected: _kind == _CalendarEntryKind.amical,
                onPressed: busy
                    ? null
                    : () => _changeKind(_CalendarEntryKind.amical),
                height: 50,
              ),
            ),
          ],
        ),
        const SizedBox(height: 8),
        Row(
          children: [
            Expanded(
              child: MatchOptionButton(
                label: 'Match entre nous',
                selected: _kind == _CalendarEntryKind.internal,
                onPressed: busy
                    ? null
                    : () => _changeKind(_CalendarEntryKind.internal),
                height: 50,
              ),
            ),
            const SizedBox(width: 8),
            Expanded(
              child: MatchOptionButton(
                label: 'Événement',
                selected: _kind == _CalendarEntryKind.event,
                onPressed: busy
                    ? null
                    : () => _changeKind(_CalendarEntryKind.event),
                height: 50,
              ),
            ),
          ],
        ),
      ],
    );
  }

  Widget _locationSelector({required bool busy}) {
    return Column(
      crossAxisAlignment: CrossAxisAlignment.stretch,
      children: [
        Text(
          'Lieu',
          style: Theme.of(context)
              .textTheme
              .titleSmall
              ?.copyWith(fontWeight: FontWeight.w800),
        ),
        const SizedBox(height: 8),
        Row(
          children: [
            Expanded(
              child: MatchOptionButton(
                label: 'Domicile',
                selected: _isHome,
                onPressed: busy ? null : () => _setLocation(true),
              ),
            ),
            const SizedBox(width: 8),
            Expanded(
              child: MatchOptionButton(
                label: 'Extérieur',
                selected: !_isHome,
                onPressed: busy ? null : () => _setLocation(false),
              ),
            ),
          ],
        ),
      ],
    );
  }

  void _setLocation(bool isHome) {
    if (_isHome == isHome) return;
    setState(() {
      _isHome = isHome;
      _refreshAddressForSelection();
    });
    _suggestOdds();
  }

  Widget _dateTimeFields({bool enabled = true}) {
    return Row(
      children: [
        Expanded(
          child: MatchValueButton(
            label: 'Date',
            value: _formatDate(_startsAt),
            icon: Icons.calendar_today_outlined,
            onPressed: enabled ? _pickDate : null,
          ),
        ),
        const SizedBox(width: 8),
        Expanded(
          child: MatchValueButton(
            label: 'Heure',
            value: _formatTime(_startsAt),
            icon: Icons.schedule_outlined,
            onPressed: enabled ? _pickTime : null,
          ),
        ),
      ],
    );
  }""",
              'calendar compact helpers',
          )
          calendar = calendar.replace(
              '_rememberAddressAsDefault = false;',
              '_rememberAddressAsDefault = true;',
          )
          calendar = replace_once(
              calendar,
              """  Future<void> _pickDate() async {
    final today = DateUtils.dateOnly(DateTime.now());
    final date = await showDatePicker(
      context: context,
      initialDate: _startsAt,
      firstDate: widget.event == null
          ? today
          : DateUtils.dateOnly(_startsAt).isBefore(today)
              ? DateUtils.dateOnly(_startsAt)
              : today,
      lastDate: DateTime.now().add(const Duration(days: 3650)),
    );
    if (date == null) return;
    setState(() {
      _startsAt = DateTime(
        date.year,
        date.month,
        date.day,
        _startsAt.hour,
        _startsAt.minute,
      );
      _repairCustomLaunchIfNeeded();
      _repairMeetingAt();
    });
    if (_isNormalMatch && _opponentId.isNotEmpty) {
      await _suggestOdds();
    }
  }

  Future<void> _pickTime() async {
    final time = await showTimePicker(
      context: context,
      initialTime: TimeOfDay.fromDateTime(_startsAt),
      builder: (context, child) => MediaQuery(
        data: MediaQuery.of(context).copyWith(alwaysUse24HourFormat: true),
        child: child!,
      ),
    );
    if (time == null) return;
    setState(() {
      _startsAt = DateTime(
        _startsAt.year,
        _startsAt.month,
        _startsAt.day,
        time.hour,
        time.minute,
      );
      _repairCustomLaunchIfNeeded();
      _repairMeetingAt();
    });
  }

  void _repairMeetingAt() {
    _meetingAt = preserveCustomMeetingTime(
      kickoffAt: _startsAt,
      customMeetingAt: _meetingAt,
    );
  }""",
              """  Future<void> _pickDate() async {
    final today = DateUtils.dateOnly(DateTime.now());
    final previousStartsAt = _startsAt;
    final date = await showMatchDateWheelPicker(
      context: context,
      initialValue: _startsAt,
      minimumDate: widget.event == null
          ? today
          : DateUtils.dateOnly(_startsAt).isBefore(today)
              ? DateUtils.dateOnly(_startsAt)
              : today,
      maximumDate: DateTime.now().add(const Duration(days: 3650)),
      title: 'Date du match',
    );
    if (date == null) return;
    setState(() {
      _startsAt = DateTime(
        date.year,
        date.month,
        date.day,
        _startsAt.hour,
        _startsAt.minute,
      );
      _repairCustomLaunchIfNeeded();
      _repairMeetingAt(previousKickoffAt: previousStartsAt);
    });
    if (_isNormalMatch && _opponentId.isNotEmpty) {
      await _suggestOdds();
    }
  }

  Future<void> _pickTime() async {
    final previousStartsAt = _startsAt;
    final time = await showMatchTimeWheelPicker(
      context: context,
      initialValue: _startsAt,
      title: 'Heure du match',
    );
    if (time == null) return;
    setState(() {
      _startsAt = DateTime(
        _startsAt.year,
        _startsAt.month,
        _startsAt.day,
        time.hour,
        time.minute,
      );
      _repairCustomLaunchIfNeeded();
      _repairMeetingAt(previousKickoffAt: previousStartsAt);
    });
  }

  Future<void> _pickSquadSize() async {
    final current = int.tryParse(_squadSizeController.text.trim()) ?? 14;
    final picked = await showMatchNumberWheelPicker(
      context: context,
      initialValue: current,
      minimumValue: 1,
      maximumValue: 30,
      title: 'Nombre de joueurs convoqués',
    );
    if (picked == null || !mounted) return;
    setState(() => _squadSizeController.text = '$picked');
  }

  void _repairMeetingAt({DateTime? previousKickoffAt}) {
    _meetingAt = preserveCustomMeetingTime(
      kickoffAt: _startsAt,
      customMeetingAt: _meetingAt,
      previousKickoffAt: previousKickoffAt,
    );
  }""",
              'calendar wheel picker methods',
          )
          calendar_path.write_text(calendar)

          match_path = Path('lib/features/matches/presentation/match_form_page.dart')
          match = match_path.read_text()
          match = replace_once(
              match,
              "import 'package:as_grinta/features/matches/presentation/widgets/match_meeting_time_picker.dart';\nimport 'package:flutter/material.dart';",
              "import 'package:as_grinta/features/matches/presentation/widgets/match_meeting_time_picker.dart';\nimport 'package:as_grinta/features/matches/presentation/widgets/match_option_button.dart';\nimport 'package:as_grinta/features/matches/presentation/widgets/match_wheel_picker.dart';\nimport 'package:flutter/material.dart';",
              'match imports',
          )
          match = match.replace(
              'bool _rememberAddressAsDefault = false;',
              'bool _rememberAddressAsDefault = true;',
          )
          match = replace_once(
              match,
              """              DropdownButtonFormField<String>(
                initialValue: _isInternal ? 'entre_nous' : _matchType,
                decoration: const InputDecoration(
                  labelText: 'Type',
                  prefixIcon: Icon(Icons.category_outlined),
                ),
                items: [
                  if (!(widget.match?.isInternal ?? false)) ...const [
                    DropdownMenuItem(
                      value: 'championnat',
                      child: Text('Championnat'),
                    ),
                    DropdownMenuItem(value: 'amical', child: Text('Amical')),
                  ],
                  if (widget.match == null ||
                      (widget.match?.isInternal ?? false))
                    const DropdownMenuItem(
                      value: 'entre_nous',
                      child: Text('Match entre nous'),
                    ),
                ],
                onChanged: (widget.match?.isInternal ?? false) || busy
                    ? null
                    : _changeMatchKind,
              ),
              const SizedBox(height: 18),""",
              """              _matchTypeSelector(busy: busy),
              const SizedBox(height: 14),""",
              'match type selector',
          )
          match = replace_once(
              match,
              """                DropdownButtonFormField<bool>(
                  initialValue: _isHome,
                  decoration: const InputDecoration(labelText: 'Lieu'),
                  items: const [
                    DropdownMenuItem(value: true, child: Text('Domicile')),
                    DropdownMenuItem(value: false, child: Text('Extérieur')),
                  ],
                  onChanged: busy
                      ? null
                      : (value) {
                          setState(() {
                            _isHome = value ?? true;
                            _refreshAddressForSelection();
                          });
                          _suggestOdds();
                        },
                ),""",
              """                _locationSelector(busy: busy),""",
              'match location selector',
          )
          match = replace_once(
              match,
              """              const SizedBox(height: 12),
              ListTile(
                contentPadding: EdgeInsets.zero,
                title: const Text('Date'),
                subtitle: Text(_formatDate(_kickoffAt)),
                trailing: const Icon(Icons.calendar_today),
                onTap: busy ? null : _pickDate,
              ),
              ListTile(
                contentPadding: EdgeInsets.zero,
                title: const Text('Heure'),
                subtitle: Text(_formatTime(_kickoffAt)),
                trailing: const Icon(Icons.schedule),
                onTap: busy ? null : _pickTime,
              ),""",
              """              const SizedBox(height: 12),
              _dateTimeFields(enabled: !busy),
              const SizedBox(height: 12),""",
              'match date time row',
          )
          match = replace_once(
              match,
              """                textCapitalization: TextCapitalization.words,
                maxLength: 300,""",
              """                textCapitalization: TextCapitalization.words,
                keyboardType: TextInputType.streetAddress,
                minLines: 2,
                maxLines: null,
                maxLength: 300,""",
              'match address multiline',
          )
          match = replace_once(
              match,
              """                  title: const Text(
                    'Utiliser cette adresse par défaut pour les prochains matchs',
                  ),
                  subtitle: Text(
                    _isHome
                        ? 'Met à jour le terrain par défaut d’AS Grinta.'
                        : 'Met à jour le terrain par défaut de l’adversaire.',
                  ),""",
              """                  title: const Text('Garder cette adresse pour cette équipe'),""",
              'match address checkbox',
          )
          match = replace_once(
              match,
              """                  TextFormField(
                    controller: _squadSizeController,
                    enabled: !busy,
                    keyboardType: TextInputType.number,
                    decoration: InputDecoration(
                      labelText: 'Nombre de joueurs convoqués',
                      suffixIcon: _squadLimitLoading
                          ? const Padding(
                              padding: EdgeInsets.all(12),
                              child: GrintaProgressIndicator(strokeWidth: 2),
                            )
                          : null,
                    ),
                    validator: (raw) {
                      final value = int.tryParse(raw?.trim() ?? '');
                      if (value == null || value < 1 || value > 30) {
                        return 'Choisissez un nombre entre 1 et 30';
                      }
                      return null;
                    },
                  ),""",
              """                  MatchValueButton(
                    label: 'Nombre de joueurs convoqués',
                    value: _squadSizeController.text,
                    icon: Icons.groups_outlined,
                    onPressed: busy ? null : _pickSquadSize,
                  ),""",
              'match squad picker',
          )
          match = replace_once(
              match,
              """  Future<void> _createOpponent() async {""",
              """  Widget _matchTypeSelector({required bool busy}) {
    final internalLocked = widget.match?.isInternal ?? false;
    return Column(
      crossAxisAlignment: CrossAxisAlignment.stretch,
      children: [
        Text(
          'Type',
          style: Theme.of(context)
              .textTheme
              .titleSmall
              ?.copyWith(fontWeight: FontWeight.w800),
        ),
        const SizedBox(height: 8),
        Row(
          children: [
            Expanded(
              child: MatchOptionButton(
                label: 'Championnat',
                selected: !_isInternal && _matchType == 'championnat',
                onPressed: busy || internalLocked
                    ? null
                    : () => _changeMatchKind('championnat'),
                height: 50,
              ),
            ),
            const SizedBox(width: 8),
            Expanded(
              child: MatchOptionButton(
                label: 'Amical',
                selected: !_isInternal && _matchType == 'amical',
                onPressed: busy || internalLocked
                    ? null
                    : () => _changeMatchKind('amical'),
                height: 50,
              ),
            ),
          ],
        ),
        if (widget.match == null || internalLocked) ...[
