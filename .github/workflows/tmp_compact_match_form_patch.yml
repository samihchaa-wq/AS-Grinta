name: Temporary compact match form cleanup

on:
  push:
    branches: [feat/compact-match-form-controls]

permissions:
  contents: write

jobs:
  cleanup:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0

      - name: Clean temporary scaffolding and restore address default
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('lib/features/matches/presentation/calendar_entry_form_page.dart')
          text = path.read_text()
          old = "      _kind = kind;\n      _rememberAddressAsDefault = false;\n"
          new = "      _kind = kind;\n      _rememberAddressAsDefault = kind != _CalendarEntryKind.event;\n"
          count = text.count(old)
          if count != 1:
              raise SystemExit(f'address default patch: expected 1 occurrence, found {count}')
          path.write_text(text.replace(old, new, 1))
          PY

          rm -f tools/tmp_patch_compact_forms.py
          rm -f .github/workflows/tmp_compact_match_form_patch.yml

      - name: Commit cleanup
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Clean compact match form branch"
          git push
