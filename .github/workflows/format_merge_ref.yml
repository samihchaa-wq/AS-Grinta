name: Temporary merge-ref formatter

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  format:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.8'
          channel: stable
          cache: true
      - name: Resolve package formatting config
        run: flutter pub get
      - name: Format merge-ref files and copy them back to the PR branch
        shell: bash
        run: |
          set -euo pipefail
          files=(
            lib/features/matches/presentation/matches_page.dart
            lib/features/matches/presentation/widgets/admin_match_options_button.dart
            lib/features/predictions/presentation/merged_matches_view.dart
          )
          dart format "${files[@]}"
          tmpdir="$(mktemp -d)"
          for file in "${files[@]}"; do
            mkdir -p "$tmpdir/$(dirname "$file")"
            cp "$file" "$tmpdir/$file"
          done
          git checkout -B agent/match-lifecycle-cleanup origin/agent/match-lifecycle-cleanup
          for file in "${files[@]}"; do
            cp "$tmpdir/$file" "$file"
          done
          if git diff --quiet -- "${files[@]}"; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "${files[@]}"
          git commit -m "Format lifecycle files with resolved package config"
          git push origin HEAD:agent/match-lifecycle-cleanup
