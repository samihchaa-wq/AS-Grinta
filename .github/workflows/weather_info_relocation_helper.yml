name: Weather info relocation helper

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/weather_info_relocation_helper.yml'

permissions:
  contents: write

jobs:
  relocate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - name: Move weather from calendar card to match Info tab
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          home = Path('lib/features/home/presentation/home_next_match_card.dart')
          text = home.read_text()
          text = text.replace(
              "import 'package:as_grinta/features/weather/presentation/match_weather_card.dart';\n",
              '',
          )
          weather_block = '''                    MatchWeatherCard(
                      matchId: match.id,
                      kickoffAt: match.kickoffAt,
                      plannedDurationMinutes: match.plannedDurationMinutes,
                    ),
'''
          if weather_block not in text:
              raise SystemExit('Weather block not found in HomeNextMatchCard')
          home.write_text(text.replace(weather_block, '', 1))

          info = Path('lib/features/matches/presentation/widgets/match_info_tab.dart')
          text = info.read_text()
          import_anchor = "import 'package:as_grinta/features/matches/domain/jersey_option.dart';\n"
          weather_import = "import 'package:as_grinta/features/weather/presentation/match_weather_card.dart';\n"
          if weather_import not in text:
              if import_anchor not in text:
                  raise SystemExit('MatchInfoTab import anchor not found')
              text = text.replace(import_anchor, import_anchor + weather_import, 1)

          encounter_anchor = '''              const SizedBox(height: 24),
              Text(
                info.lastEncounters.length > 1
'''
          weather_in_info = '''              if (info.kickoffAt != null)
                MatchWeatherCard(
                  matchId: matchId,
                  kickoffAt: info.kickoffAt!,
                  plannedDurationMinutes: 90,
                ),
              const SizedBox(height: 24),
              Text(
                info.lastEncounters.length > 1
'''
          if 'plannedDurationMinutes: 90' not in text:
              if encounter_anchor not in text:
                  raise SystemExit('MatchInfoTab encounter anchor not found')
              text = text.replace(encounter_anchor, weather_in_info, 1)
          info.write_text(text)

          pubspec = Path('pubspec.yaml')
          text = pubspec.read_text()
          if 'version: 0.3.2+89' in text:
              pubspec.write_text(text.replace('version: 0.3.2+89', 'version: 0.3.2+90', 1))

          build_version = Path('web/build_version.js')
          text = build_version.read_text()
          if "AS_GRINTA_WEB_VERSION = '0.3.2+89'" in text:
              build_version.write_text(
                  text.replace(
                      "AS_GRINTA_WEB_VERSION = '0.3.2+89'",
                      "AS_GRINTA_WEB_VERSION = '0.3.2+90'",
                      1,
                  )
              )
          PY
          rm .github/workflows/weather_info_relocation_helper.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add lib/features/home/presentation/home_next_match_card.dart \
                  lib/features/matches/presentation/widgets/match_info_tab.dart \
                  pubspec.yaml web/build_version.js \
                  .github/workflows/weather_info_relocation_helper.yml
          git commit -m 'fix(weather): show forecast only in match Info tab'
          git push origin HEAD:${{ github.head_ref }}
