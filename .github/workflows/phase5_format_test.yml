name: Phase 5 format test

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  format:
    if: github.head_ref == 'visual/ui-overhaul-phase-5'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: visual/ui-overhaul-phase-5
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Install locked dependencies
        run: flutter pub get --enforce-lockfile
      - name: Format badge test
        run: dart format test/badge_trophy_button_test.dart
      - name: Commit format
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add test/badge_trophy_button_test.dart
          git diff --cached --quiet || git commit -m "style: formater le test des badges"
          git push origin HEAD:visual/ui-overhaul-phase-5
