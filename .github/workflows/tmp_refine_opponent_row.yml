name: Temporary refine opponent row

on:
  push:
    branches:
      - feat/reorganize-match-form-sections

permissions:
  contents: write

jobs:
  refine:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: feat/reorganize-match-form-sections
      - name: Apply refinement
        env:
          PATCH_B64: 
        run: |
          printf '%s' "$PATCH_B64" | base64 -d > /tmp/refine.py
          python3 /tmp/refine.py
          dart format lib/features/matches/presentation/calendar_entry_form_page.dart lib/features/matches/presentation/match_form_page.dart
      - name: Commit changes
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add lib/features/matches/presentation/calendar_entry_form_page.dart lib/features/matches/presentation/match_form_page.dart
          git diff --cached --quiet && exit 0
          git commit -m "Refine opponent selector and duplicate warning"
          git push origin HEAD:feat/reorganize-match-form-sections
