name: Temporary refine opponent row

on:
  push:
    branches:
      - feat/reorganize-match-form-sections

permissions:
  contents: write

jobs:
  refine:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: feat/reorganize-match-form-sections
      - name: Apply mounted guard
        env:
          PATCH_B64: 
        run: |
          printf '%s' "$PATCH_B64" | base64 -d > /tmp/refine.py
          python3 /tmp/refine.py
      - name: Commit changes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add lib/features/matches/presentation/calendar_entry_form_page.dart lib/features/matches/presentation/match_form_page.dart
          git diff --cached --quiet && exit 0
          git commit -m "Guard opponent duplicate dialog after async gap"
          git push origin HEAD:feat/reorganize-match-form-sections
