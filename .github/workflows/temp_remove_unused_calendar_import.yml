name: Temp remove unused calendar import

on:
  push:
    branches:
      - agent/club-events-ui

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Remove unused import
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('lib/features/predictions/presentation/merged_matches_view.dart')
          text = path.read_text()
          target = "import 'package:as_grinta/features/predictions/presentation/widgets/match_history_card.dart';\n"
          if target not in text:
            raise SystemExit('unused import not found')
          path.write_text(text.replace(target, '', 1))
          PY
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get --enforce-lockfile
      - run: dart format lib/features/predictions/presentation/merged_matches_view.dart
      - name: Commit cleanup
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/features/predictions/presentation/merged_matches_view.dart
          git commit -m "Nettoie l’ancien import du formulaire match"
          git push origin HEAD:agent/club-events-ui
