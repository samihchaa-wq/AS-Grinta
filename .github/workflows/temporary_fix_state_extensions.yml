name: Temporary fix state extensions

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  fix:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Patch State access
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          state_path = Path('lib/features/sports_management/presentation/admin_squad_plan_page_state.dart')
          state = state_path.read_text()
          helper = "  void _updateState(VoidCallback callback) => setState(callback);\n\n"
          anchor = "  bool get _locked {"
          if helper not in state:
              state = state.replace(anchor, helper + anchor, 1)
              state_path.write_text(state)

          for relative in (
              'lib/features/sports_management/presentation/admin_squad_plan_page_effectif.dart',
              'lib/features/sports_management/presentation/admin_squad_plan_page_composition.dart',
          ):
              path = Path(relative)
              text = path.read_text().replace('setState(', '_updateState(')
              path.write_text(text)
          PY

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install locked dependencies
        run: flutter pub get --enforce-lockfile

      - name: Format affected files
        run: |
          dart format \
            lib/features/sports_management/presentation/admin_squad_plan_page_state.dart \
            lib/features/sports_management/presentation/admin_squad_plan_page_effectif.dart \
            lib/features/sports_management/presentation/admin_squad_plan_page_composition.dart \
            lib/features/sports_management/presentation/admin_squad_plan_page_composition_widgets.dart

      - name: Commit fix
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet; then
            echo 'Aucune correction supplémentaire.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            lib/features/sports_management/presentation/admin_squad_plan_page_state.dart \
            lib/features/sports_management/presentation/admin_squad_plan_page_effectif.dart \
            lib/features/sports_management/presentation/admin_squad_plan_page_composition.dart \
            lib/features/sports_management/presentation/admin_squad_plan_page_composition_widgets.dart
          git commit -m 'Corriger l’accès à setState dans les extensions'
          git push origin "HEAD:${{ github.event.pull_request.head.ref }}"
