name: Format calendar form like CI

on:
  push:
    branches:
      - ui/calendar-form-readability-v2

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Install locked dependencies
        run: flutter pub get --enforce-lockfile
      - name: Format calendar form
        run: dart format lib/features/matches/presentation/calendar_entry_form_page.dart
      - name: Commit formatting and remove temporary workflow
        run: |
          rm .github/workflows/tmp_ci_format_calendar.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/features/matches/presentation/calendar_entry_form_page.dart .github/workflows/tmp_ci_format_calendar.yml
          git commit -m "Format calendar form like CI"
          git push origin HEAD:ui/calendar-form-readability-v2
