name: Agent wire lifecycle migrations into business CI

on:
  pull_request:
    branches: [main]
  push:
    branches:
      - agent/match-lifecycle-cleanup

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/match-lifecycle-cleanup
          fetch-depth: 0
      - name: Wire lifecycle migrations into business CI and remove workflow
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('.github/workflows/supabase_business_tests.yml')
          text = path.read_text()
          needle = """            psql \"$DB_URL\" -v ON_ERROR_STOP=1 \\\n              -f supabase/migrations/20260803161358_match_weather_security_floor.sql\n            psql \"$DB_URL\" -v ON_ERROR_STOP=1 \\\n              -f supabase/tests/bootstrap/season_lifecycle_acl.sql"""
          replacement = """            psql \"$DB_URL\" -v ON_ERROR_STOP=1 \\\n              -f supabase/migrations/20260803161358_match_weather_security_floor.sql\n            psql \"$DB_URL\" -v ON_ERROR_STOP=1 \\\n              -f supabase/migrations/20260804180000_match_lifecycle_cleanup.sql\n            psql \"$DB_URL\" -v ON_ERROR_STOP=1 \\\n              -f supabase/migrations/20260804180500_live_coach_finalize_context.sql\n            psql \"$DB_URL\" -v ON_ERROR_STOP=1 \\\n              -f supabase/migrations/20260804181000_lock_prematch_sport_edits.sql\n            psql \"$DB_URL\" -v ON_ERROR_STOP=1 \\\n              -f supabase/migrations/20260804181500_harden_legacy_archive_lifecycle.sql\n            psql \"$DB_URL\" -v ON_ERROR_STOP=1 \\\n              -f supabase/migrations/20260804182000_harden_missing_match_duration.sql\n            psql \"$DB_URL\" -v ON_ERROR_STOP=1 \\\n              -f supabase/migrations/20260804182500_lock_generic_match_status_updates.sql\n            psql \"$DB_URL\" -v ON_ERROR_STOP=1 \\\n              -f supabase/tests/bootstrap/season_lifecycle_acl.sql"""
          if needle not in text:
              raise SystemExit('Expected business CI migration insertion point not found')
          path.write_text(text.replace(needle, replacement, 1))
          PY
          rm .github/workflows/agent-wire-lifecycle-migrations-into-business-ci.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add .github/workflows/supabase_business_tests.yml .github/workflows/agent-wire-lifecycle-migrations-into-business-ci.yml
          git commit -m "Run lifecycle migrations in business CI"
          git push origin HEAD:agent/match-lifecycle-cleanup
