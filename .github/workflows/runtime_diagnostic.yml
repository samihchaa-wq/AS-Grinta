name: Runtime diagnostic

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  web-runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Read application version
        shell: bash
        run: |
          set -euo pipefail
          version=$(awk '/^version:/{print $2}' pubspec.yaml)
          test -n "$version"
          echo "APP_VERSION=$version" >> "$GITHUB_ENV"
      - name: Build debug web with source maps
        shell: bash
        run: |
          set -o pipefail
          flutter build web \
            --debug \
            --source-maps \
            --pwa-strategy=none \
            --base-href "/" \
            --dart-define-from-file=config/production.json \
            --dart-define=APP_VERSION="$APP_VERSION" \
            2>&1 | tee runtime-build.log
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm install --no-save playwright-core@1.52.0
      - name: Start local server
        run: |
          python3 -m http.server 8080 --directory build/web >/tmp/http.log 2>&1 &
          echo $! > /tmp/http.pid
          sleep 2
      - name: Inspect rendered app on multiple viewports
        run: |
          node <<'NODE'
          const fs = require('fs');
          const { chromium } = require('playwright-core');

          const viewports = [
            { name: 'mobile-narrow', width: 320, height: 568 },
            { name: 'mobile-standard', width: 390, height: 844 },
            { name: 'mobile-landscape', width: 844, height: 390 },
            { name: 'desktop', width: 1440, height: 900 },
          ];

          (async () => {
            const browser = await chromium.launch({
              headless: true,
              executablePath: '/usr/bin/google-chrome',
              args: ['--no-sandbox', '--disable-dev-shm-usage'],
            });
            const allEvents = [];

            for (const viewport of viewports) {
              const context = await browser.newContext({
                viewport: { width: viewport.width, height: viewport.height },
                serviceWorkers: 'block',
              });
              const page = await context.newPage();
              const events = [];
              const prefix = `[${viewport.name}]`;

              page.on('console', message => {
                const text = message.text();
                events.push(`${prefix} console.${message.type()}: ${text}`);
              });
              page.on('pageerror', error => {
                events.push(`${prefix} pageerror: ${error.stack || error.message}`);
              });
              page.on('requestfailed', request => {
                events.push(
                  `${prefix} requestfailed: ${request.url()} ${request.failure()?.errorText ?? ''}`,
                );
              });
              page.on('response', response => {
                if (response.status() >= 400 && !response.url().endsWith('/favicon.ico')) {
                  events.push(`${prefix} http ${response.status()}: ${response.url()}`);
                }
              });

              const response = await page.goto(
                `http://127.0.0.1:8080/?viewport=${viewport.name}`,
                { waitUntil: 'networkidle', timeout: 90000 },
              );
              if (!response || response.status() >= 400) {
                throw new Error(`${prefix} HTTP ${response?.status() ?? 'sans réponse'}`);
              }

              await page.waitForFunction(() => {
                return document.querySelector('flutter-view, flt-glass-pane, canvas') !== null;
              }, null, { timeout: 45000 });
              await page.waitForTimeout(3000);

              const screenshot = `runtime-${viewport.name}.png`;
              await page.screenshot({ path: screenshot, fullPage: true });
              const size = fs.statSync(screenshot).size;
              if (size < 4000) {
                throw new Error(`${prefix} capture anormalement vide: ${size} octets`);
              }

              const html = await page.content();
              fs.writeFileSync(`runtime-${viewport.name}.html`, html);
              allEvents.push(...events);
              await context.close();
            }

            fs.writeFileSync('runtime.log', allEvents.join('\n'));
            console.log(allEvents.join('\n'));

            const fatal = allEvents.filter(line =>
              line.includes('console.error:') ||
              line.includes('pageerror:') ||
              line.includes('A RenderFlex overflowed') ||
              line.includes('OVERFLOWING'),
            );
            if (fatal.length > 0) {
              throw new Error(fatal.join(' | '));
            }

            await browser.close();
          })().catch(error => {
            console.error(error);
            process.exit(1);
          });
          NODE
      - name: Verify PWA offline reload and deep-link fallback
        run: |
          node <<'NODE'
          const fs = require('fs');
          const { chromium } = require('playwright-core');

          (async () => {
            const browser = await chromium.launch({
              headless: true,
              executablePath: '/usr/bin/google-chrome',
              args: ['--no-sandbox', '--disable-dev-shm-usage'],
            });
            const context = await browser.newContext({
              viewport: { width: 390, height: 844 },
              serviceWorkers: 'allow',
            });
            const page = await context.newPage();
            const pageErrors = [];
            page.on('pageerror', error => pageErrors.push(error.stack || error.message));

            const initialResponse = await page.goto('http://127.0.0.1:8080/', {
              waitUntil: 'networkidle',
              timeout: 90000,
            });
            if (!initialResponse || initialResponse.status() >= 400) {
              throw new Error(`chargement initial HTTP ${initialResponse?.status() ?? 'sans réponse'}`);
            }
            await page.evaluate(async () => {
              if (!('serviceWorker' in navigator)) {
                throw new Error('Service worker non pris en charge');
              }
              await navigator.serviceWorker.ready;
            });

            // Une première navigation ne peut pas être contrôlée par le worker
            // qui vient d’être installé. Une recharge en ligne est donc requise.
            await page.reload({ waitUntil: 'networkidle', timeout: 90000 });
            await page.waitForFunction(() => navigator.serviceWorker.controller !== null, null, {
              timeout: 45000,
            });
            const activeWorker = await page.evaluate(async () => {
              const registration = await navigator.serviceWorker.ready;
              return registration.active?.scriptURL ?? '';
            });
            if (!activeWorker.includes('/sw.js')) {
              throw new Error(`service worker inattendu: ${activeWorker}`);
            }
            await page.waitForFunction(() => {
              return document.querySelector('flutter-view, flt-glass-pane, canvas') !== null;
            }, null, { timeout: 45000 });

            await context.setOffline(true);
            const offlineResponse = await page.goto(
              'http://127.0.0.1:8080/stats?offline=1',
              { waitUntil: 'domcontentloaded', timeout: 45000 },
            );
            if (!offlineResponse || offlineResponse.status() >= 400) {
              throw new Error(
                `lien profond hors ligne HTTP ${offlineResponse?.status() ?? 'sans réponse'}`,
              );
            }
            await page.waitForFunction(() => {
              return document.querySelector('flutter-view, flt-glass-pane, canvas') !== null;
            }, null, { timeout: 45000 });
            await page.waitForTimeout(2500);
            await page.screenshot({ path: 'runtime-pwa-offline.png', fullPage: true });
            if (fs.statSync('runtime-pwa-offline.png').size < 4000) {
              throw new Error('capture PWA hors ligne anormalement vide');
            }
            if (pageErrors.length > 0) throw new Error(pageErrors.join(' | '));

            await browser.close();
          })().catch(error => {
            console.error(error);
            process.exit(1);
          });
          NODE
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: runtime-diagnostic
          path: |
            runtime-build.log
            runtime-*.png
            runtime-*.html
            runtime.log
            build/web/main.dart.js
            build/web/main.dart.js.map
            /tmp/http.log
          if-no-files-found: warn
