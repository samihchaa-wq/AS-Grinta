name: Runtime diagnostic

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  web-runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Read application version
        shell: bash
        run: |
          set -euo pipefail
          version=$(awk '/^version:/{print $2}' pubspec.yaml)
          test -n "$version"
          echo "APP_VERSION=$version" >> "$GITHUB_ENV"
      - name: Build production-equivalent web bundle
        shell: bash
        run: |
          set -o pipefail
          flutter build web \
            --release \
            --source-maps \
            --pwa-strategy=none \
            --no-web-resources-cdn \
            --base-href "/" \
            --dart-define-from-file=config/production.json \
            --dart-define=APP_VERSION="$APP_VERSION" \
            2>&1 | tee runtime-build.log
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm install --no-save playwright-core@1.52.0
      - name: Start local server
        run: |
          python3 -m http.server 8080 --directory build/web >/tmp/http.log 2>&1 &
          echo $! > /tmp/http.pid
          sleep 2
      - name: Inspect rendered app on multiple viewports
        run: |
          node <<'NODE'
          const fs = require('fs');
          const { chromium } = require('playwright-core');
          const viewports = [
            { name: 'mobile-narrow', width: 320, height: 568 },
            { name: 'mobile-standard', width: 390, height: 844 },
            { name: 'mobile-landscape', width: 844, height: 390 },
            { name: 'desktop', width: 1440, height: 900 },
          ];

          (async () => {
            const browser = await chromium.launch({
              headless: true,
              executablePath: '/usr/bin/google-chrome',
              args: ['--no-sandbox', '--disable-dev-shm-usage'],
            });
            const allEvents = [];
            for (const viewport of viewports) {
              const context = await browser.newContext({
                viewport: { width: viewport.width, height: viewport.height },
                serviceWorkers: 'block',
              });
              const page = await context.newPage();
              const events = [];
              const prefix = `[${viewport.name}]`;
              page.on('console', message => {
                if (message.type() === 'error') events.push(`${prefix} console.error: ${message.text()}`);
              });
              page.on('pageerror', error => events.push(`${prefix} pageerror: ${error.stack || error.message}`));
              page.on('requestfailed', request => events.push(`${prefix} requestfailed: ${request.url()} ${request.failure()?.errorText ?? ''}`));
              page.on('response', response => {
                if (response.status() >= 400 && !response.url().endsWith('/favicon.ico')) {
                  events.push(`${prefix} http ${response.status()}: ${response.url()}`);
                }
              });
              const response = await page.goto(
                `http://127.0.0.1:8080/?viewport=${viewport.name}`,
                { waitUntil: 'networkidle', timeout: 90000 },
              );
              if (!response || response.status() >= 400) {
                throw new Error(`${prefix} HTTP ${response?.status() ?? 'sans réponse'}`);
              }
              await page.locator('flutter-view, flt-glass-pane, canvas').first()
                .waitFor({ state: 'attached', timeout: 45000 });
              await page.waitForTimeout(2500);
              const screenshot = `runtime-${viewport.name}.png`;
              await page.screenshot({ path: screenshot, fullPage: true });
              if (fs.statSync(screenshot).size < 4000) {
                throw new Error(`${prefix} capture anormalement vide`);
              }
              allEvents.push(...events);
              await context.close();
            }
            fs.writeFileSync('runtime.log', allEvents.join('\n'));
            if (allEvents.length > 0) throw new Error(allEvents.join(' | '));
            await browser.close();
          })().catch(error => {
            console.error(error);
            process.exit(1);
          });
          NODE
      - name: Verify PWA offline reload and deep-link fallback
        run: |
          node <<'NODE'
          const fs = require('fs');
          const { chromium } = require('playwright-core');

          async function waitForController(page) {
            for (let i = 0; i < 90; i += 1) {
              if (await page.evaluate(() => navigator.serviceWorker.controller !== null)) return;
              await page.waitForTimeout(500);
            }
            throw new Error('Le service worker n’a pas pris le contrôle de la page.');
          }

          (async () => {
            const browser = await chromium.launch({
              headless: true,
              executablePath: '/usr/bin/google-chrome',
              args: ['--no-sandbox', '--disable-dev-shm-usage'],
            });
            const context = await browser.newContext({
              viewport: { width: 390, height: 844 },
              serviceWorkers: 'allow',
            });
            const page = await context.newPage();
            const errors = [];
            page.on('pageerror', error => errors.push(error.stack || error.message));
            page.on('console', message => {
              if (message.type() === 'error') errors.push(message.text());
            });

            await page.goto('http://127.0.0.1:8080/', {
              waitUntil: 'networkidle', timeout: 90000,
            });
            await page.evaluate(async () => {
              if (!('serviceWorker' in navigator)) throw new Error('Service worker indisponible');
              await navigator.serviceWorker.ready;
            }).catch(async error => {
              if (!String(error).includes('Execution context was destroyed')) throw error;
              await page.waitForLoadState('networkidle', { timeout: 90000 });
            });
            await page.reload({ waitUntil: 'networkidle', timeout: 90000 });
            await waitForController(page);
            await page.locator('flutter-view, flt-glass-pane, canvas').first()
              .waitFor({ state: 'attached', timeout: 45000 });

            await context.setOffline(true);
            const response = await page.goto('http://127.0.0.1:8080/stats?offline=1', {
              waitUntil: 'domcontentloaded', timeout: 45000,
            });
            if (!response || response.status() >= 400) {
              throw new Error(`lien profond hors ligne HTTP ${response?.status() ?? 'sans réponse'}`);
            }
            await page.locator('flutter-view, flt-glass-pane, canvas').first()
              .waitFor({ state: 'attached', timeout: 45000 });
            await page.waitForTimeout(2000);
            await page.screenshot({ path: 'runtime-pwa-offline.png', fullPage: true });
            if (fs.statSync('runtime-pwa-offline.png').size < 4000) {
              throw new Error('capture PWA hors ligne anormalement vide');
            }
            if (errors.length > 0) throw new Error(errors.join(' | '));
            await browser.close();
          })().catch(error => {
            console.error(error);
            process.exit(1);
          });
          NODE
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: runtime-diagnostic
          path: |
            runtime-build.log
            runtime-*.png
            runtime.log
            build/web/main.dart.js
            build/web/main.dart.js.map
            /tmp/http.log
          if-no-files-found: warn
