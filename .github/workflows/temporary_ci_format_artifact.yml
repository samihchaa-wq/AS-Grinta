name: Temporary CI format artifact

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  format-artifact:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install locked dependencies
        run: flutter pub get --enforce-lockfile

      - name: Format with the CI toolchain
        run: |
          dart format \
            lib/features/sports_management/presentation/admin_squad_plan_page_composition.dart \
            lib/features/sports_management/presentation/admin_squad_plan_page_effectif.dart

      - name: Commit the formatted files
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t changed < <(git diff --name-only -- \
            lib/features/sports_management/presentation/admin_squad_plan_page_composition.dart \
            lib/features/sports_management/presentation/admin_squad_plan_page_effectif.dart)
          if [ "${#changed[@]}" -eq 0 ]; then
            echo 'Les fichiers sont déjà formatés.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- "${changed[@]}"
          git commit -m 'Appliquer le formatage Dart de la CI'
          git push origin "HEAD:${{ github.event.pull_request.head.ref }}"
