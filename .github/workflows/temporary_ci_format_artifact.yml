name: Temporary CI format artifact

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  format-artifact:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install locked dependencies
        run: flutter pub get --enforce-lockfile

      - name: Format with the CI toolchain
        run: |
          dart format \
            lib/features/sports_management/presentation/admin_squad_plan_page_composition.dart \
            lib/features/sports_management/presentation/admin_squad_plan_page_effectif.dart

      - name: Collect formatted files
        run: |
          mkdir -p formatted/lib/features/sports_management/presentation
          cp lib/features/sports_management/presentation/admin_squad_plan_page_composition.dart \
            formatted/lib/features/sports_management/presentation/
          cp lib/features/sports_management/presentation/admin_squad_plan_page_effectif.dart \
            formatted/lib/features/sports_management/presentation/

      - name: Upload formatted files
        uses: actions/upload-artifact@v4
        with:
          name: ci-formatted-effectif-files
          path: formatted
          if-no-files-found: error
