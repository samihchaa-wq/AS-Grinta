name: Flutter CI

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: flutter-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Write formatter outputs
        run: |
          dart format \
            lib/core/utils/match_window.dart \
            lib/features/admin/presentation/admin_sports_management_section.dart \
            lib/features/predictions/data/predictions_repository.dart \
            lib/features/predictions/presentation/merged_matches_view.dart \
            lib/features/sports_management/presentation/admin_squad_plan_page_state.dart \
            lib/features/sports_management/presentation/match_lineup_page.dart \
            lib/features/weather/presentation/match_weather_card.dart \
            test/exhaustive_prediction_state_space_test.dart \
            test/match_weather_card_test.dart \
            test/match_window_test.dart \
            test/prediction_window_test.dart

      - name: Upload formatted sources
        uses: actions/upload-artifact@v4
        with:
          name: formatted-match-temporality-dart
          path: |
            lib/core/utils/match_window.dart
            lib/features/admin/presentation/admin_sports_management_section.dart
            lib/features/predictions/data/predictions_repository.dart
            lib/features/predictions/presentation/merged_matches_view.dart
            lib/features/sports_management/presentation/admin_squad_plan_page_state.dart
            lib/features/sports_management/presentation/match_lineup_page.dart
            lib/features/weather/presentation/match_weather_card.dart
            test/exhaustive_prediction_state_space_test.dart
            test/match_weather_card_test.dart
            test/match_window_test.dart
            test/prediction_window_test.dart
