name: Flutter CI

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: read

concurrency:
  group: flutter-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout PR head
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Format Live source
        shell: bash
        run: |
          set -euo pipefail
          dart format lib/features/match_live/presentation/match_live_running_page.dart

      - name: Commit formatted source
        shell: bash
        env:
          HEAD_BRANCH: ${{ github.head_ref }}
        run: |
          set -euo pipefail
          git add lib/features/match_live/presentation/match_live_running_page.dart
          if git diff --cached --quiet; then
            echo "Source déjà formatée."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Applique dart format au cockpit Live"
          git push origin "HEAD:${HEAD_BRANCH}"
