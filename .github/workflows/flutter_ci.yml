name: Flutter CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: flutter-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}
          fetch-depth: 0

      - name: Prepare post-match implementation
        if: >-
          github.event_name == 'pull_request' &&
          github.head_ref == 'agent/postmatch-composition-editor' &&
          !contains(github.event.pull_request.title, '[implementation-applied]')
        shell: bash
        run: |
          set -euo pipefail
          python3 .github/agent/postmatch_composition_patch.py
          python3 .github/agent/postmatch_composition_patch_fix.py
          rm -f \
            .github/agent/postmatch_composition_patch.py \
            .github/agent/postmatch_composition_patch_fix.py \
            .github/workflows/agent-postmatch-composition.yml
          git checkout origin/main -- .github/workflows/flutter_ci.yml
          dart format \
            lib/features/sports_management/data/sport_waitlist_repository.dart \
            lib/features/sports_management/data/match_composition_repository.dart \
            lib/features/sports_management/domain/match_composition.dart \
            lib/features/sports_management/domain/sport_match_finalization.dart \
            lib/features/sports_management/presentation/admin_squad_plan_page.dart \
            lib/features/matches/presentation/match_details_page.dart \
            test/match_composition_metadata_test.dart

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Read application version
        shell: bash
        run: |
          set -euo pipefail
          version=$(awk '/^version:/{print $2}' pubspec.yaml)
          test -n "$version"
          echo "APP_VERSION=$version" >> "$GITHUB_ENV"

      - name: Check formatting of changed Dart files
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            base="origin/${{ github.base_ref }}"
            range="$base...HEAD"
          else
            range="HEAD^...HEAD"
          fi
          mapfile -t files < <(git diff --name-only --diff-filter=ACMR "$range" -- '*.dart')
          mapfile -t unstaged < <(git diff --name-only --diff-filter=ACMR -- '*.dart')
          files+=("${unstaged[@]}")
          mapfile -t files < <(printf '%s\n' "${files[@]}" | sed '/^$/d' | sort -u)
          if [ "${#files[@]}" -eq 0 ]; then
            echo "No changed Dart files to format."
            exit 0
          fi
          dart format --output=none --set-exit-if-changed "${files[@]}"

      - name: Analyze
        shell: bash
        run: |
          set -o pipefail
          flutter analyze --fatal-infos 2>&1 | tee analyze.log

      - name: Test
        shell: bash
        run: |
          set -o pipefail
          flutter test 2>&1 | tee test.log

      - name: Build web
        shell: bash
        run: |
          set -o pipefail
          flutter build web \
            --release \
            --base-href "/AS-Grinta/" \
            --pwa-strategy=none \
            --no-web-resources-cdn \
            --dart-define-from-file=config/production.json \
            --dart-define=APP_VERSION="$APP_VERSION" \
            2>&1 | tee build-web.log

      - name: Commit generated implementation
        if: >-
          success() &&
          github.event_name == 'pull_request' &&
          github.head_ref == 'agent/postmatch-composition-editor' &&
          !contains(github.event.pull_request.title, '[implementation-applied]')
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "Implémenter la composition post-match unique"
          git push origin HEAD:agent/postmatch-composition-editor

      - name: Upload validation logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: flutter-validation-logs
          path: |
            analyze.log
            test.log
            build-web.log
          if-no-files-found: warn
