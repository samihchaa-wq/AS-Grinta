name: Flutter CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: flutter-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apply-unified-composition-button:
    if: >-
      github.event_name == 'pull_request' &&
      github.head_ref == 'feature/unified-composition-publish-button'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout pull request branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Merge the draft and publication buttons
        shell: python
        run: |
          from pathlib import Path

          path = Path("lib/features/sports_management/presentation/admin_squad_plan_page.dart")
          text = path.read_text(encoding="utf-8")

          old = "\n".join([
              "        const SizedBox(height: 16),",
              "        FilledButton.tonalIcon(",
              "          onPressed:",
              "              _busy || _locked ? null : () => _saveComposition(publish: false),",
              "          icon: const Icon(Icons.save_outlined),",
              "          label: Text(",
              "            _compositionDirty",
              "                ? 'Enregistrer le brouillon'",
              "                : 'Brouillon enregistré',",
              "          ),",
              "        ),",
              "        const SizedBox(height: 10),",
              "        FilledButton.icon(",
              "          onPressed:",
              "              _busy || _locked ? null : () => _saveComposition(publish: true),",
              "          icon: const Icon(Icons.campaign_outlined),",
              "          label: Text(",
              "            composition.isPublished ? 'Republier' : 'Publier la composition',",
              "          ),",
              "        ),",
          ]) + "\n"

          new = "\n".join([
              "        const SizedBox(height: 16),",
              "        FilledButton.icon(",
              "          onPressed:",
              "              _busy || _locked ? null : () => _saveComposition(publish: true),",
              "          icon: const Icon(Icons.campaign_outlined),",
              "          label: Text(",
              "            composition.isPublished ? 'Mettre à jour' : 'Publier',",
              "          ),",
              "        ),",
          ]) + "\n"

          occurrences = text.count(old)
          if occurrences != 1:
              raise SystemExit(
                  f"Expected exactly one button block, found {occurrences}."
              )

          path.write_text(text.replace(old, new), encoding="utf-8")

      - name: Commit application change
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/features/sports_management/presentation/admin_squad_plan_page.dart
          git commit -m "Unify composition publication button"
          git push origin HEAD:${{ github.head_ref }}

  validate:
    needs: apply-unified-composition-button
    if: >-
      always() &&
      (needs.apply-unified-composition-button.result == 'success' ||
       needs.apply-unified-composition-button.result == 'skipped')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.head_ref || github.ref }}
          fetch-depth: 0

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Read application version
        shell: bash
        run: |
          set -euo pipefail
          version=$(awk '/^version:/{print $2}' pubspec.yaml)
          test -n "$version"
          echo "APP_VERSION=$version" >> "$GITHUB_ENV"

      - name: Check formatting of changed Dart files
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            base="origin/${{ github.base_ref }}"
            range="$base...HEAD"
          else
            range="HEAD^...HEAD"
          fi
          mapfile -t files < <(git diff --name-only --diff-filter=ACMR "$range" -- '*.dart')
          if [ "${#files[@]}" -eq 0 ]; then
            echo "No changed Dart files to format."
            exit 0
          fi
          dart format --output=none --set-exit-if-changed "${files[@]}"

      - name: Analyze
        shell: bash
        run: |
          set -o pipefail
          flutter analyze --fatal-infos 2>&1 | tee analyze.log

      - name: Test
        shell: bash
        run: |
          set -o pipefail
          flutter test 2>&1 | tee test.log

      - name: Build web
        shell: bash
        run: |
          set -o pipefail
          flutter build web \
            --release \
            --base-href "/AS-Grinta/" \
            --pwa-strategy=none \
            --no-web-resources-cdn \
            --dart-define-from-file=config/production.json \
            --dart-define=APP_VERSION="$APP_VERSION" \
            2>&1 | tee build-web.log

      - name: Upload validation logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: flutter-validation-logs
          path: |
            analyze.log
            test.log
            build-web.log
          if-no-files-found: warn
