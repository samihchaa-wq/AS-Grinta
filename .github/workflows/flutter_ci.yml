name: Flutter CI

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: flutter-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Write formatter output
        run: dart format lib/features/sports_management/presentation/admin_squad_plan_page_state.dart

      - name: Upload formatted source
        uses: actions/upload-artifact@v4
        with:
          name: formatted-admin-squad-plan-state
          path: lib/features/sports_management/presentation/admin_squad_plan_page_state.dart
