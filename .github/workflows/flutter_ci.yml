name: Flutter CI

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout spacing branch
        uses: actions/checkout@v4
        with:
          ref: ui/unified-spacing-centering
          fetch-depth: 0

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install locked dependencies
        run: flutter pub get --enforce-lockfile

      - name: Format implementation
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t files < <(git ls-files '*.dart')
          dart format "${files[@]}"

      - name: Restore standard CI and commit formatting
        shell: bash
        run: |
          set -euo pipefail
          git show origin/main:.github/workflows/flutter_ci.yml > .github/workflows/flutter_ci.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            echo 'No formatting commit required.'
          else
            git commit -m 'Formater la charte d’espacement UI'
            git push origin HEAD:ui/unified-spacing-centering
          fi
