name: Flutter CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: flutter-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Require a merged pull request on main
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          response=$(curl -LfsS \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/commits/${GITHUB_SHA}/pulls")
          merged_count=$(jq '[.[] | select(.merged_at != null and .base.ref == "main")] | length' <<<"$response")
          if [ "$merged_count" -lt 1 ]; then
            echo "::error::Push direct détecté sur main. Les changements doivent passer par une pull request fusionnée."
            exit 1
          fi

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Read application version
        shell: bash
        run: |
          set -euo pipefail
          version=$(awk '/^version:/{print $2}' pubspec.yaml)
          test -n "$version"
          echo "APP_VERSION=$version" >> "$GITHUB_ENV"

      - name: Check formatting of changed Dart files
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            base="origin/${{ github.base_ref }}"
            range="$base...HEAD"
          else
            range="HEAD^...HEAD"
          fi
          mapfile -t files < <(git diff --name-only --diff-filter=ACMR "$range" -- '*.dart')
          if [ "${#files[@]}" -eq 0 ]; then
            echo "No changed Dart files to format."
            exit 0
          fi
          dart format "${files[@]}"
          git diff --binary -- "${files[@]}" > format.patch
          if [ -s format.patch ]; then
            cat format.patch
            echo "::error::Des fichiers Dart ne sont pas formatés. Le correctif est disponible dans l’artefact format.patch."
            exit 1
          fi

      - name: Analyze
        shell: bash
        run: |
          set -o pipefail
          flutter analyze --fatal-infos 2>&1 | tee analyze.log

      - name: Test with coverage
        shell: bash
        run: |
          set -o pipefail
          flutter test --coverage 2>&1 | tee test.log

      - name: Summarize coverage
        shell: bash
        run: |
          set -euo pipefail
          test -s coverage/lcov.info
          found=$(awk -F: '/^LF:/{sum+=$2} END{print sum+0}' coverage/lcov.info)
          hit=$(awk -F: '/^LH:/{sum+=$2} END{print sum+0}' coverage/lcov.info)
          if [ "$found" -eq 0 ]; then
            percent='0.00'
          else
            percent=$(awk -v hit="$hit" -v found="$found" 'BEGIN { printf "%.2f", (100 * hit / found) }')
          fi
          printf 'Lignes couvertes : %s/%s (%s%%)\n' "$hit" "$found" "$percent" | tee coverage-summary.txt
          {
            echo '### Couverture Flutter'
            echo
            echo "- Lignes couvertes : **$hit / $found ($percent %)**"
            echo '- Aucun seuil bloquant n’est fixé pendant l’établissement de la référence initiale.'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Build web
        shell: bash
        run: |
          set -o pipefail
          flutter build web \
            --release \
            --base-href "/AS-Grinta/" \
            --pwa-strategy=none \
            --no-web-resources-cdn \
            --dart-define-from-file=config/production.json \
            --dart-define=APP_VERSION="$APP_VERSION" \
            2>&1 | tee build-web.log

      - name: Upload validation logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: flutter-validation-logs
          path: |
            format.patch
            analyze.log
            test.log
            coverage/lcov.info
            coverage-summary.txt
            build-web.log
          if-no-files-found: warn
