name: Flutter CI

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: flutter-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout correction branch
        uses: actions/checkout@v4
        with:
          ref: agent/fix-moderator-match-save
          fetch-depth: 0

      - name: Apply moderator match-save fix
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          replacements = {
              Path('lib/features/matches/presentation/match_form_page.dart'): [('final canManage = role == AuthRole.admin;', 'final canManage = role?.isAdmin ?? false;')],
              Path('lib/features/matches/presentation/matches_controller.dart'): [('bool get _isAdmin => _role == AuthRole.admin;', 'bool get _isAdmin => _role?.isAdmin ?? false;')],
              Path('pubspec.yaml'): [('version: 0.3.2+93', 'version: 0.3.2+94')],
              Path('web/build_version.js'): [("AS_GRINTA_WEB_VERSION = '0.3.2+93';", "AS_GRINTA_WEB_VERSION = '0.3.2+94';")],
              Path('web/sw.js'): [('Révision de déploiement 0.3.2+93', 'Révision de déploiement 0.3.2+94')],
          }
          for path, pairs in replacements.items():
              text = path.read_text()
              for old, new in pairs:
                  if text.count(old) != 1:
                      raise SystemExit(f'{path}: expected exactly one occurrence of {old!r}')
                  text = text.replace(old, new)
              path.write_text(text)
          PY
          git checkout origin/main -- .github/workflows/flutter_ci.yml
          git rm .github/workflows/apply-moderator-match-save-fix.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Corrige l’enregistrement des matchs pour les modérateurs"
          git push origin HEAD:agent/fix-moderator-match-save
