name: Phase 4 format probe

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Format target
        run: dart format lib/features/predictions/presentation/merged_matches_view.dart
      - name: Upload formatted target
        uses: actions/upload-artifact@v4
        with:
          name: phase4-formatted-source
          path: lib/features/predictions/presentation/merged_matches_view.dart
