name: Fix guest composition contract test

on:
  push:
    branches:
      - agent/clarify-effectif-publication

permissions:
  contents: write

jobs:
  fix-test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: agent/clarify-effectif-publication
          fetch-depth: 0

      - name: Publish effectif before guest composition
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path('supabase/tests/database/sports_management_guests.test.sql')
          text = path.read_text()
          marker = """set local role authenticated;

select is(
  public.admin_save_match_composition(
    current_setting('test.guest_match')::uuid,
"""
          replacement = """set local role authenticated;

select is(
  public.admin_publish_match_effectif(
    current_setting('test.guest_match')::uuid,
    14,
    (
      select jsonb_agg(
        jsonb_build_object(
          'season_player_id', participant.season_player_id,
          'status', 'convoked'
        ) order by participant.season_player_id
      )
      from public.match_sport_participants participant
      where participant.match_id = current_setting('test.guest_match')::uuid
        and participant.season_player_id is not null
        and participant.availability_status = 'available'
    ),
    'Publication préalable des convocations avec invité'
  ) #>> '{convocation_version}',
  '1',
  'les convocations sont publiées avant la composition avec invité'
);

select is(
  public.admin_save_match_composition(
    current_setting('test.guest_match')::uuid,
"""
          if replacement in text:
              raise SystemExit(0)
          if text.count(marker) != 1:
              raise SystemExit('Insertion marker missing or ambiguous')
          path.write_text(text.replace(marker, replacement, 1))
          PY

      - name: Commit when needed
        shell: bash
        run: |
          set -euo pipefail
          target='supabase/tests/database/sports_management_guests.test.sql'
          if git diff --quiet -- "$target"; then
            echo 'Le test est déjà corrigé.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- "$target"
          git commit -m 'Adapter le test invité au contrat de publication'
          git fetch origin agent/clarify-effectif-publication
          git rebase origin/agent/clarify-effectif-publication
          git push origin HEAD:agent/clarify-effectif-publication
