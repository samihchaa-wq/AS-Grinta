name: Temporary format club identity

on:
  push:
    branches:
      - agent/club-identity-calendar

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: agent/club-identity-calendar
          fetch-depth: 0

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Load locked package language versions
        run: flutter pub get --enforce-lockfile

      - name: Format calendar view
        shell: bash
        run: |
          set -euo pipefail
          dart format lib/features/matches/presentation/calendar_matches_view.dart
          if git diff --quiet -- lib/features/matches/presentation/calendar_matches_view.dart; then
            echo "Aucun changement de formatage nécessaire."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/features/matches/presentation/calendar_matches_view.dart
          git commit -m "style: format calendar view with project language version"
          git push origin HEAD:agent/club-identity-calendar
