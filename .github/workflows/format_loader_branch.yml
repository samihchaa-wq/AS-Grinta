name: Format loader branch

on:
  push:
    branches: [feat/grinta-loading-system]

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/grinta-loading-system
          fetch-depth: 0

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Format and verify exact pull-request Dart diff
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t files < <(git diff --name-only --diff-filter=ACMR origin/main...HEAD -- '*.dart')
          printf '%s\n' "${files[@]}" > .format-loader-status
          dart format "${files[@]}"
          dart format --output=none --set-exit-if-changed "${files[@]}"
          printf 'clean\n' >> .format-loader-status
          git add -- "${files[@]}" .format-loader-status

      - name: Commit verified formatting
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "style: verify exact PR Dart formatting"
          git push
