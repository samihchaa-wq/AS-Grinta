name: Apply home dashboard compatibility cleanup

on:
  push:
    branches: [cleanup/remove-home-dashboard-compat]
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/apply_home_dashboard_cleanup.yml'

permissions:
  contents: write

jobs:
  patch:
    if: ${{ github.event_name == 'pull_request' || !contains(github.event.head_commit.message, '[home-dashboard-cleanup]') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout cleanup branch
        uses: actions/checkout@v4
        with:
          ref: cleanup/remove-home-dashboard-compat
          fetch-depth: 0

      - name: Remove no-op compatibility provider and invalidations
        shell: python
        run: |
          from pathlib import Path

          provider = Path('lib/features/home/data/home_repository.dart')
          if not provider.exists():
              raise SystemExit('Compatibility provider already missing')

          import_line = "import 'package:as_grinta/features/home/data/home_repository.dart';\n"
          touched = []
          refs_before = 0

          for path in Path('lib').rglob('*.dart'):
              text = path.read_text()
              refs_before += text.count('homeDashboardProvider')
              if path == provider:
                  continue
              if 'homeDashboardProvider' not in text and import_line not in text:
                  continue

              lines = text.splitlines(keepends=True)
              out = []
              changed = False

              for line in lines:
                  if line == import_line:
                      changed = True
                      continue

                  if 'homeDashboardProvider' in line:
                      changed = True
                      stripped = line.strip()
                      if stripped.endswith('.invalidate(homeDashboardProvider);') and not stripped.startswith('..'):
                          continue
                      if stripped == '..invalidate(homeDashboardProvider)':
                          continue
                      if stripped == '..invalidate(homeDashboardProvider);':
                          if out and out[-1].lstrip().startswith('..invalidate('):
                              out[-1] = out[-1].rstrip('\n').rstrip() + ';\n'
                          elif out and out[-1].strip() in {'ref', '_ref'}:
                              out.pop()
                          continue
                      raise SystemExit(f'Unexpected homeDashboardProvider usage in {path}: {line!r}')

                  out.append(line)

              next_text = ''.join(out)
              if 'homeDashboardProvider' in next_text:
                  raise SystemExit(f'Provider reference remains in {path}')
              if changed:
                  path.write_text(next_text)
                  touched.append(str(path))

          if refs_before < 3:
              raise SystemExit(f'Unexpectedly low reference count: {refs_before}')

          provider.unlink()
          touched.append(str(provider))

          remaining = []
          for path in Path('lib').rglob('*.dart'):
              text = path.read_text()
              if 'homeDashboardProvider' in text or import_line.strip() in text:
                  remaining.append(str(path))
          if remaining:
              raise SystemExit(f'References remain: {remaining}')

          print(f'Removed {refs_before} provider mentions across {len(touched)} files')
          print('\n'.join(touched))

      - name: Remove this temporary workflow from final diff
        run: rm .github/workflows/apply_home_dashboard_cleanup.yml

      - name: Commit cleanup
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git diff --cached --check
          git commit -m "Remove obsolete home dashboard compatibility [home-dashboard-cleanup]"
          git push origin HEAD:cleanup/remove-home-dashboard-compat
