name: Multi Viewport Runtime Audit

on:
  push:
    branches: [audit/authenticated-admin-e2e]
    paths:
      - '.github/workflows/multi_viewport_runtime_audit.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sweep:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      APP_URL: https://samihchaa-wq.github.io/AS-Grinta/
      TEST_USERNAME: Testt
      TEST_PASSWORD: ${{ secrets.E2E_TESTT_PASSWORD }}
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm install --no-save playwright-core@1.52.0
      - name: Sweep authenticated routes at multiple viewport widths
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p viewport-audit/screens
          node <<'NODE'
          const fs=require('fs');const{chromium}=require('playwright-core');
          (async()=>{const b=await chromium.launch({headless:true,executablePath:'/usr/bin/google-chrome',args:['--no-sandbox','--disable-dev-shm-usage']});const c=await b.newContext({viewport:{width:390,height:844},serviceWorkers:'block'});const p=await c.newPage();const global=[];p.on('pageerror',e=>global.push({kind:'pageerror',text:e.message,at:new Date().toISOString()}));p.on('console',m=>{if(m.type()==='error')global.push({kind:'console',text:m.text(),at:new Date().toISOString()})});const wait=ms=>p.waitForTimeout(ms);async function sem(){try{await p.evaluate(()=>document.querySelector('flt-semantics-placeholder')?.click());await wait(120)}catch(_){}}async function focus(l){const a=p.locator(`[aria-label="${l}"]`).first();if(await a.count())return a.click({force:true});const t=p.getByText(l,{exact:true}).first();if(await t.count())return t.click({force:true});throw new Error(`missing ${l}`)}
          await p.goto(`${process.env.APP_URL}?vp-login=${Date.now()}#/auth/sign-in`,{waitUntil:'networkidle',timeout:90000});await wait(1200);await sem();await focus('Identifiant');await p.keyboard.type(process.env.TEST_USERNAME);await focus('Mot de passe');await p.keyboard.type(process.env.TEST_PASSWORD);await focus('Se connecter');await p.waitForFunction(()=>!location.hash.includes('/auth/'),null,{timeout:45000});await wait(1500);
          const widths=[320,390,768,1280];const routes=['/matches','/statistics','/pronos','/admin'];const rows=[];for(const width of widths){await p.setViewportSize({width,height:width<600?844:900});for(const route of routes){const startErr=global.length;const start=Date.now();await p.goto(`${process.env.APP_URL}?vp=${width}-${route.slice(1)}-${Date.now()}#${route}`,{waitUntil:'networkidle',timeout:60000}).catch(e=>global.push({kind:'navigation',text:e.message,at:new Date().toISOString()}));await wait(1800);await sem();const url=p.url();const text=(await p.locator('body').innerText().catch(()=>'' )).replace(/\s+/g,' ').trim();const errs=global.slice(startErr);rows.push({width,route,finalUrl:url,elapsedMs:Date.now()-start,textLength:text.length,errorCount:errs.length,errors:errs});await p.screenshot({path:`viewport-audit/screens/${width}-${route.slice(1)}.png`,fullPage:true}).catch(()=>{})}}
          const interesting=global.filter(x=>!/get_my_match_availability/.test(x.text)&&!/Failed to load resource/.test(x.text));const result={rows,allErrors:global,interestingErrors:interesting};fs.writeFileSync('viewport-audit/result.json',JSON.stringify(result,null,2));fs.writeFileSync('viewport-audit/summary.txt',JSON.stringify({rows:rows.map(r=>({width:r.width,route:r.route,finalUrl:r.finalUrl,elapsedMs:r.elapsedMs,errorCount:r.errorCount})),interestingErrors:interesting},null,2));await b.close()})().catch(e=>{console.error(e);process.exit(1)});
          NODE
      - if: always()
        run: cat viewport-audit/summary.txt || true
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: multi-viewport-runtime-audit
          path: viewport-audit/
          retention-days: 7
