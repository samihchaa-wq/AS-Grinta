name: Temporary convocation formatter

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/tmp_format_convocation.yml'
      - 'lib/features/matches/**'
      - 'lib/features/predictions/presentation/merged_matches_view.dart'

permissions:
  contents: read

jobs:
  format-artifact:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
        with:
          channel: stable
          cache: true
      - run: |
          dart format \
            lib/features/matches/presentation/calendar_entry_form_page.dart \
            lib/features/matches/presentation/match_form_page.dart \
            lib/features/matches/presentation/widgets/convocation_launch_picker.dart \
            lib/features/predictions/presentation/merged_matches_view.dart
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: formatted-convocation-files
          path: |
            lib/features/matches/presentation/calendar_entry_form_page.dart
            lib/features/matches/presentation/match_form_page.dart
            lib/features/matches/presentation/widgets/convocation_launch_picker.dart
            lib/features/predictions/presentation/merged_matches_view.dart
