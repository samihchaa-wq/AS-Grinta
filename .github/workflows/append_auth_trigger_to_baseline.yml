name: Append auth trigger to canonical baseline

on:
  push:
    branches: [rebuild/full-migration-history]
    paths: [.github/workflows/append_auth_trigger_to_baseline.yml]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: rebuild/full-migration-history
          fetch-depth: 0
      - name: Append application-owned auth trigger to the canonical baseline
        shell: bash
        run: |
          set -euo pipefail
          file='supabase/migrations/20260809234943_finish_audit_concurrency_and_registration.sql'
          marker='Canonical cross-schema auth trigger'
          if grep -Fq "$marker" "$file"; then
            exit 0
          fi
          cat >> "$file" <<'SQL'

          -- Canonical cross-schema auth trigger.
          -- public.handle_new_auth_user() is part of the public schema dump, but
          -- its trigger lives on Supabase-managed auth.users and therefore is not
          -- emitted by a public/private-only schema dump.
          drop trigger if exists on_auth_user_created on auth.users;
          create trigger on_auth_user_created
            after insert or update of email, raw_user_meta_data on auth.users
            for each row execute function public.handle_new_auth_user();
          SQL
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "$file"
          git diff --cached --quiet && exit 0
          git commit -m 'Include auth profile trigger in canonical baseline'
          git push origin HEAD:rebuild/full-migration-history
