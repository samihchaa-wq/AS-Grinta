name: Complete canonical cross-schema baseline

on:
  push:
    branches: [rebuild/full-migration-history]
    paths: [.github/workflows/append_auth_trigger_to_baseline.yml]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: rebuild/full-migration-history
          fetch-depth: 0
      - name: Append cross-schema and operational state to the canonical baseline
        shell: bash
        run: |
          set -euo pipefail
          file='supabase/migrations/20260809234943_finish_audit_concurrency_and_registration.sql'

          if ! grep -Fq 'Canonical cross-schema auth trigger' "$file"; then
            cat >> "$file" <<'SQL'

          -- Canonical cross-schema auth trigger.
          -- public.handle_new_auth_user() is part of the public schema dump, but
          -- its trigger lives on Supabase-managed auth.users and therefore is not
          -- emitted by a public/private-only schema dump.
          drop trigger if exists on_auth_user_created on auth.users;
          create trigger on_auth_user_created
            after insert or update of email, raw_user_meta_data on auth.users
            for each row execute function public.handle_new_auth_user();
          SQL
          fi

          if ! grep -Fq 'Canonical operational extensions and schedules' "$file"; then
            cat >> "$file" <<'SQL'

          -- Canonical operational extensions and schedules.
          -- Scheduled jobs live in the pg_cron extension tables rather than in
          -- public/private, so a schema-only dump cannot capture them.
          create extension if not exists pg_cron with schema pg_catalog;
          create extension if not exists pg_net with schema extensions;
          create extension if not exists pgcrypto with schema extensions;
          create extension if not exists "uuid-ossp" with schema extensions;

          select cron.unschedule(jobid)
          from cron.job
          where jobname in (
            'sports-availability-reminders',
            'match-weather-refresh',
            'sports-motm-jobs',
            'prediction-j5-reminders'
          );

          select cron.schedule(
            'sports-availability-reminders',
            '* * * * *',
            $job$select private.process_sport_availability_notifications(now());$job$
          );
          select cron.schedule(
            'match-weather-refresh',
            '*/15 * * * *',
            $job$select private.request_match_weather_refresh(null);$job$
          );
          select cron.schedule(
            'sports-motm-jobs',
            '* * * * *',
            $job$select private.process_match_motm_jobs(now());$job$
          );
          select cron.schedule(
            'prediction-j5-reminders',
            '* * * * *',
            $job$select public.push_prediction_j5_notifications();$job$
          );
          SQL
          fi

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "$file"
          git diff --cached --quiet && exit 0
          git commit -m 'Complete canonical auth and scheduled-job baseline'
          git push origin HEAD:rebuild/full-migration-history
