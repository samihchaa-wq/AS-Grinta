name: Temporary exact formatter

on:
  push:
    branches: [feature/opponent-stadium-library]

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: feature/opponent-stadium-library
      - name: Setup Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
        with:
          channel: stable
          cache: true
      - name: Resolve dependencies exactly like CI
        run: flutter pub get --enforce-lockfile
      - name: Format and commit
        shell: bash
        run: |
          dart format lib/features/admin/presentation/opponent_stadium_library_page.dart
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add lib/features/admin/presentation/opponent_stadium_library_page.dart
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Format stadium library after dependency resolution"
          git push origin HEAD:feature/opponent-stadium-library
