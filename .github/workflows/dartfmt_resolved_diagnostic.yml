name: Dart format resolved diagnostic

on:
  push:
    branches:
      - agent/compact-match-report-ui

permissions:
  contents: read

jobs:
  format-diff:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Setup Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
        with:
          channel: stable
          cache: true
      - name: Resolve dependencies
        run: flutter pub get --enforce-lockfile
      - name: Show formatter diff
        run: |
          dart format lib/features/sports_management/presentation/widgets/match_goal_actions_editor.dart
          git diff -- lib/features/sports_management/presentation/widgets/match_goal_actions_editor.dart
