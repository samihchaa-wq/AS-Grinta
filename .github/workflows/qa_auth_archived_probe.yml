name: QA auth archived account probe

on:
  push:
    branches: [qa/auth-archived-probe]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: qa-auth-archived-probe
  cancel-in-progress: true

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'

      - name: Install Playwright Core
        run: npm install --no-save playwright-core@1.52.0

      - name: Create account through public function
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('fs');
          const crypto = require('crypto');
          const supabase = 'https://dhwrtdnjwdkvdyvojvjl.supabase.co';
          const publishable = 'sb_publishable_jTOp1ah4CLw8OIKloeHUiQ_PvYS2J5q';
          (async () => {
            const password = `Qa${crypto.randomBytes(14).toString('hex')}Z9`;
            const suffix = crypto.randomBytes(5).toString('hex').replace(/[0-9]/g, 'a').slice(0, 7);
            const registration = await fetch(`${supabase}/functions/v1/register-account`, {
              method: 'POST',
              headers: {
                'Content-Type': 'application/json',
                apikey: publishable,
                Authorization: `Bearer ${publishable}`,
              },
              body: JSON.stringify({
                firstName: 'Archive',
                lastName: `Recette${suffix}`,
                password,
              }),
            });
            const payload = await registration.json().catch(() => ({}));
            if (registration.status !== 200 || typeof payload.username !== 'string' || !payload.username) {
              throw new Error(`register-account failed HTTP ${registration.status}: ${JSON.stringify(payload)}`);
            }
            fs.writeFileSync('.qa-archived-secret.json', JSON.stringify({ username: payload.username, password }));
            fs.writeFileSync('archive-target.txt', `${payload.username}\n`);
            console.log('ARCHIVE_TARGET_CREATED');
          })().catch(error => {
            console.error(error);
            process.exit(1);
          });
          NODE

      - name: Publish archive target identifier
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: qa-auth-archive-target
          path: archive-target.txt
          if-no-files-found: error
          retention-days: 1

      - name: Allow staging profile transition
        run: sleep 120

      - name: Verify archived account through public UI
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('fs');
          const { chromium } = require('playwright-core');
          const base = 'https://samihchaa-wq.github.io/AS-Grinta/staging';
          const credentials = JSON.parse(fs.readFileSync('.qa-archived-secret.json', 'utf8'));

          async function activate(page) {
            await page.locator('flutter-view, flt-glass-pane, canvas').first()
              .waitFor({ state: 'attached', timeout: 45000 });
            await page.waitForTimeout(1800);
            await page.evaluate(() => {
              const p = document.querySelector('flt-semantics-placeholder');
              if (p instanceof HTMLElement) p.click();
            }).catch(() => {});
            await page.waitForTimeout(600);
          }

          async function waitForAx(page, text, timeout = 30000) {
            const deadline = Date.now() + timeout;
            const cdp = await page.context().newCDPSession(page);
            await cdp.send('Accessibility.enable');
            while (Date.now() < deadline) {
              const tree = await cdp.send('Accessibility.getFullAXTree');
              if (tree.nodes.some(n => String(n.name?.value ?? '').includes(text))) return;
              await page.waitForTimeout(250);
            }
            await page.screenshot({ path: 'archived-sign-in.png' });
            fs.writeFileSync(
              'archived-result.txt',
              `username=${credentials.username}\nurl=${page.url()}\nresult=missing-inactive-message\n`,
            );
            throw new Error(`Texte introuvable: ${text}; url=${page.url()}`);
          }

          (async () => {
            const browser = await chromium.launch({
              headless: true,
              executablePath: '/usr/bin/google-chrome',
              args: ['--no-sandbox', '--disable-dev-shm-usage'],
            });
            const context = await browser.newContext({
              viewport: { width: 390, height: 844 },
              serviceWorkers: 'block',
            });
            const page = await context.newPage();
            await page.goto(`${base}/#/auth/sign-in?archived=${Date.now()}`, {
              waitUntil: 'domcontentloaded', timeout: 45000,
            });
            await activate(page);
            await page.getByRole('textbox', { name: 'Identifiant', exact: true }).fill(credentials.username);
            await page.getByRole('textbox', { name: 'Mot de passe', exact: true }).fill(credentials.password);
            await page.getByRole('button', { name: 'Se connecter', exact: true }).click();
            await waitForAx(page, 'Ce compte n’est pas actif.', 30000);
            await page.screenshot({ path: 'archived-sign-in.png' });
            fs.writeFileSync('archived-result.txt', `username=${credentials.username}\nurl=${page.url()}\nresult=ok\n`);
            console.log(`ARCHIVED_FLOW=OK username=${credentials.username} url=${page.url()}`);
            await browser.close();
          })().catch(error => {
            console.error(error);
            process.exit(1);
          });
          NODE

      - name: Remove local credential file
        if: always()
        run: rm -f .qa-archived-secret.json

      - name: Upload archived evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: qa-auth-archived-probe
          path: |
            archive-target.txt
            archived-result.txt
            archived-sign-in.png
          if-no-files-found: warn
          retention-days: 1
