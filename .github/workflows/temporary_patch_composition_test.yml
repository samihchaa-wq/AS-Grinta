name: Temporary patch composition test

on:
  push:
    branches:
      - agent/clarify-effectif-publication

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: agent/clarify-effectif-publication
          fetch-depth: 0

      - name: Patch test setup and remove this workflow
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path('supabase/tests/database/sports_management_composition_server.test.sql')
          text = path.read_text()
          old = """update public.match_sport_participants
          set availability_status = 'available',
              availability_updated_at = now(),
              availability_updated_by = '91000000-0000-0000-0000-000000000001',
              updated_at = now()
          where match_id = current_setting('test.composition_match')::uuid;
          """
          new = """update public.match_sport_participants
          set availability_status = 'available',
              availability_updated_at = now(),
              availability_updated_by = '91000000-0000-0000-0000-000000000001',
              convocation_status = 'convoked',
              convocation_manual_override = true,
              waitlist_turn_should_consume = false,
              waitlist_turn_state = 'waived',
              updated_at = now()
          where match_id = current_setting('test.composition_match')::uuid;
          """
          if old not in text:
              raise SystemExit('Bloc de préparation introuvable')
          path.write_text(text.replace(old, new, 1))
          PY
          git rm .github/workflows/temporary_patch_composition_test.yml

      - name: Commit patch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add supabase/tests/database/sports_management_composition_server.test.sql
          git commit -m 'Corriger la préparation du test de composition'
          git push origin HEAD:agent/clarify-effectif-publication
