name: Phase 7 format

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  format:
    if: github.head_ref == 'visual/ui-overhaul-phase-7'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: visual/ui-overhaul-phase-7
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Install locked dependencies
        run: flutter pub get --enforce-lockfile
      - name: Format phase 7 files
        run: dart format lib/app/shell/app_shell.dart lib/core/widgets/grinta_responsive_content.dart
      - name: Commit format
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add lib/app/shell/app_shell.dart lib/core/widgets/grinta_responsive_content.dart
          git diff --cached --quiet || git commit -m "style: formater la phase 7"
          git push origin HEAD:visual/ui-overhaul-phase-7
