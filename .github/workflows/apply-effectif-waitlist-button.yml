name: Apply effectif waitlist button

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  apply-and-validate:
    if: github.head_ref == 'agent/effectif-waitlist-button'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Apply implementation
        run: python3 .github/agent/add_effectif_waitlist_button.py

      - name: Install dependencies
        run: flutter pub get

      - name: Format
        run: dart format lib/features/sports_management/presentation/admin_squad_plan_page.dart

      - name: Analyze
        run: flutter analyze --fatal-infos

      - name: Test
        run: flutter test

      - name: Build web
        run: |
          version=$(awk '/^version:/{print $2}' pubspec.yaml)
          flutter build web \
            --release \
            --base-href "/AS-Grinta/" \
            --pwa-strategy=none \
            --no-web-resources-cdn \
            --dart-define-from-file=config/production.json \
            --dart-define=APP_VERSION="$version"

      - name: Commit implementation
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add lib/features/sports_management/presentation/admin_squad_plan_page.dart
          if git diff --cached --quiet; then
            echo "No implementation change to commit."
          else
            git commit -m "Ajouter l’accès à la liste d’attente depuis l’effectif"
            git push origin HEAD:${{ github.head_ref }}
          fi
