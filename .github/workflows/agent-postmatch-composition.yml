name: Implement post-match composition

on:
  push:
    branches: [agent/postmatch-composition-editor]
    paths:
      - .github/workflows/agent-postmatch-composition.yml
      - .github/agent/postmatch_composition_patch.py
      - .github/agent/postmatch_composition_patch_fix.py

permissions:
  contents: write

concurrency:
  group: implement-postmatch-composition
  cancel-in-progress: false

jobs:
  implement:
    if: ${{ !contains(github.event.head_commit.message, '[postmatch-implemented]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: agent/postmatch-composition-editor
          fetch-depth: 0

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Apply implementation
        run: |
          set -euo pipefail
          python3 .github/agent/postmatch_composition_patch.py
          python3 .github/agent/postmatch_composition_patch_fix.py
          rm -f \
            .github/agent/postmatch_composition_patch.py \
            .github/agent/postmatch_composition_patch_fix.py \
            .github/workflows/agent-postmatch-composition.yml

      - name: Format
        run: |
          dart format \
            lib/features/sports_management/data/sport_waitlist_repository.dart \
            lib/features/sports_management/data/match_composition_repository.dart \
            lib/features/sports_management/domain/match_composition.dart \
            lib/features/sports_management/domain/sport_match_finalization.dart \
            lib/features/sports_management/presentation/admin_squad_plan_page.dart \
            lib/features/matches/presentation/match_details_page.dart \
            test/match_composition_metadata_test.dart

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze --fatal-infos

      - name: Test
        run: flutter test

      - name: Build web
        run: |
          version=$(awk '/^version:/{print $2}' pubspec.yaml)
          flutter build web \
            --release \
            --base-href "/AS-Grinta/" \
            --pwa-strategy=none \
            --no-web-resources-cdn \
            --dart-define-from-file=config/production.json \
            --dart-define=APP_VERSION="$version"

      - name: Commit implementation
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "Implémenter la composition post-match unique [postmatch-implemented]"
          git push origin agent/postmatch-composition-editor
