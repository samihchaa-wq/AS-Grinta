name: PWA Offline Audit

on:
  push:
    branches: [audit/authenticated-admin-e2e]
    paths:
      - '.github/workflows/pwa_offline_audit.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  offline:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      APP_URL: https://samihchaa-wq.github.io/AS-Grinta/
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm install --no-save playwright-core@1.52.0
      - name: Audit service worker and offline startup
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p pwa-artifacts
          node <<'NODE'
          const fs=require('fs');
          const {chromium}=require('playwright-core');
          (async()=>{
            const result={};
            const browser=await chromium.launch({headless:true,executablePath:'/usr/bin/google-chrome',args:['--no-sandbox','--disable-dev-shm-usage']});
            const context=await browser.newContext({viewport:{width:390,height:844},serviceWorkers:'allow'});
            const page=await context.newPage();
            const errors=[];
            page.on('pageerror',e=>errors.push(`pageerror ${e.message}`));
            page.on('console',m=>{if(m.type()==='error')errors.push(`console ${m.text()}`)});
            async function waitFlutter(timeout=45000){await page.waitForFunction(()=>document.querySelector('flutter-view,flt-glass-pane,canvas')!==null,null,{timeout});await page.waitForTimeout(1200)}
            async function cacheReport(){return page.evaluate(async()=>{const names=await caches.keys();const out={};for(const name of names){const c=await caches.open(name);out[name]=(await c.keys()).map(r=>new URL(r.url).pathname);}return out;});}
            await page.goto(`${process.env.APP_URL}?offline-audit=${Date.now()}`,{waitUntil:'networkidle',timeout:90000});
            await waitFlutter();
            await page.evaluate(async()=>{if('serviceWorker' in navigator)await navigator.serviceWorker.ready});
            await page.waitForTimeout(2500);
            result.controller=await page.evaluate(()=>!!navigator.serviceWorker.controller);
            result.cacheAfterFirstOpen=await cacheReport();
            const cdp=await context.newCDPSession(page);
            await cdp.send('Network.clearBrowserCache');
            await context.setOffline(true);
            try{await page.reload({waitUntil:'domcontentloaded',timeout:20000});await waitFlutter(12000);result.firstOffline=true}catch(e){result.firstOffline=false;result.firstOfflineError=String(e.message||e)}
            await page.screenshot({path:'pwa-artifacts/offline-first.png',fullPage:true}).catch(()=>{});
            await context.setOffline(false);
            await page.reload({waitUntil:'networkidle',timeout:90000});await waitFlutter();await page.waitForTimeout(1500);
            result.cacheAfterWarmReload=await cacheReport();
            await cdp.send('Network.clearBrowserCache');
            await context.setOffline(true);
            try{await page.reload({waitUntil:'domcontentloaded',timeout:20000});await waitFlutter(12000);result.warmOffline=true}catch(e){result.warmOffline=false;result.warmOfflineError=String(e.message||e)}
            await page.screenshot({path:'pwa-artifacts/offline-warm.png',fullPage:true}).catch(()=>{});
            result.errors=errors;
            fs.writeFileSync('pwa-artifacts/result.json',JSON.stringify(result,null,2));
            fs.writeFileSync('pwa-artifacts/result.txt',`controller=${result.controller}\nfirstOffline=${result.firstOffline}\nwarmOffline=${result.warmOffline}\nerrors=${errors.length}\ncacheFirst=${JSON.stringify(result.cacheAfterFirstOpen)}\ncacheWarm=${JSON.stringify(result.cacheAfterWarmReload)}\n`);
            await browser.close();
          })().catch(e=>{console.error(e);process.exit(1)});
          NODE
      - if: always()
        run: cat pwa-artifacts/result.txt || true
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pwa-offline-audit
          path: pwa-artifacts/
          retention-days: 7
