name: Format badge editor once v2
on:
  push:
    branches:
      - fix/badge-editor-open-before-picker
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/badge-editor-open-before-picker
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Format and self-clean
        run: |
          dart format lib/features/badges/presentation/badge_image_editor.dart
          rm .github/workflows/format_badge_editor_once_v2.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/features/badges/presentation/badge_image_editor.dart .github/workflows/format_badge_editor_once_v2.yml
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Format badge editor with CI Dart"
          git push
