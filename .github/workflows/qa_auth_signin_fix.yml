name: QA auth sign-in fix

on:
  push:
    branches: [fix/auth-signin-offline-feedback]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: qa-auth-signin-fix
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: stable
          cache: true

      - name: Install locked dependencies
        run: flutter pub get --enforce-lockfile

      - name: Run auth controller tests
        run: |
          flutter test test/auth_controller_test.dart
          flutter test test/auth_signin_error_message_test.dart

      - name: Build web against staging
        run: |
          flutter build web \
            --release \
            --base-href "/" \
            --pwa-strategy=none \
            --no-web-resources-cdn \
            --dart-define-from-file=config/staging.json

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'

      - name: Install Playwright Core
        run: npm install --no-save playwright-core@1.52.0

      - name: Exercise bad credentials and stalled network
        run: |
          mkdir -p qa-auth-fix-artifacts
          python3 -m http.server 8091 --directory build/web > qa-auth-fix-artifacts/server.log 2>&1 &
          echo $! > qa-auth-fix-artifacts/server.pid
          trap 'kill $(cat qa-auth-fix-artifacts/server.pid) 2>/dev/null || true' EXIT

          for attempt in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8091/ >/dev/null; then break; fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:8091/ >/dev/null

          node <<'NODE'
          const fs = require('fs');
          const { chromium } = require('playwright-core');
          const root = 'http://127.0.0.1:8091';
          const tokenEndpoint = /\/auth\/v1\/token\?grant_type=password/;

          async function activate(page) {
            await page.locator('flutter-view, flt-glass-pane, canvas').first()
              .waitFor({ state: 'attached', timeout: 45000 });
            await page.waitForTimeout(1800);
            await page.evaluate(() => {
              const placeholder = document.querySelector('flt-semantics-placeholder');
              if (placeholder instanceof HTMLElement) placeholder.click();
            }).catch(() => {});
            await page.waitForTimeout(500);
          }

          async function axNames(page) {
            const cdp = await page.context().newCDPSession(page);
            await cdp.send('Accessibility.enable');
            const ax = await cdp.send('Accessibility.getFullAXTree');
            return ax.nodes
              .map(node => String(node.name?.value ?? '').trim())
              .filter(Boolean);
          }

          async function waitForAxName(page, text, timeout = 20000) {
            const deadline = Date.now() + timeout;
            while (Date.now() < deadline) {
              const names = await axNames(page);
              if (names.some(name => name.includes(text))) return;
              await page.waitForTimeout(200);
            }
            throw new Error(`Texte introuvable: ${text}`);
          }

          async function capture(page, stem) {
            await page.screenshot({
              path: `qa-auth-fix-artifacts/${stem}.png`,
              fullPage: true,
            }).catch(() => {});
            const names = await axNames(page).catch(() => []);
            fs.writeFileSync(
              `qa-auth-fix-artifacts/${stem}-ax.txt`,
              `${names.join('\n')}\n`,
            );
          }

          async function open(browser) {
            const context = await browser.newContext({
              viewport: { width: 390, height: 844 },
              serviceWorkers: 'block',
            });
            const page = await context.newPage();
            await page.goto(`${root}/#/auth/sign-in`, {
              waitUntil: 'networkidle',
              timeout: 90000,
            });
            await activate(page);
            return { context, page };
          }

          (async () => {
            const browser = await chromium.launch({
              headless: true,
              executablePath: '/usr/bin/google-chrome',
              args: ['--no-sandbox', '--disable-dev-shm-usage'],
            });

            // Mauvais identifiants : on simule exactement la réponse GoTrue
            // afin que la preuve navigateur ne dépende pas de la disponibilité
            // du projet staging au moment du run.
            {
              const { context, page } = await open(browser);
              try {
                await page.route(tokenEndpoint, async route => {
                  await route.fulfill({
                    status: 400,
                    contentType: 'application/json',
                    body: JSON.stringify({
                      code: 'invalid_credentials',
                      msg: 'Invalid login credentials',
                    }),
                  });
                });
                await page.getByRole('textbox', { name: 'Identifiant', exact: true })
                  .fill(`qa-invalid-${Date.now()}`);
                await page.getByRole('textbox', { name: 'Mot de passe', exact: true })
                  .fill('MauvaisMotDePasse123');
                await page.getByRole('button', { name: 'Se connecter', exact: true }).click();
                await waitForAxName(
                  page,
                  'Connexion impossible. Vérifie ton identifiant et ton mot de passe.',
                  10000,
                );
                await capture(page, 'after-bad-credentials');
              } catch (error) {
                await capture(page, 'failure-bad-credentials');
                throw error;
              } finally {
                await context.close();
              }
            }

            // Réseau suspendu : la requête HTTP ne répond jamais. Le timeout
            // applicatif de 12 s doit reprendre la main, sortir du chargement
            // et afficher un message réseau spécifique.
            {
              const { context, page } = await open(browser);
              try {
                await page.route(tokenEndpoint, async route => {
                  await new Promise(resolve => setTimeout(resolve, 30000));
                  await route.abort('timedout').catch(() => {});
                });
                await page.getByRole('textbox', { name: 'Identifiant', exact: true })
                  .fill(`qa-stalled-${Date.now()}`);
                await page.getByRole('textbox', { name: 'Mot de passe', exact: true })
                  .fill('MotDePasseReseau123');
                const started = Date.now();
                await page.getByRole('button', { name: 'Se connecter', exact: true }).click();
                await waitForAxName(
                  page,
                  'Connexion temporairement indisponible. Vérifie ta connexion et réessaie.',
                  18000,
                );
                const elapsed = Date.now() - started;
                if (elapsed < 10000 || elapsed > 16000) {
                  throw new Error(`Timeout applicatif inattendu: ${elapsed} ms`);
                }
                fs.writeFileSync(
                  'qa-auth-fix-artifacts/offline-result.txt',
                  `stalled-network-feedback-ms=${elapsed}\n`,
                );
                await capture(page, 'after-stalled-network');
              } catch (error) {
                await capture(page, 'failure-stalled-network');
                throw error;
              } finally {
                await context.close();
              }
            }

            await browser.close();
          })().catch(error => {
            console.error(error);
            process.exit(1);
          });
          NODE

      - name: Upload QA evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: qa-auth-signin-fix-evidence
          path: qa-auth-fix-artifacts/
          if-no-files-found: error
