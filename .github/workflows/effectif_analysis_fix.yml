name: Effectif analysis fix

on:
  push:
    branches:
      - agent/clarify-effectif-publication

permissions:
  contents: write

concurrency:
  group: effectif-analysis-fix
  cancel-in-progress: true

jobs:
  fix:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: agent/clarify-effectif-publication
          fetch-depth: 0

      - name: Apply focused fixes
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          main_path = Path('lib/features/sports_management/presentation/admin_squad_plan_page.dart')
          main = main_path.read_text()
          main = main.replace(
              "part 'admin_squad_plan_page_composition_widgets.dart';\n",
              '',
          )
          main_path.write_text(main)

          state_path = Path('lib/features/sports_management/presentation/admin_squad_plan_page_state.dart')
          state = state_path.read_text()
          marker = 'class _AdminSquadPlanPageState extends ConsumerState<AdminSquadPlanPage> {\n'
          helper = (
              marker
              + '  void _updateState(VoidCallback callback) {\n'
              + '    setState(callback);\n'
              + '  }\n\n'
          )
          if 'void _updateState(VoidCallback callback)' not in state:
              if marker not in state:
                  raise SystemExit('State class marker not found')
              state = state.replace(marker, helper, 1)
          state_path.write_text(state)

          for relative in (
              'lib/features/sports_management/presentation/admin_squad_plan_page_composition.dart',
              'lib/features/sports_management/presentation/admin_squad_plan_page_effectif.dart',
          ):
              path = Path(relative)
              path.write_text(path.read_text().replace('setState(', '_updateState('))
          PY
          git rm -f --ignore-unmatch \
            lib/features/sports_management/presentation/admin_squad_plan_page_composition_widgets.dart

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install locked dependencies
        run: flutter pub get --enforce-lockfile

      - name: Format and analyze
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t files < <(git ls-files '*.dart')
          dart format "${files[@]}"
          dart format --output=none --set-exit-if-changed "${files[@]}"
          flutter analyze --fatal-warnings --fatal-infos

      - name: Commit and rebase safely
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet && git diff --cached --quiet; then
            echo 'Aucune correction à enregistrer.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A -- \
            lib/features/sports_management/presentation/admin_squad_plan_page.dart \
            lib/features/sports_management/presentation/admin_squad_plan_page_state.dart \
            lib/features/sports_management/presentation/admin_squad_plan_page_composition.dart \
            lib/features/sports_management/presentation/admin_squad_plan_page_effectif.dart \
            lib/features/sports_management/presentation/admin_squad_plan_page_composition_widgets.dart
          git commit -m 'Corriger l’analyse du parcours effectif composition'
          git fetch origin agent/clarify-effectif-publication
          git rebase origin/agent/clarify-effectif-publication
          git push origin HEAD:agent/clarify-effectif-publication
