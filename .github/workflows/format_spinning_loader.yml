name: Format spinning loader

on:
  push:
    branches: [fix/spinning-ball-loader-ci]

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/spinning-ball-loader-ci

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Format loader
        run: dart format lib/core/widgets/grinta_loader.dart

      - name: Commit formatting
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/core/widgets/grinta_loader.dart
          git diff --cached --quiet && exit 0
          git commit -m "style: format spinning ball loader"
          git push
