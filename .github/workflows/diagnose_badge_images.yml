name: AS Grinta badge illustration recovery diagnosis

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/diagnose_badge_images.yml'

permissions:
  contents: read

jobs:
  report:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.head_ref == 'diagnostic/recuperation-badges-images-20261115'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_PROJECT_REF: ovzijmqrnsgcmryinkfa
    steps:
      - name: Checkout safely
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Install Supabase CLI
        uses: supabase/setup-cli@3c2f5e2ae34c34e428e8e206e2c4d21fa2d20fbf # v2
        with:
          version: latest

      - name: Verify safe read-only query mode and link AS Grinta
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${SUPABASE_ACCESS_TOKEN:-}" ] || [ -z "${SUPABASE_DB_PASSWORD:-}" ]; then
            echo "::error::Credentials for the original AS Grinta project are missing."
            exit 1
          fi
          supabase db query --help | grep -q -- '--read-only'
          supabase link --project-ref "$SUPABASE_PROJECT_REF" --password "$SUPABASE_DB_PASSWORD"

      - name: Count badge image links and surviving Storage objects
        shell: bash
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/badge_counts.sql" <<'SQL'
          select
            count(*) as badge_count,
            count(*) filter (where nullif(btrim(b.image_url), '') is not null) as image_links,
            count(*) filter (where nullif(btrim(b.image_url), '') is null) as missing_image_links,
            count(*) filter (
              where nullif(btrim(b.image_url), '') is not null
                and exists (
                  select 1 from storage.objects s
                  where s.bucket_id = 'badge-images'
                    and s.name = split_part(split_part(coalesce(b.image_url, ''), '/badge-images/', 2), '?', 1)
                )
            ) as linked_images_present_in_storage,
            (select count(*) from storage.objects s where s.bucket_id = 'badge-images')
              as objects_in_badge_images_bucket
          from public.badges b;
          SQL
          supabase db query --remote --read-only --file "$RUNNER_TEMP/badge_counts.sql" --output table

      - name: Read-only image status of each mystery badge
        shell: bash
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/badge_status.sql" <<'SQL'
          select
            b.code,
            b.name,
            case when nullif(btrim(b.image_url), '') is null
              then 'NO_URL' else 'URL_PRESENT' end as image_reference,
            case when exists (
              select 1 from storage.objects s
              where s.bucket_id = 'badge-images'
                and s.name = split_part(split_part(coalesce(b.image_url, ''), '/badge-images/', 2), '?', 1)
            ) then 'FILE_PRESENT' else 'FILE_ABSENT' end as storage_file
          from public.badges b
          where b.kind = 'custom'
             or lower(b.name) like any (array[
               '%chapeau%', '%fracassante%', '%gardien%', '%immanquable%'
             ])
          order by lower(b.name), b.code;
          SQL
          supabase db query --remote --read-only --file "$RUNNER_TEMP/badge_status.sql" --output table

      - name: Compare HTTP delivery of four photographed badges
        shell: bash
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/badge_http_urls.sql" <<'SQL'
          select code, name, image_url from public.badges
          where code in (
            'custom_coup_du_chapeau_1790725592200',
            'custom_entr_e_fracassante_1794287679545',
            'custom_gardien_d_un_soir_1790198294777',
            'custom_immanquable_1790244481714'
          )
          order by code;
          SQL
          supabase db query --remote --read-only --file "$RUNNER_TEMP/badge_http_urls.sql" --output csv > "$RUNNER_TEMP/badge_urls.csv"
          python3 - <<'PY'
          import csv, hashlib, os, urllib.parse, urllib.request, urllib.error
          source = os.path.join(os.environ["RUNNER_TEMP"], "badge_urls.csv")
          with open(source, newline="", encoding="utf-8") as stream:
              records = list(csv.DictReader(stream))
          print(f"Image HTTP diagnostic: {len(records)} selected badges")
          for r in records:
              original = (r.get("image_url") or "").strip()
              parsed = urllib.parse.urlsplit(original)
              transform = original.replace(
                  "/storage/v1/object/public/badge-images/",
                  "/storage/v1/render/image/public/badge-images/"
              )
              transform = transform + ("&" if "?" in transform else "?") + "width=360&quality=75"
              print(f"{r.get('name')}: host={parsed.hostname or '(empty)'}")
              for version, url in (("public-original", original), ("optimized-render", transform)):
                  if not url.startswith("https://"):
                      print(f"  {version}: INVALID_URL")
                      continue
                  try:
                      request = urllib.request.Request(url, headers={"User-Agent": "ASGrintaBadgeRecoveryAudit/1.0"})
                      with urllib.request.urlopen(request, timeout=20) as response:
                          data = response.read()
                          print(f"  {version}: HTTP={response.status}, type={response.headers.get('Content-Type')}, bytes={len(data)}, sha256={hashlib.sha256(data).hexdigest()[:16]}")
                  except urllib.error.HTTPError as e:
                      print(f"  {version}: HTTP={e.code}, type={e.headers.get('Content-Type')}")
                  except Exception as e:
                      print(f"  {version}: ERROR={type(e).__name__}")
          PY
