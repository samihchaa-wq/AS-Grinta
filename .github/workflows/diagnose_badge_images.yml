name: AS Grinta badge illustration recovery diagnosis

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/diagnose_badge_images.yml'

permissions:
  contents: read

jobs:
  report:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.head_ref == 'diagnostic/recuperation-badges-images-20261115'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_PROJECT_REF: ovzijmqrnsgcmryinkfa
    steps:
      - name: Checkout safely
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Install Supabase CLI
        uses: supabase/setup-cli@3c2f5e2ae34c34e428e8e206e2c4d21fa2d20fbf # v2
        with:
          version: latest

      - name: Verify safe read-only query mode and link AS Grinta
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${SUPABASE_ACCESS_TOKEN:-}" ] || [ -z "${SUPABASE_DB_PASSWORD:-}" ]; then
            echo "::error::Credentials for the original AS Grinta project are missing."
            exit 1
          fi
          supabase db query --help | grep -q -- '--read-only'
          supabase link --project-ref "$SUPABASE_PROJECT_REF" --password "$SUPABASE_DB_PASSWORD"

      - name: Count badge image links and surviving Storage objects
        shell: bash
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/badge_counts.sql" <<'SQL'
          select
            count(*) as badge_count,
            count(*) filter (where nullif(btrim(b.image_url), '') is not null) as image_links,
            count(*) filter (where nullif(btrim(b.image_url), '') is null) as missing_image_links,
            count(*) filter (
              where nullif(btrim(b.image_url), '') is not null
                and exists (
                  select 1 from storage.objects s
                  where s.bucket_id = 'badge-images'
                    and s.name = private.badge_image_storage_path(b.image_url)
                )
            ) as linked_images_present_in_storage,
            (select count(*) from storage.objects s where s.bucket_id = 'badge-images')
              as objects_in_badge_images_bucket
          from public.badges b;
          SQL
          supabase db query --remote --read-only --file "$RUNNER_TEMP/badge_counts.sql" --output table

      - name: Read-only image status of each mystery badge
        shell: bash
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/badge_status.sql" <<'SQL'
          select
            b.code,
            b.name,
            case when nullif(btrim(b.image_url), '') is null
              then 'NO_URL' else 'URL_PRESENT' end as image_reference,
            case when exists (
              select 1 from storage.objects s
              where s.bucket_id = 'badge-images'
                and s.name = private.badge_image_storage_path(b.image_url)
            ) then 'FILE_PRESENT' else 'FILE_ABSENT' end as storage_file
          from public.badges b
          where b.kind = 'custom'
             or lower(b.name) like any (array[
               '%chapeau%', '%fracassante%', '%gardien%', '%immanquable%'
             ])
          order by lower(b.name), b.code;
          SQL
          supabase db query --remote --read-only --file "$RUNNER_TEMP/badge_status.sql" --output table
