name: Temporary internal composition formatter

on:
  pull_request:

permissions:
  contents: read

jobs:
  format-diff:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Setup Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
        with:
          channel: stable
          cache: true
      - name: Show formatter diff
        run: |
          dart format lib/features/sports_management/presentation/widgets/internal_team_composition_view.dart
          git diff -- lib/features/sports_management/presentation/widgets/internal_team_composition_view.dart
          git diff --quiet -- lib/features/sports_management/presentation/widgets/internal_team_composition_view.dart
