name: Temporary calendar form formatter

on:
  push:
    branches:
      - ui/calendar-form-readability

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Format calendar form
        run: dart format lib/features/matches/presentation/calendar_entry_form_page.dart
      - name: Commit formatting
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/features/matches/presentation/calendar_entry_form_page.dart
          git commit -m "Format calendar form"
          git push origin HEAD:ui/calendar-form-readability
