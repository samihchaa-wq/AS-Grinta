name: Temporary Live lineup optimistic-lock patch

on:
  push:
    branches:
      - db/live-lineup-optimistic-lock
    paths:
      - '.github/workflows/live_lineup_optimistic_lock_patch.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: db/live-lineup-optimistic-lock
          fetch-depth: 0

      - name: Setup Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: stable
          cache: true

      - name: Install locked dependencies
        run: flutter pub get --enforce-lockfile

      - name: Apply exact client patch
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          def replace_exact(path, old, new, expected=1):
              p = Path(path)
              text = p.read_text()
              count = text.count(old)
              if count != expected:
                  raise SystemExit(f'{path}: expected {expected} matches, found {count}')
              p.write_text(text.replace(old, new))

          repo = 'lib/features/match_live/data/match_live_repository.dart'
          replace_exact(
              repo,
              """  Future<MatchLiveStateBundle> saveLiveLineup({\n    required String matchId,\n    required List<Map<String, dynamic>> entries,\n    List<({String playerIn, String playerOut})> substitutions,\n  });""",
              """  Future<MatchLiveStateBundle> saveLiveLineup({\n    required String matchId,\n    required List<Map<String, dynamic>> entries,\n    required int expectedLineupRevision,\n    List<({String playerIn, String playerOut})> substitutions,\n  });""",
          )
          replace_exact(
              repo,
              """  Future<MatchLiveStateBundle> saveLiveLineup({\n    required String matchId,\n    required List<Map<String, dynamic>> entries,\n    List<({String playerIn, String playerOut})> substitutions = const [],\n  }) async {""",
              """  Future<MatchLiveStateBundle> saveLiveLineup({\n    required String matchId,\n    required List<Map<String, dynamic>> entries,\n    required int expectedLineupRevision,\n    List<({String playerIn, String playerOut})> substitutions = const [],\n  }) async {""",
          )
          replace_exact(
              repo,
              """        'p_match_id': matchId,\n        'p_entries': entries,\n        'p_substitution': substitutions.isEmpty""",
              """        'p_match_id': matchId,\n        'p_entries': entries,\n        'p_expected_lineup_revision': expectedLineupRevision,\n        'p_substitution': substitutions.isEmpty""",
          )

          providers = 'lib/features/match_live/presentation/match_live_providers.dart'
          replace_exact(
              providers,
              """  Future<void> saveLiveLineup({\n    required List<Map<String, dynamic>> entries,\n    List<({String playerIn, String playerOut})> substitutions = const [],\n  }) {""",
              """  Future<void> saveLiveLineup({\n    required List<Map<String, dynamic>> entries,\n    required int expectedLineupRevision,\n    List<({String playerIn, String playerOut})> substitutions = const [],\n  }) {""",
          )
          replace_exact(
              providers,
              """        matchId: arg,\n        entries: entries,\n        substitutions: substitutions,""",
              """        matchId: arg,\n        entries: entries,\n        expectedLineupRevision: expectedLineupRevision,\n        substitutions: substitutions,""",
          )

          pre = 'lib/features/match_live/presentation/match_live_pre_kickoff_page.dart'
          replace_exact(
              pre,
              """    await _controller.saveLiveLineup(\n      entries: [for (final entry in entries) entry.toRpcJson()],\n    );""",
              """    await _controller.saveLiveLineup(\n      entries: [for (final entry in entries) entry.toRpcJson()],\n      expectedLineupRevision: widget.bundle.session.lineupRevision,\n    );""",
              expected=2,
          )

          running = 'lib/features/match_live/presentation/match_live_running_page.dart'
          replace_exact(
              running,
              """      await controller.saveLiveLineup(\n        entries: [for (final entry in entries) entry.toRpcJson()],\n        substitutions: pairs,\n      );""",
              """      await controller.saveLiveLineup(\n        entries: [for (final entry in entries) entry.toRpcJson()],\n        expectedLineupRevision: bundle.session.lineupRevision,\n        substitutions: pairs,\n      );""",
          )
          replace_exact(
              running,
              """    await controller.saveLiveLineup(\n      entries: [for (final entry in entries) entry.toRpcJson()],\n    );""",
              """    await controller.saveLiveLineup(\n      entries: [for (final entry in entries) entry.toRpcJson()],\n      expectedLineupRevision: bundle.session.lineupRevision,\n    );""",
          )
          PY

          dart format \
            lib/features/match_live/data/match_live_repository.dart \
            lib/features/match_live/presentation/match_live_providers.dart \
            lib/features/match_live/presentation/match_live_pre_kickoff_page.dart \
            lib/features/match_live/presentation/match_live_running_page.dart

      - name: Remove temporary workflow and commit
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/live_lineup_optimistic_lock_patch.yml
          git add \
            lib/features/match_live/data/match_live_repository.dart \
            lib/features/match_live/presentation/match_live_providers.dart \
            lib/features/match_live/presentation/match_live_pre_kickoff_page.dart \
            lib/features/match_live/presentation/match_live_running_page.dart
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Pass Live lineup revision through client writes'
          git push origin HEAD:db/live-lineup-optimistic-lock
