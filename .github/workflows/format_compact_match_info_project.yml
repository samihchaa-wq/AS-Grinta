name: Format compact match info with project language

on:
  push:
    branches: [fix/compact-match-info]
    paths:
      - '.github/workflows/format_compact_match_info_project.yml'

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/compact-match-info
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Resolve project language and format
        shell: bash
        run: |
          set -euo pipefail
          flutter pub get --enforce-lockfile
          dart format lib/features/matches/presentation/widgets/match_info_tab.dart test/match_weather_card_test.dart
          rm .github/workflows/format_compact_match_info_project.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add lib/features/matches/presentation/widgets/match_info_tab.dart test/match_weather_card_test.dart .github/workflows/format_compact_match_info_project.yml
          git commit -m 'style: format compact match info with project language'
          git push origin HEAD:fix/compact-match-info
