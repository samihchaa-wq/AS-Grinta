name: Waitlist exact format

on:
  push:
    branches: [ui/waitlist-stats-sticky-table]

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ui/waitlist-stats-sticky-table
      - name: Setup Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: stable
          cache: true
      - name: Install locked dependencies
        run: flutter pub get --enforce-lockfile
      - name: Format waitlist source exactly like CI
        run: dart format lib/features/sports_management/presentation/admin_waitlist_page.dart
      - name: Commit formatting if needed
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- lib/features/sports_management/presentation/admin_waitlist_page.dart; then
            echo "Already formatted."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/features/sports_management/presentation/admin_waitlist_page.dart
          git commit -m "Apply CI-exact Dart formatting"
          git push origin HEAD:ui/waitlist-stats-sticky-table
