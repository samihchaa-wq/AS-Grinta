name: Temporary format reorder calendar

on:
  push:
    branches:
      - fix/reorder-calendar-entry-form

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: fix/reorder-calendar-entry-form
          fetch-depth: 0
      - name: Setup Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
        with:
          channel: stable
          cache: true
      - name: Format target file
        run: dart format lib/features/matches/presentation/calendar_entry_form_page.dart
      - name: Commit formatting and remove temporary workflow
        run: |
          rm .github/workflows/tmp_format_reorder_calendar.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/features/matches/presentation/calendar_entry_form_page.dart .github/workflows/tmp_format_reorder_calendar.yml
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Format reordered calendar entry form"
          git push origin HEAD:fix/reorder-calendar-entry-form
