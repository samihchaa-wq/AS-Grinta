name: QA exact register URL probe

on:
  push:
    branches: [qa/auth-prelogin-audit]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'

      - name: Install Playwright Core
        run: npm install --no-save playwright-core@1.52.0

      - name: Open exact public registration URL
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('fs');
          const { chromium } = require('playwright-core');
          (async () => {
            const browser = await chromium.launch({
              headless: true,
              executablePath: '/usr/bin/google-chrome',
              args: ['--no-sandbox', '--disable-dev-shm-usage'],
            });
            const context = await browser.newContext({
              viewport: { width: 390, height: 844 },
              serviceWorkers: 'block',
            });
            const page = await context.newPage();
            const requested = 'https://samihchaa-wq.github.io/AS-Grinta/staging/#/auth/register';
            await page.goto(requested, { waitUntil: 'domcontentloaded', timeout: 45000 });
            await page.locator('flutter-view, flt-glass-pane, canvas').first()
              .waitFor({ state: 'attached', timeout: 45000 });
            await page.waitForTimeout(2000);
            await page.evaluate(() => {
              const p = document.querySelector('flt-semantics-placeholder');
              if (p instanceof HTMLElement) p.click();
            }).catch(() => {});
            await page.waitForTimeout(1000);
            let fieldVisible = false;
            try {
              await page.getByRole('textbox', { name: 'Prénom', exact: true }).waitFor({ timeout: 5000 });
              fieldVisible = true;
            } catch (_) {}
            const result = `requested=${requested}\nfinal=${page.url()}\nprenomVisible=${fieldVisible}\n`;
            fs.writeFileSync('register-exact-url-result.txt', result);
            await page.screenshot({ path: 'register-exact-url.png' });
            console.log(result);
            await browser.close();
            if (!fieldVisible || !result.includes('/auth/register')) process.exit(1);
          })().catch(error => {
            console.error(error);
            process.exit(1);
          });
          NODE

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: qa-register-exact-url
          path: |
            register-exact-url-result.txt
            register-exact-url.png
          if-no-files-found: warn
