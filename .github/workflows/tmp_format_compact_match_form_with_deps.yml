name: Temporary compact match form formatter with deps

on:
  push:
    branches:
      - feat/compact-match-form-controls

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: feat/compact-match-form-controls
          fetch-depth: 0

      - name: Setup Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
        with:
          channel: stable
          cache: true

      - name: Resolve locked dependencies
        run: flutter pub get --enforce-lockfile

      - name: Format compact match form files
        run: |
          dart format \
            lib/features/matches/domain/match_meeting.dart \
            lib/features/matches/presentation/calendar_entry_form_page.dart \
            lib/features/matches/presentation/match_form_page.dart \
            lib/features/matches/presentation/widgets/convocation_launch_picker.dart \
            lib/features/matches/presentation/widgets/match_meeting_time_picker.dart \
            lib/features/matches/presentation/widgets/match_option_button.dart \
            lib/features/matches/presentation/widgets/match_wheel_picker.dart \
            test/match_meeting_test.dart
          rm -f .github/workflows/tmp_format_compact_match_form_with_deps.yml

      - name: Commit formatter output and cleanup
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m 'style: format compact match form with dependencies'
          git push origin HEAD:feat/compact-match-form-controls
