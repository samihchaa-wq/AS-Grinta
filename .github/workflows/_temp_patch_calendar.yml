name: Temporary calendar patch

on:
  push:
    branches:
      - fix/badges-calendar-reset
    paths:
      - .github/workflows/_temp_patch_calendar.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/badges-calendar-reset
      - name: Patch calendar month reset
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('lib/features/matches/presentation/calendar_matches_view.dart')
          text = path.read_text()

          import_anchor = "import 'dart:math' as math;\n\n"
          import_line = "import 'package:as_grinta/app/shell/module_navigation.dart';\n"
          if import_line not in text:
              text = text.replace(import_anchor, import_anchor + import_line, 1)

          build_anchor = "  @override\n  Widget build(BuildContext context) {\n    final state = ref.watch(matchesControllerProvider);"
          listener = "  @override\n  Widget build(BuildContext context) {\n    ref.listen<int>(matchesFocusRequestProvider, (previous, next) {\n      if (_displayMode != _CalendarDisplayMode.month) return;\n      final now = DateTime.now();\n      final currentMonth = DateTime(now.year, now.month);\n      if (_monthCursor == currentMonth) return;\n      setState(() => _monthCursor = currentMonth);\n    });\n\n    final state = ref.watch(matchesControllerProvider);"
          if build_anchor not in text:
              raise SystemExit('calendar build anchor not found')
          text = text.replace(build_anchor, listener, 1)
          path.write_text(text)
          PY
      - name: Commit patch and remove temporary workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/_temp_patch_calendar.yml
          git add lib/features/matches/presentation/calendar_matches_view.dart
          git commit -m "Calendrier: recentrer Par mois sur la date actuelle"
          git push origin HEAD:fix/badges-calendar-reset
