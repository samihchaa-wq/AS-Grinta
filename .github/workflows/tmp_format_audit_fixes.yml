name: Temporary format audit fixes

on:
  push:
    branches:
      - ci/supabase-migration-drift-guard-audit-fixes

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ci/supabase-migration-drift-guard-audit-fixes
          fetch-depth: 0
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get --enforce-lockfile
      - name: Format tests
        shell: bash
        run: |
          set -euo pipefail
          dart format test/app_router_stability_test.dart test/auth_controller_test.dart
          git diff --check
          if git diff --quiet; then
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add test/app_router_stability_test.dart test/auth_controller_test.dart
          git commit -m 'Formater les tests Auth'
          git push origin HEAD:ci/supabase-migration-drift-guard-audit-fixes
