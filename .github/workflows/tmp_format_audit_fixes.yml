name: Temporary format audit fixes

on:
  push:
    branches:
      - ci/supabase-migration-drift-guard-audit-fixes

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ci/supabase-migration-drift-guard-audit-fixes
          fetch-depth: 0
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Format changed Dart files
        shell: bash
        run: |
          set -euo pipefail
          dart format \
            lib/features/auth/presentation/auth_loading_page.dart \
            lib/features/predictions/data/season_predictions_repository.dart \
            lib/features/predictions/presentation/season_prediction_entry_page.dart \
            test/auth_redirect_test.dart
          git diff --check
          if git diff --quiet; then
            echo 'Nothing to format.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            lib/features/auth/presentation/auth_loading_page.dart \
            lib/features/predictions/data/season_predictions_repository.dart \
            lib/features/predictions/presentation/season_prediction_entry_page.dart \
            test/auth_redirect_test.dart
          git commit -m 'Formater les correctifs Dart'
          git push origin HEAD:ci/supabase-migration-drift-guard-audit-fixes
