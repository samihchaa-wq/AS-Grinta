<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="referrer" content="no-referrer">
  <meta name="robots" content="noindex">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'unsafe-inline'; img-src 'self'; media-src 'self' blob:; connect-src 'self'; base-uri 'none'; form-action 'none'">
  <link rel="icon" type="image/png" href="favicon.png">
  <title>Test vidéo AS Grinta</title>
  <style>
    body { font-family: -apple-system, system-ui, sans-serif; margin: 0; padding: 20px 16px 40px; background: #041224; color: #f2f4f8; line-height: 1.45; }
    main { max-width: 520px; margin: 0 auto; }
    h1 { font-size: 22px; margin: 0 0 8px; }
    p { margin: 8px 0; }
    .card { background: #0d2340; border-radius: 16px; padding: 16px; margin: 14px 0; }
    .verdict { font-size: 19px; font-weight: 600; }
    .ok { color: #48c98b; } .ko { color: #ff6f7d; } .wait { color: #f0a34a; }
    video { display: block; width: min(100%, calc(52vh * 390 / 844)); aspect-ratio: 390 / 844; margin: 0 auto; object-fit: cover; border-radius: 12px; background: #000; }
    button { display: block; width: 100%; box-sizing: border-box; text-align: center; background: #fbe80c; color: #041224; padding: 14px; border: 0; border-radius: 12px; font: inherit; font-weight: 600; margin: 12px 0; cursor: pointer; }
    ul { padding-left: 18px; margin: 6px 0; } li { margin: 4px 0; }
    small, .details { color: #9fb4cc; font-size: 13px; }
    .details { white-space: pre-wrap; word-break: break-word; }
    [hidden] { display: none !important; }
  </style>
</head>
<body>
<main>
  <h1>Test de la vidéo du stade</h1>
  <p>Ce test vérifie que ton téléphone lit la vidéo de la composition. Rien n'est envoyé, rien n'est enregistré.</p>
  <div class="card">
    <p id="verdict" class="verdict wait">Test automatique en cours…</p>
    <video id="video" muted playsinline webkit-playsinline disablepictureinpicture disableremoteplayback preload="auto" poster="assets/assets/composition/stade.jpg"></video>
    <button id="tap" type="button" hidden>Toucher ici pour le 2ᵉ test</button>
    <ul id="results"></ul>
  </div>
  <div class="card">
    <p><strong>Fais une capture d'écran de cette page</strong> et envoie-la à la personne qui t'a envoyé ce lien.</p>
    <p class="details" id="details"></p>
  </div>
</main>
<script src="build_version.js"></script>
<script src="test-video.js"></script>
</body>
</html>
