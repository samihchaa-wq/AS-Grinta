<!DOCTYPE html>
<html lang="fr">
<head>
  <base href="$FLUTTER_BASE_HREF">
  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="ASG — l'application officielle du club">
  <meta name="theme-color" content="#041224">
  <meta name="referrer" content="no-referrer">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; base-uri 'self'; object-src 'none'; script-src 'self' 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https://ovzijmqrnsgcmryinkfa.supabase.co; font-src 'self' data: https://fonts.gstatic.com; connect-src 'self' blob: https://ovzijmqrnsgcmryinkfa.supabase.co wss://ovzijmqrnsgcmryinkfa.supabase.co https://fonts.gstatic.com; worker-src 'self' blob:; manifest-src 'self'; media-src 'self' data: blob: https://ovzijmqrnsgcmryinkfa.supabase.co; form-action 'self'; upgrade-insecure-requests">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <link rel="icon" type="image/png" href="favicon.png">
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">
  <link rel="apple-touch-icon" sizes="192x192" href="icons/Icon-192.png">
  <link rel="apple-touch-icon" sizes="512x512" href="icons/Icon-512.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="ASG">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>ASG</title>
  <link rel="preload" as="image" href="asg_logo.webp">
  <style>
    html, body { margin: 0; width: 100%; height: 100%; background: #041224; }
    img {
      -webkit-touch-callout: none;
      -webkit-user-select: none;
      user-select: none;
      -webkit-user-drag: none;
      user-drag: none;
      touch-action: none;
    }

    /* Écran de démarrage affiché avant que Flutter ne prenne la main. Il
       reprend exactement la mise en page du splash Flutter (écusson puis
       indicateur) pour que la bascule ne produise aucun saut visuel. */
    #asg-splash {
      position: fixed;
      inset: 0;
      z-index: 2147483646;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #041224;
      opacity: 1;
      transition: opacity .32s ease-out;
    }
    #asg-splash.asg-splash-out { opacity: 0; pointer-events: none; }
    .asg-splash-inner {
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 32px;
      text-align: center;
    }
    .asg-crest {
      position: relative;
      width: min(240px, 58vw);
      animation: asg-breathe 2.8s ease-in-out infinite;
    }
    .asg-crest img { display: block; width: 100%; height: auto; }
    .asg-shine {
      position: absolute;
      inset: 0;
      opacity: 0;
      background-image: linear-gradient(
        104deg,
        rgba(255, 255, 255, 0) 40%,
        rgba(255, 255, 255, .5) 50%,
        rgba(255, 255, 255, 0) 60%
      );
      background-repeat: no-repeat;
      background-size: 260% 100%;
    }
    @supports ((-webkit-mask-image: url("asg_logo.webp")) or (mask-image: url("asg_logo.webp"))) {
      .asg-shine {
        opacity: 1;
        -webkit-mask-image: url("asg_logo.webp");
        mask-image: url("asg_logo.webp");
        -webkit-mask-size: 100% 100%;
        mask-size: 100% 100%;
        animation: asg-shine 2.8s ease-in-out infinite;
      }
    }
    .asg-track {
      margin-top: 28px;
      width: 132px;
      height: 4px;
      border-radius: 999px;
      background: rgba(103, 169, 243, .2);
      overflow: hidden;
    }
    .asg-track i {
      display: block;
      width: 42%;
      height: 100%;
      border-radius: 999px;
      background: linear-gradient(90deg, #3475C9, #FBE80C);
      animation: asg-slide 1.5s cubic-bezier(.65, .02, .35, 1) infinite;
    }
    .asg-stalled {
      margin-top: 26px;
      max-width: 260px;
      font: 500 13px/1.45 -apple-system, BlinkMacSystemFont, system-ui, sans-serif;
      color: #A9C4E6;
    }
    .asg-stalled button {
      margin-top: 12px;
      padding: 9px 18px;
      border: 0;
      border-radius: 999px;
      background: #FBE80C;
      color: #041224;
      font: 700 13px/1 -apple-system, BlinkMacSystemFont, system-ui, sans-serif;
      cursor: pointer;
    }
    @keyframes asg-breathe {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.035); }
    }
    @keyframes asg-shine {
      0% { background-position: 175% 0; }
      55%, 100% { background-position: -75% 0; }
    }
    @keyframes asg-slide {
      0% { transform: translateX(-115%); }
      100% { transform: translateX(250%); }
    }
    @media (prefers-reduced-motion: reduce) {
      .asg-crest, .asg-shine { animation: none; }
      .asg-shine { opacity: 0; }
      .asg-track i { width: 100%; animation: none; }
    }
  </style>
  <script src="build_version.js"></script>
  <script src="history_swipe.js"></script>
  <script src="app_shell.js" defer></script>
</head>
<body>
  <div id="asg-splash" role="status" aria-label="Démarrage de ASG">
    <div class="asg-splash-inner">
      <div class="asg-crest">
        <img src="asg_logo.webp" alt="AS La Grinta" width="480" height="523" fetchpriority="high">
        <span class="asg-shine" aria-hidden="true"></span>
      </div>
      <div class="asg-track" aria-hidden="true"><i></i></div>
    </div>
  </div>
</body>
</html>
